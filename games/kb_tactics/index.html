<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kb_tactics — jeu assemblé depuis la Knowledge Base</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #0a0c12; color: #e8eef5; font-family: system-ui, sans-serif;
           display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
    h1 { font-size: 16px; font-weight: 600; margin: 4px 0; color: #9fb3c8; }
    .stage { position: relative; }
    canvas { border: 1px solid #2b2f3a; image-rendering: pixelated; background: #0d0f16; }
    #overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
               align-items: center; justify-content: center; gap: 14px;
               background: rgba(8,10,16,0.82); }
    #overlay.hidden { display: none; }
    #overlay-text { font-size: 20px; font-weight: 700; }
    #restart { padding: 8px 18px; font-size: 15px; cursor: pointer; border: 0; border-radius: 6px;
               background: #1f5c99; color: #fff; }
    .hint { font-size: 12px; color: #93a1b0; }
  </style>
</head>
<body>
  <h1>kb_tactics — atteins la sortie EXIT, évite les poursuivants</h1>
  <div class="stage">
    <canvas id="board"></canvas>
    <div id="overlay" class="hidden">
      <div id="overlay-text"></div>
      <button id="restart">Rejouer</button>
    </div>
  </div>
  <div class="hint">Flèches ou WASD pour bouger · Espace pour attendre · tour-par-tour</div>
  <script type="module" src="main.mjs"></script>
</body>
</html>
