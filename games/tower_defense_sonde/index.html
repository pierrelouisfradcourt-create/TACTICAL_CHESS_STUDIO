<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tower Defense Sonde</title>
  <style>
    * { margin: 0; padding: 0; }
    body {
      font-family: monospace;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { margin-bottom: 20px; }
    #game-canvas {
      border: 2px solid #0f0;
      display: block;
      margin-bottom: 20px;
      background: #000;
    }
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
      /* Above the end-of-game overlay: the Restart button has to stay reachable
         once the overlay is up, otherwise a finished game is a dead end. */
      position: relative;
      z-index: 200;
    }
    button {
      padding: 10px 20px;
      background: #222;
      color: #fff;
      border: 1px solid #0f0;
      cursor: pointer;
      font-family: monospace;
    }
    button:hover { background: #0f0; color: #000; }
    #btn-gun { border-color: #0f0; }
    #btn-frost { border-color: #00f; }
    #btn-cannon { border-color: #f00; }
    .stats {
      text-align: center;
      font-size: 14px;
    }
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 100;
      /* Purely informational: it must never swallow the clicks of the controls
         it sits over (measured defect — #restart was unclickable after DEFEAT). */
      pointer-events: none;
    }
    #overlay.show { display: flex; }
    /* Playability contract: #overlay carries the class `hidden` while hidden. */
    #overlay.hidden { display: none; }
    #overlay h2 { font-size: 48px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>Tower Defense</h1>
  <canvas id="game-canvas" width="640" height="384"></canvas>

  <div class="controls">
    <button id="btn-gun">Gun (50)</button>
    <button id="btn-frost">Frost (60)</button>
    <button id="btn-cannon">Cannon (100)</button>
    <button id="btn-upgrade">Upgrade</button>
    <button id="btn-call-wave">Call Wave</button>
    <button id="restart">Restart</button>
  </div>

  <div class="stats">
    <div>Gold: <span id="stat-gold">100</span></div>
    <div>Lives: <span id="stat-lives">20</span></div>
    <div>Wave: <span id="stat-wave">1</span></div>
    <div>Leaks: <span id="stat-leaks">0</span></div>
  </div>

  <div id="overlay" class="hidden">
    <h2 id="overlay-result"></h2>
    <p id="overlay-stats"></p>
  </div>

  <script type="module" src="main.mjs"></script>
</body>
</html>
