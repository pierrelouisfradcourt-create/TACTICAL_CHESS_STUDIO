# TETRIS — contrat de jeu (budget + preuve). Nœud 4 du curriculum.
# Format : scripts/forge/standard/SCHEMA.md §1 — schéma FERMÉ, exactement 7 clés de
# premier niveau. Gabarit : games/breakout_v2/00_CHARTER/game_contract.yaml.
#
# STATUT : PROPOSITION DE BOOTSTRAP (2026-08-03). Ce fichier est mécaniquement valide
# (check_contract_completeness) mais N'EST PAS RATIFIÉ. Le charter narratif (critères de
# succès, paramètres de design, actions interdites) reste à produire par l'étape s0 sous
# son contrat — il n'est PAS pré-écrit ici : un bootstrap prépare le terrain, il ne joue
# pas les étapes à la place des agents.
#
# NŒUD : 4. Suit le précédent MÉCANIQUE Pong=1 / Snake=2 / Breakout_v2=3.

schema_version: 1
game_id: tetris
node: 4
runtimes: [rules, godot]

budget:
  # reuses: VIDE — et c'est une décision, pas un oubli. Le catalogue ne contient
  # aujourd'hui qu'une brique Godot en tier validated/candidate (sys-grid-nav-m01,
  # navigation sur grille discrète). Tetris EST sur grille discrète, donc cette brique
  # est le premier candidat sérieux depuis le début du curriculum — mais la déclarer
  # ici sans avoir vérifié son API réelle contre le besoin ferait échouer le volet
  # budget, et surtout répéterait l'erreur P5 (une brique importée « littéralement »
  # alors que sa signature ne correspondait pas). À trancher à l'étape s3/s4, sur
  # lecture du code de la brique, pas sur son nom.
  reuses: []
  # adds: VIDE. Ce build ne PROMET aucun dépôt en bibliothèque. Si le forgeron juge
  # qu'un système mérite d'être légué (le générateur en sac de 7 est le candidat le
  # plus probable), le budget le BLOQUE et le remonte — comportement voulu.
  adds: []

assets:
  # Rendu par primitives du moteur, aucun asset externe prévu. Même position que
  # Snake et Breakout_v2.
  plan: cc0

# =====================================================================================
# DESCRIPTEUR DE PREUVE — contrat docs/forge/CONTRAT_PREUVE_MUTATION_V1.md (FIGÉ).
# =====================================================================================
proof:
  schema_version: 1
  runtime: godot

  mutation:
    # À CONFIRMER contre la wiremap RÉELLE une fois gelée (règle de forme 4 du contrat :
    # une catégorie ni jugée ni exclue est un BLOCKED). Valeurs calquées sur Breakout_v2,
    # à vérifier catégorie par catégorie — pas à recopier aveuglément.
    categories_mutables: [system]
    categories_exclues:
      - system.adapter        # rendu/runtime -> oracle produit, pas mutation
      - test.unit
      - test.oracle
      - godot.project_root
      - godot.project_tests

    command: ["<bin:godot>", "--headless", "--path", ".", "--script", "res://tests/run_tests.gd"]
    cwd: "games/tetris"
    binary_ref: godot
    expects_exit_zero: true

    budget:
      # NON CALIBRÉ. Aucune mesure Tetris n'existe. Ces valeurs sont un point de départ
      # [H] repris de Breakout_v2, PAS une valeur ratifiée. À recalibrer sur mesure
      # réelle avant s9, jamais après un dépassement silencieux.
      max_mutants: 200          # A_CALIBRER
      timeout_per_mutant_s: 30  # A_CALIBRER
      total_timeout_s: 900      # A_CALIBRER
      cost_class: engine

    seals:
      wrapper: []
      test_scripts: ["tests/run_tests.gd"]

  solvability:
    entry: "solvability.gd"
    # max_ticks : AUCUNE mesure Tetris. Attention — Tetris n'a PAS d'état gagné en
    # marathon (règle de genre genre.tetris.no_victory_in_marathon). La solvabilité ne
    # peut donc PAS se définir comme « un bot gagne » : il faudra la définir comme
    # « un bot survit N pièces sans blocage » ou « un bot nettoie N lignes ». C'est une
    # DÉCISION OUVERTE à trancher avant s9, pas un paramètre à copier de Breakout.
    max_ticks: 20000            # A_CALIBRER — marge large volontaire
    trials: 50                  # repris par cohérence de méthode, pas par mesure
    trial_timeout_ms: 60000
