<!-- req_click_target — warm-tactile-illustration. Cible de clic centrale : l'élément
     le plus grand et le plus chaud du champ, silhouette pleine et ronde, ombre douce
     courte (Art Bible § asset_rules). Liseré sarcelle = affordance cliquable. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Cible de récolte">
  <defs>
    <radialGradient id="ct-body" cx="38%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#FFCE54"/>
      <stop offset="62%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#C77F14"/>
    </radialGradient>
    <filter id="ct-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1E1B18" flood-opacity="0.55"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="82" fill="url(#ct-body)" stroke="#3BB6A6" stroke-width="5" filter="url(#ct-shadow)"/>
  <circle cx="100" cy="100" r="58" fill="none" stroke="#1E1B18" stroke-width="3" stroke-opacity="0.28"/>
  <circle cx="74" cy="72" r="15" fill="#FFF3D6" fill-opacity="0.55"/>
  <path d="M100 52 L112 88 L150 88 L120 111 L131 148 L100 125 L69 148 L80 111 L50 88 L88 88 Z"
        fill="#1E1B18" fill-opacity="0.32"/>
</svg>
