<!-- req_click_feedback_vfx — soft-glow-vfx. Halo d'impact du clic, superposé à la
     cible au tick du clic et absent du tick précédent (preuve R3). Halo doux, pas de
     dégradé lourd (Art Bible § asset_rules). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Impact de clic">
  <defs>
    <radialGradient id="cf-glow" cx="50%" cy="50%" r="50%">
      <stop offset="45%" stop-color="#FFCE54" stop-opacity="0"/>
      <stop offset="78%" stop-color="#FFCE54" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#cf-glow)"/>
  <g stroke="#FFCE54" stroke-width="4" stroke-linecap="round" stroke-opacity="0.9">
    <path d="M60 6 v14"/><path d="M60 100 v14"/><path d="M6 60 h14"/><path d="M100 60 h14"/>
    <path d="M22 22 l10 10"/><path d="M88 88 l10 10"/><path d="M98 22 l-10 10"/><path d="M32 88 l-10 10"/>
  </g>
</svg>
