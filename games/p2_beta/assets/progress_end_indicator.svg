<!-- req_progress_end_indicator — flat-vector-ui. Gouttière de la JAUGE DE FIN :
     bandeau fin, persistant, distinct en position/forme/taille du compteur de
     ressource (Art Bible § world_constraints). Les 4 crans marquent les seuils de
     stage, pour que la position dans le run se lise sans lire un chiffre. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 22" width="400" height="22" preserveAspectRatio="none" role="img" aria-label="Gouttière de la jauge de fin">
  <rect x="1" y="1" width="398" height="20" rx="10" fill="#2A2622" stroke="#3A342E" stroke-width="2"/>
  <g stroke="#A79E92" stroke-width="2" stroke-opacity="0.75">
    <path d="M80 4 v14"/><path d="M160 4 v14"/><path d="M240 4 v14"/><path d="M320 4 v14"/>
  </g>
</svg>
