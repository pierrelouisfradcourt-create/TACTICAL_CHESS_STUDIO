<!-- req_background — warm-tactile-illustration. Champ chaud calme garantissant le
     contraste des nombres : le fond ne rivalise JAMAIS avec les chiffres
     (Art Bible § ui_readability, hiérarchie stricte). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Fond de jeu">
  <defs>
    <radialGradient id="bg-field" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#2E2823"/>
      <stop offset="100%" stop-color="#1E1B18"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg-field)"/>
  <g stroke="#3A342E" stroke-width="1.5" stroke-opacity="0.55">
    <path d="M0 150 H800"/><path d="M0 300 H800"/><path d="M0 450 H800"/>
  </g>
  <circle cx="120" cy="110" r="46" fill="#F5A623" fill-opacity="0.05"/>
  <circle cx="690" cy="500" r="72" fill="#3BB6A6" fill-opacity="0.05"/>
</svg>
