     rendu, ce n'est pas une overlay posée dessus) — Art Bible § world_constraints. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Scène de victoire">
  <defs>
    <radialGradient id="vs-sky" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#4A3A22"/>
      <stop offset="70%" stop-color="#2A2622"/>
      <stop offset="100%" stop-color="#1E1B18"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#vs-sky)"/>
  <g fill="none" stroke="#F5A623" stroke-opacity="0.5">
    <circle cx="400" cy="250" r="110" stroke-width="4"/>
    <circle cx="400" cy="250" r="152" stroke-width="3" stroke-opacity="0.34"/>
    <circle cx="400" cy="250" r="196" stroke-width="2" stroke-opacity="0.2"/>
  </g>
  <circle cx="400" cy="250" r="70" fill="#FFCE54"/>
  <path d="M0 470 L150 400 L300 452 L450 386 L600 448 L800 380 V600 H0 Z" fill="#8E6FE0" fill-opacity="0.32"/>
  <path d="M0 520 L180 468 L360 512 L540 460 L720 508 L800 480 V600 H0 Z" fill="#1E1B18"/>
</svg>
