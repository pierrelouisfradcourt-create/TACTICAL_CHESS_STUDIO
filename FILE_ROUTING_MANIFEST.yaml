# FILE_ROUTING_MANIFEST.yaml
# SSOT du contrat de fichiers — Tactical Chess Studio
# Autorité : HumanGate (Pierre)
# Mis à jour : 2026-05-31
#
# Note technique Python 3.12 :
#   PurePosixPath.match() — "**" requiert un composant intermédiaire.
#   Pour fichiers directs dans un dossier : utiliser "dossier/*.ext"
#   Pour sous-dossiers : utiliser "dossier/**/*.ext"
#   La chaîne doc_hygiene_chain.py applique les deux en séquence.
#
# Statuts autorisés :
#   IMPLEMENTED | DOCUMENTED_ONLY | PASSIVE | BLOCKED | SANDBOX | LOCAL | ORPHANED | DECISION_PENDING
# Lanes autorisées :
#   SAFE_AUTO | AUDIT_REQUIRED | HUMAN_REQUIRED | FORBIDDEN | NA

routing:

  # ============================================================
  # TRACKED — Fichiers intentionnellement dans git
  # ============================================================
  tracked:

    # --- Runtime Rust ---
    - pattern: "src/*.rs"
      status: IMPLEMENTED
      lane: AUDIT_REQUIRED
      description: "Runtime Rust root level"

    - pattern: "src/**/*.rs"
      status: IMPLEMENTED
      lane: AUDIT_REQUIRED
      description: "Runtime Rust code — active source truth. Search = autorité finale."

    - pattern: "Cargo.toml"
      status: IMPLEMENTED
      lane: AUDIT_REQUIRED
      description: "Rust manifest"

    - pattern: "Cargo.lock"
      status: IMPLEMENTED
      lane: AUDIT_REQUIRED
      description: "Rust lockfile"

    # --- ML Python ---
    - pattern: "ml/*.py"
      status: varies
      lane: AUDIT_REQUIRED
      description: "ML pipeline Python — inference, training, dataset. train.py = FORBIDDEN sans gate."

    - pattern: "ml/**/*.py"
      status: varies
      lane: AUDIT_REQUIRED
      description: "ML pipeline Python sous-dossiers"

    - pattern: "ml/move_vocab.py"
      status: IMPLEMENTED
      lane: AUDIT_REQUIRED
      description: "Standard move vocab helper — fingerprint stable 690ce94a"

    - pattern: "ml/infer_policy.py"
      status: IMPLEMENTED
      lane: AUDIT_REQUIRED
      description: "Inference Python — value head actuellement jetée (issue #NEW-04)"

    - pattern: "ml/train.py"
      status: PASSIVE
      lane: FORBIDDEN
      description: "Training pipeline — FORBIDDEN sans gate HumanGate explicite"

    - pattern: "ml/lichess_importer.py"
      status: IMPLEMENTED
      lane: AUDIT_REQUIRED
      description: "Importeur CSV Lichess -> JSONL"

    - pattern: "ml/rebuild_levels.py"
      status: IMPLEMENTED
      lane: AUDIT_REQUIRED
      description: "Reconstruction niveaux puzzles L2/L3"

    # --- Scripts ---
    - pattern: "scripts/*.py"
      status: IMPLEMENTED
      lane: HUMAN_REQUIRED
      description: "Scripts CI/automation — HUMAN_REQUIRED systématiquement"

    - pattern: "scripts/*.ps1"
      status: IMPLEMENTED
      lane: HUMAN_REQUIRED
      description: "Scripts PowerShell — HUMAN_REQUIRED"

    - pattern: "scripts/auto_merge_guard.py"
      status: IMPLEMENTED
      lane: HUMAN_REQUIRED
      description: "Seule autorité de merge automatique — ne jamais toucher en automation"

    # --- Lab chains (pipeline de développement) ---
    - pattern: "lab/chains/*.py"
      status: IMPLEMENTED
      lane: SAFE_AUTO
      description: "Chaînes de développement — orchestrateurs LLM local"

    - pattern: "lab/chains/doc_hygiene_chain.py"
      status: IMPLEMENTED
      lane: SAFE_AUTO
      description: "Chaîne d'hygiène documentaire — créée 2026-05-31, 54 tests verts"

    - pattern: "lab/chains/test_doc_hygiene.py"
      status: IMPLEMENTED
      lane: SAFE_AUTO
      description: "Tests pytest doc_hygiene_chain — 54 passed"

    - pattern: "lab/chains/chain_executor.py"
      status: IMPLEMENTED
      lane: SAFE_AUTO
      description: "Executor Devstral — dry-run par défaut"

    - pattern: "lab/chains/validate_packet.py"
      status: IMPLEMENTED
      lane: SAFE_AUTO
      description: "Validateur Truth Packet fail-closed"

    - pattern: "lab/chains/chain_log.py"
      status: IMPLEMENTED
      lane: SAFE_AUTO
      description: "Logger historique chaînes"

    - pattern: "lab/chains/run_chain.py"
      status: IMPLEMENTED
      lane: SAFE_AUTO
      description: "Orchestrateur principal v4 (Mistral + Ingénieur + Red Team)"

    - pattern: "lab/chains/IMPROVEMENT_LEDGER.yaml"
      status: IMPLEMENTED
      lane: SAFE_AUTO
      description: "Kaizen Loop ledger — SSOT des improvements. Mis a jour par kaizen_loop.py."

    - pattern: "lab/chains/KAIZEN_PROTOCOL.md"
      status: DOCUMENTED_ONLY
      lane: SAFE_AUTO
      description: "Protocole boucle d amelioration continue. Doctrine operationnelle."

    - pattern: ".gitignore"
      status: IMPLEMENTED
      lane: SAFE_AUTO
      description: "Gitignore repo — configuration standard."

    # --- Scripts de debug racine (outils réutilisables) ---
    - pattern: "audit_moves_length.py"
      status: IMPLEMENTED
      lane: AUDIT_REQUIRED
      description: "Outil audit longueur moves — réutilisable pour debug dataset"

    - pattern: "audit_rocky.py"
      status: IMPLEMENTED
      lane: AUDIT_REQUIRED
      description: "Outil audit Rocky — diagnostic agent"

    - pattern: "fix_hanging.py"
      status: IMPLEMENTED
      lane: AUDIT_REQUIRED
      description: "Fix filtrage puzzles hanging_piece 1-coup (Moves.len()==2)"

    # --- Docs maîtres ---
    - pattern: "00_STUDIO_CONTROL/00_MASTER_DOCS/*.md"
      status: DOCUMENTED_ONLY
      lane: SAFE_AUTO
      description: "Master docs canoniques — 00_VISION à 11_REPRISE_PROMPT"

    - pattern: "00_STUDIO_CONTROL/00_MASTER_DOCS/00_NAVIGATION_INDEX.md"
      status: DOCUMENTED_ONLY
      lane: SAFE_AUTO
      description: "Index de navigation master docs — à committer"

    - pattern: "00_STUDIO_CONTROL/99_ARCHIVE/**/*.md"
      status: DOCUMENTED_ONLY
      lane: SAFE_AUTO
      description: "Archive docs historiques — DOCUMENTED_ONLY"

    - pattern: "00_STUDIO_CONTROL/99_ARCHIVE/records/DATASET_LEGACY_CHAMPION_TEACHER_INVENTORY_V0.md"
      status: DOCUMENTED_ONLY
      lane: SAFE_AUTO
      description: "Inventaire legacy dataset champion teacher — à committer comme archive"

    - pattern: "docs/control-plane/**/*.md"
      status: DOCUMENTED_ONLY
      lane: SAFE_AUTO
      description: "Control-plane docs governance"

    # --- Lab puzzles ---
    - pattern: "lab/puzzles/level1.jsonl"
      status: IMPLEMENTED
      lane: SAFE_AUTO
      description: "2081 puzzles Lichess L1 (mate_in_1, hanging_piece 1-coup)"

    - pattern: "lab/puzzles/level2.jsonl"
      status: IMPLEMENTED
      lane: SAFE_AUTO
      description: "2000 puzzles Lichess L2 (fork, pin, mateIn2)"

    - pattern: "lab/puzzles/level3.jsonl"
      status: IMPLEMENTED
      lane: SAFE_AUTO
      description: "2000 puzzles Lichess L3 (anastasiasMate, rookEndgame)"

    # --- Lab reports (baseline traçable) ---
    - pattern: "lab/reports/eval_smoke_baseline.json"
      status: IMPLEMENTED
      lane: DOCUMENTED_ONLY
      description: "Première baseline EvalRunResult — commit c0ebf62, 2026-05-30"

    - pattern: "lab/reports/learning_progress.json"
      status: IMPLEMENTED
      lane: DOCUMENTED_ONLY
      description: "Learning progress schema v2 — 2026-05-30"

    - pattern: "lab/reports/conversion_suite_v1_latest.json"
      status: IMPLEMENTED
      lane: DOCUMENTED_ONLY
      description: "Conversion suite — targeted metric only, NOT Elo evidence"

    # --- Lab datasets (trackés avec précaution) ---
    - pattern: "lab/datasets/teacher_samples.jsonl"
      status: BLOCKED
      lane: FORBIDDEN
      description: "Teacher dataset CORROMPU — 553 samples, 0pct neural, result=draw. Issue #NEW-03. Ne pas utiliser."

    - pattern: "lab/datasets/linked_pedagogy/*.pgn"
      status: IMPLEMENTED
      lane: SAFE_AUTO
      description: "Sources PGN champions du monde — Ding vs Gukesh, World Cup 2023"

    - pattern: "lab/datasets/linked_pedagogy/*.csv"
      status: IMPLEMENTED
      lane: SAFE_AUTO
      description: "CSV candidates pedagogy triage"

    - pattern: "lab/pedagogy_db/*.pgn"
      status: IMPLEMENTED
      lane: SAFE_AUTO
      description: "PGN pedagogiques — endgames, tactics, conversion"

    - pattern: "lab/ACTIVE_DATASET.txt"
      status: IMPLEMENTED
      lane: AUDIT_REQUIRED
      description: "Pointer dataset actif — pointe vers lab/dataset/"

    # --- Evaluation system ---
    - pattern: "src/evaluation/*.rs"
      status: IMPLEMENTED
      lane: AUDIT_REQUIRED
      description: "EvalRunResult, RegressionGuard, GuardVerdict — 13 tests verts"

    # --- Schemas ---
    - pattern: "schemas/*.json"
      status: PASSIVE
      lane: SAFE_AUTO
      description: "Schemas JSON — contrainte de forme uniquement"

    - pattern: "schemas/*.schema.json"
      status: PASSIVE
      lane: SAFE_AUTO
      description: "JSON schemas formels"

    # --- CI ---
    - pattern: ".github/**/*.yml"
      status: IMPLEMENTED
      lane: HUMAN_REQUIRED
      description: "GitHub Actions CI — HUMAN_REQUIRED systématiquement"

    # --- Manifest lui-même ---
    - pattern: "FILE_ROUTING_MANIFEST.yaml"
      status: IMPLEMENTED
      lane: SAFE_AUTO
      description: "Ce fichier — SSOT du contrat de fichiers. Mis à jour par doc_hygiene_chain."

  # ============================================================
  # GITIGNORED — Fichiers intentionnellement exclus de git
  # ============================================================
  gitignored:

    - pattern: ".venv312/**"
      status: LOCAL
      lane: NA
      description: "Python venv local — jamais committer"

    - pattern: ".venv312"
      status: LOCAL
      lane: NA
      description: "Python venv local root"

    - pattern: "*.log"
      status: LOCAL
      lane: NA
      description: "Tous les logs — ne jamais committer"

    - pattern: "rocky_debug.log"
      status: LOCAL
      lane: NA
      description: "Log debug Rocky — LOCAL, ne pas committer"

    # Sandbox lab
    - pattern: "lab/hygiene/**"
      status: SANDBOX
      lane: NA
      description: "Rapports doc_hygiene_chain — sandbox local"

    - pattern: "lab/hygiene/*.md"
      status: SANDBOX
      lane: NA
