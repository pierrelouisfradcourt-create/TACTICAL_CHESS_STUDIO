    - pattern: "lab/reports/*.tmp"
      status: LOCAL
      lane: NA
      description: "Fichiers tmp rapports — transitoires"

    - pattern: "lab/reports/*.txt"
      status: LOCAL
      lane: NA
      description: "Fichiers txt diagnostics locaux"

    - pattern: "lab/reports/eval_l2_run.tmp"
      status: LOCAL
      lane: NA
