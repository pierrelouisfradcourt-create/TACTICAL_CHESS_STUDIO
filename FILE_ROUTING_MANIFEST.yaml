    - pattern: "lab/reverse_dataset/**"
      status: LOCAL
      lane: NA
      description: "Reverse dataset et weakness_log — état opérationnel local"

    - pattern: "lab/reverse_dataset/weakness_log.jsonl"
      status: LOCAL
      lane: NA
      description: "Log faiblesses Rocky — état opérationnel, ne pas committer"

    - pattern: ".studio_state/**"
      status: LOCAL
      lane: NA
      description: "Studio operational state — local only"

    - pattern: "lab/gameplay_observation/sandbox_outputs/**"
      status: SANDBOX
      lane: NA
      description: "Sandbox outputs observation — non-canonical"

    - pattern: "LOCAL_ARCHIVE/**"
      status: LOCAL
      lane: NA
      description: "Archive AM stack locale — passive, BLOCKED publication"

    - pattern: "lab/runs/**"
      status: FORBIDDEN
      lane: FORBIDDEN
      description: "RUN_* bundles — FORBIDDEN en automation. Ne jamais créer."

  # ============================================================
  # UNROUTED — Décisions en attente ou DELETE
  # ============================================================
  unrouted:

    - pattern: "ml/auto_coach.py"
      status: ORPHANED
      lane: AUDIT_REQUIRED
      created_by: "session inconnue (erreur)"
      recommendation: "DELETE — créé par erreur, pas de valeur documentée"
      decision_deadline: "prochaine session"

    - pattern: "scripts/uxpilote/**"
      status: DECISION_PENDING
      lane: HUMAN_REQUIRED
      created_by: "session UxPilote prototype"
      recommendation: "HUMAN_REQUIRED — scripts/ = review manuelle obligatoire. Décider: TRACKED ou DELETE."
      note: "uxpilote_readonly.py existe non tracké depuis 04_STUDIO.md"
      decision_deadline: "Phase 1 UxPilote"

    - pattern: "scripts/uxpilote"
      status: DECISION_PENDING
      lane: HUMAN_REQUIRED
      created_by: "session UxPilote prototype"
      recommendation: "HUMAN_REQUIRED — voir pattern ci-dessus"
      decision_deadline: "Phase 1 UxPilote"

# ============================================================
# RÈGLES D'AUDIT (lues par doc_hygiene_chain.py)
# ============================================================
audit_rules:

  - rule: "Tout fichier créé doit être routé"
    enforcement: "BLOCK si fichier présent en worktree et absent de tracked/gitignored/unrouted"
    action: "Afficher orphelins + recommandation + bloquer PR"

  - rule: "Sandbox outputs dans lab/hygiene/ ou lab/chains/traces/ uniquement"
    enforcement: "WARN si fichier sandbox détecté ailleurs"
    action: "Proposer déplacement ou gitignore"

  - rule: "DECISION_PENDING résolu dans 3 cycles de chaîne"
    enforcement: "WARN après 3 exécutions sans résolution"
    action: "Escalader à HumanGate"

  - rule: "ml/auto_coach.py doit être supprimé"
    enforcement: "WARN à chaque exécution tant que présent"
    action: "Rappeler recommendation DELETE"

  - rule: "lab/datasets/teacher_samples.jsonl ne doit pas être modifié"
    enforcement: "BLOCK si détecté dans changed_files"
    action: "Issue #NEW-03 ouverte — dataset rebuild requis via HumanGate"

  - rule: "claim_verdict est toujours NO_CLAIM_ALLOWED"
    enforcement: "Constante — jamais overridable par automation"
    action: "N/A"

# ============================================================
# MÉTADONNÉES
# ============================================================
metadata:
  version: "1.0"
  created: "2026-05-31"
  authority: "HumanGate"
  last_updated_by: "doc_hygiene_chain v1 (bootstrap manuel)"
  python_312_note: >
    PurePosixPath.match() en Python 3.12 requiert un composant intermédiaire
    pour '**'. Fichiers directs : utiliser 'dossier/*.ext'.
    Sous-dossiers : utiliser 'dossier/**/*.ext'.
    doc_hygiene_chain.py applique les deux patterns en séquence.
  next_review: "Après décision scripts/uxpilote/ et suppression ml/auto_coach.py"
