# FILE_ROUTING_MANIFEST.yaml
# SSOT du contrat de fichiers — Tactical Chess Studio
# Autorité : HumanGate (Pierre)
# Mis à jour : 2026-06-02
#
# Note technique Python 3.12 :
#   PurePosixPath.match() — "**" requiert un composant intermédiaire.
#   Pour fichiers directs dans un dossier : utiliser "dossier/*.ext"
#   Pour sous-dossiers : utiliser "dossier/**/*.ext"
#   La chaîne doc_hygiene_chain.py applique les deux en séquence.
#
# Statuts autorisés :
#   IMPLEMENTED | DOCUMENTED_ONLY | PASSIVE | BLOCKED | SANDBOX | LOCAL | ORPHANED | DECISION_PENDING
# Lanes autorisées :
#   SAFE_AUTO | AUDIT_REQUIRED | HUMAN_REQUIRED | FORBIDDEN | NA

