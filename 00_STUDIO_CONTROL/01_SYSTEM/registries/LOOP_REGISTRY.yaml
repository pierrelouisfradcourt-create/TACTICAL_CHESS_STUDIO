schema_version: "CONTROL_ROOM_LOOP_REGISTRY_V0"
status: "DOCUMENTED_ONLY"
owner: "HumanGate"
last_checked: "2026-05-20"
loops:
  - loop_id: "LLM_CODEX_CONTROL_ROOM_LOOP_V0"
    name: "LOCAL LLM -> CODEX TEACHER -> LOCAL LLM RETRY -> CODEX FINAL VALIDATION"
    status: "DOCUMENTED_ONLY"
    sequence:
      - step: "local_llm_student_pass"
        actor: "local_llm_student"
        status: "DOCUMENTED_ONLY"
        output: "LOCAL_LLM_STUDENT_PASS_TEMPLATE.yaml"
        truth_authority: false
        allowed_result: "candidate_only"
      - step: "codex_teacher_correction"
        actor: "codex_teacher"
        status: "DOCUMENTED_ONLY"
        output: "CODEX_TEACHER_CORRECTION_TEMPLATE.yaml"
        truth_authority: "evidence_bound"
        required:
          - "evidence"
          - "commands_run"
          - "corrected_classifications"
          - "blocked_claims"
      - step: "local_llm_retry_pass"
        actor: "local_llm_retry"
        status: "DOCUMENTED_ONLY"
        output: "LOCAL_LLM_RETRY_PASS_TEMPLATE.yaml"
        truth_authority: false
        allowed_result: "revised_candidate_only"
      - step: "codex_final_validation"
        actor: "codex_final_validation"
        status: "DOCUMENTED_ONLY"
        output: "CODEX_FINAL_VALIDATION_TEMPLATE.yaml"
        truth_authority: "evidence_bound"
        required:
          - "route_check"
          - "yaml_validation"
          - "status_taxonomy_validation"
          - "floating_items_validation"
          - "noise_gate_validation"
      - step: "humangate"
        actor: "HumanGate"
        status: "DOCUMENTED_ONLY"
        authority: "final"
        allowed_result:
          - "approve"
          - "block"
          - "request_revision"
    reads:
      - "00_STUDIO_CONTROL/00_INDEX/CONTROL_INDEX.md"
      - "00_STUDIO_CONTROL/01_MAPS/STUDIO_MAP.md"
      - "00_STUDIO_CONTROL/01_MAPS/STUDIO_OUTPUT_ROUTING_POLICY_V0.md"
      - "00_STUDIO_CONTROL/02_NAVIGATION/STUDIO_SOURCE_ANCHORING_V0.md"
      - "00_STUDIO_CONTROL/03_REGISTRIES/FILE_REGISTRY.yaml"
      - "00_STUDIO_CONTROL/03_REGISTRIES/AGENT_REGISTRY.yaml"
      - "00_STUDIO_CONTROL/04_BOUNDARIES/CLAIMS_LEDGER.yaml"
      - "00_STUDIO_CONTROL/05_STATUS/REPO_TRUTH_SNAPSHOT.yaml"
    writes:
      - "routed pass records only when HumanGate authorizes output routing"
    output_routes:
      student_pass: "00_STUDIO_CONTROL/07_FORMS/LOCAL_LLM_STUDENT_PASS_TEMPLATE.yaml as template only; filled records require separate routing"
      teacher_correction: "00_STUDIO_CONTROL/07_FORMS/CODEX_TEACHER_CORRECTION_TEMPLATE.yaml as template only; filled records require separate routing"
      retry_pass: "00_STUDIO_CONTROL/07_FORMS/LOCAL_LLM_RETRY_PASS_TEMPLATE.yaml as template only; filled records require separate routing"
      final_validation: "00_STUDIO_CONTROL/07_FORMS/CODEX_FINAL_VALIDATION_TEMPLATE.yaml as template only; filled records require separate routing"
    blocked_if:
      - "agent_without_registry"
      - "loop_without_registry"
      - "output_route_unknown"
      - "required_source_not_loaded"
      - "claim_without_evidence"
      - "action_creates_noise"
      - "HumanGate_final_authority_removed"
    evidence:
      - "Loop registered as documentation-only control-room workflow."
