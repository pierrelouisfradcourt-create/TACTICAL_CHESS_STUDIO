  neural_proposal_rerank_helper_only:
    status: "DOCUMENTED_ONLY"
    rule: "Neural may propose, rank, rerank, or provide helper signals only."
    allowed_role: "proposal_rerank_helper_only"
    final_authority: false
  lightweight_critic_guard_helper_only:
    status: "DOCUMENTED_ONLY"
    rule: "Critic may guard or flag risks but must not select the final move."
    allowed_role: "guard_helper_only"
    final_authority: false
  decision_controller_activation:
    status: "BLOCKED"
    rule: "DecisionController activation requires separate HumanGate authorization."
  llm_final_move_authority:
    status: "BLOCKED"
    rule: "LLM must stay outside the critical gameplay decision loop."
  benchmark_or_elo_claim:
    status: "BLOCKED"
    rule: "Logs, reports, and benchmarks must not become strength claims without separate HumanGate authorization and evidence."

