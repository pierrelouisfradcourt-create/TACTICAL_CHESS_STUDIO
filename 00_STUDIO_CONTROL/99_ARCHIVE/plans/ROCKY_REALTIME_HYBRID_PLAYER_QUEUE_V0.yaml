  parent_index_id: "PLAYER_IMPROVEMENT_QUEUE_INDEX_V0"
  intended_surface: "roadmap_docs_only"
  status: "DOCUMENTED_ONLY"
  purpose: "Plan a realtime player model that combines current Neural helper signals, specialized Search final authority, and lightweight Critic guard signals without runtime mutation."
  runtime_authority: "NONE"
  mutation_authority: "HumanGate"
  activation_authority: "HumanGate"
  claim_authority: "HumanGate"

realtime_architecture:
  fast_loop:
    neural_current:
      role: "proposal_rerank_helper_only"
      final_authority: "BLOCKED"
      status: "DOCUMENTED_ONLY"
      allowed_future_use:
        - "candidate_proposal"
        - "candidate_rerank_signal"
        - "helper_feature_signal"
      blocked_future_use:
        - "final_move_selection"
        - "authority_override"
        - "benchmark_or_strength_claim"
    specialized_search:
      role: "final_tactical_authority"
      final_authority: "DOCUMENTED_ONLY"
      status: "DOCUMENTED_ONLY"
      allowed_future_use:
        - "final_action_selection"
        - "legality_filtered_search"
        - "bounded_budget_search"
      blocked_future_use:
        - "unauthorized_benchmark_claim"
        - "dataset_or_model_generation"
    lightweight_critic:
      role: "guard_helper_only"
      final_authority: "BLOCKED"
      status: "DOCUMENTED_ONLY"
      allowed_future_use:
        - "risk_flag"
        - "sanity_check"
        - "candidate_warning"
      blocked_future_use:
        - "final_move_selection"
        - "DecisionController_activation"
  offline_loop:
    llm_planner:
      role: "audit_adapt_plan_between_decisions_only"
      critical_loop_access: "BLOCKED"
      final_move_authority: "BLOCKED"
      status: "DOCUMENTED_ONLY"
    memory:
      role: "passive_until_authorized"
      status: "PASSIVE"
  authority:
    final_gameplay_authority: "Search"
    mutation_activation_claim_authority: "HumanGate"
    promotion_authority: "HumanGate"

future_micro_patch_categories:
  - id: "SEARCH_ORDERING_CANDIDATE"
    status: "DOCUMENTED_ONLY"
    intended_surface: "roadmap_docs_only"
    purpose: "Plan future move ordering improvements without changing Search authority."
    required_boundary_guard: "SEARCH_AUTHORITY_TRACE_GUARD"
    blocked_claims:
      - "benchmark_proof"
      - "elo_claim"
      - "runtime_strength_claim"
  - id: "SEARCH_BUDGET_CANDIDATE"
    status: "DOCUMENTED_ONLY"
    intended_surface: "roadmap_docs_only"
    purpose: "Plan future bounded search budget improvements without benchmark claims."
    required_boundary_guard: "SEARCH_AUTHORITY_TRACE_GUARD"
    blocked_claims:
      - "benchmark_proof"
      - "scientific_proof"
  - id: "NEURAL_RERANK_SIGNAL_CANDIDATE"
    status: "DOCUMENTED_ONLY"
    intended_surface: "roadmap_docs_only"
    purpose: "Plan future Neural rerank signal use while preserving helper-only authority."
    required_boundary_guard: "NEURAL_PROPOSAL_ONLY_GUARD"
    blocked_authority_changes:
      - "Neural final authority"
      - "LLM final move authority"
  - id: "CRITIC_SANITY_CHECK_CANDIDATE"
    status: "DOCUMENTED_ONLY"
    intended_surface: "roadmap_docs_only"
    purpose: "Plan future lightweight critic risk checks without final decision authority."
    required_boundary_guard: "CRITIC_HELPER_ONLY_GUARD"
    blocked_authority_changes:
      - "Critic final authority"
      - "DecisionController activation"
  - id: "DECISION_EVIDENCE_PACKET_CANDIDATE"
    status: "DOCUMENTED_ONLY"
    intended_surface: "roadmap_docs_only"
    purpose: "Plan future evidence packet emitted per decision without runtime activation in this task."
    required_boundary_guard: "NO_BENCHMARK_ELO_CLAIM_GUARD"
    blocked_outputs:
      - "latest.json"
      - "lab/runs/RUN_*"
      - "model_or_checkpoint"

compatibility:
  boundary_guard_queue:
    status: "DOCUMENTED_ONLY"
    reason: "Realtime player planning inherits Search/Neural/Critic/LLM boundaries."
  observability_evidence_queue:
    status: "DOCUMENTED_ONLY"
    reason: "Observability can support future trace/evidence candidates without strength claims."
  uxpilote_3d_ux_patch_chain_queue:
    status: "DOCUMENTED_ONLY"
    reason: "UX can visualize realtime architecture and queue state without runtime mutation."
  conditional_compatibility:
    - pair: ["REALTIME_HYBRID_PLAYER_QUEUE_V0", "SEARCH_SPECIALIZATION_QUEUE_V0"]
      condition: "Search remains final tactical authority and any patch stays bounded to exact target files."
    - pair: ["REALTIME_HYBRID_PLAYER_QUEUE_V0", "LIGHTWEIGHT_CRITIC_QUEUE_V0"]
      condition: "Critic remains guard/helper only and does not activate DecisionController."
    - pair: ["REALTIME_HYBRID_PLAYER_QUEUE_V0", "OFFLINE_LLM_PLANNER_QUEUE_V0"]
      condition: "LLM remains outside the critical loop and produces planning/audit only."
  blocked_with:
