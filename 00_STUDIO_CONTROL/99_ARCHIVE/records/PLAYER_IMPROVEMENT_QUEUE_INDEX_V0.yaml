architecture_rule:
  runtime_fast_loop:
    neural:
      role: "proposal_rerank_helper_only"
      final_authority: false
      status: "PASSIVE"
    search:
      role: "final_tactical_authority"
      final_authority: true
      status: "PASSIVE"
    critic:
      role: "lightweight_guard_helper_only"
      final_authority: false
      status: "DOCUMENTED_ONLY"
  offline_loop:
    llm_planner:
      role: "audit_adapt_plan_between_decisions_only"
      critical_loop_access: "BLOCKED"
      final_move_authority: "BLOCKED"
      status: "DOCUMENTED_ONLY"
    memory:
      role: "passive_until_authorized"
      status: "PASSIVE"
  authority:
    final_gameplay_authority: "Search"
    mutation_activation_claim_authority: "HumanGate"
    promotion_authority: "HumanGate"

queues:
  - id: "BOUNDARY_GUARD_QUEUE_V0"
    intended_surface: "roadmap_docs_only"
    status: "DOCUMENTED_ONLY"
    purpose: "Maintain Neural/Search/DecisionController boundaries."
    runtime_authority: "NONE"
    compatible_default: true
  - id: "REALTIME_HYBRID_PLAYER_QUEUE_V0"
    intended_surface: "roadmap_docs_only"
    status: "DOCUMENTED_ONLY"
    purpose: "Plan neural current + specialized search + lightweight critic."
    runtime_authority: "NONE"
    compatible_default: false
  - id: "SEARCH_SPECIALIZATION_QUEUE_V0"
    intended_surface: "roadmap_docs_only"
    status: "DOCUMENTED_ONLY"
    purpose: "Plan bounded search improvements without authority drift."
    runtime_authority: "NONE"
    compatible_default: false
  - id: "LIGHTWEIGHT_CRITIC_QUEUE_V0"
    intended_surface: "roadmap_docs_only"
    status: "DOCUMENTED_ONLY"
    purpose: "Plan critic checks without final decision authority."
    runtime_authority: "NONE"
    compatible_default: false
  - id: "OFFLINE_LLM_PLANNER_QUEUE_V0"
    intended_surface: "roadmap_docs_only"
    status: "DOCUMENTED_ONLY"
    purpose: "Plan offline LLM audit, adaptation, and memory outside the critical loop."
    runtime_authority: "NONE"
    compatible_default: "conditional"
  - id: "OBSERVABILITY_EVIDENCE_QUEUE_V0"
    intended_surface: "roadmap_docs_only"
    status: "DOCUMENTED_ONLY"
    purpose: "Plan evidence, traces, and reports without benchmark or proof claims."
    runtime_authority: "NONE"
    compatible_default: true
  - id: "DATASET_TRAINING_BLOCKED_QUEUE_V0"
    intended_surface: "roadmap_docs_only"
    status: "DOCUMENTED_ONLY"
    purpose: "Keep dataset, training, model, and promotion actions explicitly blocked."
    runtime_authority: "NONE"
    compatible_default: false

compatibility_matrix:
  compatible:
    - pair: ["BOUNDARY_GUARD_QUEUE_V0", "REALTIME_HYBRID_PLAYER_QUEUE_V0"]
      reason: "Boundary guard constrains realtime planning."
    - pair: ["BOUNDARY_GUARD_QUEUE_V0", "SEARCH_SPECIALIZATION_QUEUE_V0"]
      reason: "Search improvement remains constrained by final-authority rule."
    - pair: ["BOUNDARY_GUARD_QUEUE_V0", "LIGHTWEIGHT_CRITIC_QUEUE_V0"]
      reason: "Critic remains guard/helper only."
    - pair: ["BOUNDARY_GUARD_QUEUE_V0", "OFFLINE_LLM_PLANNER_QUEUE_V0"]
      reason: "Offline planner remains outside critical loop and under HumanGate."
    - pair: ["BOUNDARY_GUARD_QUEUE_V0", "OBSERVABILITY_EVIDENCE_QUEUE_V0"]
      reason: "Observability supports boundary evidence without activation."
    - pair: ["SEARCH_SPECIALIZATION_QUEUE_V0", "LIGHTWEIGHT_CRITIC_QUEUE_V0"]
      reason: "Compatible if Search still chooses the final action."
    - pair: ["OBSERVABILITY_EVIDENCE_QUEUE_V0", "REALTIME_HYBRID_PLAYER_QUEUE_V0"]
      reason: "Observation can support planning but cannot prove benchmark or strength."
    - pair: ["OBSERVABILITY_EVIDENCE_QUEUE_V0", "SEARCH_SPECIALIZATION_QUEUE_V0"]
      reason: "Trace evidence can support future targeted validation."
    - pair: ["OBSERVABILITY_EVIDENCE_QUEUE_V0", "LIGHTWEIGHT_CRITIC_QUEUE_V0"]
      reason: "Trace evidence can describe critic behavior without promoting authority."
  conditional:
    - pair: ["OFFLINE_LLM_PLANNER_QUEUE_V0", "REALTIME_HYBRID_PLAYER_QUEUE_V0"]
      condition: "LLM stays outside the critical decision loop."
    - pair: ["OFFLINE_LLM_PLANNER_QUEUE_V0", "SEARCH_SPECIALIZATION_QUEUE_V0"]
      condition: "LLM produces planning or audit only, no runtime move authority."
    - pair: ["REALTIME_HYBRID_PLAYER_QUEUE_V0", "LIGHTWEIGHT_CRITIC_QUEUE_V0"]
      condition: "Critic cannot become DecisionController or final authority."
    - pair: ["REALTIME_HYBRID_PLAYER_QUEUE_V0", "SEARCH_SPECIALIZATION_QUEUE_V0"]
      condition: "Future micro-patches must be isolated by exact target files and targeted tests."
  blocked:
    - pair: ["DATASET_TRAINING_BLOCKED_QUEUE_V0", "REALTIME_HYBRID_PLAYER_QUEUE_V0"]
      reason: "Training, dataset generation/reset, and model outputs remain blocked."
    - pair: ["DATASET_TRAINING_BLOCKED_QUEUE_V0", "SEARCH_SPECIALIZATION_QUEUE_V0"]
      reason: "Search improvement must not smuggle training or benchmark claims."
    - pair: ["DATASET_TRAINING_BLOCKED_QUEUE_V0", "LIGHTWEIGHT_CRITIC_QUEUE_V0"]
      reason: "Critic planning must not create or promote models."
    - pair: ["OFFLINE_LLM_PLANNER_QUEUE_V0", "runtime_final_move_authority"]
      reason: "LLM must not decide gameplay actions."
    - pair: ["LIGHTWEIGHT_CRITIC_QUEUE_V0", "decision_controller_activation"]
      reason: "DecisionController activation is blocked."
    - pair: ["REALTIME_HYBRID_PLAYER_QUEUE_V0", "neural_final_authority"]
      reason: "Neural remains proposal/rerank/helper only."
    - pair: ["SEARCH_SPECIALIZATION_QUEUE_V0", "benchmark_or_elo_claim"]
      reason: "Benchmark or Elo claims require separate authorization and evidence."

recommended_order:
