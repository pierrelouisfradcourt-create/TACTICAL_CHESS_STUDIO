exact_future_patch_scope:
  status: "DOCUMENTED_ONLY"
  task_card: "SEARCH-003-AUTHORITY-TRACE-SCOPE"
  patch_name: "DecisionTrace serializable authority field and Search-authority consistency check"
  one_patch_boundary: "Add explicit final-selection authority evidence to the serializable decision trace packet and require Search authority when used_search is true."
  exact_runtime_files_to_edit_if_later_authorized:
    - path: "src/chess/decision_trace.rs"
      surface: "active_runtime_code"
      required_change: "Add a nullable serialized selection_authority field to DecisionTrace, positioned after decision_mode."
      required_field_shape: "pub selection_authority: Option<String>"
      serde_rule: "Use default deserialization compatibility; do not skip serialization unless later HumanGate changes the JSON contract."
      validation_change: "Extend DecisionTraceValidationError and validate_consistency so used_search=true requires selection_authority == Some(\"search\")."
      blocked_change: "Do not introduce Neural, Critic, LLM, or DecisionController final-authority semantics."
    - path: "src/chess/decision_trace_bridge.rs"
      surface: "active_runtime_code"
      required_change: "Add a selection_authority parameter to build_decision_trace_from_legal_actions and pass it into DecisionTrace."
      required_parameter_position: "Immediately after decision_mode."
      blocked_change: "Do not call engine Search, NeuralAgent, DecisionController, or runtime gameplay from the bridge."
  exact_test_files_to_edit_if_later_authorized:
    - path: "tests/decision_trace_bridge.rs"
      surface: "tests"
      required_change: "Update bridge constructor calls, JSON expectations, and add a negative validation case for used_search=true without Search authority."
    - path: "tests/telemetry_prep.rs"
      surface: "tests"
      required_change: "Update direct DecisionTrace fixtures, JSON fixtures, deserialization fixtures, and flag-state tests for selection_authority."
  reference_only_runtime_files:
    - path: "src/chess/decision.rs"
      surface: "active_runtime_code"
      reason: "Already carries SelectionAuthority and search_authority_trace; do not edit in this micro-patch."
    - path: "src/chess/search_backend_adapter.rs"
      surface: "active_runtime_code"
      reason: "Search adapter boundary is evidence for Search final authority; do not edit in this micro-patch."
    - path: "src/ai/search_backend.rs"
      surface: "active_runtime_code"
      reason: "SearchResult does not need authority ownership for this patch."
  reference_only_test_files:
    - path: "tests/decision_authority_boundary_current.rs"
      surface: "tests"
      reason: "Boundary guard should be run later, but not edited."
    - path: "tests/search_backend_passive_adapter.rs"
      surface: "tests"
      reason: "Adapter boundary should be run later, but not edited."

