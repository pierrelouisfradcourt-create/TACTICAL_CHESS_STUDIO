  notes: 'project: factory | theme: gouvernance. Decouverte 2026-07-08 (session Leviathan).
    Sans Claude-proxy (:8765 non lance depuis 2026-06-27, pas de crash) ni GEMINI_API_KEY,
    les 3 roles de council.py (PLAN_REVIEW, RED_TEAM, DIVERGENCE) tombent tous en fallback
    Qwen -> distinct_models=1, collapsed=True, requires_humangate=True. Le mecanisme
    DETECTE le collapse mais ne l ALERTE que par un flag interne: aucune sortie humaine
    forte (pas de WARN stderr dedie au collapse, pas d exit code specifique cote lib).
    Sur un cas test a reponse connue (math pity gacha, esperance vraie ~33.6 tirages
    vs 50 annonce), Qwen seul conclut correctement EN SURFACE (50 est faux) mais avec
    un raisonnement FAUX et dans le sens OPPOSE (pretend que 50 sous-estime; realite:
    50 surestime car le pity accelere). Risque = confiance mal placee: lecture rapide
    croit que le council confirme Claude alors que le raisonnement est inverse. Gaps
    infra: (1) reactiver proxy:8765 via python scripts/claude_proxy.py; (2) provisionner
    GEMINI_API_KEY (doctrine ~/.openclaw/.env); (3) BUG latent GeminiAdapter model=gemini-flash
    vs install doc gemini-2.5-flash -> meme avec cle risque 400. Escalade Pierre. ||
    ADDENDUM 2026-07-08 (diagnostic timeout, test proxy actif) : meme avec le proxy
    :8765 relance et sain (/health OK, appel claude reussi cote serveur), PLAN_REVIEW
    retombe en fallback Qwen -> collapsed RESTE True. CAUSE RACINE : _READ_TIMEOUT_S=110s
    (constante en dur dans council.py) < latence reelle de claude --print (~114s mesure
    ce jour, 60-160s historique log) -> requests leve ReadTimeout a 110s -> CouncilCallError
    -> fallback Qwen silencieux. Le flag timed_out NE se leve PAS car c''est une requests.ReadTimeout,
    PAS une asyncio.TimeoutError (seul le role-timeout de 120s met timed_out=True).
    Le fallback est donc doublement invisible. PREUVE : en relevant _READ_TIMEOUT_S
    a 280s + role-timeout 300s, distinct_models=2, collapsed=False, PLAN_REVIEW=claude
    qui calcule juste (E=33.26 vs 50 annonce, cible ~66.5 tirages, hard pity 70 redondant
    car soft pity garantit au 69e, pire cas non borne) — meme qualite que Claude direct.
    Qwen (RED_TEAM) BLOQUE mais ne calcule jamais et conclut a l''envers (50 sous-estime).
    CORRECTIFS ATTENDUS (ajout a l''acceptance) : (a) relever _READ_TIMEOUT_S et le
    role-timeout coherent au-dessus de la latence CLI observee, idealement configurable
    par env ; (b) faire lever timed_out=True explicitement quand une ReadTimeout/CouncilCallError
    frappe le role primaire, pour que le fallback cesse d''etre invisible ; (c) alerte
    humaine des qu''un role critique passe en fallback. | [FROZEN 2026-07-19] triage
