projet: p4_beta
intention: >
  Bras DIRIGÉ (D4) de la PAIRE 4 (protocole docs/forge/RUN2_PROTOCOLE_V1.md, RATIFIÉ Pierre
  2026-08-30). Produire un jeu incremental/clicker web jouable dont la STRUCTURE est intégralement
  imposée par le fichier normatif RATIFIÉ structure_imposee_v2_FROZEN.yaml (même dossier — grammaire v2 :
  mapping explicite des 6 améliorations, tick_ms 100, budget de mesure 72000 ticks, comptabilité
  milli-R entiers), en fermant toute la chaîne de preuve full_content. La cohérence de
  dimensionnement v2 est établie par simulation de bureau ; la SOLVABILITÉ RUNTIME reste une
  obligation de CE run (caveat Pierre). La qualité ludique n'est pas jugée (donnée M7).
  OBJECTIF : première paire VALIDE (compteur actuel : 0). p1_*/p2_* restent l'archive dégradée.
contraintes:
  normative_refs:
    - spec: FORGE_DESIGN_FREEDOM_SPEC_V0
      rules: [N1, N2, N3, N4, N7, N8, N9]
  project_specific:
    techniques:
      - "genre : incremental/clicker — FIXÉ PAR PIERRE (paire pilote 2026-08-30, reconduit paire 4)"
      - >
        STRUCTURE IMPOSÉE NORMATIVE : lab/forge_briefs/p4_beta/structure_imposee_v2_FROZEN.yaml
        (RATIFIÉE Pierre 2026-08-30) — chaque valeur (croissance 1.12, coûts de base, productions,
        mapping améliorations id/effet/coût/dispo/dépendance, seuils cumulés, tick_ms 100,
        comptabilité milli-R entiers, fin S5 = 1_000_000 R cumulés) reprise TELLE QUELLE ;
        toute déviation = écart déclaré en champ structuré, jamais silencieux (M3)
      - "budget_ticks_mesure: 72000 (constante de MESURE du protocole V1, symétrique aux deux bras)"
      - "fin de partie OBSERVABLE requise (victoire S5) ; pas d'état d'échec — fidèle au genre"
      - "socle sonde web (N1) : HTML+JS, déterminisme seedé, window.__game, harnais complet à la racine"
      - "A1 (protocole V1) : le charter DOIT être matérialisé par s0 (bloc ```yaml) — un bras sans charter.yaml est invalide"
    experimentales:
      - "bras D de la PAIRE 4 — variable manipulée : l'AUTEUR DE LA STRUCTURE (grammaire ratifiée, pas une conception créative de Pierre)"
      - "preuves par propriétaires distincts du producteur (gates fiches 2/3/5 + prérequis pair_preflight)"
      - "SOLVABILITÉ RUNTIME obligatoire : un bot scripté atteint S5 dans budget_ticks_mesure (le desk-check ne compte pas)"
cible: web (HTML+JS canvas)
references_autorisees:
  - ref: "lab/forge_briefs/p4_beta/structure_imposee_v2_FROZEN.yaml (NORMATIF ratifié, pas une inspiration)"
    source: "grammaire v2 proposée Fable, RATIFIÉE Pierre 2026-08-30 (sas de pré-enregistrement)"
  - ref: "Cookie Clicker — grammaire de genre UNIQUEMENT, jamais une copie (aucun asset, nom, contenu)"
    source: "Pierre 2026-08-30 (genre de la paire)"
criteres_sortie:
  - "chaîne full_content complète : verdict signé + verify_run AUTHENTIQUE"
  - "charter.yaml MATÉRIALISÉ par s0 (A1 — condition de validité de bras)"
  - "structure du jeu == structure_imposee_v2_FROZEN.yaml, écarts déclarés en champ structuré (M3)"
  - "design_questions/r2/design_freeze exercés normalement — modification_locus utilisé pour toute réponse (aucune_requise justifié si objet normatif)"
  - "chaque asset_request.id resolved-avec-fichier ou blocked-justifié (check_asset_consumption)"
  - "check_artbible exécuté par le driver (executed_by: driver)"
  - "product_snapshot.md matérialisé (exigible pour M7(a), protocole V1 A3)"
  - "s11 red-team Qwen réel independent: true ; LM Studio down → HALT sans fallback"
  - "SOLVABILITÉ RUNTIME : bot scripté atteint S5 en ≤ 72000 ticks ; bots de mesure à variance non triviale (temps-jusqu'à-S5, jalons)"
libertes_deleguees:
  - "thème et univers"
  - "personnages/entités et leur nommage"
  - "direction artistique"
  - "assets nécessaires à la production"
  - "présentation/HUD et micro-interactions non couvertes par la structure"
  - "tout détail d'implémentation non fixé par structure_imposee_v2_FROZEN.yaml"
mesure:
  tick_ms: 100
  budget_ticks: 72000
provenance:
  genre: "Pierre 2026-08-30 (paire pilote, reconduit paire 4)"
  structure: >
    grammaire v2 RATIFIÉE Pierre 2026-08-30 (sas de pré-enregistrement) — distinction verrouillée :
    proposée par Fable, ratifiée par Pierre ; la variable expérimentale est l'auteur de la
    structure, pas l'auteur de l'univers. Caveat ratifié : cohérence de dimensionnement établie
    par simulation de bureau, solvabilité runtime = obligation de ce run.
  budget_mesure: "constante de protocole V1 (72000 ticks), ratifiée Pierre 2026-08-30, symétrique aux deux bras"
  protocole: "RUN2_PROTOCOLE_V1.md RATIFIÉ Pierre 2026-08-30 ; GO paire 4 Pierre 2026-08-30"
  criteres_sortie: "Pierre 2026-08-30 (protocole V1 + GO paire 4)"
  libertes_deleguees: "Pierre 2026-08-30 — thème/DA/assets libres dans les DEUX bras (une seule variable)"
  redaction: "Fable (poste de commande), session 2026-08-30"
