objectif: 'Produire un jeu web incremental/clicker jouable dont la structure complète
  (boucles, ressources, actions, progression, déblocages, économie, dimensionnement,
  condition de fin) est ENTIÈREMENT INVENTÉE par la chaîne Forge, en fermant toute
  la chaîne de preuve full_content (verdict signé HMAC + verify_run AUTHENTIQUE) et
  en prouvant la solvabilité runtime : un bot scripté compétent atteint une fin OBSERVABLE
  dans la fenêtre de mesure de 72000 ticks de 100 ms. Bras LIBRE (L2) de la PAIRE
  3 — variable manipulée : l''AUTEUR DE LA STRUCTURE.

  '
hors_scope:
- Jugement de la qualité ludique / du fun — donnée M7 du protocole, hors périmètre
  de ce bras.
- Consultation ou reprise de toute valeur du bras dirigé (lab/forge_briefs/p2_alpha/**,
  p1_alpha/**) — isolement de bras obligatoire.
- 'Copie de Cookie Clicker : aucun asset, nom, contenu, ni valeur numérique repris
  ; la référence sert de grammaire de genre seulement.'
- 'Changement de genre : incremental/clicker est fixé par Pierre, non négociable par
  la chaîne.'
- Changement de plateforme (autre chose que web HTML+JS canvas).
- Écriture hors du répertoire du projet games/p3_beta et de son harnais racine.
- Modification des lanes protégées (tests/, src/) et des zones gelées du studio.
criteres_succes:
- 'charter.yaml produit par s0 et accepté par l''oracle check_charter : tous les champs
  requis renseignés, aucun champ vide, absent ou évasif résiduel (condition de validité
  de bras A1).'
- Chaîne full_content complète jusqu'au verdict signé HMAC, re-vérifié AUTHENTIQUE
  par forge.verify_run.
- Structure entièrement inventée par la chaîne et documentée au charter avec provenance
  agent tracée (N2 ; mesures M2a inventé-silencieux = défaut / M2b délégué-explicite
  tracé) ; aucune grandeur structurelle empruntée au bras dirigé.
- 'SOLVABILITÉ RUNTIME prouvée : un bot scripté compétent atteint la condition de
  fin en 72000 ticks de 100 ms au plus ; bots de mesure à variance non triviale (temps-jusqu''à-la-fin,
  jalons — ≥2 valeurs distinctes non triviales).'
- Fin de partie OBSERVABLE atteinte par au moins une sonde — un idle infini n'est
  pas prouvable.
- 'Socle sonde web conforme N1 : HTML+JS, déterminisme seedé, window.__game exposé,
  harnais complet à la racine games/p3_beta.'
- 'Chaque asset_request résolu-avec-fichier ou bloqué-justifié (check_asset_consumption)
  ; check_artbible exécuté par le driver (executed_by: driver) ; product_snapshot.md
  matérialisé (exigible M7(a)).'
- 's11 red-team Qwen réel et indépendant (independent: true) ; LM Studio indisponible
  => HALT sans fallback.'
actions_interdites:
- 'Inventer ou supposer reference_jeu / plateforme_cible sans source Pierre explicite
  (leçon AutoBattler : Battlegrounds + Godot choisis hors Pierre).'
- Consulter le bras dirigé ou y aligner une grandeur structurelle — contamination
  = paire invalidée.
- Reprendre une valeur numérique, un nom, un asset ou un contenu de Cookie Clicker.
- 'Utiliser un >= tautologique dans un test d''oracle : asserter le comportement STRICT
  (une action produit vraiment sa ressource, un seuil débloque vraiment).'
- Émettre un reçu code sans evidence_path (=> exécution non prouvable => BLOCKED).
- Prévoir un fallback si LM Studio est down au s11 (=> HALT obligatoire).
- Concevoir une condition de fin inatteignable dans 72000 ticks par un bot compétent.
- 'Traiter le budget de 72000 ticks comme une valeur de design du jeu : c''est une
  constante de MESURE du protocole V1, symétrique aux deux bras.'
- git commit ou git push (gate Pierre exclusif).
plateforme_cible: 'web — HTML + JS (canvas). Source Pierre : project_brief p3_beta,
  champ cible (2026-08-30).'
reference_jeu: 'Genre incremental/clicker ; grammaire de genre de Cookie Clicker UNIQUEMENT
  (aucune copie, aucun asset/nom/contenu, aucune valeur numérique reprise). Source
  Pierre : paire pilote 2026-08-30, reconduite paire 3 (project_brief.provenance.genre
  + references_autorisees).

  '
criteres_demo:
- Un compteur de ressource visible à l'écran qui augmente quand le joueur agit (clic
  ou générateur).
- 'Au moins un déblocage OBSERVABLE : un nouvel élément à l''écran (bouton, générateur,
  section) apparaît quand un seuil est franchi.'
- 'Une progression visible dans le temps sans action continue du joueur : un générateur
  produit à l''écran de lui-même.'
- Un écran ou une bannière de FIN DE PARTIE observable quand la condition de fin est
  atteinte.
