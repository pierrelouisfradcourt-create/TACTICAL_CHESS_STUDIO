incertitudes:
  - item: "Exact millisecond tick rate of the original 1980 arcade cabinet"
    reason: "Sources mention 'deterministic timing' and 'one tile per cycle' but do not specify whether the arcade ran at 60 Hz, 50 Hz, or a bespoke rate. Different regions (NTSC vs. PAL) likely differ."
    impact: "For implementation: assume standard arcade 60 Hz or derive from observing recorded gameplay footage and counting frames between state changes."

  - item: "Precise speed ratios between Pac-Man and ghosts (e.g., tiles per second)"
    reason: "Sources state ghosts are 95% of Pac-Man's speed and that Pac-Man is faster when not eating than eating, but do not give exact frame data or tile/ms values."
    impact: "For implementation: initial guess of 150 ms per tile for Pac-Man (charter proposal) would make ghosts ~158 ms per tile; this requires playtest validation against recorded original gameplay."

  - item: "Exact warp tunnel positioning and behavior rules"
    reason: "Maze sources confirm two side tunnels and wrap-around, but do not specify which exact tiles are tunnel entries/exits or whether ghosts use tunnels."
