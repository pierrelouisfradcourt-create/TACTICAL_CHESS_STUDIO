# COMPARABLE GAMES & GENRE CONTEXT
# ============================================================================

comparable_games:
  - game_name: "Ms. Pac-Man (1981)"
    publisher: "Namco / Midway"
    key_differences:
      - "Multiple distinct maze layouts across levels (vs. single repeating maze in original Pac-Man)"
      - "Randomized ghost movement patterns (harder to memorize and pattern-play against)"
      - "Power pellet effect shorter-duration and reduces with level progression"
      - "Fruit bonuses appear dynamically in maze (vs. static positioning)"
      - "Ghost targeting still uses chase/scatter, but implementation details differ"
    mechanics_source: "https://strategywiki.org/wiki/Ms._Pac-Man/Gameplay, https://pacman.fandom.com/wiki/Ms._Pac-Man_(game)"

  - game_name: "Dig Dug (1982)"
    publisher: "Namco"
    genre_crossover: "Arcade maze-based action (similar era, similar difficulty escalation)"
    mechanics:
      - "Player controls 2D grid-based character (Dig Dug the miner)"
      - "Victory via defeating all enemies per level (Pookas and Fygars, not ghosts)"
      - "Defense tool: air pump to inflate and burst enemies (vs. power pellets to stun)"
      - "Rock physics: pushing boulders to crush enemies (vs. maze structure containment)"
      - "15 unique layouts; cycles after round 15; kill screen at round 256"
      - "Fruit bonus items appear after progressing in round (similar progression reward)"
    retention: "High replayability through varied level layouts and skill-based mechanics"
    mechanics_source: "https://en.wikipedia.org/wiki/Dig_Dug, https://www.arcade-history.com/?n=dig-dug&page=detail&id=637"

