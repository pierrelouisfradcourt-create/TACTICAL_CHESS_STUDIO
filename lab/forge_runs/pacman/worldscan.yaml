  - item: "Ghost spawn timing and ghost house exit sequencing under pellet consumption thresholds"
    reason: "Sources mention pellet-based thresholds for Blinky's Cruise Elroy mode but do not enumerate exact count thresholds per level for initial ghost spawning."
    impact: "For implementation: may require empirical observation or reference to Pac-Man emulator source code (MAME)."

  - item: "Power pellet effect duration exact end conditions (timer expiry vs. all ghosts eaten)"
    reason: "Sources state effect expires 'after time or when all ghosts eaten' but do not clarify which event takes precedence if both could occur within a frame."
