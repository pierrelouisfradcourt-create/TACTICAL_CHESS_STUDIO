  - item: "Level 256 kill screen exact state (ghost placement, why unplayable)"
    reason: "Sources mention 'level 256 is unplayable' and 'Pooka placed on player start' (from Dig Dug), but Pac-Man level 256 specifics not fully sourced. May be related to sprite corruption or game engine limits."
    impact: "For implementation: original 256-level ceiling is a known system limit; our run ends before this so defer."

# ============================================================================
# ADVISORY NOTES
# ============================================================================

advisory:
  - "This scan observes Pac-Man and comparable arcade games to understand their ASSEMBLIES (systems, states, loops, retention). The analysis is ARCHITECTURAL, not PRESCRIPTIVE. The choice of which mechanics to retain, which to adapt, and which to invent remains with the council and architecture step (s4)."

  - "Pac-Man is a DETERMINISTIC game with PROCEDURALLY ESCALATED DIFFICULTY (no RNG except Frightened mode pseudo-random pathfinding). This is unlike modern roguelike or procedural-generation games and affects what 'replayability' means: players return to beat personal scores, not to discover new content."

  - "The 'hour 5' retention loop does not apply to 1980 arcade games in the same sense as modern games. Arcade design optimized for QUARTER-FED SESSIONS (3-5 minutes each) with HIGH SKILL CEILING, not for sustained 5+ hour sessions. Cross-session progression (levels 1→256) and leaderboards (cabinet high-score tables) were the retention mechanisms."

  - "Ghost targeting is PURE and DETERMINISTIC. A bot that knows the ghost algorithms can exploit them (pattern-play). The design mitigates this by giving each ghost a different algorithm, creating emergent complexity. This is NOT a weakness; it is elegant AI design."

  - "The Victory Condition is STRICTLY COUNTING: eat EVERY pellet, no exceptions. A design that allows 'good enough' (e.g., 239/240 pellets and time-out to next level) would be a different game and breaks the demo criteria 'Part Complete Without Tools.'"

