# --- Ce que ce charter ne tranche PAS (remonte, pas masque) -----------------------------
question_ouverte_humangate:
  - sujet: "Preuve a juge humain — le vocabulaire ferme n'a pas de case pour elle"
    etat: >-
      Le vocabulaire ferme expected_proof.kind (bot_action | oracle | mutation | visual |
      file_write) ne contient AUCUNE valeur designant une preuve dont le juge est une
      PERSONNE. Defaut deja MESURE au run V1 : R41 et R42 du prisme.json ont ete rangees en
      `visual` avec la verite (« constat humain, jamais une assertion machine ») ecrite en
      texte libre dans le statement, que nul oracle ne lit. Le run V2 ajoute quatre
      exigences de cette nature. Cette etape n'a PAS le droit d'ajouter une valeur au
      vocabulaire et ne l'a pas fait.
    question_a_pierre: >-
      Veux-tu ouvrir le vocabulaire des preuves attendues a une valeur explicite de
      jugement humain (ce qui rendrait ces exigences comptables au lieu de silencieuses),
      ou preferes-tu qu'elles restent rangees en `visual` avec la reserve en texte libre,
      en sachant qu'aucune mesure ne les distingue aujourd'hui d'une preuve machine ?
  - sujet: "Forme de l'audio — decision d'orchestrateur, pas de Pierre"
    etat: >-
      Pierre a demande du son sans en fixer la forme. L'orchestrateur a tranche : audio
      entierement GENERE a l'execution, zero fichier importe. C'est la seule forme qui
      satisfait a la fois core.audio (qui ne peut pas etre declaree non applicable) et
      l'invariant zero asset du jeu. Consequence assumee : un son synthetise sonne
      autrement qu'un son enregistre, et la qualite percue releve de ton jugement.
    question_a_pierre: >-
      Confirmes-tu l'audio genere a l'execution sans aucun fichier importe, ou acceptes-tu
      de lever l'invariant « zero asset » pour du son enregistre ? Les deux sont
      defendables ; ils ne se prouvent pas de la meme facon.
  - sujet: "Chiffres de non-regression de l'oracle V1"
    etat: >-
      Les valeurs 1012 assertions et solvabilite 50/50 ont ete transmises a cette etape par
      l'orchestrateur. Cette etape ne les a pas re-mesurees (elle n'execute aucun oracle de
      jeu) et le verdict signe du run V1 ne les porte pas. Le critere de non-regression est
      donc ecrit comme une comparaison AVANT/APRES a relever soi-meme, pas comme une
      constante gravee.
    question_a_pierre: >-
      Le premier releve du run V2 (execution de l'oracle AVANT toute modification) fait-il
      foi comme baseline officielle, meme s'il donne un chiffre different de 1012 ?
  - sujet: "Profondeur de la progression entre niveaux"
    etat: >-
      Le charter exige au moins deux cartes, un enchainement sans redemarrage et au moins
      un parametre qui evolue avec le niveau, avec preuve de variance. Il ne fixe NI le
      nombre de cartes NI le parametre qui progresse (vitesse des fantomes, duree de
      l'etat Frightened, nombre de pastilles, autre) : c'est une decision de conception,
      etape s4-archi.
    question_a_pierre: >-
      Combien de cartes veux-tu embarquer, et quelle grandeur veux-tu voir progresser d'un
      niveau au suivant ? Sans reponse, l'architecture choisira le minimum prouvable (deux
      cartes, un parametre) et le declarera comme tel.
  - sujet: "Tactile Android — prepare jusqu'ou"
    etat: >-
      Le charter exige que la couche d'entree declare le tactile comme source et expose au
      moins une surface tactile (le bouton de pause visible). Il met en hors_scope le build
      Android, le portage et la signature.
    question_a_pierre: >-
      Le tactile « prepare » signifie-t-il pour toi une couche d'entree qui l'accepte (ce
      qui est ecrit ici), ou une partie reellement jouable au doigt sur un ecran, avec des
      commandes directionnelles tactiles ?

