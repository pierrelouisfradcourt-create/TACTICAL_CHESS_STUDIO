# ==========================================================================================
# POINTS TRANCHES DANS CETTE ETAPE — decisions assumees, avec ce qu'elles engagent.
# ==========================================================================================

points_tranches:

  - id: T1
    sujet: "Ordre des operations a l'interieur d'un tick"
    tranche: >-
      Ordre fige et declare : action d'entree -> horloge des etats -> deplacement de Pac-Man
      -> deplacement des fantomes -> consommation du collectible -> detection des contacts sur
      les positions AVANT et APRES -> calcul du statut (F39).
    pourquoi: >-
      L'ordre decide de la plupart des cas limites, notamment R32 (croisement en sens inverse
      sur la meme arete) : detecter le contact uniquement sur les positions finales laisse
      passer l'echange de cases. Le laisser implicite reviendrait a laisser l'etape 4 le
      decider par accident.
    ce_qui_reste_a_l_etape_4: "ou vit cette composition, et comment elle est cablee."

  - id: T2
    sujet: "Ou vit l'aleatoire du mode Effraye"
    tranche: >-
      Un generateur pseudo-aleatoire unique (F3) dont l'ETAT est un champ de l'etat de partie,
      consomme par la seule F21. Aucune autre fonction ne tire d'alea.
    pourquoi: >-
      Le world scan qualifie le deplacement Effraye de « pseudo-random » ; le charter interdit
      tout alea non seede et exige un replay strictement identique (R38). Porter l'etat du
      generateur DANS l'etat de partie est ce qui rend les deux compatibles : le generateur est
      clone, rejoue et compare comme n'importe quel autre champ. C'est la deduction assumee par
      l'arbitrage A2 du prisme, pas un fait source.

  - id: T3
    sujet: "Les quatre fantomes partagent le meme algorithme de deplacement"
    tranche: >-
      Une seule fonction de choix de sortie (F20), quatre fonctions de case-cible distinctes
      (F15 a F18). Les fantomes ne different QUE par leur cible.
    pourquoi: >-
      C'est ce qui rend la preuve de variance (R19) attribuable : si quatre trajectoires
      divergent alors que l'algorithme de deplacement est commun, la divergence vient
      necessairement du ciblage. Quatre algorithmes de deplacement differents rendraient la
      mesure ininterpretable.

  - id: T4
    sujet: "Deux fonctions distinctes pour l'etat observable"
    tranche: >-
      F2 (projection PURE de l'etat vers un releve) et F50 (adaptateur qui expose ce releve a
      un lecteur exterieur) sont deux fonctions, pas une.
    pourquoi: >-
      Le calcul du releve doit rester teste sans moteur ; l'ecriture sur un canal de sortie est
      une I/O. Les fusionner ferait entrer une I/O dans la logique pure et rendrait la
      projection intestable en dehors du runtime.

  - id: T5
    sujet: "Le budget de ticks du bot est un parametre declare"
    tranche: "F54 prend un budget de ticks DECLARE en entree, il n'en porte aucun en dur."
    pourquoi: >-
      Precedent mesure du studio (games/snake) : un budget par defaut trop bas a produit un
      FAUX NEGATIF de solvabilite. Sur une carte de 244 collectibles a boucles avec retours en
      arriere, le budget est un parametre a declarer et a justifier, jamais une constante
      heritee.

  - id: T6
    sujet: "F10 (invariants de carte) est une fonction du jeu, pas seulement un test"
    tranche: "Classee `logique_pure`, appelable aussi bien par une preuve que par le jeu."
    pourquoi: >-
      C'est elle qui rend la carte cassee de R40 DETECTABLE. Si l'atteignabilite des 244
      collectibles n'existait que dans un test, la carte cassee ne serait pas declaree
      injouable : elle serait seulement perdue, ce qui ne discrimine rien.

# ==========================================================================================
# REMONTE PLUTOT QU'INVENTE — ce que cette etape n'a PAS decide, et pourquoi.
# ==========================================================================================

remonte_plutot_qu_invente:

  - sujet: "Trace exact des murs du labyrinthe"
    etat: >-
      Le world scan source la DIMENSION (28x36) et le NOMBRE de collectibles (244), pas la
      carte tuile par tuile ; il declare en incertitude la position exacte des tunnels.
    ce_que_cette_etape_a_fait: >-
      Elle a enumere la fonction qui DECRIT la carte (F5) et celle qui VERIFIE ses invariants
      (F10 : 244 exact, chaque collectible atteignable, deux boucles internes, maison centrale,
      deux tunnels sur une meme ligne, une super-pastille par quadrant). Elle n'a dessine aucun
      trace : le trace est un choix de production, pas un fait de regle.

  - sujet: "Valeurs chiffrees A_EQUILIBRER (cadence de tick, cadence relative des fantomes, duree de l'etat Effraye, delais de sortie de la maison, budget de ticks du bot)"
    etat: "Statut A_EQUILIBRER au charter ; aucune valeur ratifiee par Pierre."
    ce_que_cette_etape_a_fait: >-
      Les fonctions concernees (F22, F23, F27, F44, F54) prennent ces valeurs en ENTREE comme
      parametres declares. Aucune valeur chiffree n'est posee ici : les fonctions assertent des
      RELATIONS (strictement plus lent que, seuil franchi, delais strictement croissants), donc
      un changement de chiffre au playtest ne reecrit aucune fonction.

  - sujet: "Question ouverte n.3 du charter (fantomes individuellement distincts ?)"
    etat: >-
      prisme.fog_humangate declare qu'aucune reponse de Pierre n'est enregistree. Le prisme a
      tranche A1 (quatre fantomes) par application de la regle de priorite ecrite dans le
      charter, pas par ratification.
    ce_que_cette_etape_a_fait: >-
      Elle a suivi le prisme sans le rouvrir : quatre fonctions de ciblage (F15 a F18). Si
      Pierre tranche a trois fantomes, F17 (cyan) tombe ou doit etre remplacee, puisque sa cible
      se calcule a partir de la position du rouge. Aucune autre fonction n'est invalidee.

  - sujet: "Divergence entre le contrat s3-decompo et l'artefact demande"
    etat: >-
      Le contrat `scripts/forge/contracts/s3-decompo.yaml` (et le prompt derive) demande un
      arbre Systeme -> Feature -> capacite materialise en `featuremap.json`, mesure par
      l'oracle deterministe `node scripts/forge/check_decompo.mjs <featuremap.json>
      --prisme <prisme.json>`. La commande de dispatch demande une LISTE DE FONCTIONS dans
      `decompo.yaml`, et interdit d'ecrire tout autre fichier.
    ce_que_cette_etape_a_fait: >-
      Elle a produit `decompo.yaml` (instruction explicite de dispatch) et REMONTE la
      divergence au lieu de fabriquer les deux artefacts. Consequence a connaitre :
      `check_decompo.mjs` ne sait pas lire ce fichier, donc AUCUN oracle de l'etape ne peut
      valider cet artefact en l'etat. La decision d'ecrire aussi une featuremap ou d'adapter
      l'oracle appartient a l'orchestrateur, pas a cette etape.
