# --- Ce que ce charter ne tranche PAS (remonté, pas masqué) -----------------------------
question_ouverte_humangate:
  - sujet: "Plateforme cible — inférence indirecte"
    etat: "Champ REMPLI avec une valeur utilisable (web HTML5 Canvas + JS ESM + serveur Node local + e2e Playwright), déduite de trois artefacts imposés par Pierre (games/pacman, --caller s9-build, modèle kb_tactics/run-oracle.mjs). Aucun verbatim de Pierre ne nomme la plateforme."
    question_a_pierre: "Confirmes-tu la cible WEB (HTML5 Canvas / JS ESM / Playwright), ou veux-tu Godot comme pour Snake ? La chaîne bifurque dès l'étape architecture : s9-build (web) contre s9-build-godot-standard (moteur), et l'oracle visuel change de nature."
  - sujet: "Nombre de fantômes, durées des états de poursuite, cadence"
    etat: "Valeurs initiales proposées par le rédacteur du contrat (3 fantômes, 7 s / 20 s, 150 ms par case, 95 % de vitesse relative), statut A_EQUILIBRER, isolées dans un bloc unique. Le charter n'a donc aucun champ en suspens."
    question_a_pierre: "Laisses-tu ces valeurs de départ au World Scan (étape 2), qui peut les sourcer et les remplacer, ou veux-tu les fixer toi-même avant l'architecture ?"
  - sujet: "Portée du modèle Pac-Man"
    etat: "Le charter exige des fantômes qui poursuivent et des états de poursuite ; il exclut la reproduction archéologique des personnalités individuelles de l'arcade de 1980 au-delà de ce que le World Scan sourcera."
    question_a_pierre: "Un vrai Pac-Man, pour toi, exige-t-il des comportements de fantômes INDIVIDUELLEMENT distincts (poursuite directe, embuscade, patrouille), ou une poursuite crédible et variée suffit-elle pour cette tranche ?"

