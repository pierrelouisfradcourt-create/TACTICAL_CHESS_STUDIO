# ==========================================================================================
# ARBITRAGES — la ou le world scan (arcade complet de 1980) et le charter (tranche minimale)
# divergent. Chaque arbitrage est TRANCHE, pas renvoye plus loin.
# ==========================================================================================

arbitrages:

  - id: A1
    sujet: "Combien de fantomes : 3 ou 4 ?"
    position_charter: >-
      charter.parametres_de_design.nombre_de_fantomes = « 3 fantomes », statut A_EQUILIBRER,
      provenance « PROPOSE par le redacteur du contrat. Pierre a impose fantomes au pluriel
      sans nombre ». Le charter ajoute lui-meme : « Le World Scan (etape 2) peut sourcer un
      autre nombre : il primera sur cette proposition. »
    position_worldscan: >-
      worldscan.ghost_states.total_ghosts = 4, avec quatre algorithmes de ciblage individuels
      SOURCES (Blinky direct, Pinky 4 cases devant, Inky via la position de Blinky, Clyde a
      seuil de 8 cases), et 4 coins de dispersion attribues nominativement.
    tranche: "QUATRE fantomes, avec les quatre regles de ciblage sourcees (exigences R18 a R21)."
    justification: >-
      Trois raisons, dans cet ordre. (1) Le charter a EXPLICITEMENT delegue ce chiffre au
      world scan, qui l'a source : ne pas suivre reviendrait a ignorer sa propre regle de
      priorite. (2) Passer a 3 obligerait a CHOISIR quel fantome supprimer, et donc a inventer
      : Inky ne se calcule qu'a partir de la position de Blinky, la suppression de l'un
      deforme l'autre. Prendre les 4 sourcés est le choix a ZERO invention ; prendre 3 est le
      choix qui en exige. (3) Le charter exige une PREUVE DE VARIANCE de trajectoire ; quatre
      formules de ciblage distinctes et documentees fournissent une preuve strictement plus
      forte que trois regles inventees, pour un cout identique (une entite de plus dans la
      meme boucle de tick, aucune structure nouvelle).
    borne_posee: >-
      Le charter exclut la « reproduction archeologique » des personnalites AU-DELA de ce que
      le world scan sourcera. Le world scan a sourcé les quatre ciblages : ils sont donc DANS
      la borne. Ce qui reste dehors est le comportement Cruise Elroy de Blinky (voir
      hors_tranche H4), qui n'est pas un ciblage mais une escalade de difficulte.
    risque_assume: >-
      Quatre poursuivants sur un labyrinthe unique rendent la partie plus dure que trois. La
      contre-mesure est deja dans la tranche : sortie echelonnee de la maison (R23), fantomes
      plus lents que Pac-Man (R22), et fenetres de dispersion (R25). Si le playtest montre que
      la carte devient injouable pour un humain, le parametre a bouger est la vitesse relative
      ou les durees, pas le nombre — supprimer un fantome casserait Inky.

  - id: A2
    sujet: "Super-pastilles et etat Effraye : dans la tranche ou dehors ?"
    position_charter: >-
      Le charter ne les nomme jamais explicitement, mais il impose (priorite 5 de Pierre) des
      « etats de poursuite explicites (machine a etats, pas des vitesses bricolees) » et un
      critere de demo « CHANGEMENT D ETAT DE POURSUITE PERCEPTIBLE ». Son hors_scope exclut
      les « fruits bonus additionnels », jamais les super-pastilles.
    position_worldscan: >-
      Les 4 super-pastilles font partie des 244 collectibles qui DEFINISSENT la condition de
      victoire (« 240 dots + 4 power pellets = 244 total collectibles »). Frightened est l'un
      des trois etats exclusifs de la machine a etats. C'est la mecanique de risque/recompense
      centrale du genre (worldscan.loops.minute_10).
    tranche: >-
      DANS LA TRANCHE : 4 super-pastilles (R16, R17), etat Effraye sur les quatre fantomes
      (R27, R28), capture de fantome avec retour en maison et bonus 200/400/800/1600 (R29).
    justification: >-
      Trois raisons. (1) Les exclure changerait la CONDITION DE VICTOIRE elle-meme : le total
      sourcé de 244 tombe a 240, et il faudrait alors justifier un chiffre non sourcé.
      (2) Sans Frightened, la machine a etats n'a que deux etats, tous deux pilotes par une
      horloge : le joueur ne PROVOQUE jamais de transition. Le critere de demo « changement
      d'etat perceptible » ne serait alors testable qu'en attendant un timer, jamais a la
      demande — une preuve nettement plus faible. (3) Pierre a demande des « etats de
      poursuite » au pluriel et explicite : Frightened est le seul des trois qui rende la
      machine a etats VISIBLE comme un choix de jeu et non comme une horloge.
    borne_posee: >-
      La capture d'un fantome le renvoie IMMEDIATEMENT dans la maison centrale (R29). La
      traversee du labyrinthe par les « yeux » du fantome capture, presente dans l'arcade,
      reste dehors (hors_tranche H6) : elle ajouterait un quatrieme etat non demande.
    contrainte_croisee: >-
      Le world scan decrit le deplacement en Effraye comme « pseudo-random ». Le charter
      interdit tout aleatoire non seede et exige un replay strictement identique. La tranche
      tranche : le pseudo-aleatoire est pilote par la graine de partie, ce qui satisfait les
      deux (R38 le rend falsifiable). C'est une deduction assumee, pas un fait sourcé.

  - id: A3
    sujet: "Taille du labyrinthe : 28x36 sourcé ou 21x21 propose ?"
    position_charter: >-
      charter.parametres_de_design.grille_labyrinthe = « 21 colonnes x 21 lignes », statut
      A_EQUILIBRER, provenance « PROPOSE par le redacteur du contrat. Pierre a impose
      grille/navigation sans chiffrer ». Aucun chiffre de Pierre.
    position_worldscan: >-
      worldscan.maze.dimensions = 28 x 36, avec la resolution arcade (224 x 288, rapport 3:4),
      la taille de tuile, le nombre de pastilles (240 + 4 = 244), la maison centrale, les deux
      tunnels lateraux et le placement des super-pastilles — un ENSEMBLE coherent, sourcé
      ensemble.
    tranche: "28 colonnes x 36 lignes (R6), avec exactement 244 collectibles (R14)."
    justification: >-
      Trois raisons. (1) La dimension et le nombre de pastilles sont sourcés ENSEMBLE :
      choisir 21x21 obligerait a inventer un nouveau nombre de pastilles, donc a fabriquer un
      fait de regle — ce que le cadrage de cette etape interdit explicitement. (2) La
      condition de victoire strictement comptee (R33) est aussi stricte a 244 qu'a un autre
      total : la taille ne relache aucune assertion. (3) La faisabilite de la preuve par bot
      n'est pas compromise : le bot doit couvrir environ 244 cases a pastille dans un
      labyrinthe a boucles, soit un ordre de grandeur de quelques centaines a un millier et
      demi de ticks avec retours en arriere. Le precedent mesuré du studio (games/snake :
      partie gagnee en 266 a 417 ticks, budget declare 5000) montre que le budget de ticks est
      un PARAMETRE DECLARE, pas un mur — le defaut historique de 200 ticks y avait produit un
      FAUX NEGATIF, ce qui est l'erreur a ne pas repeter ici.
    ce_qui_reste_non_source: >-
      La DIMENSION est sourcee, le TRACE exact des murs ne l'est pas (le world scan ne fournit
      pas la carte tuile par tuile, et declare en incertitude la position exacte des tunnels).
      La tranche n'exige donc pas le trace de 1980 : elle exige un labyrinthe 28x36 verifiant
      des invariants observables — exactement 244 collectibles, chaque collectible atteignable
      depuis la case de depart, au moins deux boucles internes, une maison centrale, deux
      tunnels lateraux sur une meme ligne, une super-pastille par quadrant d'angle. Le trace
      lui-meme est un choix de production, pas un fait de regle.
    risque_assume: >-
      Une partie complete devient plus longue qu'a 21x21. Le world scan situe une partie
      d'arcade a 3-5 minutes, ce qui reste compatible avec le critere de demo « PARTIE
      COMPLETE SANS OUTIL ». Si le playtest juge la partie trop longue pour une validation
      solo, le parametre a bouger est la cadence, pas le nombre de pastilles — qui, lui, est
      la condition de victoire.

  - id: A4
    sujet: "Sequence et durees des etats de poursuite"
    position_charter: >-
      charter.parametres_de_design.durees_etats_de_poursuite = « 7 s de dispersion puis 20 s
      de poursuite, en cycle », statut A_EQUILIBRER, avec la mention explicite « le World Scan
      peut sourcer d'autres etats et d'autres durees, qui primeront ».
    position_worldscan: >-
      worldscan.ghost_states.mode_timing_levels_1_4 : 20 s poursuite, 7 s dispersion, 20 s,
      7 s, 20 s, 5 s, puis 1 033 s de poursuite — donc un cycle FINI de six seuils, pas une
      alternance infinie.
    tranche: >-
      La sequence sourcee (R25), le dernier segment etant rendu comme « poursuite jusqu'a la
      fin de la partie » puisque 1 033 s depasse largement la duree d'un labyrinthe unique.
    justification: >-
      Le charter delegue explicitement. La sequence sourcee est en outre MEILLEURE pour la
      preuve : elle offre six seuils a des instants declarés et distincts, donc six triplets
      d'assertion (juste avant / au seuil / juste apres) exigés par le critere ETATS DE
      POURSUITE TESTES SUR LEURS SEUILS, et elle place deux transitions dans les 27 premieres
      secondes — ce qui rend le replay de R38 court et donc executable a chaque run.

# ==========================================================================================
# HORS TRANCHE — documente par le world scan, deliberement exclu de cette tranche.
# Rien n'est ici par oubli : chaque ligne porte sa raison.
# ==========================================================================================

hors_tranche:

  - id: H1
    element: "Niveaux multiples et progression de campagne (256 niveaux)"
    documente_par: "worldscan.player_objectives ; worldscan.victory_conditions[LEVEL_PROGRESSION, SCALING]"
    raison: >-
      charter.hors_scope l'exclut nommement : « la tranche est UN labyrinthe jouable de bout
      en bout ; l'extension multi-niveaux est un run ulterieur ». La condition de victoire de
      la tranche s'arrete a GAGNE (R33), elle n'enchaine sur aucun niveau suivant.

  - id: H2
    element: "Escalade de difficulte par niveau (vitesses qui montent, duree Effraye qui baisse, dispersions qui se compriment)"
    documente_par: "worldscan.systems[Difficulty Escalation] ; worldscan.ghost_states.mode_timing_levels_5_plus ; duree Effraye levels 5-18 et 19+"
    raison: >-
      Consequence directe de H1 : sans niveau 2, il n'existe aucun palier ou appliquer une
      escalade. Les valeurs retenues dans la tranche sont celles des niveaux 1 a 4, sourcees
      comme un bloc coherent.

  - id: H3
    element: "Kill screen du niveau 256"
    documente_par: "worldscan.victory_conditions[SCALING] ; worldscan.incertitudes[Level 256 kill screen exact state]"
    raison: >-
      Consequence de H1, et le world scan declare lui-meme que l'etat exact de cet ecran
      n'est PAS sourcé. Le reproduire exigerait d'inventer un fait de regle.

  - id: H4
    element: "Cruise Elroy (acceleration de Blinky et abandon de la dispersion sous un seuil de pastilles)"
    documente_par: "worldscan.ghost_targeting.blinky_red.special_behavior"
    raison: >-
      Trois raisons cumulees. (1) Les seuils sont declarés PAR NIVEAU (20 pastilles restantes
      aux niveaux 1-4, 10 aux niveaux 5-20) : sans progression de niveaux (H1), le mecanisme
      perd son objet. (2) Il fait sortir Blinky de la machine a etats declarée, ce qui
      contredit l'exigence R24 (exactement un etat parmi trois) sans en apporter un quatrieme
      demande. (3) Il ACCELERE un fantome : le charter avertit qu'une vitesse superieure a
      celle du joueur rendrait la solvabilite (R39) impossible a prouver sur certaines cartes.

  - id: H5
    element: "Fruits et objets bonus"
    documente_par: "worldscan.incertitudes[Fruits and bonus items in original Pac-Man level 1]"
    raison: >-
      Exclu nommement par charter.hors_scope (« fruits bonus additionnels »), ET le world scan
      declare que le placement et la valeur des fruits du niveau 1 ne sont pas sourcés — les
      inclure exigerait donc a la fois de violer le hors_scope et d'inventer des chiffres.

  - id: H6
    element: "Traversee du labyrinthe par les yeux d'un fantome capture pour regagner la maison"
    documente_par: "worldscan.systems[Frightened Mode].expiration_rules « ghost respawns at ghost house when eaten »"
    raison: >-
      Le fait sourcé est le RETOUR EN MAISON, pas la traversee visible. La tranche retient le
      fait (R29 : reapparition immediate dans la maison) et laisse dehors l'animation de
      retour, qui ajouterait un quatrieme etat de fantome non demande par Pierre.

  - id: H7
    element: "Sortie echelonnee de la maison pilotee par des seuils de pastilles consommees"
    documente_par: "worldscan.ghost_states.spawn_behavior ; worldscan.incertitudes[Ghost spawn timing and ghost house exit sequencing]"
    raison: >-
      Le world scan declare explicitement que les seuils exacts ne sont PAS enumerés. La
      tranche retient ce qui est sourcé — l'ordre de sortie, Blinky en premier — et remplace
      les seuils non sourcés par des delais declarés en ticks (R23), assumés comme deduction
      et non presentes comme un fait d'arcade.

  - id: H8
    element: "Vitesse variable de Pac-Man selon qu'il mange ou non"
    documente_par: "worldscan.incertitudes[Precise speed ratios] « Pac-Man is faster when not eating than eating »"
    raison: >-
      Le world scan qualifie lui-meme ce point d'incertain et sans donnee chiffree. La tranche
      retient une cadence unique pour Pac-Man, ce qui rend R22 (le joueur creuse l'ecart)
      falsifiable sans dependre d'un chiffre non sourcé.

  - id: H9
    element: "Table des meilleurs scores persistee entre les sessions"
    documente_par: "worldscan.systems[Scoring & Persistence].persistence_arcade « cabinet EEPROM »"
    raison: >-
      Aucun critere de charter ne le demande, et charter.hors_scope exclut backend, base de
      donnees et leaderboard. Le score final est affiche a la fin de partie (R35) ; il n'est
      pas conserve entre deux lancements.

  - id: H10
    element: "Son, musique, attract mode, cinematiques inter-niveaux"
    documente_par: "worldscan (contexte arcade) ; charter.hors_scope"
    raison: >-
      Exclus nommement par charter.hors_scope (« ecrans d'attract mode », « son »,
      « cinematiques inter-niveaux ») et par la contrainte zero asset importe (R4).

  - id: H11
    element: "Variantes du genre : mazes multiples et ghosts randomises de Ms. Pac-Man, mecaniques de Dig Dug"
    documente_par: "worldscan.comparable_games"
    raison: >-
      Materiel de comparaison de genre, pas de specification du jeu demande. Le charter nomme
      Pac-Man comme reference_jeu, sur source Pierre directe.

# ==========================================================================================
# CE QUE CE PRISME N'A DELIBEREMENT PAS TRANSFORME EN EXIGENCE
# (criteres du charter qui ne sont PAS observables par le joueur : ils appartiennent aux
# etapes aval. Listés pour qu'aucun ne disparaisse en silence, jamais pour les trancher ici.)
# ==========================================================================================

renvois_aux_etapes_aval:
  - critere_charter: "LOGIQUE SEPAREE DU RENDU, VERIFIE STATIQUEMENT"
    pourquoi_pas_une_exigence: "Propriete de structure interne, invisible pour le joueur. Aucune capture ni etat expose ne peut la falsifier."
    destination: "etape architecture (s4)"
  - critere_charter: "PARAMETRES DE JEU ISOLES ET NOMMES (zero litteral de gameplay hors du bloc)"
    pourquoi_pas_une_exigence: "Propriete de structure interne. Le joueur observe les VALEURS (R22, R25, R27, R37), jamais leur lieu de declaration."
    destination: "etape architecture (s4)"
  - critere_charter: "GATE DE MUTATION SUR LA LOGIQUE PURE"
    pourquoi_pas_une_exigence: "Propriete de la chaine de preuve, pas du produit. Le prisme fournit la LISTE des invariants a tuer (R7, R15, R30, R31, R33, R25), pas le dispositif."
    destination: "etape de preuve / oracle"
  - critere_charter: "ORACLE UNIQUE ET REEXECUTABLE"
    pourquoi_pas_une_exigence: "Outillage de preuve. Le prisme fournit ce qui doit etre prouve (R38, R39, R40), pas le point d'entree."
    destination: "etape de preuve / oracle"
  - critere_charter: "CONSOMMATION DE CONNAISSANCE MESUREE ; PERIMETRE D ECRITURE BORNE ; PREUVE MECANIQUE FOURNIE ; VOCABULAIRE DE CLAIM ABSENT"
    pourquoi_pas_une_exigence: "Regles de conduite du run, sans expression dans le jeu vu par le joueur."
    destination: "conduite du run / verdict"

