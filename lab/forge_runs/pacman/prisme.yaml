# ==========================================================================================
# FOG — ce que ce prisme n'a pas l'autorite de trancher, remonte a HumanGate (Pierre).
# ==========================================================================================

fog_humangate:
  - sujet: "Question ouverte n.3 du charter, toujours ouverte"
    etat: >-
      charter.question_ouverte_humangate demandait a Pierre : « Un vrai Pac-Man exige-t-il des
      comportements de fantomes INDIVIDUELLEMENT distincts, ou une poursuite credible et
      variee suffit-elle ? »
      Aucune reponse de Pierre n'est enregistree dans les artefacts du run.
    ce_que_le_prisme_a_fait: >-
      Il a tranche A1 (quatre fantomes, quatre ciblages sourcés) en s'appuyant sur la regle de
      priorite ecrite DANS le charter (« le World Scan primera sur cette proposition »), pas
      sur une reponse de Pierre. Ce n'est donc pas une ratification, c'est l'application d'une
      regle deja ecrite.
    impact_si_Pierre_tranche_autrement: >-
      Si Pierre veut trois fantomes, R20 tombe partiellement (le ciblage du cyan depend de la
      position du rouge) et il faudra declarer quel fantome disparait et quelle regle de
      ciblage le remplace. Aucune autre exigence n'est invalidee.
  - sujet: "Statut A_EQUILIBRER des parametres chiffres"
    etat: >-
      Cadence de tick, vitesse relative des fantomes, duree de l'etat Effraye et delais de
      sortie de la maison restent des valeurs declarées, susceptibles de bouger au playtest.
    ce_que_le_prisme_a_fait: >-
      Il a formule R22, R25, R27, R28 et R23 de facon a rester falsifiables SANS dependre du
      chiffre exact : elles assertent des relations (plus lent que, decroit strictement, seuil
      franchi) et non des valeurs. Un rejeu du playtest peut changer les chiffres sans reecrire
      les exigences.
