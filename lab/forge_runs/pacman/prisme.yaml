# Prisme Produit — etape s1-prisme — projet : pacman
# run_id   : pacman-20260805-r1
# marqueur : FORGE_DISPATCH:s1-prisme:pacman-20260805-r1
# date     : 2026-08-05
# encodage : utf-8
#
# ROLE TENU : realisateur. Ce document decrit le PRODUIT FINI tel que le joueur le vit.
# Il ne decide ni le decoupage fonctionnel (etape 3) ni l'architecture (etape 4) : aucun
# nom de fichier, aucun module, aucun noeud moteur n'y figure, par construction.
#
# PLATEFORME : GODOT 4.6.3 / GDScript. Autorite = lab/forge_runs/pacman/platform_correction.yaml,
# qui SUPPLANTE le champ `plateforme_cible` de charter.yaml. Aucune exigence ci-dessous ne
# suppose un navigateur, un canvas HTML, du JavaScript ni un pilote de navigateur comme
# runtime du jeu. Les exigences sont formulees en termes d'ECRAN et d'ETAT EXPOSE, deux
# notions independantes du moteur.
#
# AMONT CONSOMME :
#   - lab/forge_runs/pacman/platform_correction.yaml  (autoritaire, plateforme)
#   - lab/forge_runs/pacman/charter.yaml              (objectif, hors_scope, 19 criteres de
#                                                      succes, 12 criteres de demo,
#                                                      parametres_de_design A_EQUILIBRER)
#   - lab/forge_runs/pacman/worldscan.yaml            (faits sources : maze 28x36, 240+4=244,
#                                                      Chase/Scatter/Frightened + durees,
#                                                      ciblage individuel des 4 fantomes, 3 vies)
# REFERENCE DE GRANULARITE : games/snake/00_CHARTER/game_contract.yaml et
#   games/snake/01_DESIGN/genre_bible.json (regles de genre enoncees comme faits observables).

version: 1
game_id: pacman
etape: s1-prisme
plateforme_en_vigueur: "Godot 4.6.3 / GDScript (platform_correction.yaml)"

# --- Legende des champs -----------------------------------------------------------------
# enonce        : ce que le joueur voit / fait, ou ce que le jeu montre. Present, concret.
# observable    : CE QU'ON REGARDE pour dire que c'est vrai (ecran reel et/ou etat expose).
# falsifie_si   : la condition exacte qui rend l'exigence FAUSSE. Sans elle, une exigence
#                 n'est pas falsifiable, elle est decorative.
# source        : charter | worldscan | deduction
# reference     : la section d'amont citee (obligatoire si source != deduction)
# nature        : experience_joueur | preuve
# verifiable_par: etat_expose | capture_ecran | etat_et_capture | humain
# dans_la_tranche : toujours true dans cette liste ; ce qui est dehors vit dans hors_tranche.

exigences:

  # ======================================================================================
  # BLOC A — OUVERTURE, LISIBILITE, VIE PROPRE DE LA BOUCLE
  # ======================================================================================

  - id: R1
    enonce: >-
      A l'ouverture, le joueur voit d'un seul coup d'oeil le labyrinthe entier, Pac-Man,
      les pastilles et les quatre fantomes, sans avoir a faire defiler l'image.
    observable: >-
      Capture d'ecran au premier instant de la partie : le contour du labyrinthe est
      integralement contenu dans la fenetre (aucune ligne ni colonne coupee par un bord),
      on compte un Pac-Man, quatre fantomes, et des pastilles.
    falsifie_si: >-
      Une ligne ou une colonne du labyrinthe est hors fenetre, ou moins de quatre fantomes
      sont visibles, ou aucune pastille n'est visible.
    source: charter
    reference: "charter.criteres_demo[DEMARRAGE VISIBLE] ; worldscan.maze.pixel_resolution (rapport 3:4, cadrage portrait)"
    nature: experience_joueur
    verifiable_par: capture_ecran
    dans_la_tranche: true

  - id: R2
    enonce: >-
      Le joueur distingue sans ambiguite cinq categories a l'ecran : les murs, les couloirs
      vides, les pastilles ordinaires, les super-pastilles, et chacun des quatre fantomes,
      chacun different des trois autres et de Pac-Man.
    observable: >-
      Capture d'ecran : les murs portent une apparence constante differente du couloir vide ;
      les quatre fantomes portent quatre couleurs deux a deux differentes ; une super-pastille
      est visiblement plus grande qu'une pastille ordinaire.
    falsifie_si: >-
      Deux fantomes partagent la meme couleur, ou une super-pastille est indiscernable d'une
      pastille ordinaire, ou une case de mur a la meme apparence qu'une case de couloir vide.
    source: charter
    reference: "charter.criteres_demo[LISIBILITE DU LABYRINTHE] ; worldscan.ghost_states.total_ghosts=4 ; worldscan.maze.key_features.power_pellet_positions"
    nature: experience_joueur
    verifiable_par: capture_ecran
    dans_la_tranche: true

  - id: R3
    enonce: >-
      Le joueur qui ne touche pas au clavier voit quand meme la partie avancer : Pac-Man
      poursuit sa direction courante et les fantomes se deplacent.
    observable: >-
      Deux relevés d'etat separes par une fenetre declaree de ticks, sans aucune entree
      clavier : la position de Pac-Man a change, et la position d'au moins un fantome a change.
    falsifie_si: >-
      Sans entree clavier, aucune position d'entite ne change entre les deux relevés.
    source: charter
    reference: "charter.objectif priorite (1) « boucle temps reel qui tourne toute seule »"
    nature: experience_joueur
    verifiable_par: etat_et_capture
    dans_la_tranche: true

  - id: R4
    enonce: >-
      Le joueur lance le jeu sans connexion reseau et voit un rendu compose uniquement de
      formes pleines et de texte : aucune image, aucune police ni aucun son exterieur au jeu
      n'est charge.
    observable: >-
      Lancement avec le reseau coupe : le jeu s'ouvre et se joue ; l'inventaire des fichiers
      du jeu ne contient aucun fichier d'image, de police ni de son importe.
    falsifie_si: >-
      Le jeu echoue a s'ouvrir sans reseau, ou un fichier d'asset externe figure dans le jeu.
    source: charter
    reference: "charter.hors_scope[Sprites, assets graphiques externes...] ; charter.actions_interdites[Introduire une dependance runtime externe]"
    nature: experience_joueur
    verifiable_par: etat_et_capture
    dans_la_tranche: true

  - id: R5
    enonce: >-
      Le joueur lit en permanence, en chiffres, son score, le nombre de pastilles restantes
      et son nombre de vies, et ces trois chiffres disent exactement la meme chose que l'etat
      interne du jeu.
    observable: >-
      Capture d'ecran et etat expose relevés au meme tick, apres chaque evenement (pastille
      mangee, vie perdue, fantome capture) : les trois nombres lus a l'ecran sont egaux aux
      trois valeurs de l'etat.
    falsifie_si: >-
      L'un des trois nombres affiches differe de la valeur d'etat correspondante, ne serait-ce
      qu'un tick apres un evenement ; ou l'un des trois est represente uniquement par des
      formes ou des pips sans chiffre.
    source: charter
    reference: "charter.criteres_demo[SCORE ET VIES EN CHIFFRES] ; charter.actions_interdites[Afficher l'etat decisif ... uniquement en formes ou en pips]"
    nature: experience_joueur
    verifiable_par: etat_et_capture
    dans_la_tranche: true

  # ======================================================================================
  # BLOC B — GRILLE, MURS, TUNNEL
  # ======================================================================================

  - id: R6
    enonce: >-
      Le joueur parcourt un labyrinthe unique de 28 cases de large sur 36 cases de haut,
      qui comporte au moins deux boucles internes : il peut faire un tour complet et revenir
      a son point de depart sans jamais faire demi-tour.
    observable: >-
      Les dimensions de la grille exposees par l'etat valent exactement 28 x 36 ; un bot
      parcourt un circuit ferme declaré et revient a sa case de depart sans qu'aucun de ses
      pas n'inverse la direction du pas precedent.
    falsifie_si: >-
      Les dimensions exposees different de 28 x 36, ou aucun circuit ferme n'existe sans
      demi-tour (labyrinthe purement arborescent).
    source: worldscan
    reference: "worldscan.maze.dimensions « 28 tiles wide x 36 tiles tall » ; worldscan.systems[Maze Topology] ; contrainte de boucles heritee de charter.parametres_de_design.grille_labyrinthe"
    nature: experience_joueur
    verifiable_par: etat_expose
    dans_la_tranche: true

  - id: R7
    enonce: >-
      Le joueur ne voit jamais Pac-Man ni un fantome a l'interieur d'un mur : chaque entite
      occupe toujours une case de couloir, une seule a la fois.
    observable: >-
      A chaque tick d'une partie complete, la case occupee par Pac-Man et par chacun des
      quatre fantomes est de type couloir.
    falsifie_si: >-
      Une seule position d'entite coincide avec une case de mur, a n'importe quel tick.
    source: charter
    reference: "charter.criteres_succes[MURS INFRANCHISSABLES SANS FAUX POSITIF NI FAUX NEGATIF] ; worldscan.systems[Discrete Grid Navigation] « ghosts and Pac-Man occupy one tile at a time »"
    nature: experience_joueur
    verifiable_par: etat_expose
    dans_la_tranche: true

  - id: R8
    enonce: >-
      Le joueur qui laisse Pac-Man foncer dans un cul-de-sac le voit s'arreter net contre le
      mur, sur la derniere case de couloir, et y rester tant qu'aucune direction praticable
      n'est demandee.
    observable: >-
      Etat avant et apres le tick de butee : la position reste sur la derniere case de
      couloir, elle ne franchit pas la case de mur, et elle ne saute vers aucune case non
      adjacente ; aux ticks suivants sans entree, la position ne change plus.
    falsifie_si: >-
      Pac-Man apparait de l'autre cote du mur, ou saute a une case non adjacente, ou change
      de direction de lui-meme sans entree du joueur.
    source: charter
    reference: "charter.criteres_succes[MURS INFRANCHISSABLES] et [DEPLACEMENT JOUEUR BORNE]"
    nature: experience_joueur
    verifiable_par: etat_et_capture
    dans_la_tranche: true

  - id: R9
    enonce: >-
      Le joueur qui sort du labyrinthe par le tunnel lateral droit voit Pac-Man reapparaitre
      aussitot par le tunnel lateral gauche, sur la meme ligne, sans s'arreter et sans perdre
      de vie — et reciproquement dans l'autre sens.
    observable: >-
      Etat sur deux ticks consecutifs : la colonne passe de l'extremite droite a l'extremite
      gauche (ou l'inverse), la ligne est inchangee, le compteur de vies est inchangé, le
      statut reste EN COURS.
    falsifie_si: >-
      Pac-Man est bloque a l'entree du tunnel, ou perd une vie, ou reapparait sur une autre
      ligne, ou marque une pause d'un tick ou plus.
    source: worldscan
    reference: "worldscan.maze.key_features.tunnels « exit right edge -> enter left edge, vice versa » ; position exacte des cases de tunnel NON sourcee (worldscan.incertitudes[Exact warp tunnel positioning])"
    nature: experience_joueur
    verifiable_par: etat_et_capture
    dans_la_tranche: true

  - id: R10
    enonce: >-
      Le joueur voit les fantomes emprunter le tunnel comme lui : le tunnel est un raccourci,
      pas un refuge ou Pac-Man serait definitivement hors d'atteinte.
    observable: >-
      Sur une fenetre declaree ou Pac-Man reste dans le couloir de tunnel, au moins un fantome
      en etat de poursuite y entre et en ressort par l'autre extremite.
    falsifie_si: >-
      Aucun fantome n'entre jamais dans le couloir de tunnel, ou un fantome s'y immobilise
      definitivement.
    source: deduction
    reference: null
    justification_deduction: >-
      Le worldscan declare explicitement que l'usage du tunnel par les fantomes n'est PAS
      source (incertitudes[Exact warp tunnel positioning ... whether ghosts use tunnels]).
      La tranche tranche pour l'acces des fantomes, faute de quoi le tunnel devient une zone
      de securite absolue et la poursuite degenere — ce que le critere FANTOMES ACTIFS ET NON
      DEGENERES du charter interdit.
    nature: experience_joueur
    verifiable_par: etat_expose
    dans_la_tranche: true

  # ======================================================================================
  # BLOC C — DEPLACEMENT DU JOUEUR AU CLAVIER
  # ======================================================================================

  - id: R11
    enonce: >-
      Le joueur qui appuie sur une fleche voit Pac-Man tourner dans cette direction des le
      tick suivant, si la case visee est un couloir.
    observable: >-
      Etat au tick qui suit l'appui : la direction effectuee est exactement la direction
      demandee, et la position a avance d'une case dans cette direction.
    falsifie_si: >-
      La direction effectuee au tick suivant differe de la direction demandee alors que la
      case visee est un couloir.
    source: charter
    reference: "charter.criteres_succes[DEPLACEMENT JOUEUR BORNE ET REACTIF] ; worldscan.loops.minute_1.actions"
    nature: experience_joueur
    verifiable_par: etat_expose
    dans_la_tranche: true

  - id: R12
    enonce: >-
      Le joueur qui demande une direction barree par un mur voit Pac-Man poursuivre sa
      direction courante : il ne se fige pas, ne recule pas et n'est pas deplace ailleurs.
    observable: >-
      Etat au tick qui suit l'appui impossible : la direction effectuee est egale a la
      direction effectuee au tick precedent, et la position a avance d'une case dans cette
      direction.
    falsifie_si: >-
      Pac-Man s'immobilise alors que sa direction courante etait praticable, ou part dans une
      troisieme direction, ou change de position d'autre chose qu'une case adjacente.
    source: charter
    reference: "charter.criteres_succes[DEPLACEMENT JOUEUR BORNE ET REACTIF] « ignoree sans effet de bord ... Pac-Man continue alors sa direction courante »"
    nature: experience_joueur
    verifiable_par: etat_expose
    dans_la_tranche: true

  - id: R13
    enonce: >-
      Le joueur qui anticipe un virage en appuyant juste avant une intersection voit Pac-Man
      tourner tout seul en arrivant a cette intersection, sans avoir a reappuyer.
    observable: >-
      Une seule pression a un tick ou le virage est impossible ; sans aucune autre entree, la
      direction effectuee au premier tick ou ce virage devient praticable est exactement la
      direction demandee.
    falsifie_si: >-
      Au premier tick ou le virage devient praticable, la direction effectuee est encore
      l'ancienne ; ou le virage se declenche a un tick ou il n'etait pas encore praticable.
    source: charter
    reference: "charter.criteres_succes[DEPLACEMENT JOUEUR BORNE ET REACTIF] « prise en compte au premier tick ou le deplacement correspondant est legal »"
    nature: experience_joueur
    verifiable_par: etat_expose
    dans_la_tranche: true

  # ======================================================================================
  # BLOC D — PASTILLES, SUPER-PASTILLES, SCORE
  # ======================================================================================

  - id: R14
    enonce: >-
      Au demarrage, le joueur a devant lui exactement 244 choses a manger : 240 pastilles
      ordinaires et 4 super-pastilles, et le compteur affiche annonce 244.
    observable: >-
      Comptage des collectibles poses sur la carte au tick 0 : 240 pastilles ordinaires plus
      4 super-pastilles, total exactement 244 ; le compteur affiche a l'ecran vaut 244.
    falsifie_si: >-
      Le total pose differe de 244, ou la repartition differe de 240 + 4, ou le compteur
      affiche differe du total reellement pose.
    source: worldscan
    reference: "worldscan.maze.pellet_count_total « 240 regular pellets + 4 power pellets = 244 total collectibles » ; worldscan.victory_conditions[CONDITION_PRIMARY]"
    nature: experience_joueur
    verifiable_par: etat_et_capture
    dans_la_tranche: true

  - id: R15
    enonce: >-
      Le joueur qui passe sur une pastille la voit disparaitre au meme instant que son score
      augmente de 10 et que le compteur de pastilles restantes baisse de 1 ; repasser sur la
      case ne rapporte plus rien.
    observable: >-
      Captures et etat au tick du passage : la pastille n'est plus rendue, le score a
      augmente d'exactement 10, les restantes ont baisse d'exactement 1 ; a un passage
      ulterieur sur la meme case, le score est inchange.
    falsifie_si: >-
      La pastille reste affichee apres le passage, ou le score bouge sans que la pastille
      disparaisse, ou un second passage sur la meme case rapporte des points.
    source: worldscan
    reference: "worldscan.systems[Pellet System] « 240 small pellets (10 points each) » ; charter.criteres_demo[PASTILLES QUI DISPARAISSENT]"
    nature: experience_joueur
    verifiable_par: etat_et_capture
    dans_la_tranche: true

  - id: R16
    enonce: >-
      Le joueur voit les quatre super-pastilles placees une par region d'angle du labyrinthe,
      loin de la maison centrale des fantomes : les atteindre demande de traverser le
      labyrinthe.
    observable: >-
      Positions des quatre super-pastilles : une et une seule par quadrant de la grille, et
      chacune strictement plus proche de son coin de labyrinthe que de la maison centrale.
    falsifie_si: >-
      Deux super-pastilles se trouvent dans le meme quadrant, ou l'une d'elles est plus proche
      de la maison centrale que de son coin.
    source: worldscan
    reference: "worldscan.maze.key_features.power_pellet_positions « 4 power pellets placed in the 4 corners ... far from ghost house »"
    nature: experience_joueur
    verifiable_par: etat_et_capture
    dans_la_tranche: true

  - id: R17
    enonce: >-
      Le joueur qui mange une super-pastille voit son score augmenter de 50, cinq fois plus
      que pour une pastille ordinaire, et le compteur de restantes baisser de 1 comme pour
      n'importe quel autre collectible.
    observable: >-
      Etat au tick de consommation : le score a augmente d'exactement 50, les restantes ont
      baisse d'exactement 1.
    falsifie_si: >-
      Le gain differe de 50, ou la super-pastille ne decremente pas le compteur de restantes
      (ce qui rendrait la victoire a 244 inatteignable).
    source: worldscan
    reference: "worldscan.systems[Pellet System] « 4 large power pellets (50 points each) » ; worldscan.victory_conditions (les 4 super-pastilles comptent dans les 244)"
    nature: experience_joueur
    verifiable_par: etat_expose
    dans_la_tranche: true

  # ======================================================================================
  # BLOC E — LES QUATRE FANTOMES
  # ======================================================================================

  - id: R18
    enonce: >-
      Le joueur voit quatre fantomes de couleurs distinctes se deplacer en continu : aucun
      ne reste plante sur place.
    observable: >-
      Sur une fenetre declaree de ticks, chacun des quatre fantomes sortis de la maison a
      change de position au moins une fois par cycle de deplacement.
    falsifie_si: >-
      Un fantome sorti de la maison conserve la meme position pendant toute la fenetre.
    source: charter
    reference: "charter.criteres_succes[FANTOMES ACTIFS ET NON DEGENERES] ; charter.criteres_demo[FANTOMES QUI POURSUIVENT VISIBLEMENT]"
    nature: experience_joueur
    verifiable_par: etat_et_capture
    dans_la_tranche: true

  - id: R19
    enonce: >-
      Le joueur voit les quatre fantomes prendre des chemins differents : ils ne se
      superposent pas et ne suivent pas la meme trajectoire.
    observable: >-
      A partir d'un etat initial identique et sur un horizon declaré de ticks, les quatre
      sequences de positions de fantomes sont deux a deux differentes (il existe pour chaque
      paire au moins un tick ou les positions different).
    falsifie_si: >-
      Deux fantomes produisent la meme sequence de positions sur tout l'horizon, ou les quatre
      occupent la meme case a la fin de l'horizon.
    source: worldscan
    reference: "worldscan.ghost_targeting.targeting_variance_proof.verification_rule « Four distinct paths emerge » ; charter.criteres_succes[FANTOMES ACTIFS ET NON DEGENERES] (regle de variance ratifiee Pierre 2026-07-21)"
    nature: experience_joueur
    verifiable_par: etat_expose
    dans_la_tranche: true

  - id: R20
    enonce: >-
      Le joueur apprend que les quatre fantomes ne pensent pas pareil : le rouge fonce droit
      sur lui ; le rose vise quatre cases devant lui, dans la direction ou il regarde ; le
      cyan vise un point calcule a partir de la position du rouge ; l'orange fonce tant qu'il
      est loin et se detourne vers son coin des qu'il approche a huit cases ou moins.
    observable: >-
      Case-cible exposee par l'etat pour chaque fantome en etat de poursuite : cible(rouge)
      egale la case de Pac-Man ; cible(rose) egale la case situee quatre cases devant Pac-Man
      dans sa direction courante ; cible(cyan) egale le point obtenu en prolongeant d'autant
      le segment allant du rouge jusqu'a la case situee deux cases devant Pac-Man ;
      cible(orange) egale la case de Pac-Man quand la distance est strictement superieure a 8,
      et son coin de dispersion quand elle est inferieure ou egale a 8.
    falsifie_si: >-
      Pour un etat ou les quatre formules donnent des resultats differents, deux fantomes
      exposent la meme cible ; ou la cible de l'orange ne bascule pas exactement au
      franchissement de la valeur 8 (assertion a 9, a 8 et a 7).
    source: worldscan
    reference: "worldscan.ghost_targeting.blinky_red / pinky_pink / inky_cyan / clyde_orange (source citee : the-pac-man-dossier)"
    nature: experience_joueur
    verifiable_par: etat_expose
    dans_la_tranche: true

  - id: R21
    enonce: >-
      Le joueur immobilise contre un mur voit le fantome rouge se rapprocher de lui sans
      relache pendant l'etat de poursuite.
    observable: >-
      Pac-Man arrete contre un mur, aucune entree, etat de poursuite actif : la distance
      Pac-Man / fantome rouge decroit strictement a chacun de ses deplacements sur une fenetre
      declaree.
    falsifie_si: >-
      Sur la fenetre declaree, la distance reste constante ou augmente entre deux deplacements
      consecutifs du fantome rouge.
    source: charter
    reference: "charter.criteres_succes[FANTOMES ACTIFS ET NON DEGENERES] « la distance joueur-fantome decroit strictement sur une fenetre declaree en etat de poursuite »"
    nature: experience_joueur
    verifiable_par: etat_expose
    dans_la_tranche: true

  - id: R22
    enonce: >-
      Le joueur qui fuit en ligne droite dans un long couloir creuse l'ecart avec le fantome
      qui le poursuit : il peut le distancer, mais jamais sans effort.
    observable: >-
      Sur un couloir droit declaré, Pac-Man fuyant en s'eloignant : la distance
      Pac-Man / poursuivant est strictement plus grande a la fin de la fenetre qu'au debut.
    falsifie_si: >-
      La distance ne croit pas sur la fenetre, ce qui signifie qu'un fantome se deplace aussi
      vite ou plus vite que Pac-Man — configuration qui rendrait la preuve de solvabilite (R39)
      impossible sur certaines cartes.
    source: worldscan
    reference: "worldscan.incertitudes[Precise speed ratios] « Sources state ghosts are 95% of Pac-Man's speed » (rapport source, valeur exacte declaree incertaine) ; charter.parametres_de_design.vitesse_relative_fantomes"
    nature: experience_joueur
    verifiable_par: etat_expose
    dans_la_tranche: true

  - id: R23
    enonce: >-
      Le joueur voit les fantomes sortir de la maison centrale l'un apres l'autre au debut de
      la partie, le rouge en premier : il n'est pas encercle des la premiere seconde.
    observable: >-
      Etat au tick 0 : exactement un fantome est hors de la maison, et c'est le rouge ; les
      trois autres en sortent a des ticks strictement croissants et declarés ; au bout du
      dernier delai declaré, les quatre sont dehors.
    falsifie_si: >-
      Les quatre fantomes sont dehors au tick 0, ou l'ordre de sortie differe de l'ordre
      declaré, ou un fantome ne sort jamais de la maison.
    source: worldscan
    reference: "worldscan.ghost_states.spawn_behavior « Blinky enters first, others follow with delays » ; les seuils exacts ne sont PAS sources (worldscan.incertitudes[Ghost spawn timing]), les delais de la tranche sont donc des valeurs declarées"
    nature: experience_joueur
    verifiable_par: etat_et_capture
    dans_la_tranche: true

  # ======================================================================================
  # BLOC F — ETATS DE POURSUITE (machine a etats explicite, priorite 5 de Pierre)
  # ======================================================================================

  - id: R24
    enonce: >-
      A tout instant, le jeu montre pour chaque fantome exactement un etat parmi trois —
      Dispersion, Poursuite, Effraye — jamais deux a la fois, jamais aucun.
    observable: >-
      A chaque tick d'une partie complete, l'etat expose de chacun des quatre fantomes
      appartient a l'ensemble des trois valeurs, sans valeur vide ni combinaison.
    falsifie_si: >-
      Un fantome expose a un tick une valeur d'etat hors des trois, une valeur vide, ou deux
      etats simultanes.
    source: worldscan
    reference: "worldscan.ghost_states.states (Chase / Scatter / Frightened, « three exclusive states per ghost ») ; charter.criteres_succes[ETATS DE POURSUITE TESTES SUR LEURS SEUILS]"
    nature: experience_joueur
    verifiable_par: etat_expose
    dans_la_tranche: true

  - id: R25
    enonce: >-
      Le joueur vit une partie rythmee par une horloge declarée : 20 s de poursuite, 7 s de
