invariants_archi:
  # --- frontière dure core <-> adaptateur ---
  - "FRONTIÈRE : le sens de dépendance est unique — adapters/** -> core/**, harness/** -> adapters/**. AUCUN import core->adapters, core->harness, adapters->harness, harness->core-direct."
  - "CONSTANTES : aucune constante Belote (taille 32, seuils 82/162/152/250, barèmes de points, ordres de force) ne vit dans core/** ; elles sont TOUTES dans adapters/belote/{cards,scoring}.mjs. Vérifiable par grep (oracle s10b)."
  - "ZÉRO-DÉPENDANCE : le package n'importe aucun node_modules tiers ; node:test + builtins node: seuls. Audit statique = aucune dép tierce."
  - "belote-claude (llm-lego/**) est SOURCE READ-ONLY des goldens : jamais importé à l'exécution, jamais modifié."

  # --- SIGNATURE RULES (décision s4 no.1 — tranchée ici, gelée à s5) ---
  - >-
    SIGNATURE RULES (contrat paramétrique, checklist d'expressivité = 8 faits Tarot FFT, ZÉRO code Tarot en V0) :
    { seatCount:int (Belote 4 · Tarot 3/4/5) ;
      teamOf(seat)->teamId, partnerOf(seat)->seat|null (null = attaquant solo/équipes asymétriques attaquant-vs-défenseurs) ;
      deckSpec:{ suits[], ranks[], specials[] } (specials = cartes hors suit×rank, ex. Excuse ; « atouts » exprimables comme une enseigne — couvre les 78 cartes + 21 atouts) ;
      deal(deck,dealer,rng)->{ hands[], kitty?, turnUp? } (kitty = chien Tarot ; turnUp = retournée Belote) ;
      completeDeal?(...)->hands[] (phase optionnelle : complément Belote / écart Tarot) ;
      runAuction(hands,ctx)->Contract|null (Contract={ taker, trump|null, level, ... } ; multi-tours ; null = redonne) ;
      trickCount:int (dérivé handSize, LU par core/trickplay — jamais 8 en dur) ;
      legalMoves(hand,trick,contract,mover)->Card[] (ensemble exact) ;
      compareInTrick(a,b,contract)->number (comparateur de force injecté à core/trick) ;
      trickWinner(trick,contract)->{ seat } (exactement un) ;
      reassignCapture?(trick,winner,ctx)->captures (hook OPTIONNEL : Excuse au dernier pli / Petit au bout — absent chez Belote = no-op) }.
  # --- SIGNATURE SCORE (décision s4 no.1) ---
  - >-
    SIGNATURE SCORE (contrat paramétrique) :
    { cardValue(card,contract)->number (le core n'assume PAS l'entier — un adaptateur Tarot peut travailler en dixièmes pour les ½-points 4.5/3.5 sans toucher au core ; couvre le pitfall des barèmes fractionnaires) ;
      scoreDeal(tricks,contract,ctx)->ScoreResult{ pointsByTeam[], base, bonuses[], contractMet:bool, scores[] } ;
      ÉVALUATION DE CONTRAT vit DANS scoreDeal de l'adaptateur, fonction des cartes-clés capturées (oudlers Tarot / seuil 82 Belote) — JAMAIS une constante du core ;
      bonusHooks[]?:déclarations du 1er pli et bonus terminaux (belote-rebelote, annonces Belote ; poignées, Petit au bout Tarot) — le core reste agnostique aux déclarations. }.

  # --- checklist d'expressivité Tarot (démontre l'anticipation SANS code Tarot) ---
  - "EXPRESSIVITÉ TAROT (8 faits FFT couverts par paramètres, 0 code Tarot) : (a) 78 cartes/atouts/Excuse -> deckSpec.{suits,ranks,specials} ; (b) ½-points -> cardValue:number (dixièmes possibles) ; (c) seuils oudlers 36/41/51/56 -> évaluation de contrat interne à scoreDeal ; (d) Excuse dernier pli -> reassignCapture? ; (e) poignées/annonces -> bonusHooks ; (f) chien 3/4/5 joueurs -> seatCount + deal.kitty + completeDeal ; (g) équipes asymétriques -> teamOf/partnerOf(null) ; (h) Petit au bout -> bonusHook terminal. Le stub non-Belote prouve la frontière ; aucun de ces éléments n'est IMPLÉMENTÉ en V0."

  # --- garanties de comportement (décisions s4 no.2/3/4) ---
  - "CONTENT-AGNOSTIC RUNTIME : core/trickplay lit seatCount/trickCount de l'adaptateur ; il n'existe aucun 4 ni 8 en dur dans core/**. L'orchestration Belote-shaped (enchère, retournée, 8 plis, cible partie) vit dans adapters/belote/game.mjs, pas dans le core."
  - "NON-MUTATION : les interrogations (core/hand, legalMoves) ne mutent jamais l'état sérialisable ; core/trickplay travaille sur une copie jouable explicite (comme belote-claude game.mjs `play = fullHands.map(h=>h.slice())`). L'état de replay reste comparable bit-à-bit."
  - "DÉTERMINISME (décision s4 no.4) : le RNG (un seul flux, core/rng) n'est consommé qu'au mélange initial et aux coupes (core/shoe) ; le jeu des plis et le pickup n'utilisent AUCUN hasard. L'enchaînement des plis (gagnant entame le suivant) vit dans core/trickplay et porte la preuve R13 (deux runs même seed -> historiques deep-equal)."
  - "PLACEMENT CONSOMMATEURS (décision s4 no.3) : le bot de solvabilité (harness/solver), le harnais de parité (harness/parity) et les goldens (harness/goldens) vivent hors du moteur, consommateurs de l'adaptateur via belote/index — jamais importés par core ni adapters. Le stub non-Belote (adapters/stub/minimal) est un adaptateur frère, jamais couplé à Belote."
  - "PARITÉ SANS CONTAMINATION : harness/parity dérive ses goldens hors-ligne de belote-claude (chaque golden cite sa source) mais n'importe jamais llm-lego/** à l'exécution ; belote-claude reste intact."
