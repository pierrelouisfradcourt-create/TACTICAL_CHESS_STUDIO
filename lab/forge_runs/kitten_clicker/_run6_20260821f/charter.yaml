objectif: Produire un clicker de chatons mignons jouable plusieurs heures, sur le
  modele Cookie Clicker (boucle incrementale, progression, paliers) + Neko Atsume
  (collection de chatons, attractivite, identite mignonne), pour Godot 4.6.3 desktop
  en fenetre GPU. Le joueur nourrit une colonie de chatons en cliquant sur une pelote
  centrale (CLICK -> RONRONS -> CHATONS -> PRODUCTION AUTOMATIQUE -> AMELIORATIONS
  -> NOUVEAUX CHATONS / LIEUX -> META-PROGRESSION). La boucle de progression et la
  meta-progression doivent etre coherentes, et les donnees de cadrage amont (victoire,
  objectifs joueur, progression, boucles de recompense, narratif) doivent reellement
  atteindre les etapes aval (Grey Blocks, WireMap, Builder, oracles), pas rester sur
  le papier.
plateforme_cible: Godot 4.6.3 (desktop, fenetre GPU) — source Pierre, design_intent.md
reference_jeu: Cookie Clicker + Neko Atsume — choisi par Pierre (design_intent.md
  ligne 3 + tache de dispatch), jamais invente par l'agent
hors_scope:
- 'Pas de multijoueur, de classement en ligne ni d''aucune fonctionnalite reseau :
  jeu solo, hors-ligne'
- Pas de monetisation, de microtransactions ni de publicite
- 'Pas de portage web, mobile ni console : cible unique Godot 4.6.3 desktop (fenetre
  GPU)'
- 'Pas de condition de defaite ni de game-over : convention du genre incremental,
  le joueur ne perd jamais sa colonie ; la victoire = franchir les paliers de meta-progression'
- 'Pas de rendu 3D : jeu 2D sprite-centre, aligne sur la taxonomie d''assets figee
  du standard (repo_map : asset.sprite/audio/font/mesh)'
- Pas de generation de contenu par IA a l'execution ni d'appel a une API externe
- Pas de sauvegarde cloud ni de compte joueur
- Ne pas etendre le perimetre au-dela de la boucle CLICK -> RONRONS -> CHATONS ->
  PRODUCTION -> AMELIORATIONS -> LIEUX -> META-PROGRESSION decrite par Pierre
criteres_succes:
- 'charter.yaml passe l''oracle deterministe forge.static_oracles.check_charter :
  7 champs requis remplis, 4 listes non vides, aucune valeur laissee en marqueur de
  champ non resolu'
- Les donnees de cadrage amont (conditions de victoire, objectifs joueur, progression,
  boucles de recompense, contraintes narratives) sont reellement CONSOMMEES en aval
  par les Grey Blocks, la WireMap et le Builder — mesure par la sonde advisory check_amont_traversal.mjs
  — pas seulement presentes dans les documents
- Le jeu construit demarre sur la vraie scene Godot et reste vivant (sonde runtime_alive
  verte sur la scene produite)
- 'L''oracle de solvabilite fait GAGNER un bot deterministe : atteinte du 3e palier
  de meta-progression en un nombre fini de ticks, sans test de mecanique en isolation
  ni comparateur >= tautologique'
- 'La WireMap est structurellement conforme aux tables figees du standard (core_requirements,
  capabilities, repo_map) : aucune ligne CORE omise, aucun identifiant provides absent
  du registre'
- Le gate de mutation est vert (survivants nuls, ou tries et justifies) sur les fichiers
  logiques declares par la WireMap
- La courbe de paliers porte au moins 3 valeurs de seuil distinctes et non triviales
  (regle de variance des metriques Forge)
- Verdict final signe HMAC verifie par forge.verify_run, decision HUMANGATE_READY,
  remis a Pierre — jamais un merge automatique
actions_interdites:
- Ne jamais git commit ni push sans go explicite de Pierre (HumanGate)
- 'Ne pas modifier les zones protegees : tests/ du studio, src/, autopilot.py, scripts/studioV2/
  (lanes gelees)'
- 'Ne pas inventer ni changer reference_jeu ni plateforme_cible : design-intent de
  Pierre ; toute divergence remonte en fog HumanGate, jamais une invention d''agent'
- Ne jamais emettre un claim_verdict autre que NO_CLAIM_ALLOWED ; toujours separer
  software_verdict / evidence_verdict / claim_verdict
- 'Ne pas ecrire un oracle de jeu qui teste seulement les mecaniques en isolation
  : l''oracle DOIT prouver la solvabilite par un bot qui gagne (lecon s10a-oracle-code)'
- 'Ne pas utiliser de comparateur >= tautologique dans un test d''oracle : asserter
  le comportement strict (compteur == n+1, palier reellement franchi)'
- Ne pas passer au verdict un recu de code sans evidence_path (execution non prouvable
  => BLOCKED)
- Ne pas utiliser d'API Anthropic externe ni aucun service reseau externe pour generer
  le jeu
- Ne pas declarer dans la WireMap un provides absent de capabilities.yaml ni omettre
  une ligne CORE de core_requirements.yaml
criteres_demo:
- 'Mecanique 1 — compteur au clic : cliquer sur la pelote centrale incremente le compteur
  de ronrons affiche d''une valeur strictement positive a chaque clic'
- 'Mecanique 2 — chaton visible apres achat : acheter un chaton fait apparaitre un
  sprite de chaton distinct et persistant dans le refuge'
- 'Mecanique 3 — production sans clic : au moins un chaton achete fait monter le compteur
  de ronrons sans aucune interaction du joueur, a un taux visible'
- 'Mecanique 4 — amelioration qui monte le taux : acheter une amelioration augmente
  de facon observable le taux de production affiche (ronrons par seconde)'
- 'Mecanique 5 — bot au palier : un bot deterministe joue seul et fait franchir au
  jeu un palier de progression observable'
- (a) Au moins 6 chatons distincts, chacun avec un nom propre affiche a l'ecran et
  une identite visuelle reconnaissable liee a sa rarete, avec au moins 3 niveaux de
  rarete representes
- '(b) Au moins 2 lieux visitables : le refuge de depart plus au moins 1 lieu debloque
  par la meta-progression, chacun avec un decor distinct visible a l''ecran'
- (c) Au moins 3 objets distincts, chacun avec une icone et un effet observable en
  jeu
- (d) Au moins 3 petites quetes dont l'objectif et la progression sont affiches a
  l'ecran (barre ou compteur), avec un etat d'accomplissement visible
- (e) Un son distinct pour chacun des 4 evenements clic, achat, deblocage et prestige,
  declenche par l'evenement lui-meme (audio procedural accepte ; preuve = volet 07_TESTS/oracle/core_audio.gd
  journalisant les 4 declenchements)
- (f) Un feedback visuel immediat au clic (animation de la pelote, particules ou pop
  de ronrons) visible a chaque clic
- '(g) Une courbe de paliers portant au moins 3 valeurs de seuil distinctes et non
  triviales (regle de variance : la metrique de palier prouve au moins 2 valeurs distinctes)'
- '(h) Un bot deterministe atteint le 3e palier de meta-progression en un nombre fini
  de ticks : solvabilite prouvee, le bot GAGNE, pas seulement les mecaniques en isolation'
