# charter.yaml — projet p2_beta (bras LIBRE / L2, PAIRE 2)
# Matérialisé par s0-contrat (A1, protocole V1). Source de commande : lab/forge_briefs/p2_beta/project_brief.yaml
# RÈGLE DE BRAS : s0 pose le CADRE et les CONTRAINTES ; la STRUCTURE du jeu est DÉLÉGUÉE à l'aval (N2), jamais inventée ici.
projet: p2_beta

objectif: >-
  Produire un jeu incremental/clicker web JOUABLE dont la STRUCTURE (boucles, ressources,
  actions, progression, déblocages, économie, dimensionnement, condition de fin) est
  ENTIÈREMENT INVENTÉE par la chaîne Forge (bras Libre = variable expérimentale : l'auteur
  de la structure), en fermant toute la chaîne de preuve full_content (verdict signé +
  verify_run AUTHENTIQUE). Joueur cible : joueur web occasional d'incremental/clicker
  (feedback immédiat au clic, progression et déblocages, session courte prouvable). Condition
  de victoire/fin : une FIN DE PARTIE OBSERVABLE (état de fin distinct de l'état de jeu),
  atteignable par un bot compétent dans la fenêtre de mesure — sa forme exacte est DÉLÉGUÉE
  à l'aval (non fixée ici). Périmètre V1 minimal jouable : au moins une action de clic
  récompensée, une ressource, une progression avec ≥1 déblocage, et une fin observable ;
  la qualité ludique N'EST PAS jugée (donnée M7).

hors_scope:
  - "Juger la qualité ludique / le fun du jeu (donnée M7, hors de ce bras) — le charter borne la PREUVE et la STRUCTURE, pas le goût."
  - "Copier Cookie Clicker : aucun asset, nom, contenu, ni valeur numérique repris ; seule la grammaire de genre est autorisée."
  - "Consulter ou réutiliser quoi que ce soit du bras dirigé ou du pilote : lab/forge_briefs/p2_alpha/**, p1_alpha/**, aucune valeur de leur structure (isolement de bras, protocole V1)."
  - "Inventer/figer au niveau s0 les valeurs structurelles concrètes (ressources, nombres, forme exacte de la fin) : c'est DÉLÉGUÉ à l'aval avec provenance tracée (N2)."
  - "Écrire du code, décider l'architecture (étape 4), faire le world scan (étape 2) : hors périmètre de s0."
  - "Toucher aux lanes protégées (tests/, src/) ou aux lanes gelées (autopilot.py, scripts/studioV2/)."

criteres_succes:
  - "Chaîne full_content complète : verdict signé + verify_run AUTHENTIQUE."
  - "charter.yaml MATÉRIALISÉ par s0 (A1 — condition de validité de bras)."
  - "Structure entièrement documentée en aval avec provenance agent (N2) — mesures M2a (inventé-silencieux = défaut) / M2b (délégué-explicite tracé)."
  - "design_questions / r2 / design_freeze exercés normalement — modification_locus utilisé pour toute réponse."
  - "Chaque asset_request.id resolved-avec-fichier ou blocked-justifié (check_asset_consumption)."
  - "check_artbible exécuté par le driver (executed_by: driver)."
  - "product_snapshot.md matérialisé (exigible pour M7(a), protocole V1 A3)."
  - "s11 red-team Qwen réel, independent: true ; LM Studio down → HALT sans fallback."
  - "SOLVABILITÉ RUNTIME : un bot scripté atteint la fin inventée en ≤ 72000 ticks (100 ms) ; bots de mesure à variance non triviale (temps-jusqu'à-la-fin, jalons)."
  - "Socle sonde web (N1) présent : HTML+JS, déterminisme seedé, window.__game exposé, harnais complet à la racine du dossier jeu."

actions_interdites:
  - "JAMAIS consulter lab/forge_briefs/p2_alpha/**, p1_alpha/**, ni aucune grandeur structurelle du bras dirigé/pilote (contamination = paire invalidée)."
  - "JAMAIS reprendre d'asset, de nom, de contenu ou de valeur numérique de Cookie Clicker (grammaire de genre uniquement)."
  - "JAMAIS choisir reference_jeu ou plateforme_cible sans source Pierre explicite (leçon AutoBattler)."
  - "JAMAIS traiter budget_ticks_mesure (72000 ticks) comme une valeur de DESIGN du jeu : c'est une constante de MESURE du protocole V1, symétrique aux deux bras."
  - "JAMAIS livrer un jeu à fin non observable (idle infini) ni à objectif inatteignable dans la fenêtre de mesure."
  - "JAMAIS de red-team avec fallback si LM Studio est down : HALT (s11 doit être réel et indépendant)."
  - "JAMAIS d'assertion tautologique dans un oracle de jeu (pas de >= masquant, pas de littéral solvable=true sous garde) : comportement STRICT asserté."
  - "JAMAIS toucher tests/, src/, ni les lanes gelées."

plateforme_cible: >-
  web (HTML + JS, rendu canvas). Cible technique fixée au brief (provenance : Pierre 2026-08-30).
  Socle N1 : HTML+JS mono-dossier games/p2_beta, déterminisme seedé, window.__game exposé pour
  le harnais, harnais complet à la racine du dossier jeu.

reference_jeu: >-
  Cookie Clicker — grammaire de genre incremental/clicker UNIQUEMENT, jamais une copie (aucun
  asset, nom, contenu, ni valeur numérique repris). AUCUN modèle STRUCTUREL de référence n'est
  imposé : la structure est INVENTÉE par la chaîne (définition du bras Libre). Source : Pierre
  2026-08-30 (genre de la paire, reconduit paire 2).

criteres_demo:
  - "Un clic est visiblement récompensé : un compteur de ressource affiché à l'écran augmente immédiatement au clic."
  - "Une progression est visible à l'écran : une valeur qui monte franchit un seuil et l'écran le reflète (déblocage, nouvel élément visible, ou changement d'état visible)."
  - "Au moins une action au-delà du clic de base est visible à l'écran (ex. un achat/amélioration qui modifie visiblement l'affichage ou le rythme)."
  - "La fin de partie est OBSERVABLE à l'écran : un état de fin distinct (écran/bannière/message de complétion) apparaît, différent de l'état de jeu en cours — ni écran figé, ni idle infini."

