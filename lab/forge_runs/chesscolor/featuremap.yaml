# Décompo fonctionnelle (s3)
Systeme: chesscolor
Features:
  - feature: couleur_de_case
    capacite: retourne clair/sombre pour une case valide
    preuve_attendue: check_chesscolor (cas e4=sombre, h1=claire, a8=claire)
  - feature: validation_entree
    capacite: rejette une case invalide avec code sortie != 0
    preuve_attendue: check_chesscolor (cas "z9" -> erreur)
