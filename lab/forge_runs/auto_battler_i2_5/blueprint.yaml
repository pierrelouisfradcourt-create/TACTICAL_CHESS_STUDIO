notes:
  granularite_oracle: >-
    forge.static_oracles._module_of (static_oracles.py:73-76) réduit tout fichier à son premier
    dossier sous src_root. Les interdictions du product_snapshot formulées en `renderer ↛
    engine/state`, `renderer ↛ engine/transition`, `renderer ↛ rng` ne sont donc PAS
    exprimables telles quelles : elles sont posées ici en `renderer ↛ engine`, qui les couvre
    toutes les trois et davantage. Écart déclaré, dans le sens strict uniquement.
  modules_sans_test: >-
    check_architecture rapporte aussi modules_sans_test (non gatant). Un fichier compte comme
    test si son nom contient « test » ou « spec » (static_oracles.py:185-187). solvability.mjs,
    e2e.mjs, web/ et app/ n'auront vraisemblablement pas de test unitaire important leur module :
    ces entrées apparaîtront dans modules_sans_test — c'est un fait rapporté, pas un FAIL.
  contradictions_signalees:
    - "engine/registry.mjs:5-25 déclare 19 Events ; 02_CORE_RULES.md:237-263 en ratifie 22. Écart réel, dans le périmètre de l'incrément."
    - "engine/state.mjs:45-55 — createGameState ne recopie que 6 clés ; pool et bench_capacity sont ré-attachés à la main dans 8 endroits de preparation.mjs. round_index subirait le même sort (RO-5)."
    - "preparation.mjs:438 — handleLock force shop_locked à true sans condition : ce n'est pas la bascule exigée par RO-1, et aucun Event n'est émis."
    - "preparation.mjs:280-286 — handleSell ne consulte que le banc : vendre une unité posée sur le plateau est aujourd'hui un rejet SILENCIEUX (contredit R7 autant que RO-4)."
    - "preparation.mjs:514-565 — handlePlace n'accepte que {unit_instance_id, target_zone}, empile sans coordonnée (l.540) et la branche 'bench' retourne l'état inchangé (l.559-562) : ni plateau→plateau ni plateau→banc n'existent, alors que UnitPlaced exige from_index/to_index."
    - "preparation.mjs:15 BENCH_CAPACITY = 8 (contre 9 ratifié) et l.20 GOLD_COSTS.Reroll = 1 (contre 2, R11)."
    - "Aucun Income, aucun round_index, aucun tirage d'ouverture n'existe (grep « Income » sur games/auto_battler/**.mjs : seulement la liste close de economy/gold.mjs). initPrepState pose gold:0 et shop:[] (preparation.mjs:79-86) : impasse de départ, R13."
    - "NOUVEAU, non listé par la featuremap — engine/transition.mjs:27-56 (applyInput) est un SECOND chemin d'application d'Input, parallèle à applyPreparationInput : il émet un Event 'Spawn' placeholder pour TOUT Input accepté et force phase='Battle' sur ConfirmPreparation. Un appel depuis l'interface polluerait le journal d'Events (Spawn hors de son sens Combat) et contournerait R4. Aucune paire deps_interdites ne peut l'interdire (input -> engine est légitime pour buildInput) : porté ici en invariant non couvert par l'oracle, à câbler en WireMap (étape 5) ou à remonter en fog."
    - "NOUVEAU, non listé par la featuremap — fixtures/p1/probe_clean/server.mjs:31 (patron de serveur des sondes) n'autorise QUE les fichiers de la racine du dossier ; ce jeu a ses modules en sous-dossiers. Reprendre ce patron tel quel rendrait la page inchargeable. Porté en responsabilité explicite de web/server.mjs."
  fog_humangate:
    - "R6/RO-6 — l'atteignabilité de la fusion en 6 Rounds dépend de la seed (Income 3 au Round 0, coûts de fixture 1 à 5 or, tirage uniforme sur 5 UnitDefinition, shop/shop.mjs:51-72). Le budget de Rounds est un jugement Pierre : aucune bible ne le fixe."
    - "R7/R14 — distinguer un Input REJETÉ d'un Input ACCEPTÉ sans effet observable (ex. Lock idempotent) n'est documenté par aucune bible. RO-1 (bascule) supprime le cas pour Lock, mais le critère général reste un trou déclaré."
    - "R12 — le style visuel, la lisibilité et la qualité d'animation n'ont AUCUN oracle : l'écran n'est pas fait quand les gardes sont vertes, il est fait quand Pierre l'a regardé."

