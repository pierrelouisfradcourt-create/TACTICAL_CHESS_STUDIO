invariants_archi:
  # --- vérifiables par forge.static_oracles.check_architecture (deps_interdites) ---
  - "INV-5/R1 — Le module renderer/ n'importe AUCUN module de logique ni le moteur : son unique entrée est l'Event Log, passé par app/. Oracle : les 12 paires [renderer, *] de deps_interdites. Formulation d'oracle déjà écrite dans 02_CORE_RULES.md:304-305."
  - "R1 (chemin indirect) — layout/ ne peut voir ni le moteur ni la logique : sans cela, renderer -> layout -> engine rendrait INV-5 contournable par transitivité."
  - "P11 — engine/** reste content-agnostic : le sens de dépendance est exclusivement modules-métier -> engine, jamais l'inverse (14 paires [engine, *])."
  - "R4 (volet architectural) — la couche d'entrée ne peut atteindre ni le Pool, ni la Shop, ni le Bench, ni l'Economy directement : tout passe par preparation/. Et app/ ne peut pas atteindre preparation/ : il n'existe donc AUCUN chemin d'écriture de l'état côté interface qui ne traverse pas la couche d'entrée."
  - "R13/R6 — solvability.mjs et e2e.mjs n'importent aucun module de logique : un harnais qui ne peut pas importer le moteur ne peut pas fabriquer l'or ni la boutique de départ."
  - "R10 — web/ n'importe aucun module de jeu : le serveur est du transport, pas un morceau du jeu."
  - "Acyclicité — engine et params.v0 sont des puits (0 dépendance sortante), app est la seule source ; toute arête va d'une couche haute vers une couche basse. Aucun cycle possible par construction."

  # --- NON vérifiables par check_architecture : à porter par la WireMap (étape 5), les tests
  #     du builder, ou à remonter en fog. Déclarés ici pour qu'ils ne soient pas crus prouvés.
  - "NON COUVERT PAR L'ORACLE D'ARCHI — R2 : zéro Math.random, zéro Date, zéro performance.now dans renderer/. check_architecture ne lit que les imports, pas les identifiants globaux. À prouver par audit statique dédié + double rendu à trame figée."
  - "NON COUVERT PAR L'ORACLE D'ARCHI — R1 (global) : renderer/ ne référence pas window.__game. L'état est exposé en global pour le capteur (R10) ; un accès global n'est PAS un import et échappe donc à deps_interdites. À prouver par audit statique du module."
  - "NON COUVERT PAR L'ORACLE D'ARCHI — entonnoir unique : applyPreparationInput n'est appelé, côté interface, que depuis input/submit.mjs (un seul site). check_architecture prouve que l'arête input -> preparation existe, pas qu'elle est unique."
  - "NON COUVERT PAR L'ORACLE D'ARCHI — R5/QC-5 : aucun champ de temps dans le GameState. À prouver par audit de schéma d'état."
  - "R14 — le retour de refus est écrit par input/feedback.mjs et par personne d'autre ; il n'existe aucun Event de rejet (registre clos à 22) et le renderer ne le dessine jamais."
  - "R11 — une valeur de travail v0 a un seul site de déclaration : params.v0.mjs. Aucune constante de gameplay ne subsiste dans preparation.mjs (l.15-22 aujourd'hui : BENCH_CAPACITY, SHOP_SIZE, GOLD_COSTS)."
  - "R1b — aucun changement d'état observable d'un Seat n'est muet : tout Input accepté qui modifie {gold, bench, board, level, shop, shop_locked} émet au moins un Event, et l'état observable est reconstructible depuis les seules conditions initiales + le journal."
  - "Anti god-object — preparation/ délègue et ne réimplémente aucune règle de pool/shop/bench/merge/economy/board ; input/ est découpé en gestes/soumission/retour/minuteur ; renderer/ en modèle de vue/DOM/canvas. Aucun de ces modules ne dépasse une responsabilité nommable en une phrase."
  - "Le Merge reste un acte système : jamais un Input, jamais déclenché par input/ ni par app/."

