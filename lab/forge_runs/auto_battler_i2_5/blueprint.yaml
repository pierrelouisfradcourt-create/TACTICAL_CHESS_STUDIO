# blueprint.yaml — auto_battler i2.5 (premier rendu jouable, is_game=true)
#
# GELÉ à l'issue de l'étape 4. src_root du projet : games/auto_battler (scripts/forge/oracles.json:84-89).
# Granularité des modules = celle de l'oracle : forge.static_oracles._module_of (l.73-76) définit
# le module d'un fichier comme son PREMIER dossier sous src_root, ou son stem s'il est à la racine.
# Toute paire deps_interdites plus fine qu'un dossier de premier niveau est INVÉRIFIABLE par
# check_architecture — c'est pourquoi les interdictions ci-dessous sont posées au niveau dossier
# (plus strict que la formulation du product_snapshot, jamais plus permissif ; motif en §notes).
#
# Trois couches, jamais confondues (exigence structurante de l'incrément) :
#   1. MOTEUR (pur, déterministe) : engine, pool, shop, bench, merge, economy, board, preparation, round
#   2. COUCHE D'ENTRÉE (voit l'état) : input  — clics → Inputs, appel d'applyPreparationInput,
#      détection du refus (R14), minuteur (R5)
#   3. RENDERER (AVEUGLE, INV-5) : renderer — n'a que l'Event Log en entrée
#   + composition : app (racine de composition), web (serveur statique), layout (géométrie pure)

modules:
  # ---------------------------------------------------------------- couche 1 : moteur
  - nom: games/auto_battler/engine/
    fichiers:
      - games/auto_battler/engine/registry.mjs
      - games/auto_battler/engine/state.mjs
      - games/auto_battler/engine/types.mjs
      - games/auto_battler/engine/transition.mjs
      - games/auto_battler/engine/inputs.mjs
      - games/auto_battler/engine/eventlog.mjs
      - games/auto_battler/engine/rng.mjs
      - games/auto_battler/engine/serialize.mjs
      - games/auto_battler/engine/replay.mjs
      - games/auto_battler/engine/match.mjs
    responsabilite: >-
      Noyau content-agnostic (P11) INCHANGÉ dans son rôle, mais RÉPARÉ sur deux points de
      l'incrément — débordement de périmètre assumé sur du code i1 déjà mergé :
      (a) registry.mjs porte le registre d'Events de 19 à 22 noms (ajout UnitPlaced,
      ShopLocked, PhaseChanged) — vérifié : engine/registry.mjs:5-25 en déclare 19 alors que
      02_CORE_RULES.md:237-263 en ratifie 22 ;
      (b) state.mjs::createGameState cesse de perdre les champs hors de ses six clés (RO-5) —
      vérifié : state.mjs:45-55 ne recopie que {seed, rng_state, eventLog, players, entities,
      phase}, d'où les ré-attachements manuels de pool/bench_capacity dans CHAQUE handler de
      preparation.mjs (l.254-256, 343-344, 420-422, 449-451, 504-506, 554-556, 587-589,
      675-677) ; round_index y disparaîtrait de la même façon.
      Le moteur ne connaît NI le rendu, NI l'entrée, NI le Round.
    depend_de: []
    couvre: ["Systeme 1 (round_index porté par le GameState)", "Systeme 2 (registre 22)", "Systeme 8 (aucun timer moteur, QC-5/INV-3)"]

  - nom: games/auto_battler/pool/
    fichiers: [games/auto_battler/pool/pool.mjs]
    responsabilite: >-
      INCHANGÉ (i2). Comptabilité du Pool par UnitDefinition : reserve au tirage, débit au Buy,
      restore au Sell selon le Star. Invariant Pool + Shops réservées + possessions (INV-7).
    depend_de: [games/auto_battler/engine/]
    couvre: ["Systeme 1 (réservation au tirage d'ouverture)"]

  - nom: games/auto_battler/shop/
    fichiers: [games/auto_battler/shop/shop.mjs]
    responsabilite: >-
      INCHANGÉ dans sa mécanique (drawShop déterministe piloté par rng_state, réservation via
      pool). Consommé par round/ pour le TIRAGE D'OUVERTURE de début de Round, en plus du
      Reroll déjà câblé dans preparation/.
    depend_de: [games/auto_battler/engine/, games/auto_battler/pool/]
    couvre: ["Systeme 1 (tirage d'ouverture)"]

  - nom: games/auto_battler/bench/
    fichiers: [games/auto_battler/bench/bench.mjs]
    responsabilite: >-
      INCHANGÉ dans sa mécanique (capacité, rejet sans effet de bord — DP-9). La VALEUR de
      capacité cesse d'être une constante de preparation.mjs et vient de params.v0.mjs (R11 :
      8 → 9). Vérifié : preparation.mjs:15 déclare BENCH_CAPACITY = 8.
    depend_de: [games/auto_battler/engine/]
    couvre: ["Systeme 13 (banc 9 places)", "Systeme 9 (refus banc plein)"]

  - nom: games/auto_battler/merge/
    fichiers: [games/auto_battler/merge/merge.mjs]
    responsabilite: >-
      INCHANGÉ. Détection/résolution de Merge (3 UnitInstances identiques), acte système jamais
      déclenché par un Input. La DESTINATION de l'unité produite (to_zone/to_index, R1b) est
      calculée par preparation/ au moment de la réintégration, pas par merge/ qui ignore les zones.
    depend_de: [games/auto_battler/engine/]
    couvre: ["Systeme 2 (MergeResolved += to_zone/to_index)"]

  - nom: games/auto_battler/economy/
    fichiers: [games/auto_battler/economy/gold.mjs]
    responsabilite: >-
      INCHANGÉ. Ledger fermé des mouvements de Gold (liste close ECO-3 : Income, Buy, Reroll,
      LevelUp, Sell, reward — vérifié gold.mjs:5-12, 'Income' est DÉJÀ dans la liste close).
      round/ passe par applyGoldTransaction pour créditer l'Income : aucun crédit d'or hors de
      ce ledger.
    depend_de: [games/auto_battler/engine/]
    couvre: ["Systeme 1 (crédit d'Income)"]

  - nom: games/auto_battler/board/
    fichiers: [games/auto_battler/board/board.mjs]
    responsabilite: >-
      NOUVEAU. Adressage LOGIQUE du plateau (RO-4) : le plateau devient une grille de
      BOARD_WIDTH × BOARD_HEIGHT cases indexées ; occupation, case libre, pose, retrait,
      déplacement case→case, validité d'un index. Vérifié : preparation.mjs:540 empile
      l'unité dans `[...player.board, {...unit}]` SANS aucune coordonnée, et le commentaire
      l.532 dit lui-même « placeholder: only Bench→Board supported for now » — le moteur n'a
      aujourd'hui AUCUNE notion de case, alors que le payload UnitPlaced ratifié exige to_index.
      board/ ne connaît NI le Gold, NI la Shop, NI le pixel : c'est de l'adressage, pas du dessin
      (la géométrie écran vit dans layout/).
    depend_de: [games/auto_battler/engine/, params.v0.mjs]
    couvre: ["Systeme 2 (UnitPlaced)", "Systeme 6 (unités à la case portée par UnitPlaced)", "Systeme 7 (Place banc→plateau, plateau→plateau, plateau→banc)"]

  - nom: games/auto_battler/preparation/
    fichiers: [games/auto_battler/preparation/preparation.mjs]
    responsabilite: >-
      Couche d'orchestration de la fenêtre Preparation : route les 7 Inputs de la liste close.
      Travail de l'incrément, tout en délégation (anti god-object) :
      (a) handlePlace passe par board/ et accepte banc→plateau, plateau→plateau et plateau→banc,
      avec un index de destination (aujourd'hui : {unit_instance_id, target_zone} seulement,
      preparation.mjs:515 ; la branche 'bench' retourne l'état inchangé, l.559-562) ;
      (b) handleSell accepte une unité posée sur le PLATEAU (aujourd'hui rejet silencieux :
      handleSell ne consulte que bench.findOnBench, l.280-286) ;
      (c) handleLock devient une BASCULE et émet ShopLocked{locked} (aujourd'hui : force
      `shop_locked: true` sans condition et sans Event, l.438) ;
      (d) Place émet UnitPlaced, ConfirmPreparation émet PhaseChanged (le commentaire MED-5
      l.567-576 qui justifiait l'absence d'Event disparaît du chemin de code) ;
      (e) UnitBought += unit_instance_id, bench_index (aujourd'hui 4 champs, l.233-239, avec
      exclusion volontaire documentée MED-4) ; UnitSold += from_zone, from_index (l.319-327) ;
      MergeResolved += to_zone, to_index (l.631-637) ;
      (f) les constantes de gameplay (BENCH_CAPACITY, SHOP_SIZE, GOLD_COSTS.Reroll) sont LUES
      depuis params.v0.mjs, plus déclarées ici (l.15-22).
      Reste la SEULE porte d'écriture de l'état d'un Seat pendant la fenêtre Preparation.
    depend_de:
      - games/auto_battler/engine/
      - games/auto_battler/pool/
      - games/auto_battler/shop/
      - games/auto_battler/bench/
      - games/auto_battler/merge/
      - games/auto_battler/economy/
      - games/auto_battler/board/
      - params.v0.mjs
    couvre: ["Systeme 2 (Events muets)", "Systeme 7 (un geste = un Input)", "Systeme 9 (rejet sans effet de bord)", "Systeme 13 (valeurs v0)"]

  - nom: games/auto_battler/round/
    fichiers: [games/auto_battler/round/round.mjs]
    responsabilite: >-
      NOUVEAU. Cycle de vie du Round et création de partie — c'est le module qui fait que
      LE JEU PEUT DÉMARRER (R13). (a) newGame(seed) : initState + initPrepState + round_index à 0 ;
      (b) startRound(state) : ordonnancement ratifié 05_ECONOMY_BIBLE.md:250-261
      Income → tirage des Shops → Preparation State, itéré sur les Seats en seat_index croissant
      (DP-2) ; Income = min(3 + round_index, 10) lu depuis params.v0.mjs, revenu de base SEUL
      (Interest/primes REJETÉS, QE-4/QE-5, 05_ECONOMY_BIBLE.md:210) ; émet GoldChanged{source:'Income'}
      SANS input_ref, puis ShopRolled{cause:'RoundStart'} (RO-3), en sautant les Shops verrouillées
      (ECO-8) sans consommer de rng_state ; (c) porte l'incrément de round_index.
      Facade unique de démarrage : app/ ne connaît que ce module pour créer et avancer une partie.
      Vérifié : aucun code d'Income n'existe aujourd'hui (grep « Income » sur games/auto_battler/**.mjs
      = uniquement la liste close de economy/gold.mjs), initPrepState pose gold:0 et shop:[]
      (preparation.mjs:79-86) — impasse totale.
    depend_de:
      - games/auto_battler/engine/
      - games/auto_battler/preparation/
      - games/auto_battler/pool/
      - games/auto_battler/shop/
      - games/auto_battler/economy/
      - params.v0.mjs
    couvre: ["Systeme 1 (démarrage complet)"]

  # ------------------------------------------------- géométrie pure (partagée vue/entrée)
  - nom: games/auto_battler/layout/
    fichiers: [games/auto_battler/layout/layout.mjs]
    responsabilite: >-
      NOUVEAU. Géométrie d'écran PURE, sans état de jeu : conversion pixel → index de case,
      index de case → rectangle, rectangles des places de banc et des emplacements de boutique.
      Existe pour une raison précise : le renderer doit DESSINER les cases et la couche d'entrée
      doit RÉSOUDRE un clic en case ; sans module partagé, la même géométrie serait dupliquée des
      deux côtés et dériverait (même motif qu'ECO-2 « une seule table lue par l'affichage et par
      le tirage »). Ne lit aucun GameState, aucun Event, aucune horloge.
    depend_de: [params.v0.mjs]
    couvre: ["Systeme 6 (plateau et unités dans le canvas)", "Systeme 7 (Place au glisser)"]

  # ------------------------------------------------------ couche 2 : entrée (voit l'état)
  - nom: games/auto_battler/input/
    fichiers:
      - games/auto_battler/input/gestures.mjs
      - games/auto_battler/input/submit.mjs
      - games/auto_battler/input/feedback.mjs
      - games/auto_battler/input/timer.mjs
    responsabilite: >-
      NOUVEAU. LA COUCHE D'ENTRÉE — le seul module autorisé à la fois à voir l'état et à toucher
      le DOM d'interaction. Découpée en quatre responsabilités pour ne pas devenir un god-object :
      · gestures.mjs — écoute les clics/glissers (boutons, emplacements de boutique, places de
        banc, canvas via layout/) et construit UN Input de la liste close INV-13, jamais deux ;
      · submit.mjs — LE point d'appel unique d'applyPreparationInput dans tout le jeu (entonnoir),
        et le comparateur profond état-avant/état-après qui DÉTECTE le refus (R14 : aucun Event de
        rejet n'existe, le registre reste clos à 22) ;
      · feedback.mjs — écrit le retour de refus dans son propre élément DOM (« Banc plein — vendez
        une unité »), hors de toute surface du renderer ; c'est ici et NULLE PART AILLEURS que R7
        est tenu ;
      · timer.mjs — décompte de 30 s (params.v0.mjs) tenu ENTIÈREMENT hors du GameState (QC-5 :
        « jamais de timer moteur »), qui à expiration passe par submit.mjs pour émettre exactement
        le même Input ConfirmPreparation que le bouton « prêt ».
      Ne dessine JAMAIS l'écran de jeu et ne déclenche JAMAIS le rendu : c'est app/ qui re-rend.
    depend_de:
      - games/auto_battler/engine/
      - games/auto_battler/preparation/
      - games/auto_battler/layout/
      - params.v0.mjs
    couvre: ["Systeme 7 (contrôles → Inputs)", "Systeme 8 (minuteur)", "Systeme 9 (rejet observable)"]

  # ---------------------------------------------- couche 3 : renderer AVEUGLE (INV-5, R1)
  - nom: games/auto_battler/renderer/
    fichiers:
      - games/auto_battler/renderer/viewmodel.mjs
      - games/auto_battler/renderer/render_dom.mjs
      - games/auto_battler/renderer/render_canvas.mjs
    responsabilite: >-
      NOUVEAU. LE RENDERER AVEUGLE. Son unique entrée est l'Event Log (+ un compteur de trames
      injecté). Il ne lit JAMAIS le GameState, ne l'importe pas, ne le référence pas, et ne lit
      pas non plus l'objet global du capteur (R10).
      · viewmodel.mjs — plie le journal depuis les conditions initiales connues (or 0, niveau 1,
        banc vide, plateau vide, boutique vide, verrou faux) en un modèle de vue ; c'est ici que
        R3 échoue quand un Event ne porte pas assez d'information pour être dessiné ;
      · render_dom.mjs — or, niveau, 5 emplacements de boutique, verrou, 9 places de banc,
        minuteur, 4 boutons en TEXTE et ÉLÉMENTS DOM RÉELS (R8), sélecteurs stables (R10) ;
      · render_canvas.mjs — plateau 8×8 miroir et unités posées avec leur Star, via layout/ ;
        liseré-chronomètre qui se consume sur le COMPTEUR DE TRAMES INJECTÉ, jamais sur l'horloge
        murale (R2 + direction artistique) ; overlay de debug éteint par défaut (R9).
      Aucun Math.random, aucun Date, aucun performance.now dans ce module.
    depend_de:
      - games/auto_battler/layout/
      - params.v0.mjs
    couvre: ["Systeme 3 (renderer aveugle)", "Systeme 4 (rendu déterministe)", "Systeme 5 (couverture Event → écran)", "Systeme 6 (HTML/canvas)", "Systeme 12 (debug éteint)", "Systeme 14 (style — aucun oracle)"]

  # -------------------------------------------------------------- composition & transport
  - nom: games/auto_battler/app/
    fichiers: [games/auto_battler/app/boot.mjs]
    responsabilite: >-
      NOUVEAU. Racine de composition, côté navigateur, et ELLE SEULE : lit la seed dans l'URL,
      appelle round.newGame(seed) puis round.startRound(), expose l'état en global sous
      window.__game pour le capteur (R10), câble input/ (en lui passant l'état courant et en
      recevant l'état suivant), tient le compteur de trames et appelle renderer avec le SEUL
      Event Log. Ne contient aucune règle de jeu, ne construit aucun Input, ne dessine rien
      lui-même. C'est le seul endroit où le mot « window » et une règle de rendu se croisent.
    depend_de:
      - games/auto_battler/round/
      - games/auto_battler/input/
      - games/auto_battler/renderer/
      - games/auto_battler/layout/
      - params.v0.mjs
    couvre: ["Systeme 4 (compteur de trames injectable)", "Systeme 11 (seed par URL, état en global)"]

  - nom: games/auto_battler/web/
    fichiers:
      - games/auto_battler/web/server.mjs
      - games/auto_battler/web/index.html
    responsabilite: >-
      NOUVEAU. Transport uniquement. server.mjs sert index.html et les modules .mjs, y compris
      ceux des SOUS-DOSSIERS (engine/, renderer/, app/… — le patron de serveur des sondes P1
      n'autorise que les fichiers de la racine : fixtures/p1/probe_clean/server.mjs:31
      `ALLOWED_FILE = /^\/[a-zA-Z0-9_-]+\.(mjs|js|css|json)$/` ; le reprendre tel quel rendrait
      ce jeu inchargeable), refuse toute traversée de chemin, et ANNONCE sa disponibilité sur
      stdout avant toute mesure (R10). index.html porte le squelette DOM (identifiants stables),
      la couleur de fond déclarée et la typographie ; il charge app/boot.mjs.
      N'importe AUCUN module de jeu : un serveur statique qui connaît les règles est un défaut.
    depend_de: []
    couvre: ["Systeme 11 (serveur, stdout, couleur de fond, sélecteurs stables)", "Systeme 6 (squelette DOM)"]

  # --------------------------------------------------------------- paramètres et oracles
  - nom: games/auto_battler/params.v0.mjs
    fichiers: [games/auto_battler/params.v0.mjs]
    responsabilite: >-
      SITE DE DÉCLARATION UNIQUE des valeurs de travail v0 (R11). Existe déjà (BOARD_WIDTH 8,
      BOARD_HEIGHT 8, BOARD_ORIENTATION 'mirror', MANA_FALLOFF_AFTER_CAST, TICK_LIMIT) et reste
      à sa place — il est cité comme source par HUMANGATE_2026-07-19_VALUES_V0.md et par
      COMBAT_GATE_PREP.md ; le déplacer casserait ces renvois. S'y AJOUTENT, et nulle part
      ailleurs : minuteur 30 s, boutique 5 emplacements, banc 9 places, Reroll 2 or, barème
      d'Income min(3 + round_index, 10), géométrie de cellule pour layout/.
      NE RESTENT PAS ICI, faute de source : le coût de montée de niveau (reste la table du
      moteur, preparation.mjs:21) et la limite d'unités posables (NON DOCUMENTÉE, non implémentée).
      Fichier de constantes : n'importe RIEN.
    depend_de: []
    couvre: ["Systeme 13 (valeurs v0, site unique)", "Systeme 8 (durée 30 s)"]

  - nom: games/auto_battler/solvability.mjs
    fichiers: [games/auto_battler/solvability.mjs]
    responsabilite: >-
      NOUVEAU (exigé par la garde forge.static_oracles.check_solvability_wired : fichier présent,
      non vide, INVOQUÉ par run-oracle.mjs). Bot déterministe qui pilote un vrai navigateur et
      ne dispose QUE des contrôles de l'interface : depuis une partie NEUVE (aucune injection
      d'or ni d'unité), acheter → poser → fusionner → confirmer, en 6 Rounds au plus (RO-6),
      seed déclarée AVANT exécution. N'importe aucun module de logique : son échec doit être
      imputable au jeu, jamais au harnais.
    depend_de: []
    couvre: ["Systeme 10 (solvabilité à la souris)"]

  - nom: games/auto_battler/e2e.mjs
    fichiers: [games/auto_battler/e2e.mjs]
    responsabilite: >-
      NOUVEAU (exigé par forge.static_oracles.check_e2e_harness : navigateur réel, entrées
      réelles, au moins N observations de window.__game/#overlay/#restart, invoqué par
      run-oracle.mjs). Click-through de la préparation : un Input par geste, refus visible,
      minuteur, images de R3 mesurées debug éteint. N'importe aucun module de logique.
    depend_de: []
    couvre: ["Systeme 5 (différences d'image)", "Systeme 7 (un geste = un Input)", "Systeme 9 (retour de refus dans le DOM)", "Systeme 11"]

  - nom: games/auto_battler/run-oracle.mjs
    fichiers: [games/auto_battler/run-oracle.mjs]
    responsabilite: >-
      EXISTANT, à étendre : porte d'oracle du jeu (scripts/forge/oracles.json:84-89 →
      `node run-oracle.mjs` depuis games/auto_battler). Doit désormais INVOQUER e2e.mjs ET
      solvability.mjs (verbes d'exécution réels : les deux gardes retirent les commentaires JS
      avant analyse — une mention en commentaire ne câble rien).
    depend_de: []
    couvre: ["Systeme 10", "Systeme 5"]

# ---------------------------------------------------------------------------------------
# Dépendances AUTORISÉES (arêtes du graphe ; tout ce qui n'y figure pas et qui est listé en
# deps_interdites est refusé mécaniquement). Graphe ACYCLIQUE, vérifiable par lecture :
# engine et params.v0 sont des puits ; app est la seule source ; aucune arête ne remonte.
deps_autorisees:
  - "pool -> engine"
  - "shop -> engine"
  - "shop -> pool"
  - "bench -> engine"
  - "merge -> engine"
  - "economy -> engine"
  - "board -> engine"
  - "board -> params.v0"
  - "layout -> params.v0"
  - "preparation -> engine"
  - "preparation -> pool"
  - "preparation -> shop"
  - "preparation -> bench"
  - "preparation -> merge"
  - "preparation -> economy"
  - "preparation -> board"
  - "preparation -> params.v0"
  - "round -> engine"
  - "round -> preparation"
  - "round -> pool"
  - "round -> shop"
  - "round -> economy"
  - "round -> params.v0"
  - "input -> engine"
  - "input -> preparation"
  - "input -> layout"
  - "input -> params.v0"
  - "renderer -> layout"
  - "renderer -> params.v0"
  - "app -> round"
  - "app -> input"
  - "app -> renderer"
  - "app -> layout"
  - "app -> params.v0"
  - "solvability -> params.v0"
  - "e2e -> params.v0"
  - "solvability -> input   # toléré par la featuremap (« le harnais n'importe que la couche d'entrée ») ; en pratique le harnais pilote un navigateur et n'importe rien"
  - "e2e -> input           # idem"

# ---------------------------------------------------------------------------------------
# Dépendances INTERDITES — livrable central. Format consommé par
# forge.static_oracles.check_architecture : liste de paires [source, cible] de NOMS DE MODULE
# (premier dossier sous src_root, ou stem d'un fichier racine). Voir le bloc blueprint_oracle
# en fin de fichier pour la projection JSON exacte à matérialiser en blueprint.json.
deps_interdites:
  # --- INV-5 / R1 : LE RENDERER EST AVEUGLE. Interdiction la plus importante du blueprint.
  #     Posée au niveau du dossier `engine` (et non engine/state, engine/transition, engine/rng
  #     séparément) parce que _module_of ne distingue pas les sous-dossiers : une paire plus fine
  #     serait INVÉRIFIABLE. Plus strict que le product_snapshot, jamais plus permissif.
  - [renderer, engine]
  - [renderer, preparation]
  - [renderer, pool]
  - [renderer, shop]
  - [renderer, bench]
  - [renderer, merge]
  - [renderer, economy]
  - [renderer, board]
  - [renderer, round]
  - [renderer, input]
  - [renderer, app]
  - [renderer, web]

  # --- P11 : engine reste content-agnostic (aucune remontée du noyau vers quoi que ce soit)
  - [engine, pool]
  - [engine, shop]
  - [engine, bench]
  - [engine, merge]
  - [engine, economy]
  - [engine, board]
  - [engine, preparation]
  - [engine, round]
  - [engine, layout]
  - [engine, renderer]
  - [engine, input]
  - [engine, app]
  - [engine, web]
  - [engine, "params.v0"]

  # --- params.v0 est un fichier de constantes : il n'importe rien
  - ["params.v0", engine]
  - ["params.v0", pool]
  - ["params.v0", shop]
  - ["params.v0", bench]
  - ["params.v0", merge]
