  games/auto_battler/bench/bench.mjs: builder
  games/auto_battler/merge/merge.mjs: builder
  games/auto_battler/economy/gold.mjs: builder
  games/auto_battler/preparation/preparation.mjs: builder

invariants_archi:
  - "engine/** reste content-agnostic (P11) : aucun import depuis pool/, shop/, bench/, merge/, economy/, preparation/ — le sens de dépendance est exclusivement modules-nouveaux -> engine/."
  - "Merge n'est jamais invoqué via un Input de l'alphabet fermé des 7 : merge.mjs est appelé uniquement depuis preparation.mjs (ou la logique de transition), jamais comme Input direct."
  - "preparation.mjs est une couche de composition pure : aucune règle de Pool/Shop/Bench/Gold/Merge n'est dupliquée ou réimplémentée dans preparation.mjs — délégation stricte aux modules dédiés (anti god-object)."
  - "Le débit du Pool a lieu exclusivement dans pool.mjs au moment du Buy ; aucun autre module ne mute le Pool directement."
  - "shop.mjs ne débite jamais le Pool lui-même — il réserve seulement via pool.mjs ; le débit reste la responsabilité exclusive de pool.mjs au Buy."
  - "gold.mjs n'accepte que des transactions appartenant à la liste close (Income, Buy, Sell, Reroll, LevelUp, rewards) ; toute transaction hors liste = fail-hard."
  - "bench.mjs rejette un Buy à capacité pleine sans aucun effet de bord (aucune mutation de pool/gold/shop n'a lieu si bench.mjs rejette)."
  - "Aucune dépendance cyclique : pool <- shop <- preparation ; bench, merge, gold sont des feuilles consommées uniquement par preparation (jamais l'inverse)."
