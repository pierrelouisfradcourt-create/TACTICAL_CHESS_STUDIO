fog_humangate:
  # Ce qui ne peut PAS être tranché par un agent — remonte à Pierre.
  - id: FOG-1
    question: "Le jeu-modèle proposé (Kingdom Rush / Bloons TD) est-il accepté comme référence de grammaire de genre, ou Pierre en désigne-t-il un autre — ou aucun ?"
    statut: "Non ratifié. Traité comme PROPOSITION ; la sonde ne dépend d'aucune propriété spécifique de ces jeux."
  - id: FOG-2
    question: "La sonde est-elle un instrument jetable, ou la graine d'un jeu à développer ? Cela change la valeur de la dette assumée (pas de vente de tour, une seule map, zéro audio)."
    statut: "Non tranché. Le charter assume JETABLE — instrument de mesure. À confirmer."
  - id: FOG-3
    question: "Le seuil de solvabilité doré (vies finales exactes du bot compétent, seed 1337) est arbitraire tant qu'aucun run n'a eu lieu. Qui le fige, et à quel moment ?"
    statut: "Résolu en procédure, ouvert en valeur : la valeur vient du PREMIER run réel et est figée ensuite ; toute modification ultérieure est signalée. La valeur elle-même ne peut pas être inventée ici."
  - id: FOG-4
    question: "La qualité ressentie (est-ce agréable à jouer ?) reste hors de portée de tout oracle de cette sonde."
    statut: "Fog permanent par construction. Jugement Pierre uniquement."
  - id: FOG-5
    question: "Les chiffres de balance proposés (PV, dégâts, coûts, compositions) sont des hypothèses de conception non testées. Ils PEUVENT ne pas produire la divergence attendue."
    statut: "Ouvert. Si le premier run montre une stratégie dominante ou une variance nulle, c'est une DÉCOUVERTE à rapporter, pas un bug à masquer par ajustement silencieux."
