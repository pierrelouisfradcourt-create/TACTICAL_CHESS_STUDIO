objectif: >-
  Forger un mini-jeu de tir vertical (shoot-em-up) tres simple : un vaisseau
  qui tire sur des ennemis descendants.

hors_scope:
  - "Multijoueur, reseau."

criteres_succes:
  - "SOLVABILITE PROUVEE : un bot gagne reellement en detruisant tous les ennemis."
  - "DETERMINISME : meme seed, meme vague d'ennemis."
  - "CONTRAT DE JOUABILITE RESPECTE : window.__game expose, #overlay, #restart."

actions_interdites:
  - "Aleatoire non seede dans la generation de vague."
