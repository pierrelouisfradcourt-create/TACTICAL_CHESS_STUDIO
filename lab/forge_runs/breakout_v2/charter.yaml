# Charter Forge — étape 0 (Contrat) — projet : breakout_v2
# IDENTITÉ DE PROJET (arbitrage orchestrateur, à respecter partout) : breakout_v2.
#   Jeu : games/breakout_v2/ · run_dir : lab/forge_runs/breakout_v2/. JAMAIS games/breakout/
#   (référence JS 2026-07-11, intangible, laissée intacte comme référence CONCEPT) ni
#   lab/forge_runs/breakout/ (artefacts de run 2026-07-11, intangibles). Choisi pour éviter
#   toute collision avec ces deux emplacements existants — voir provenance.identite_projet.
# schéma       : {objectif, hors_scope[], criteres_succes[], actions_interdites[],
#                 plateforme_cible, reference_jeu, criteres_demo[]} — 7 champs, format Snake v2
# oracle sortie: forge.static_oracles.check_charter (déterministe, non-LLM)
#
# PROVENANCE DE CE FICHIER : matérialisation directe (mission orchestrateur 2026-07-31) du
# charter PROPOSED rédigé le 2026-07-30 (docs/forge/BREAKOUT_V2_CHARTER_PROPOSED.md §2, §4,
# §5, §"Paramètres de design chiffrés", §revisions, §provenance, §question_ouverte_humangate).
# Ceci N'EST PAS le produit d'un agent dispatché sous contrat s0-contrat (aucun
# FORGE_DISPATCH:s0-contrat n'a été ouvert pour cette écriture) : c'est une transcription
# fidèle du document PROPOSED en artefact exploitable, à laquelle deux arbitrages
# orchestrateur ont été ajoutés (voir revisions v2, provenance, question_ouverte_humangate) —
# tous deux marqués ARBITRAGE_ORCHESTRATEUR_2026-07-31_RATIFICATION_GATE_EN_ATTENTE, non
# fermés, en attente de ratification HumanGate Pierre.
#
# NOTE DE MÉTHODE : aucune décision n'est portée par un commentaire (règle studio
# 2026-07-23). La provenance de chaque champ de design-intent est un CHAMP STRUCTURÉ
# (`provenance:`), l'historique de révision est un CHAMP STRUCTURÉ (`revisions:`), et
# tout paramètre chiffré non arbitré par Pierre est un CHAMP STRUCTURÉ à valeur initiale
# proposée (`parametres_de_design:`, statut A_EQUILIBRER) — jamais de la prose de marge,
# jamais un champ laissé en suspens.

version: 2

objectif: >-
  Forger de zéro un jeu de casse-briques (Breakout) solo, arcade, JOUABLE et DÉTERMINISTE
  (hors seed de disposition des briques), sur MOTEUR GODOT, sous le profil standard_godot
  (squelette gelé). Ce run a un DOUBLE objectif, de rang égal (cadrage Pierre 2026-07-30,
  verbatim : « Le jeu doit servir de TEST DE PIPELINE, pas seulement produire un jeu ») :
  (a) un Breakout jouable, (b) l'exercice et la mesure du pipeline Forge V2 observable
  (provenance, oracles, verdict signé, lessons — voir §1 du document de campagne associé,
  docs/forge/BREAKOUT_V2_CHARTER_PROPOSED.md). Produit minimal : une balle, une raquette
  contrôlée au clavier, N briques en disposition SEEDÉE (même seed + index de niveau =>
  même disposition, reproductible), physique de rebond réelle (murs latéraux/plafond par
  inversion de composante de vitesse, raquette avec angle de rebond FONCTION DU POINT
  D'IMPACT, brique détruite au contact avec rebond correspondant). Conditions de fin
  mutuellement exclusives : VICTOIRE quand le compte de briques cassables restantes vaut
  exactement 0, DÉFAITE quand la balle est perdue sous la raquette et qu'il ne reste plus de
  vies. La logique de jeu PURE (état, physique, collisions, génération de niveau, conditions
  de fin) est séparée du rendu et de l'entrée : rendu et input consomment l'état, jamais
  l'inverse — même discipline que Snake et Pong. Point dur assumé dès l'objectif (voir
  document de campagne §3) : Breakout est une physique CONTINUE, pas une grille discrète —
  le déterminisme se prouve sur un PAS DE TEMPS FIXE, nommé, jamais sur l'horloge du moteur.
  Le jeu doit être prouvé SOLVABLE par un bot qui INTERCEPTE réellement la balle selon une
  stratégie de contrôle déclarée (document de campagne §3), pas seulement testé mécanique
  par mécanique. PÉRIMÈTRE V1 (arbitrage orchestrateur, voir hors_scope et revisions v2) : un
  seul niveau, pas de progression multi-niveaux.

hors_scope:
