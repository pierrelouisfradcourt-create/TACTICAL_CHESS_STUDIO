# --- Ce que ce charter ne tranche PAS (remonté, pas masqué) ---
question_ouverte_humangate:
  - sujet: "Statut de core.audio (exigence CORE non contournable)"
    etat: >-
      Précédent EXACT et mesuré sur Snake : core.audio laissé DEFERRED, decider: pierre,
      jamais retiré ni déclaré NOT_APPLICABLE (games/snake/09_WIREMAP/wiremap.json). Ce
      charter Breakout hérite du même conflit non résolu : core_requirements.yaml impose
      un retour sonore (proof_kind artifact, not_applicable_allowed: false).
    arbitrage_orchestrateur: >-
      ARBITRAGE_ORCHESTRATEUR_2026-07-31_RATIFICATION_GATE_EN_ATTENTE — décision de travail
      appliquée par défaut : core.audio reste DEFERRED, decider: pierre, même précédent que
      Snake. Ce n'est pas une clôture du fog, seulement l'alignement sur le précédent connu
      en attendant la ratification.
    question_a_pierre: >-
      Ratifies-tu un adaptateur audio minimal pour Breakout (même patron que
      games/pong/06_RUNTIME/adapters/presentation/audio.mjs, porté en concept Godot), ou
      confirmes-tu le DEFERRED appliqué par défaut par l'orchestrateur — comme pour Snake ?
  - sujet: "Périmètre multi-niveaux"
    etat: >-
      Le charter web 2026-07-11 mentionnait une progression multi-niveaux (victoire au
      dernier niveau). Le périmètre minimal proposé (docs/forge/BREAKOUT_V2_CAMPAIGN_PREP.md
      §4) se limite à UN SEUL niveau pour la première boucle complète.
    arbitrage_orchestrateur: >-
      ARBITRAGE_ORCHESTRATEUR_2026-07-31_RATIFICATION_GATE_EN_ATTENTE — décision de travail
      appliquée : HORS SCOPE V1, un seul niveau seedé, cohérent avec le produit minimal de
      l'objectif. Ce n'est pas une clôture du fog.
    question_a_pierre: >-
      Confirmes-tu le périmètre à un seul niveau pour ce run 1 (appliqué par défaut par
      l'orchestrateur), la progression multi-niveaux étant reportée à une révision
      ultérieure du charter ?
  - sujet: "Valeurs chiffrées non sourcées (terrain, grille de briques, vies, angle max)"
    etat: >-
      Toutes proposées par le rédacteur du charter proposé, non vérifiées par World Scan
      HTTP, statut A_EQUILIBRER — le charter n'a donc aucun champ en suspens, mais aucune
      valeur n'a le statut RATIFIE_PIERRE dont Snake bénéficiait pour sa grille et sa
      vitesse initiale. Aucun arbitrage orchestrateur appliqué ici : ces valeurs restent
      telles que proposées, sans requalification.
    question_a_pierre: >-
      Ces valeurs de départ te conviennent-elles pour le premier build (conçues pour être
      ajustées au playtest sans toucher la logique), ou souhaites-tu un World Scan sourcé
      avant de les figer — sachant que cela retarderait le début de la campagne ?
