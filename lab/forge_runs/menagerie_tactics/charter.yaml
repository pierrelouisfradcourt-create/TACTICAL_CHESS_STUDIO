# Charter Forge — Menagerie Tactics (s0-contrat)
# Produit par l'orchestrateur /forge. Source : prompt utilisateur (fusion Pokémon × Fire Emblem) + GDD 10 sections.
# claim_verdict: NO_CLAIM_ALLOWED
run_id: menagerie_tactics
date: "2026-07-11"
titre_travail: "Menagerie Tactics"
pitch: >-
  Tactical-RPG de collection : le joueur mène une meute de bêtes sur une grille au
  tour par tour ; il CAPTURE les bêtes ennemies en les affaiblissant puis en les
  encerclant au milieu du combat ; les bêtes KO reviennent cicatrisées, jamais mortes.
sources_inspiration: [Pokémon (collection/capture/type-matchup), Fire Emblem (tactique de grille/positionnement/coût d'échec)]
identite_propre: >-
  La capture est une MANŒUVRE tactique (encercler + tenir), pas un mini-jeu séparé ni
  un lancer de dé. Coût d'échec gradué (cicatrice) entre le zéro-enjeu de Pokémon et la
  permadeath brutale de Fire Emblem.
perimetre_v0: >-
  Une bataille jouable sur grille 8x8, tour par tour, 6 types en cycle, terrain,
  déplacement/portée, capture par encerclement, KO->cicatrice, condition de victoire.
  Prototype web (JS pur, moteur headless testable). PAS de campagne multi-cartes en v0.
hors_perimetre_v0: [campagne multi-nœuds, évolution/class-change, liens/supports, 24 bêtes, méta compétitif]
lanes: JEUX (prototype web JS, dossier games/menagerie_tactics)
contrainte_realisabilite: petite équipe — moteur pur + rendu canvas, zéro dépendance runtime.
oracle_exigé: >-
  Jeu => oracle CODE (logic + property) + e2e navigateur réel (click/clavier) + SOLVABILITÉ
  (un bot joue, GAGNE et réussit AU MOINS UNE capture) + gate mutation 100%-ou-triage.
gate_humain: Pierre décide merge/reject/freeze. NO_CLAIM_ALLOWED.
