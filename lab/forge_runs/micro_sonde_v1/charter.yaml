objectif: 'Produire en un seul run un micro-prototype web immédiatement jouable —
  un « sas » de

  production/playtest — tenant dans un périmètre VERROUILLÉ PAR PIERRE : exactement
  1 pièce

  contenant 3 endroits distincts et 3 personnages. Le jeu doit s''ouvrir dans un navigateur
  et

  se jouer à la souris et/ou au clavier par un HUMAIN (pas seulement par bot), donner
  envie

  d''interagir dès la première minute SANS tutoriel, et permettre d''atteindre un
  état

  intéressant — victoire, défaite ou renversement de situation PERCEPTIBLE — en moins
  de

  5 minutes de jeu humain, le tout SANS aucune économie, aucun compteur affiché, aucune

  ressource numérique visible, aucun score. Le CONTENU (identité des 3 personnages,
  nature des

  3 endroits, thème, ton, enjeu, nature de l''interaction, forme exacte de la fin/du

  renversement) est DÉLÉGUÉ aux étapes aval (liberté de conception) et n''est PAS
  fixé par ce

  charter. Joueur cible : un humain au navigateur. Juge final de la qualité : Pierre,
  en

  playtest court après s12 — les oracles ne prouvent que « ça tourne ».

  '
hors_scope:
- Toute économie, tout compteur affiché, toute ressource numérique visible, tout score
- Plus d'1 pièce, plus de 3 endroits, ou plus de 3 personnages (périmètre verrouillé
  Pierre)
- Toute mesure expérimentale M1–M7, toute comparaison, toute analyse expérimentale
  (c'est un sas de production/playtest, pas une expérience)
- Toute paire L/D (aucune paire — décision Pierre 2026-09-01)
- Toute référence externe, grammaire de genre ou œuvre-guide (le pipeline invente
  seul)
- Tout tutoriel ou texte d'apprentissage requis pour jouer
- Toute plateforme autre que web HTML+JS (pas de Godot ni autre moteur)
- La décision de CONTENU par s0 (déléguée aux étapes aval — hors du charter)
- Tout jugement automatisé du « fun »/de la qualité (réservé au playtest humain de
  Pierre)
criteres_succes:
- 'Chaîne micro_sonde complète s0→s9→s10a→s11→s12 : verdict signé HMAC + verify_run
  AUTHENTIQUE'
- charter matérialisé par s0 (bloc yaml)
- 'Socle sonde web N1 : HTML+JS, déterminisme seedé, window.__game exposé, harnais
  complet à la racine du jeu'
- 'LANCEMENT : le jeu s''ouvre dans un navigateur et affiche la pièce, les 3 endroits
  et les 3 personnages'
- 'INTERACTION : chaque personnage ET chaque endroit réagit de façon perceptible à
  une action du joueur'
- Jouable au navigateur par un humain à la souris et/ou au clavier (pas seulement
  par bot)
- 'BOUCLE D''ACTION : le harnais E2E prouve qu''une séquence d''actions change l''état
  du jeu ET que ce nouvel état change les possibilités suivantes'
- 'ÉTAT INTÉRESSANT : le harnais prouve par bot scripté (solvabilité) qu''une fin
  ou un renversement est ATTEIGNABLE — assertion STRICTE, jamais un >= tautologique'
- Un état intéressant est atteignable en < 5 minutes de jeu humain
- s11 red-team Qwen réel ; si LM Studio est down → HALT sans fallback
actions_interdites:
- Introduire une économie, un compteur affiché, une ressource numérique visible ou
  un score
- Dépasser le périmètre 1 pièce / 3 endroits / 3 personnages
- Ajouter un tutoriel ou un texte d'apprentissage pour rendre le jeu jouable
- Emprunter à une référence externe, une grammaire de genre ou une œuvre-guide
- Exécuter une mesure M1–M7, une comparaison ou une analyse expérimentale
- Substituer un fallback à Qwen en s11 si LM Studio est down (obligation de HALT)
- Émettre un verdict de qualité/fun automatisé (les oracles ne prouvent que « ça tourne
  »)
- git commit / git push (gate Pierre — aucun sous-agent ne commite)
- Écrire hors de games/micro_sonde_v1/ et des artefacts de run autorisés ; toucher
  aux lanes protégées (tests/, src/)
- Poursuivre au-delà de s12 même tous voyants verts (STOP — jugement humain Pierre)
plateforme_cible: 'web (HTML+JS canvas) — socle sonde N1 (source : project_brief.yaml
  champ `cible`, Pierre 2026-09-01)'
reference_jeu: 'AUCUNE référence externe — décision EXPLICITE Pierre 2026-09-01 (project_brief.yaml,
  provenance.references_autorisees ; references_autorisees: []). La sonde teste ce
  que le pipeline invente SEUL, sans grammaire de genre ni œuvre-guide. Champ DÉCLARÉ-VIDE
  assumé et TRACÉ à une source Pierre : ce n''est ni une invention d''agent ni un
  fog ouvert.

  '
criteres_demo:
- À l'ouverture dans le navigateur, on VOIT la pièce, les 3 endroits et les 3 personnages
  à l'écran (rien n'est vide/noir)
- Cliquer/agir sur un personnage produit une réaction PERCEPTIBLE à l'écran (le personnage
  change visiblement d'état, répond, bouge…)
- Cliquer/agir sur un endroit produit une réaction PERCEPTIBLE à l'écran
- Enchaîner quelques actions ouvre VISIBLEMENT de nouvelles possibilités qui n'existaient
  pas avant (ex. un accès qui s'ouvre, un personnage qui devient interactif) — perceptible
  SANS aucun compteur ni chiffre
- Une fin ou un renversement se produit VISIBLEMENT à l'écran (un changement d'état
  lisible comme « il s'est passé quelque chose »), atteint en < 5 min, sans score
  ni nombre
- Dans la première minute, un élément à l'écran invite à interagir SANS aucun texte
  de tutoriel
