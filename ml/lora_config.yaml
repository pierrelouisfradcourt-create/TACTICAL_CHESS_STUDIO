  threshold_to_train: 50
  draw_rate_pool: null  # à mesurer — smoke benchmark requis

model:
  base: "Qwen2.5-7B-Instruct"
  target_model: "devstral-tcs-v1"
  adapter_type: "lora"
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"

training:
  epochs: 3
  batch_size: 4
  learning_rate: 2.0e-4
  max_seq_length: 2048
  warmup_ratio: 0.03
  gradient_checkpointing: true
  fp16: true

