                // C'est ce qui déclenche le brouillard d'audit sur le nœud (nodeAudit lit data).
                const data = { ...n.data, ...payload, producerRef: brick.id,
                  sourceRef: brick.sourceRef || n.data.sourceRef || null,
                  wiredStatus: brickWiredStatus(brick) };
                if (hasComps) data.promptManual = false;
                return { ...n, data, attachedBrick: { id: brick.id, name: brick.name, badge: brick.badge } };
              }
              if (hasComps && n.type === 'agent-component' && n.data && n.data.parentId === nodeId) {
                const v = payload[n.data.componentType];
                if (typeof v === 'string' && v.trim() !== '') return { ...n, data: { ...n.data, text: v } };
              }
              return n;
            });
          });
          setStatus({ msg: '✅ Fiche « ' + brick.name + ' » attachée à ' + nodeId, kind: 'ok' });
        } catch { setStatus({ msg: '❌ attache échouée', kind: 'error' }); }
      }, [F]);

      // Attach a PROMPT brick to an LLM node: applies payload.text onto
      // node.data.prompt (replaces it). If the field was already non-empty and
      // differs, confirm first so a hand-edited prompt is never clobbered silently.
      // attachedPrompt is a top-level label (dropped by toEngineGraph).
      const attachPromptToNode = useCallback(async (nodeId, brickId) => {
        const { setNodes, nodes } = F; // attach onto the FOCUSED zone's node
        if (!brickId) {
          setNodes((ns) => ns.map((n) => n.id === nodeId
            ? (() => { const { attachedPrompt, ...rest } = n; const { producerRef, ...restData } = (n.data || {}); return { ...rest, data: restData }; })()
            : n));
          return;
        }
        try {
          const r = await fetch('/api/library/' + encodeURIComponent(brickId));
          if (!r.ok) { setStatus({ msg: '❌ prompt introuvable', kind: 'error' }); return; }
          const brick = await r.json();
          const text = (brick.payload && brick.payload.text) || '';
          const node = nodes.find((n) => n.id === nodeId);
          const current = node && node.data ? String(node.data.prompt || '') : '';
          if (current.trim() && current.trim() !== text.trim()) {
            if (!window.confirm('Ce nœud a déjà un prompt édité. L\'écraser par « ' + brick.name + ' » ?')) {
              setStatus({ msg: 'Attache annulée (prompt existant conservé)', kind: '' });
              return;
            }
          }
          // producerRef = provenance (the Prompt brick produces this node's output).
          setNodes((ns) => ns.map((n) => n.id === nodeId
            ? { ...n, data: { ...n.data, prompt: text, producerRef: brick.id }, attachedPrompt: { id: brick.id, name: brick.name, badge: brick.badge } }
            : n));
          setStatus({ msg: '✅ Prompt « ' + brick.name + ' » attaché à ' + nodeId, kind: 'ok' });
        } catch { setStatus({ msg: '❌ attache prompt échouée', kind: 'error' }); }
      }, [F]);

      // Attach an ORACLE brick to a node as a quality GUARDIAN. This pass stores
      // only the ASSOCIATION (no real execution): data.oracleRef = brickId is
      // TRANSMITTED to the engine as INERT metadata (mockAdapters/runGraph ignore
      // unknown data keys) so the link travels with saved chains and is ready for a
      // future pass that executes the guardian. attachedOracle is a UI-only label
      // (top-level → dropped by toEngineGraph). Passing '' detaches.
      const attachOracleToNode = useCallback(async (nodeId, brickId) => {
        const { setNodes, nodes } = F; // attach onto the FOCUSED zone's node
        if (!brickId) {
          setNodes((ns) => ns.map((n) => {
            if (n.id !== nodeId) return n;
            const { attachedOracle, ...rest } = n;
            const { oracleRef, ...restData } = (n.data || {});
            return { ...rest, data: restData };
          }));
          return;
        }
        try {
          const r = await fetch('/api/library/' + encodeURIComponent(brickId));
          if (!r.ok) { setStatus({ msg: '❌ oracle introuvable', kind: 'error' }); return; }
          const brick = await r.json();
          // Governance: no self-validation. A node's producer must be independent of
          // its Oracle. producerRef falls back to the node id when no producer brick.
          const node = nodes.find((n) => n.id === nodeId);
          const prodRef = (node && node.data && node.data.producerRef) || nodeId;
          if (prodRef === brick.id) {
            setStatus({ msg: '⛔ Auto-validation interdite : un Oracle ne peut pas juger un nœud produit par sa propre brique.', kind: 'error' });
            return;
          }
          setNodes((ns) => ns.map((n) => n.id === nodeId
            ? { ...n, data: { ...n.data, oracleRef: brick.id }, attachedOracle: { id: brick.id, name: brick.name, badge: brick.badge } }
            : n));
          setStatus({ msg: '✅ Oracle « ' + brick.name + ' » attaché comme gardien à ' + nodeId, kind: 'ok' });
        } catch { setStatus({ msg: '❌ attache oracle échouée', kind: 'error' }); }
      }, [F]);

      // Attach a GOAL brick to ANY node (no attachableTo restriction — a goal steers
      // the intent of anything). Stores data.goalRef = brickId (transmitted INERT to
      // the engine, same treatment as oracleRef) + attachedGoal UI label (top-level,
      // dropped by toEngineGraph). Passing '' detaches.
      const attachGoalToNode = useCallback(async (nodeId, brickId) => {
        const { setNodes } = F; // attach onto the FOCUSED zone's node
        if (!brickId) {
          setNodes((ns) => ns.map((n) => {
            if (n.id !== nodeId) return n;
            const { attachedGoal, ...rest } = n;
            const { goalRef, ...restData } = (n.data || {});
            return { ...rest, data: restData };
          }));
          return;
        }
        try {
          const r = await fetch('/api/library/' + encodeURIComponent(brickId));
          if (!r.ok) { setStatus({ msg: '❌ objectif introuvable', kind: 'error' }); return; }
          const brick = await r.json();
          setNodes((ns) => ns.map((n) => n.id === nodeId
            ? { ...n, data: { ...n.data, goalRef: brick.id }, attachedGoal: { id: brick.id, name: brick.name, badge: brick.badge } }
            : n));
          setStatus({ msg: '✅ Objectif « ' + brick.name + ' » attaché à ' + nodeId, kind: 'ok' });
        } catch { setStatus({ msg: '❌ attache objectif échouée', kind: 'error' }); }
      }, [F]);

      // Apply an OUTPUTFORMAT brick onto a "sortie attendue" satellite: renders the brick
      // payload to plain text (renderOutputFormat) and writes it as the satellite's text.
      // Same "pick a Library brick → fill a field" shape as the other attaches, at the
      // grain of ONE satellite (the 8th). Feeds composeAgentPrompt on the next recompose.
      const applyOutputFormatToComponent = useCallback(async (compId, brickId) => {
        if (!brickId) return;
        try {
          const r = await fetch('/api/library/' + encodeURIComponent(brickId));
          if (!r.ok) { setStatus({ msg: '❌ brique introuvable', kind: 'error' }); return; }
          const brick = await r.json();
          const text = renderOutputFormat(brick.payload);
          patchNodeData(F.setNodes, compId, { text });
          setStatus({ msg: '✅ Format « ' + brick.name + ' » appliqué à ' + compId, kind: 'ok' });
        } catch { setStatus({ msg: '❌ attache format de sortie échouée', kind: 'error' }); }
      }, [F]);

      // ---- Chaîne (Passe 3) ----
      // Save the CURRENT canvas (full nodes WITH positions, edges, initial input) as
      // a "chain" brick. Stores the raw canvas nodes — NOT toEngineGraph's stripped
      // output — so reloading restores the exact layout (Phase 0). Direct POST (unique
      // id, one-off create) — the editor queue (Dette 1) is for in-editor edits.
      const saveCanvasAsChain = useCallback(async (name, category, tagsStr) => {
        let initialInput = {};
        try { initialInput = JSON.parse(inputText); } catch { /* garde {} si input invalide */ }
        const id = 'chain-' + Date.now().toString(36);
        const now = new Date().toISOString();
        const tags = (tagsStr || '').split(',').map((s) => s.trim()).filter(Boolean);
        // Council ⊂ Chaîne : badge honnête dérivé du contenu (real gate v1 / target vision),
        // sinon 'demo'. Catégorie fournie par le formulaire (pré-remplie « council » pour un Council).
        const ci = councilInfoOf(nodes);
        const doc = {
          id, kind: 'chain', name: name || 'Chaîne sans nom', maturity: 'draft', badge: ci.badge,
          roadmapRef: null, sourceRef: null, wiredStatus: 'unset',
          payload: { nodes, edges, initialInput, category: category || (ci.isCouncil ? 'council' : ''), tags },
          created: now, updated: now,
        };
        try {
          const r = await fetch('/api/library/' + encodeURIComponent(id), {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(doc),
          });
          if (!r.ok) { setStatus({ msg: '❌ sauvegarde chaîne échouée', kind: 'error' }); return; }
          await loadLibrary();
          setChainSaveOpen(false);
          setStatus({ msg: '✅ Chaîne « ' + doc.name + ' » sauvegardée (' + nodes.length + ' nœuds)', kind: 'ok' });
        } catch { setStatus({ msg: '❌ réseau — sauvegarde chaîne impossible', kind: 'error' }); }
      }, [nodes, edges, inputText, loadLibrary]);

      // Repopulate the canvas from a chain brick — SAME mechanism as loading a fixed
      // example (loadInto). Positions preserved because payload.nodes are raw canvas
      // nodes. Switches to the Canvas view.
      const loadChainToCanvas = useCallback((brick) => {
        const p = (brick && brick.payload) || {};
        loadInto({ nodes: p.nodes || [], edges: p.edges || [], input: p.initialInput }, 'Chaîne « ' + (brick.name || '?') + ' » chargée');
        setLoadedExample(null); // a saved chain is not one of the 3 fixed example keys
        setView('canvas');
      }, [loadInto]);

      // Fetch a chain's full payload by id then load it (used by the view selector,
      // whose list only carries summaries).
      const loadChainById = useCallback(async (id) => {
        try {
          const r = await fetch('/api/library/' + encodeURIComponent(id));
          if (!r.ok) { setStatus({ msg: '❌ chaîne introuvable', kind: 'error' }); return; }
          loadChainToCanvas(await r.json());
        } catch { setStatus({ msg: '❌ chargement chaîne échoué', kind: 'error' }); }
      }, [loadChainToCanvas]);

      // Load the library once on mount (triggers server-side seed if empty).
      useEffect(() => { loadLibrary(); }, [loadLibrary]);

      // Keep the editor coherent with the Type filter: if the brick being edited no
      // longer matches the active filter (and the filter isn't "Tous"), close it —
      // never leave an editor open whose kind contradicts the filter above it.
      useEffect(() => {
        if (libEditing && libFilter !== 'all' && libEditing.kind !== libFilter) setLibEditing(null);
      }, [libFilter, libEditing]);

      // Edge/selection edits target the FOCUSED zone (inspector shows F's selection).
      const setEdgeField = useCallback((id, patch) => {
        F.setEdges((es) => es.map((e) => e.id === id ? { ...e, ...patch } : e));
      }, [F]);

      const deleteSelected = useCallback(() => {
        const { sel, nodes, setNodes, setEdges, setSel } = F;
        if (!sel) return;
        if (sel.kind === 'node') {
          // Cascade: deleting a composite Agent removes its 7 satellite components too
          // (and every edge touching any of them). agentComponentsOf is empty for legacy
          // agents / non-agent nodes, so this reduces to the plain single-node delete.
          const compIds = agentComponentsOf(sel.id, nodes).map((n) => n.id);
          const removed = new Set([sel.id, ...compIds]);
          setNodes((ns) => ns.filter((n) => !removed.has(n.id)));
          setEdges((es) => es.filter((e) => !removed.has(e.from) && !removed.has(e.to)));
        } else {
          setEdges((es) => es.filter((e) => e.id !== sel.id));
        }
        setSel(null);
      }, [F]);

      // ----- execute against the REAL engine -----
      const execute = useCallback(async () => {
        setBusy(true); setError(null); setErrorDetail(null);
        setStatus({ msg: '⏳ Exécution sur le moteur…', kind: 'busy' });
        try {
          let parsedInput;
          try { parsedInput = JSON.parse(inputText); }
          catch (e) { setError('Input JSON invalide : ' + e.message); setErrorDetail(null); setStatus({ msg: '❌ Input JSON invalide', kind: 'error' }); setBusy(false); return; }

          // Carte d'identité — UI layer (mirror of the Oracle self-validation double-check):
          // refuse BEFORE the network call if any composite agent's card is incomplete. The
          // API refuses too (no bypass). Legacy agents (no satellites) are never flagged.
          const incomplete = incompleteCompositeAgents(nodes);
          if (incomplete.length > 0) {
            const a = incomplete[0];
            setError(`L'agent ${a.id} est incomplet (${a.filled}/${a.total} composants remplis). ` +
              `Complète sa carte d'identité (${AGENT_CARD_LABELS}) avant de l'exécuter.`);
            setErrorDetail(null);
            setResult(null);
            setStatus({ msg: `❌ Agent incomplet (${a.filled}/${a.total}) — carte d'identité à compléter`, kind: 'error' });
            setBusy(false);
            return;
          }

          const engineGraph = toEngineGraph(nodes, edges);
          const res = await fetch('/api/execute', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ graph: engineGraph, initialInput: parsedInput, live }),
          });
          const out = await res.json();

          if (!out.success) {
            // Friction #2 — show the actionable human message; keep the raw one as detail.
            setError(humanizeGraphError(out.error));
            setErrorDetail(out.error);
            setResult(null);
            setStatus({ msg: '❌ Graphe invalide (voir explication)', kind: 'error' });
            setBusy(false);
            return;
          }
          setResult({ state: out.state, trace: out.trace, status: out.status });
          setError(null); setErrorDetail(null);
          if (out.status === 'paused_humangate') {
            // Keep the paused ctx + the exact graph sent, for /api/resume.
            setPaused({ ctx: { state: out.state, trace: out.trace, status: out.status, pausedAt: out.pausedAt }, graph: engineGraph, pausedAt: out.pausedAt });
            setResumeNote('');
            setStatus({ msg: '⏸️ En attente de validation humaine', kind: 'busy' });
          } else {
            setPaused(null);
            setStatus({ msg: `✅ Exécuté — ${out.trace.length} étape(s)`, kind: 'ok' });
          }
          // (applyTraceToWm retiré — le run ne touche plus le Wire Map, cf. note plus haut)
        } catch (e) {
          setError('Appel moteur échoué : ' + e.message);
          setStatus({ msg: '❌ Réseau / moteur injoignable', kind: 'error' });
        } finally {
          setBusy(false);
        }
      }, [nodes, edges, inputText, live]);

      // Resume a HumanGate pause with a human decision. Calls /api/resume with the
      // paused ctx + the graph that produced it, then updates the trace/state (and
      // re-pauses if a second gate is hit downstream).
      const resume = useCallback(async (decision) => {
        if (!paused) return;
        setBusy(true);
        setStatus({ msg: decision === 'approve' ? '⏳ Reprise (approuvé)…' : '⏳ Arrêt (rejeté)…', kind: 'busy' });
        try {
          const res = await fetch('/api/resume', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pausedState: paused.ctx, graph: paused.graph, decision, note: resumeNote || undefined, live }),
          });
          const out = await res.json();
          if (!out.success) { setError('Reprise refusée :\n' + out.error); setErrorDetail(null); setStatus({ msg: '❌ Reprise échouée', kind: 'error' }); return; }
          setResult({ state: out.state, trace: out.trace, status: out.status });
          if (out.status === 'paused_humangate') {
            setPaused({ ctx: { state: out.state, trace: out.trace, status: out.status, pausedAt: out.pausedAt }, graph: paused.graph, pausedAt: out.pausedAt });
            setResumeNote('');
            setStatus({ msg: '⏸️ En attente de validation humaine (gate suivant)', kind: 'busy' });
          } else {
            setPaused(null);
            setStatus({ msg: out.status === 'rejected' ? '❌ Rejeté par l\'humain — arrêté' : `✅ Repris — ${out.trace.length} étape(s)`, kind: out.status === 'rejected' ? 'error' : 'ok' });
          }
        } catch (e) {
          setError('Appel reprise échoué : ' + e.message);
          setStatus({ msg: '❌ Réseau / moteur injoignable', kind: 'error' });
        } finally { setBusy(false); }
      }, [paused, resumeNote, live]);

      // Engine graph shown in the inspector's "graphe envoyé au moteur" panel — reads the
      // ACTIVE zone's nodes/edges (bare names), so the Sandbox is never included, by construction.
      const engineGraph = toEngineGraph(nodes, edges);

      // ---- Library panel renderer (multi-kind: agent + prompt + chain) ----
      function renderLibrary() {
        // F1 — Type filter, then free-text search over the row's visible fields, then sort.
        const q = libSearch.trim().toLowerCase();
        const filtered = libBricks
          .filter((b) => libFilter === 'all' ? true : b.kind === libFilter)
          .filter((b) => q === '' ? true :
            [b.name, b.kind, b.badge, b.maturity].some((v) => String(v || '').toLowerCase().includes(q)))
          .slice()
          .sort((a, b) => libSort === 'updated'
            ? String(b.updated || b.created || '').localeCompare(String(a.updated || a.created || ''))
            : String(a.name || '').localeCompare(String(b.name || ''), 'fr', { sensitivity: 'base' }));
        const e = libEditing;
        // Currently-selected canvas node (shared React state) — lets the editor offer
        // a direct "attach" action to a compatible node without leaving for the canvas.
        const selCanvasNode = F.sel && F.sel.kind === 'node' ? F.nodes.find((n) => n.id === F.sel.id) : null;
        // Kind → its behaviour hint (list tooltips) + attach compatibility.
        const LIST_HINT = { agent: "s'attache à un nœud agent", prompt: "s'attache à un nœud llm", chain: 'se charge sur le canvas', oracle: 'gardien : valide la sortie d’un nœud', roadmap: 'plan : jalons (jalon → objectif Goal)', goal: "objectif final — s'attache à tout", outputformat: "contrat de sortie — s'attache au satellite « sortie attendue »", router: "s'attache à un nœud router", tool: "s'attache à un nœud tool", note: 'annotation — non exécutable (s’attache à un nœud note)', artefact: 'livrable final — non exécutable (s’attache à un nœud artefact)' };
        return (
          <div className="wm" data-testid="library">
            <div className="wm-bar">
              <span style={{ color: '#6366f1' }}>Bibliothèque :</span>
              <span style={{ fontSize: 10, color: '#94a3b8' }} data-testid="lib-count">{filtered.length} brique(s)</span>
              <label style={{ fontSize: 10, color: '#94a3b8', display: 'flex', alignItems: 'center', gap: 4 }}>Type :
                <select data-testid="lib-filter" value={libFilter} onChange={(ev) => setLibFilter(ev.target.value)} style={{ width: 'auto' }}>
                  <option value="all">Tous</option><option value="agent">Agent</option><option value="prompt">Prompt</option><option value="chain">Chaîne</option><option value="oracle">Oracle</option><option value="roadmap">Roadmap</option><option value="goal">Goal</option><option value="outputformat">Sortie attendue</option><option value="router">Router</option><option value="tool">Tool</option><option value="note">Note</option><option value="artefact">Artefact</option>
                </select>
              </label>
              {/* F1 — free-text search (on visible fields) + sort. Prereq before any mass import. */}
              <input data-testid="lib-search" type="search" value={libSearch} placeholder="🔍 rechercher…"
                onChange={(ev) => setLibSearch(ev.target.value)}
                style={{ width: 140, fontSize: 11 }} />
              <label style={{ fontSize: 10, color: '#94a3b8', display: 'flex', alignItems: 'center', gap: 4 }}>Tri :
                <select data-testid="lib-sort" value={libSort} onChange={(ev) => setLibSort(ev.target.value)} style={{ width: 'auto' }}>
                  <option value="name">Nom (A→Z)</option><option value="updated">Modifié (récent)</option>
                </select>
              </label>
              <div className="pal-item" style={{ marginLeft: 'auto' }}>
                <button data-testid="lib-new" onClick={(ev) => { ev.stopPropagation(); setMenu(menu === 'lib-new' ? null : 'lib-new'); }}>＋ Nouveau ▾</button>
                {menu === 'lib-new' && (
                  <div className="pal-menu" data-testid="lib-new-menu" style={{ right: 6, left: 'auto' }} onClick={(ev) => ev.stopPropagation()}>
                    <button className="pal-menu-i" data-testid="lib-new-agent" onClick={() => { newBrick('agent'); setMenu(null); }}>Agent</button>
                    <button className="pal-menu-i" data-testid="lib-new-prompt" onClick={() => { newBrick('prompt'); setMenu(null); }}>Prompt</button>
                    <button className="pal-menu-i" data-testid="lib-new-chain" onClick={() => { newBrick('chain'); setMenu(null); }}>Chaîne</button>
                    <button className="pal-menu-i" data-testid="lib-new-oracle" onClick={() => { newBrick('oracle'); setMenu(null); }}>Oracle</button>
                    <button className="pal-menu-i" data-testid="lib-new-roadmap" onClick={() => { newBrick('roadmap'); setMenu(null); }}>Roadmap</button>
                    <button className="pal-menu-i" data-testid="lib-new-goal" onClick={() => { newBrick('goal'); setMenu(null); }}>Goal</button>
                    <button className="pal-menu-i" data-testid="lib-new-outputformat" onClick={() => { newBrick('outputformat'); setMenu(null); }}>Sortie attendue</button>
                    <button className="pal-menu-i" data-testid="lib-new-router" onClick={() => { newBrick('router'); setMenu(null); }}>Router</button>
                    <button className="pal-menu-i" data-testid="lib-new-tool" onClick={() => { newBrick('tool'); setMenu(null); }}>Tool</button>
                    <button className="pal-menu-i" data-testid="lib-new-note" onClick={() => { newBrick('note'); setMenu(null); }}>Note</button>
                    <button className="pal-menu-i" data-testid="lib-new-artefact" onClick={() => { newBrick('artefact'); setMenu(null); }}>Artefact</button>
                  </div>
                )}
              </div>
            </div>
            <div className="wm-scroll" data-testid="lib-list">
              <table className="wm-t">
                <thead><tr><th>Nom</th><th>Type</th><th>Badge</th><th>Maturité</th><th></th></tr></thead>
                <tbody>
                  {filtered.length === 0 && <tr><td colSpan={5} className="wm-unmapped" style={{ padding: 12 }}>Vide — clique « ＋ Nouveau ».</td></tr>}
                  {filtered.map((b) => (
                    <tr key={b.id} data-testid={'lib-row-' + b.id} data-kind={b.kind}>
                      <td><button className="wm-link" data-testid={'lib-open-' + b.id} title={LIST_HINT[b.kind] || ''} onClick={() => loadBrick(b.id)}>{b.name}</button></td>
                      <td><span className="lib-maturity" data-testid={'lib-kind-' + b.id} style={{ background: '#1e293b', color: '#cbd5e1' }}>{b.kind}</span></td>
                      <td><span className={'badge-' + b.badge}>{EXAMPLE_BADGE[b.badge]}</span></td>
                      <td><span className="lib-maturity" data-maturity={b.maturity} data-testid={'lib-mat-' + b.id}>{b.maturity}</span></td>
                      <td><button className="wm-chip" data-testid={'lib-dup-' + b.id} onClick={() => duplicateBrick(b.id)}>dupliquer</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {e && (
              <div className="wm-audit" data-testid="lib-editor" data-kind={e.kind} style={{ marginTop: 10 }}>
                <div className="field row">
                  <div><label>id</label><input data-testid="lib-id" value={e.id} readOnly /></div>
                  <div><label>type</label><input data-testid="lib-kind" value={e.kind} readOnly /></div>
                </div>
                <div className="field"><label>nom</label>
                  <input data-testid="lib-name" value={e.name}
                    onChange={(ev) => patchBrick({ name: ev.target.value })} /></div>
                <div className="field row">
                  <div><label>maturité</label>
                    <select data-testid="lib-maturity" value={e.maturity}
                      onChange={(ev) => patchBrick({ maturity: ev.target.value })}>
                      <option value="draft">draft</option><option value="saved">saved</option><option value="live">live (à venir)</option>
                    </select></div>
                  <div><label>badge</label>
                    <select data-testid="lib-badge" value={e.badge}
                      onChange={(ev) => patchBrick({ badge: ev.target.value })}>
                      <option value="demo">démo</option><option value="real">réel</option><option value="target">cible</option>
                    </select></div>
                </div>
                {/* sourceRef is a universal (top-level) traceability field — make it
                    editable for every kind (was display-only before). */}
                <div className="field"><label>sourceRef (traçabilité — ex: autopilot.py:393-406)</label>
                  <input data-testid="lib-sourceref" value={e.sourceRef ?? ''}
                    placeholder="fichier:lignes ou URL"
                    onChange={(ev) => patchBrick({ sourceRef: ev.target.value === '' ? null : ev.target.value })} /></div>
                {/* wiredStatus — universel (tous kinds), réglage manuel v1 (pas d'oracle auto).
                    Valeur affichée = effective (documented-only par défaut pour une brique
                    importée sans champ). Régler ≠ unset/documented-only lève le brouillard. */}
                <div className="field"><label>🌫️ wiredStatus (vérité de câblage — épistémique, pas qualité)
                    <span className="lib-wired" data-wired={brickWiredStatus(e)} style={{ marginLeft: 6 }}>{brickWiredStatus(e)}</span></label>
                  <select data-testid="lib-wired" value={brickWiredStatus(e)}
                    onChange={(ev) => patchBrick({ wiredStatus: ev.target.value })}>
                    {WIRED_STATUS_VALUES.map((v) => (<option key={v} value={v}>{WIRED_STATUS_LABELS[v]}</option>))}
                  </select>
                  <div className="hint">Sur le canvas : documented-only/unset (avec sourceRef) = corps flouté (« on ne sait pas ») ; broken = teinte danger (« on sait, c'est cassé ») ; wired = net.</div></div>

                {e.kind === 'agent' && (
                  <div data-testid="lib-editor-agent">
                    <div style={{ fontSize: 9, color: '#6366f1', margin: '8px 0 4px', textTransform: 'uppercase', letterSpacing: 1 }}>Champs LLM</div>
                    {LIB_LLM_FIELDS.map(([key, label]) => (
                      <div className="field" key={key}><label>{label}</label>
                        <input data-testid={'lib-' + key} value={e.payload[key] ?? ''}
                          onChange={(ev) => patchBrickPayload({ [key]: ev.target.value })} /></div>
                    ))}
                    <div className="field row">
                      <div><label>temperature</label>
                        <input data-testid="lib-temperature" type="number" step="0.1" value={e.payload.temperature ?? ''}
                          onChange={(ev) => patchBrickPayload({ temperature: ev.target.value === '' ? null : Number(ev.target.value) })} /></div>
                      <div><label>top_p</label>
                        <input data-testid="lib-top_p" type="number" step="0.05" value={e.payload.top_p ?? ''}
                          onChange={(ev) => patchBrickPayload({ top_p: ev.target.value === '' ? null : Number(ev.target.value) })} /></div>
                    </div>
                    <div className="field"><label>max_tokens</label>
                      <input data-testid="lib-max_tokens" type="number" value={e.payload.max_tokens ?? ''}
                        onChange={(ev) => patchBrickPayload({ max_tokens: ev.target.value === '' ? null : Number(ev.target.value) })} /></div>

                    <div style={{ fontSize: 9, color: '#6366f1', margin: '8px 0 4px', textTransform: 'uppercase', letterSpacing: 1 }}>Gouvernance (agent_registry)</div>
                    <div className="field"><label>autonomy_level</label>
                      <input data-testid="lib-autonomy" value={e.payload.autonomy_level ?? ''}
                        placeholder="L0 / L1 / …"
                        onChange={(ev) => patchBrickPayload({ autonomy_level: ev.target.value === '' ? null : ev.target.value })} /></div>
                    <div className="field"><label>permissions (JSON)</label>
                      <textarea data-testid="lib-permissions" rows={5} value={libPermText}
                        onChange={(ev) => setLibPermText(ev.target.value)} /></div>
                    <div className="field"><label>allowed_surfaces (une par ligne)</label>
                      <textarea data-testid="lib-allowed" rows={3} value={(e.payload.allowed_surfaces || []).join('\n')}
                        onChange={(ev) => patchBrickPayload({ allowed_surfaces: ev.target.value.split('\n').map((s) => s.trim()).filter(Boolean) })} /></div>
                    <div className="field"><label>forbidden_surfaces (une par ligne)</label>
                      <textarea data-testid="lib-forbidden" rows={3} value={(e.payload.forbidden_surfaces || []).join('\n')}
                        onChange={(ev) => patchBrickPayload({ forbidden_surfaces: ev.target.value.split('\n').map((s) => s.trim()).filter(Boolean) })} /></div>
                    {/* Direct attach action — same visibility as Chaîne's load button.
                        Attaches this fiche to the selected AGENT node (reuses attachBrickToNode). */}
                    <div style={{ marginTop: 8, borderTop: '1px solid #334155', paddingTop: 8 }}>
                      {selCanvasNode && selCanvasNode.type === 'agent' ? (
                        <button data-testid="lib-attach"
                          onClick={() => { attachBrickToNode(selCanvasNode.id, e.id); setView('canvas'); }}>
                          🔗 Attacher à {selCanvasNode.id}
                        </button>
                      ) : (
                        <span>
                          <button data-testid="lib-attach" disabled
                            title="Sélectionne un nœud agent sur le Canvas, puis reviens ici">
                            🔗 Sélectionne un nœud agent sur le Canvas pour attacher
                          </button>
                          <button className="wm-link" data-testid="lib-attach-goto" style={{ marginLeft: 8 }}
                            onClick={() => setView('canvas')}>→ Canvas</button>
                        </span>
                      )}
                    </div>
                  </div>
                )}

                {e.kind === 'prompt' && (
                  <div data-testid="lib-editor-prompt">
                    <div style={{ fontSize: 9, color: '#6366f1', margin: '8px 0 4px', textTransform: 'uppercase', letterSpacing: 1 }}>Prompt</div>
                    <div className="field"><label>texte du prompt</label>
                      <textarea data-testid="lib-text" rows={8} value={e.payload.text || ''}
                        placeholder="Le prompt réutilisable…"
                        onChange={(ev) => patchBrickPayload({ text: ev.target.value })} /></div>
                    <div className="field"><label>variables (une par ligne — informatif, pas de templating)</label>
                      <textarea data-testid="lib-variables" rows={3} value={(e.payload.variables || []).join('\n')}
                        onChange={(ev) => patchBrickPayload({ variables: ev.target.value.split('\n').map((s) => s.trim()).filter(Boolean) })} /></div>
                    <div className="field row">
                      <div><label>format de sortie</label>
                        <select data-testid="lib-outputFormat" value={e.payload.outputFormat || 'text'}
                          onChange={(ev) => patchBrickPayload({ outputFormat: ev.target.value })}>
                          {PROMPT_FORMATS.map((f) => <option key={f} value={f}>{f}</option>)}
                        </select></div>
                      <div><label>catégorie</label>
                        <input data-testid="lib-category" list="lib-cat-dl" value={e.payload.category || ''}
                          placeholder="routing / analyse / …"
                          onChange={(ev) => patchBrickPayload({ category: ev.target.value })} />
                        <datalist id="lib-cat-dl">{PROMPT_CATEGORIES.map((c) => <option key={c} value={c} />)}</datalist></div>
                    </div>
                    {e.payload.outputFormat === 'json' && (
                      <div className="field"><label>schéma de sortie (JSON libre — stocké, non validé en Passe 2)</label>
                        <textarea data-testid="lib-outputSchema" rows={4} value={e.payload.outputSchema || ''}
                          onChange={(ev) => patchBrickPayload({ outputSchema: ev.target.value || null })} /></div>
                    )}
                    <div className="field row" style={{ alignItems: 'end' }}>
                      <div><label>version</label><input data-testid="lib-version" value={e.payload.version ?? 1} readOnly /></div>
                      <div><button className="ghost" data-testid="lib-version-inc"
                        onClick={() => patchBrickPayload({ version: (e.payload.version || 1) + 1 })}>Incrémenter version</button></div>
                    </div>
                    {/* Direct attach action — same visibility as Chaîne's load button.
                        Attaches this prompt to the selected LLM node (reuses attachPromptToNode,
                        incl. its overwrite confirmation from Passe 2). */}
                    <div style={{ marginTop: 8, borderTop: '1px solid #334155', paddingTop: 8 }}>
                      {selCanvasNode && selCanvasNode.type === 'llm' ? (
                        <button data-testid="lib-attach"
                          onClick={() => { attachPromptToNode(selCanvasNode.id, e.id); setView('canvas'); }}>
                          🔗 Attacher à {selCanvasNode.id}
                        </button>
                      ) : (
                        <span>
                          <button data-testid="lib-attach" disabled
                            title="Sélectionne un nœud llm sur le Canvas, puis reviens ici">
                            🔗 Sélectionne un nœud llm sur le Canvas pour attacher
                          </button>
                          <button className="wm-link" data-testid="lib-attach-goto" style={{ marginLeft: 8 }}
                            onClick={() => setView('canvas')}>→ Canvas</button>
                        </span>
                      )}
                    </div>
                  </div>
                )}

                {e.kind === 'chain' && (
                  <div data-testid="lib-editor-chain">
                    <div style={{ fontSize: 9, color: '#6366f1', margin: '8px 0 4px', textTransform: 'uppercase', letterSpacing: 1 }}>Chaîne (graphe)</div>
                    <div className="field"><label>catégorie</label>
                      <input data-testid="lib-category" list="lib-cat-dl" value={e.payload.category || ''}
                        placeholder="council / routing / …"
                        onChange={(ev) => patchBrickPayload({ category: ev.target.value })} />
                      <datalist id="lib-cat-dl">{CHAIN_CATEGORIES.map((c) => <option key={c} value={c} />)}</datalist></div>
                    <div className="field"><label>tags (séparés par virgule)</label>
                      <input data-testid="lib-tags" value={(e.payload.tags || []).join(', ')}
                        onChange={(ev) => patchBrickPayload({ tags: ev.target.value.split(',').map((s) => s.trim()).filter(Boolean) })} /></div>
                    <div className="field"><label>aperçu graphe (lecture seule)</label>
                      <div className="hint" data-testid="lib-chain-summary">
                        {(e.payload.nodes || []).length} nœud(s) · {(e.payload.edges || []).length} edge(s) · types : {
                          Array.from(new Set((e.payload.nodes || []).map((n) => n.type))).join(', ') || '—'
                        }
                      </div></div>
                    <button data-testid="lib-load-canvas" onClick={() => loadChainToCanvas(e)} style={{ marginTop: 4 }}>📂 Charger sur le canvas</button>
                    <div className="hint">Le graphe s'édite sur le canvas puis se re-sauve via « 💾 chaîne ». Ici : métadonnées seulement.</div>
                  </div>
                )}

                {e.kind === 'oracle' && (() => {
                  const attachable = e.payload.attachableTo || [];
                  const typeOk = selCanvasNode && attachable.includes(selCanvasNode.type);
                  // No self-validation: the selected node's producer must differ from
                  // this Oracle brick. producerRef falls back to the node id.
                  const prodRef = selCanvasNode ? ((selCanvasNode.data && selCanvasNode.data.producerRef) || selCanvasNode.id) : null;
                  const selfValidation = !!selCanvasNode && prodRef === e.id;
                  const canAttach = typeOk && !selfValidation;
                  return (
                  <div data-testid="lib-editor-oracle">
                    <div style={{ fontSize: 9, color: '#6366f1', margin: '8px 0 4px', textTransform: 'uppercase', letterSpacing: 1 }}>Oracle (validateur / gardien)</div>
                    <div className="field"><label>catégorie</label>
                      <input data-testid="lib-category" list="lib-oracle-cat-dl" value={e.payload.category || ''}
                        placeholder="structural / métier / …"
                        onChange={(ev) => patchBrickPayload({ category: ev.target.value })} />
                      <datalist id="lib-oracle-cat-dl">{ORACLE_CATEGORIES.map((c) => <option key={c} value={c} />)}</datalist></div>
                    <div className="field"><label>prompt de validation</label>
                      <textarea data-testid="lib-oracle-prompt" rows={4} value={e.payload.prompt || ''}
                        placeholder='Vérifie la sortie… Réponds en JSON {"verdict":"PASS"|"FAIL","reasoning":"…"}'
                        onChange={(ev) => patchBrickPayload({ prompt: ev.target.value })} /></div>
                    <div className="field"><label>règle métier (ce que l'oracle vérifie)</label>
                      <textarea data-testid="lib-oracle-rule" rows={3} value={e.payload.rule || ''}
                        placeholder="ex: la sortie doit être un JSON valide {intent: string}"
                        onChange={(ev) => patchBrickPayload({ rule: ev.target.value })} /></div>
                    <div className="field row">
                      <div><label>champ verdict</label>
                        <input data-testid="lib-oracle-verdictField" value={e.payload.verdictField || ''}
                          placeholder="verdict"
                          onChange={(ev) => patchBrickPayload({ verdictField: ev.target.value })} /></div>
                      <div><label>valeurs possibles (une par ligne)</label>
                        <textarea data-testid="lib-oracle-expected" rows={2} value={(e.payload.expectedValues || []).join('\n')}
                          onChange={(ev) => patchBrickPayload({ expectedValues: ev.target.value.split('\n').map((s) => s.trim()).filter(Boolean) })} /></div>
                    </div>
                    <div className="field"><label>types de nœuds cibles (gardien de)</label>
                      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', fontSize: 11 }}>
                        {ORACLE_ATTACH_TYPES.map((t) => (
                          <label key={t} className="setting-row" style={{ gap: 4 }}>
                            <input type="checkbox" data-testid={'lib-oracle-attach-' + t}
                              checked={attachable.includes(t)}
                              onChange={(ev) => {
                                const next = ev.target.checked ? [...attachable, t] : attachable.filter((x) => x !== t);
                                patchBrickPayload({ attachableTo: Array.from(new Set(next)) });
                              }} />
                            <span>{t}</span>
                          </label>
                        ))}
                      </div></div>
                    <div className="field row">
                      <div><label>modèle</label>
                        <input data-testid="lib-oracle-model" value={e.payload.model ?? ''}
                          onChange={(ev) => patchBrickPayload({ model: ev.target.value })} /></div>
                      <div><label>temperature</label>
                        <input data-testid="lib-oracle-temperature" type="number" step="0.1" value={e.payload.temperature ?? ''}
                          onChange={(ev) => patchBrickPayload({ temperature: ev.target.value === '' ? null : Number(ev.target.value) })} /></div>
                    </div>
                    {/* Guardian attach — visible & discoverable, like Agent/Prompt/Chaîne.
                        BLOCKED on self-validation (no node can be final authority on its own result). */}
                    <div style={{ marginTop: 8, borderTop: '1px solid #334155', paddingTop: 8 }}>
                      {canAttach ? (
                        <span>
                          <button data-testid="lib-attach"
                            onClick={() => { attachOracleToNode(selCanvasNode.id, e.id); setView('canvas'); }}>
                            🛡️ Attacher comme gardien à {selCanvasNode.id}
                          </button>
                          <div className="hint" data-testid="oracle-crossval" style={{ color: '#6ee7b7', marginTop: 4 }}>
                            ✅ Validation croisée : ce nœud est jugé par un Oracle indépendant.
                          </div>
                        </span>
                      ) : selfValidation ? (
                        <span>
                          <button data-testid="lib-attach" disabled
                            title="Auto-validation interdite">⛔ Auto-validation interdite</button>
                          <div className="hint" data-testid="oracle-selfval-msg" style={{ color: '#fca5a5', marginTop: 4 }}>
                            Un Oracle ne peut pas valider le nœud qui produit sa propre entrée. Attache-le à un nœud
                            DIFFÉRENT, produit par un agent indépendant.
                          </div>
                        </span>
                      ) : (
                        <span>
                          <button data-testid="lib-attach" disabled
                            title={'Sélectionne un nœud compatible (' + attachable.join('/') + ') sur le Canvas'}>
                            🛡️ Sélectionne un nœud {attachable.join('/') || 'compatible'} sur le Canvas pour attacher
                          </button>
                          <button className="wm-link" data-testid="lib-attach-goto" style={{ marginLeft: 8 }}
                            onClick={() => setView('canvas')}>→ Canvas</button>
                        </span>
                      )}
                    </div>
                    <div className="hint">Association seulement (pas d'exécution réelle en Passe 4). Le gardien s'exécutera dans une passe future avec de vrais adapters LLM.</div>
                  </div>
                  );
                })()}

                {e.kind === 'roadmap' && (
                  <div data-testid="lib-editor-roadmap">
                    <div style={{ fontSize: 9, color: '#6366f1', margin: '8px 0 4px', textTransform: 'uppercase', letterSpacing: 1 }}>Roadmap (jalons)</div>
                    <div className="field"><label>catégorie</label>
                      <input data-testid="lib-category" list="lib-roadmap-cat-dl" value={e.payload.category || ''}
                        placeholder="produit / studio / …"
                        onChange={(ev) => patchBrickPayload({ category: ev.target.value })} />
                      <datalist id="lib-roadmap-cat-dl">{ROADMAP_CATEGORIES.map((c) => <option key={c} value={c} />)}</datalist></div>
                    <div className="field">
                      <label>jalons ({(e.payload.milestones || []).length})</label>
                      {(e.payload.milestones || []).length === 0 && <div className="hint">Aucun jalon. Ajoute-en un.</div>}
                      {(e.payload.milestones || []).map((m, idx) => {
                        const goal = libBricks.find((b) => b.kind === 'goal' && b.id === m.goalRef);
                        return (
                          <div key={m.id} data-testid={'ms-' + idx} style={{ border: '1px solid #334155', borderRadius: 6, padding: 8, marginBottom: 8 }}>
                            <div className="field row" style={{ marginBottom: 4 }}>
                              <div><label>titre</label>
                                <input data-testid={'ms-title-' + idx} value={m.title || ''}
                                  onChange={(ev) => updateMilestone(idx, { title: ev.target.value })} /></div>
                              <div><label>statut</label>
                                <select data-testid={'ms-status-' + idx} value={m.status || 'todo'}
                                  onChange={(ev) => updateMilestone(idx, { status: ev.target.value })}>
                                  {MILESTONE_STATUS.map((s) => <option key={s} value={s}>{s}</option>)}
                                </select></div>
                            </div>
                            <div className="field" style={{ marginBottom: 4 }}><label>description</label>
                              <textarea data-testid={'ms-desc-' + idx} rows={2} value={m.description || ''}
                                onChange={(ev) => updateMilestone(idx, { description: ev.target.value })} /></div>
                            {/* Passe 6 — optional Goal attached to this milestone. */}
                            <div className="field" style={{ marginBottom: 4 }}>
                              <label>🎯 objectif (Goal) — optionnel</label>
                              <select data-testid={'ms-goal-' + idx} value={m.goalRef || ''}
                                onChange={(ev) => updateMilestone(idx, { goalRef: ev.target.value || null })}>
                                <option value="">(aucun)</option>
                                {libBricks.filter((b) => b.kind === 'goal').map((b) => (
                                  <option key={b.id} value={b.id}>{b.name}</option>
                                ))}
                              </select>
                              {m.goalRef && <div className="hint" data-testid={'ms-goal-label-' + idx}>🎯 {goal ? goal.name : m.goalRef}</div>}
                            </div>
                            <button className="wm-chip" data-testid={'ms-remove-' + idx} onClick={() => removeMilestone(idx)}>✕ retirer</button>
                          </div>
                        );
                      })}
                      <button data-testid="lib-add-milestone" onClick={addMilestone} style={{ marginTop: 2 }}>＋ Ajouter un jalon</button>
                    </div>
                    <div className="hint">Un jalon peut porter un objectif (Goal). Association métadonnée — pas d'exécution en Passe 5/6.</div>
                  </div>
                )}

                {e.kind === 'goal' && (
                  <div data-testid="lib-editor-goal">
                    <div style={{ fontSize: 9, color: '#6366f1', margin: '8px 0 4px', textTransform: 'uppercase', letterSpacing: 1 }}>Goal (finalité)</div>
                    <div className="field"><label>catégorie</label>
                      <input data-testid="lib-category" list="lib-goal-cat-dl" value={e.payload.category || ''}
                        placeholder="meta / produit / …"
                        onChange={(ev) => patchBrickPayload({ category: ev.target.value })} />
                      <datalist id="lib-goal-cat-dl">{GOAL_CATEGORIES.map((c) => <option key={c} value={c} />)}</datalist></div>
                    <div className="field"><label>texte de la finalité (l'objectif à donner au LLM)</label>
                      <textarea data-testid="lib-goal-text" rows={6} value={e.payload.text || ''}
                        placeholder="ex: Créer une roadmap structurée en jalons à partir du contexte fourni."
                        onChange={(ev) => patchBrickPayload({ text: ev.target.value })} /></div>
                    {/* Attach — large & light: any canvas node (no attachableTo restriction). */}
                    <div style={{ marginTop: 8, borderTop: '1px solid #334155', paddingTop: 8 }}>
                      {selCanvasNode ? (
                        <button data-testid="lib-attach"
                          onClick={() => { attachGoalToNode(selCanvasNode.id, e.id); setView('canvas'); }}>
                          🎯 Attacher comme objectif à {selCanvasNode.id}
                        </button>
                      ) : (
                        <span>
                          <button data-testid="lib-attach" disabled
                            title="Sélectionne n'importe quel nœud sur le Canvas, puis reviens ici">
                            🎯 Sélectionne un nœud sur le Canvas pour attacher
                          </button>
                          <button className="wm-link" data-testid="lib-attach-goto" style={{ marginLeft: 8 }}
                            onClick={() => setView('canvas')}>→ Canvas</button>
                        </span>
                      )}
                    </div>
                    <div className="hint">Un Goal est du texte d'intention (le « pourquoi »), non exécutable. Attachable à tout nœud (data.goalRef, transmis inerte).</div>
                  </div>
                )}

                {e.kind === 'outputformat' && (
                  <div data-testid="lib-editor-outputformat">
                    <div style={{ fontSize: 9, color: '#6366f1', margin: '8px 0 4px', textTransform: 'uppercase', letterSpacing: 1 }}>Sortie attendue (contrat de sortie)</div>
                    <div className="field"><label>modèle de format</label>
                      <select data-testid="lib-of-formatType" value={e.payload.formatType || 'free-text'}
                        onChange={(ev) => {
                          const ft = ev.target.value;
                          const patch = { formatType: ft };
                          // Picking "3-verdicts" seeds the canonical fields (+ a default
                          // description) once, so the template is usable without hand-typing.
                          if (ft === 'structured-verdicts' && (!e.payload.fields || e.payload.fields.length === 0)) {
                            patch.fields = VERDICT_FIELDS_CANON.map((f) => ({ name: f.name, values: [...f.values] }));
                            if (!e.payload.description) patch.description = 'Format canonique imposé à tout worker TCS — confirmé requis par run_chain.py + autopilot.py';
                          }
                          patchBrickPayload(patch);
                        }}>
                        {OUTPUTFORMAT_TYPES.map((t) => <option key={t} value={t}>{OUTPUTFORMAT_TYPE_LABEL[t]}</option>)}
                      </select></div>

                    {(e.payload.formatType || 'free-text') === 'free-text' && (
                      <div className="field"><label>description (prose — ce que l'agent doit produire)</label>
                        <textarea data-testid="lib-of-description" rows={5} value={e.payload.description || ''}
                          placeholder="ex: Un rapport en prose décrivant le résultat, les limites et les étapes de test."
                          onChange={(ev) => patchBrickPayload({ description: ev.target.value })} /></div>
                    )}

                    {e.payload.formatType === 'structured' && (
                      <div>
                        <div className="field row">
                          <div><label>format</label>
                            <select data-testid="lib-of-outputFormat" value={e.payload.outputFormat || 'text'}
                              onChange={(ev) => patchBrickPayload({ outputFormat: ev.target.value })}>
                              {PROMPT_FORMATS.map((f) => <option key={f} value={f}>{f}</option>)}
                            </select></div>
                        </div>
                        <div className="field"><label>schéma (optionnel — libre, stocké non validé)</label>
                          <textarea data-testid="lib-of-schema" rows={4} value={e.payload.outputSchema || ''}
                            placeholder='ex: {"result": "string", "ok": "boolean"}'
                            onChange={(ev) => patchBrickPayload({ outputSchema: ev.target.value || null })} /></div>
                        <div className="field"><label>description (optionnelle)</label>
                          <textarea data-testid="lib-of-description" rows={2} value={e.payload.description || ''}
                            onChange={(ev) => patchBrickPayload({ description: ev.target.value })} /></div>
                      </div>
                    )}

                    {e.payload.formatType === 'structured-verdicts' && (
                      <div data-testid="lib-of-verdicts">
                        <div className="field"><label>description</label>
                          <textarea data-testid="lib-of-description" rows={2} value={e.payload.description || ''}
                            onChange={(ev) => patchBrickPayload({ description: ev.target.value })} /></div>
                        {(e.payload.fields || []).map((f, i) => (
                          <div className="field" key={f.name || i}>
                            <label>{f.name} — valeurs autorisées (une par ligne)</label>
                            <textarea data-testid={'lib-of-field-' + f.name} rows={2} value={(f.values || []).join('\n')}
                              onChange={(ev) => {
                                const values = ev.target.value.split('\n').map((s) => s.trim()).filter(Boolean);
                                const fields = (e.payload.fields || []).map((g, j) => j === i ? { ...g, values } : g);
                                patchBrickPayload({ fields });
                              }} /></div>
                        ))}
                        <div className="hint">Format canonique 3-verdicts imposé par run_chain.py + autopilot.py (cf. UX_STUDIO_MATRICES_AUDIT Volet 3).</div>
                      </div>
                    )}

                    <div className="field"><label>aperçu (texte appliqué au satellite)</label>
                      <textarea data-testid="lib-of-preview" rows={3} readOnly value={renderOutputFormat(e.payload)} /></div>

                    {/* Attach — targets a selected "sortie attendue" satellite on the canvas. */}
                    <div style={{ marginTop: 8, borderTop: '1px solid #334155', paddingTop: 8 }}>
                      {selCanvasNode && selCanvasNode.type === 'agent-component' && selCanvasNode.data.componentType === 'sortieAttendue' ? (
                        <button data-testid="lib-attach"
                          onClick={() => { applyOutputFormatToComponent(selCanvasNode.id, e.id); setView('canvas'); }}>
                          📤 Appliquer au satellite {selCanvasNode.id}
                        </button>
                      ) : (
                        <span>
                          <button data-testid="lib-attach" disabled
                            title="Sélectionne le satellite « sortie attendue » d'un agent sur le Canvas, puis reviens ici">
                            📤 Sélectionne un satellite « sortie attendue » pour appliquer
                          </button>
                          <button className="wm-link" data-testid="lib-attach-goto" style={{ marginLeft: 8 }}
                            onClick={() => setView('canvas')}>→ Canvas</button>
                        </span>
                      )}
                    </div>
                    <div className="hint">Contrat de SORTIE attaché au 8ᵉ satellite « sortie attendue » — compose la section « Format de sortie attendu » du prompt de l'agent.</div>
                  </div>
                )}

                {/* ---- Passe A : router / tool / note / artefact editors ---- */}
                {e.kind === 'router' && (
                  <div data-testid="lib-editor-router">
                    <div style={{ fontSize: 9, color: '#6366f1', margin: '8px 0 4px', textTransform: 'uppercase', letterSpacing: 1 }}>Router (aiguillage)</div>
                    <div className="field"><label>path (source du routeKey)</label>
                      <input data-testid="lib-router-path" value={e.payload.path || ''}
                        placeholder="ex: nodes.node-analyzer.intent"
                        onChange={(ev) => patchBrickPayload({ path: ev.target.value })} /></div>
                    <div className="field"><label>defaultRoute (repli si path non résolu)</label>
                      <input data-testid="lib-router-defaultRoute" value={e.payload.defaultRoute || ''}
                        placeholder="ex: chat"
                        onChange={(ev) => patchBrickPayload({ defaultRoute: ev.target.value })} /></div>
                    <div style={{ marginTop: 8, borderTop: '1px solid #334155', paddingTop: 8 }}>
                      {selCanvasNode && selCanvasNode.type === 'router' ? (
                        <button data-testid="lib-attach"
                          onClick={() => { attachBrickToNode(selCanvasNode.id, e.id); setView('canvas'); }}>
                          🔀 Attacher à {selCanvasNode.id}
                        </button>
                      ) : (
                        <span>
                          <button data-testid="lib-attach" disabled
                            title="Sélectionne un nœud router sur le Canvas, puis reviens ici">
                            🔀 Sélectionne un nœud router sur le Canvas pour attacher
                          </button>
                          <button className="wm-link" data-testid="lib-attach-goto" style={{ marginLeft: 8 }}
                            onClick={() => setView('canvas')}>→ Canvas</button>
                        </span>
                      )}
                    </div>
                    <div className="hint">path + defaultRoute — mêmes champs que le nœud router du canvas (data.path / data.defaultRoute).</div>
                  </div>
                )}

                {e.kind === 'tool' && (
                  <div data-testid="lib-editor-tool">
                    <div style={{ fontSize: 9, color: '#6366f1', margin: '8px 0 4px', textTransform: 'uppercase', letterSpacing: 1 }}>Tool (outil)</div>
                    <div className="field"><label>name (identifiant de l'outil)</label>
                      <input data-testid="lib-tool-name" value={e.payload.name || ''}
                        placeholder="ex: search"
                        onChange={(ev) => patchBrickPayload({ name: ev.target.value })} /></div>
                    <div className="field"><label>description</label>
                      <textarea data-testid="lib-tool-description" rows={4} value={e.payload.description || ''}
                        placeholder="ex: Recherche web renvoyant des extraits."
                        onChange={(ev) => patchBrickPayload({ description: ev.target.value })} /></div>
                    <div style={{ marginTop: 8, borderTop: '1px solid #334155', paddingTop: 8 }}>
                      {selCanvasNode && selCanvasNode.type === 'tool' ? (
                        <button data-testid="lib-attach"
                          onClick={() => { attachBrickToNode(selCanvasNode.id, e.id); setView('canvas'); }}>
                          🔧 Attacher à {selCanvasNode.id}
                        </button>
                      ) : (
                        <span>
                          <button data-testid="lib-attach" disabled
                            title="Sélectionne un nœud tool sur le Canvas, puis reviens ici">
                            🔧 Sélectionne un nœud tool sur le Canvas pour attacher
                          </button>
                          <button className="wm-link" data-testid="lib-attach-goto" style={{ marginLeft: 8 }}
                            onClick={() => setView('canvas')}>→ Canvas</button>
                        </span>
                      )}
                    </div>
                    <div className="hint">name + description — mêmes champs que le nœud tool du canvas (data.name / data.description).</div>
                  </div>
                )}

                {e.kind === 'note' && (
                  <div data-testid="lib-editor-note">
                    <div style={{ fontSize: 9, color: '#6366f1', margin: '8px 0 4px', textTransform: 'uppercase', letterSpacing: 1 }}>Note (annotation)</div>
                    <div className="field"><label>titre</label>
                      <input data-testid="lib-note-title" value={e.payload.title || ''}
                        placeholder="Note"
                        onChange={(ev) => patchBrickPayload({ title: ev.target.value })} /></div>
                    <div className="field"><label>texte (annotation libre — hors moteur)</label>
                      <textarea data-testid="lib-note-text" rows={5} value={e.payload.text || ''}
                        placeholder="Contenu libre, ignoré par le moteur."
                        onChange={(ev) => patchBrickPayload({ text: ev.target.value })} /></div>
                    <div style={{ marginTop: 8, borderTop: '1px solid #334155', paddingTop: 8 }}>
                      {selCanvasNode && selCanvasNode.type === 'note' ? (
                        <button data-testid="lib-attach"
                          onClick={() => { attachBrickToNode(selCanvasNode.id, e.id); setView('canvas'); }}>
                          📝 Attacher à {selCanvasNode.id}
                        </button>
                      ) : (
                        <span>
                          <button data-testid="lib-attach" disabled
                            title="Sélectionne un nœud note sur le Canvas, puis reviens ici">
                            📝 Sélectionne un nœud note sur le Canvas pour attacher
                          </button>
                          <button className="wm-link" data-testid="lib-attach-goto" style={{ marginLeft: 8 }}
                            onClick={() => setView('canvas')}>→ Canvas</button>
                        </span>
                      )}
                    </div>
                    <div className="hint">Non exécutable : une Note est exclue de toEngineGraph (le moteur ne la voit jamais). Son statut de brique n'y change rien.</div>
                  </div>
                )}

                {e.kind === 'artefact' && (
                  <div data-testid="lib-editor-artefact">
                    <div style={{ fontSize: 9, color: '#6366f1', margin: '8px 0 4px', textTransform: 'uppercase', letterSpacing: 1 }}>Artefact (livrable)</div>
                    <div className="field"><label>titre du livrable</label>
                      <input data-testid="lib-artefact-title" value={e.payload.title || ''}
                        placeholder="ex: Belote v1"
                        onChange={(ev) => patchBrickPayload({ title: ev.target.value })} /></div>
                    <div className="field"><label>description</label>
                      <textarea data-testid="lib-artefact-description" rows={3} value={e.payload.description || ''}
                        onChange={(ev) => patchBrickPayload({ description: ev.target.value })} /></div>
                    <div className="field"><label>type d'artefact</label>
                      <select data-testid="lib-artefact-type" value={e.payload.artefactType || 'logiciel'}
                        onChange={(ev) => patchBrickPayload({ artefactType: ev.target.value })}>
                        {ARTEFACT_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
                      </select></div>
                    <div style={{ marginTop: 8, borderTop: '1px solid #334155', paddingTop: 8 }}>
                      {selCanvasNode && selCanvasNode.type === 'artefact' ? (
                        <button data-testid="lib-attach"
                          onClick={() => { attachBrickToNode(selCanvasNode.id, e.id); setView('canvas'); }}>
                          🎁 Attacher à {selCanvasNode.id}
                        </button>
                      ) : (
                        <span>
                          <button data-testid="lib-attach" disabled
                            title="Sélectionne un nœud artefact sur le Canvas, puis reviens ici">
                            🎁 Sélectionne un nœud artefact sur le Canvas pour attacher
                          </button>
                          <button className="wm-link" data-testid="lib-attach-goto" style={{ marginLeft: 8 }}
                            onClick={() => setView('canvas')}>→ Canvas</button>
                        </span>
                      )}
                    </div>
                    <div className="hint">Livrable final (logiciel, document, jeu — Belote/Chess/TCG —, fichier, autre). Non exécutable : exclu de toEngineGraph, comme une Note.</div>
                  </div>
                )}

                {/* F2 — notes libre, commun à TOUS les kinds (plus seulement Agent). Contexte,
                    routage, incohérences signalées… hors des champs structurés. Persisté dans
                    payload.notes quel que soit le kind (le moteur ignore cette clé). */}
                <div className="field" style={{ marginTop: 8, borderTop: '1px solid #334155', paddingTop: 8 }}>
                  <label>notes (libre — contexte, routage, incohérences signalées…)</label>
                  <textarea data-testid="lib-notes" rows={4} value={e.payload.notes ?? ''}
                    placeholder="Infos complémentaires, hors des champs structurés"
                    onChange={(ev) => patchBrickPayload({ notes: ev.target.value })} />
                </div>
                <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
                  <button data-testid="lib-save" onClick={saveBrick}>Sauvegarder</button>
                  <button className="ghost" data-testid="lib-duplicate" onClick={() => duplicateBrick(e.id)}>Dupliquer</button>
                  <button className="danger" data-testid="lib-delete" onClick={() => deleteBrick(e.id)} style={{ marginLeft: 'auto' }}>Supprimer</button>
                </div>
                <div className="hint">Exécution réelle : coche « réel (LM Studio) » dans la barre du haut avant Exécuter (LM Studio local :1234). Décoché = mockAdapters.</div>
              </div>
            )}
          </div>
        );
      }

      // ---- Wire Map panel renderer ----
      function renderWireMap() {
        // Wire Map = software roadmap / patch-note journal. It reads ONLY the
        // project's own entries — never the canvas (nodes). No NON MAPPÉ rows.
        const entries = wm ? wm.entries : [];
        const StatusBadge = (t) => (
          <span className="wm-badge" data-testid="wm-badge" style={{ background: colorHex(t.color) }}>{t.status}</span>
        );
        return (
          <div className="wm" data-testid="wiremap">
            <div className="wm-bar">
              <span style={{ color: '#6366f1' }}>Projet :</span>
              <select data-testid="wm-project-select" value={wmId || ''}
                onChange={(e) => loadWmProject(e.target.value)}>
                {wmProjects.length === 0 && <option value="">(aucun)</option>}
                {wmProjects.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
              <button data-testid="wm-new-project" onClick={() => setWmNewOpen(true)}>＋ Nouveau projet</button>
              <button data-testid="wm-add-entry" onClick={() => addWmEntry()}>＋ Ajouter entrée</button>
              <button className="ghost" data-testid="wm-audit" onClick={runAudit} style={{ marginLeft: 'auto' }}>Audit</button>
            </div>

            {!wm && <div className="empty">Aucun projet chargé. Crée-en un ou sélectionne-le.</div>}

            {wm && (
              <div className="wm-scroll" data-testid="wm-scroll">
                <table className="wm-t">
                  <thead>
                    <tr>
                      <th>#</th><th className="wm-col-node">Nœud</th><th>Statut</th><th>Couleur</th><th>H?</th><th></th>
                    </tr>
                  </thead>
                  <tbody>
                    {entries.map((e) => {
                      // Detail is open by default for entries with no test associated
                      // ("non mappé au test"); explicit toggle overrides that.
                      const defaultOpen = !e.test.file && !e.test.description;
                      const exp = (e.id in wmExpanded) ? wmExpanded[e.id] : defaultOpen;
                      const toggle = () => setWmExpanded((prev) => ({ ...prev, [e.id]: !exp }));
                      return (
                        <React.Fragment key={e.id}>
                          <tr data-testid="wm-row" data-entry-id={e.id} data-node-id={e.nodeId}>
                            <td><input type="number" style={{ width: 40 }} value={e.order}
                              onChange={(ev) => updateEntry(e.id, { order: Number(ev.target.value) })} /></td>
                            {/* Correction 2 — plain read-only node reference (no canvas selection). */}
                            <td className="wm-col-node">
                              <span className="wm-node-name" data-testid="wm-node" title={e.nodeId || e.label}>
                                {e.nodeId || e.label || '—'}
                              </span>
                            </td>
                            <td>
                              {StatusBadge(e.test)}{' '}
                              <select data-testid={'wm-status-' + e.id} value={e.test.status}
                                onChange={(ev) => setEntryStatus(e.id, ev.target.value)}>
                                {WM_STATUS_LIST.map((s) => <option key={s} value={s}>{s}</option>)}
                              </select>
                            </td>
                            {/* Correction 4 — closed 3-choice colour (traffic light) with pastille. */}
                            <td>
                              <div className="wm-color-cell">
                                <span className="wm-pastille" data-testid={'wm-pastille-' + e.id} style={{ background: colorHex(e.test.color) }} />
                                <select className="wm-color-select" data-testid={'wm-color-' + e.id} value={normColor(e.test.color)}
                                  style={{ borderColor: colorHex(e.test.color) }}
                                  onChange={(ev) => updateEntryTest(e.id, { color: ev.target.value })}>
                                  {WM_COLOR_LIST.map((c) => <option key={c} value={c}>{WM_COLOR_LABEL[c]}</option>)}
                                </select>
                              </div>
                            </td>
                            <td style={{ textAlign: 'center' }}><input type="checkbox" data-testid={'wm-human-' + e.id} checked={!!e.humanRequired}
                              onChange={(ev) => updateEntry(e.id, { humanRequired: ev.target.checked })} /></td>
                            <td><button className="wm-expand-btn" data-testid={'wm-expand-' + e.id} onClick={toggle}>{exp ? '▾' : '▸'} Détails</button></td>
                          </tr>
                          {exp && (
                            <tr className="wm-detail" data-testid="wm-detail" data-entry-id={e.id}>
                              <td colSpan={6}>
                                <div className="wm-detail-grid">
                                  <div className="wm-f"><label>Nœud / nom de la fonctionnalité</label>
                                    <input data-testid={'wm-name-' + e.id} value={e.nodeId || ''}
                                      placeholder="ex: scheduler, view-selector, library-store"
                                      onChange={(ev) => updateEntry(e.id, { nodeId: ev.target.value })} /></div>
                                  <div className="wm-f"><label>Fonction</label>
                                    <input value={e.function || ''} onChange={(ev) => updateEntry(e.id, { function: ev.target.value })} /></div>
                                  <div className="wm-f"><label>Commande</label>
                                    <input value={e.command || ''} onChange={(ev) => updateEntry(e.id, { command: ev.target.value })} /></div>
                                  <div className="wm-f full"><label>Fichiers / Lignes</label>
                                    <div>
                                      {(e.files || []).map((f, i) => (
                                        <span key={i} className="wm-chip" data-testid="wm-file-chip"
                                          onClick={() => openViewer(f.path, f.lines && f.lines[0], f.lines && f.lines[1])}>
                                          {f.path}:{f.lines ? f.lines[0] + '-' + f.lines[1] : '?'}
                                        </span>
                                      ))}
                                      <FileAdder onAdd={(path, from, to) => updateEntry(e.id, { files: [...(e.files || []), { path, lines: [from, to] }] })} files={wmFiles} />
                                    </div>
                                  </div>
                                  <div className="wm-f"><label>Test — description</label>
                                    <input value={e.test.description || ''} onChange={(ev) => updateEntryTest(e.id, { description: ev.target.value })} /></div>
                                  <div className="wm-f"><label>Test — fichier:ligne</label>
                                    <div style={{ display: 'flex', gap: 4 }}>
                                      <input value={e.test.file || ''} onChange={(ev) => updateEntryTest(e.id, { file: ev.target.value })} />
                                      <input type="number" style={{ width: 54 }} value={e.test.line || 0} onChange={(ev) => updateEntryTest(e.id, { line: Number(ev.target.value) })} />
                                    </div></div>
                                  <div className="wm-f"><label>IMP</label>
                                    <input value={e.impRef || ''} onChange={(ev) => updateEntry(e.id, { impRef: ev.target.value || null })} /></div>
                                  <div className="wm-f"><label>Notes</label>
                                    <input value={e.notes || ''} onChange={(ev) => updateEntry(e.id, { notes: ev.target.value })} /></div>
                                  <div className="wm-f full"><button className="danger" style={{ padding: '3px 8px' }} onClick={() => deleteEntry(e.id)}>✕ Supprimer l'entrée</button></div>
                                </div>
                              </td>
                            </tr>
                          )}
                        </React.Fragment>
                      );
                    })}
                    {entries.length === 0 && (
                      <tr data-testid="wm-empty-row"><td colSpan={6} className="wm-unmapped" style={{ padding: 12 }}>
                        Aucune entrée. Clique « ＋ Ajouter entrée » pour documenter une fonctionnalité logicielle construite.
                      </td></tr>
                    )}
                  </tbody>
                </table>
              </div>
            )}

            {wmAudit && (
              <div className="wm-audit" data-testid="wm-audit-report">
                <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                  <b style={{ color: '#6366f1' }}>Rapport d'audit</b>
                  <button className="ghost" onClick={() => setWmAudit(null)}>fermer</button>
                </div>
                <pre>{wmAudit}</pre>
              </div>
            )}

            {wmNewOpen && (
              <div className="wm-modal" onMouseDown={() => setWmNewOpen(false)}>
                <div className="box" onMouseDown={(e) => e.stopPropagation()}>
                  <h3 style={{ color: '#6366f1', marginBottom: 10 }}>Nouveau projet Wire Map</h3>
                  <div className="field"><label>nom</label><input data-testid="wm-new-name" id="wm-new-name" placeholder="Mon Projet" /></div>
                  <div className="field"><label>repo root</label><input data-testid="wm-new-root" id="wm-new-root" defaultValue="C:/TACTICAL_CHESS_STUDIO/llm-lego" /></div>
                  <div className="field"><label>roadmap ref (optionnel)</label><input data-testid="wm-new-roadmap" id="wm-new-roadmap" placeholder="IMPROVEMENT_LEDGER.yaml" /></div>
                  <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
