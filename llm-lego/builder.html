      // Derived-prompt engine (per-canvas): keep each COMPOSITE agent's data.prompt (+ model)
      // in sync with its 7 satellites. Runs on every nodes change; rewrites only on real diff.
      useEffect(() => {
        setNodes((ns) => {
          let changed = false;
          const next = ns.map((n) => {
            if (n.type !== 'agent') return n;
            if (!agentComponentsOf(n.id, ns).length) return n;      // legacy agent
            if (n.data && n.data.promptManual) return n;            // diverged — user owns it
            const { prompt, model } = composeAgentPrompt(n.id, ns);
            const curPrompt = n.data ? String(n.data.prompt || '') : '';
            const nextModel = model || (n.data ? n.data.model : undefined);
            if (curPrompt === prompt && (n.data ? n.data.model : undefined) === nextModel) return n;
            changed = true;
            const data = { ...n.data, prompt };
            if (model) data.model = model;                          // modele component → technical model field
            return { ...n, data };
          });
          return changed ? next : ns;
        });
      }, [nodes]);

      return { nodes, setNodes, edges, setEdges, sel, setSel, selNode, selEdge, drag, setDrag,
        draw, setDraw, resizing, setResizing, dragMid, setDragMid, canvasW, setCanvasW, canvasH,
        setCanvasH, selectedIds, setSelectedIds, marquee, setMarquee, titleEdit, setTitleEdit,
        importChooser, setImportChooser, zoom, setZoom, panning, setPanning, spacePan, setSpacePan,
        canvasRef, spaceRef, pendingScroll };
    }

    // ============================================================================
    // CanvasSurface — the ONE canvas component. All pointer/zoom/pan interaction + the
    // SVG/nodes render live here, driven by the `cv` model prop. Rendered once per zone.
    // Props: cv (model), snap (grid setting), idSeq (SHARED id counter so ids are unique
    // across zones), result/paused (run state — ACTIVE only; Sandbox gets null so it never
    // shows execution), isSandbox/label (presentation), onActivate (focus this zone).
    // ============================================================================
    function CanvasSurface({ cv, snap, idSeq, result, paused, isSandbox, label, onActivate, readOnly, roBanner }) {
      // Calques : quand ≥2 calques sont superposés sur l'Actif, le canvas passe en
      // LECTURE SEULE (on regarde un delta, on ne l'édite pas). Ref = pas de closure périmée.
      const roRef = useRef(false); roRef.current = !!readOnly;
      const {
        nodes, setNodes, edges, setEdges, sel, setSel, selNode, selEdge, drag, setDrag,
        draw, setDraw, resizing, setResizing, dragMid, setDragMid, canvasW, setCanvasW,
        canvasH, setCanvasH, selectedIds, setSelectedIds, marquee, setMarquee, titleEdit,
        setTitleEdit, zoom, setZoom, panning, setPanning, spacePan, setSpacePan,
        canvasRef, spaceRef, pendingScroll,
      } = cv;
      const GRID = 24; // matches the canvas background grid
      const snapTo = useCallback((v) => (snap ? Math.round(v / GRID) * GRID : v), [snap]);
      const ZOOM_MIN = 0.3, ZOOM_MAX = 2.5;
      const clampZoom = (z) => Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
      const zoomAt = useCallback((factor, cx, cy) => {
        const el = canvasRef.current; if (!el) return;
        setZoom((z) => {
          const nz = clampZoom(z * factor);
          if (nz === z) return z;
          const wx = (el.scrollLeft + cx) / z, wy = (el.scrollTop + cy) / z; // world point under cursor
          pendingScroll.current = { l: wx * nz - cx, t: wy * nz - cy };       // keep it under cursor after
          return nz;
        });
      }, []);
      const zoomBy = useCallback((factor) => {
        const el = canvasRef.current; if (!el) return;
        zoomAt(factor, el.clientWidth / 2, el.clientHeight / 2); // buttons zoom around the viewport centre
      }, [zoomAt]);
      const resetZoom = useCallback(() => {
        setZoom(() => { pendingScroll.current = { l: 0, t: 0 }; return 1; });
      }, []);
      useLayoutEffect(() => {
        if (pendingScroll.current && canvasRef.current) {
          canvasRef.current.scrollLeft = pendingScroll.current.l;
          canvasRef.current.scrollTop = pendingScroll.current.t;
          pendingScroll.current = null;
        }
      }, [zoom]);

      const toCanvas = useCallback((clientX, clientY) => {
        const el = canvasRef.current;
        const r = el.getBoundingClientRect();
        return { x: (clientX - r.left + el.scrollLeft) / zoom, y: (clientY - r.top + el.scrollTop) / zoom };
      }, [zoom]);

      const startDrag = useCallback((e, id) => {
        e.stopPropagation();
        if (roRef.current) return; // lecture seule (calques superposés) — aucun déplacement
        if (e.shiftKey || e.ctrlKey || e.metaKey) {
          setSelectedIds((cur) => cur.includes(id) ? cur.filter((x) => x !== id) : [...cur, id]);
          setSel({ kind: 'node', id });
          return;
        }
        const inGroup = selectedIds.includes(id) && selectedIds.length > 1;
        const ids = inGroup ? selectedIds : [id];
        if (!inGroup) setSelectedIds([id]);
        const p = toCanvas(e.clientX, e.clientY);
        const orig = {};
        ids.forEach((nid) => { const nn = nodes.find((x) => x.id === nid); if (nn) orig[nid] = { x: nn.x, y: nn.y }; });
        setDrag({ ids, startX: p.x, startY: p.y, orig });
        setSel({ kind: 'node', id });
      }, [nodes, selectedIds, toCanvas]);

      const startDraw = useCallback((e, fromId, fromHandle) => {
        e.stopPropagation();
        if (roRef.current) return; // lecture seule (calques) — pas de nouveau lien
        const p = toCanvas(e.clientX, e.clientY);
        setDraw({ from: fromId, fromHandle, x: p.x, y: p.y });
      }, [toCanvas]);

      const startResize = useCallback((e, id) => {
        e.stopPropagation();
        if (roRef.current) return; // lecture seule (calques) — pas de redimensionnement
        const n = nodes.find((x) => x.id === id);
        const d = dimsOf(n);
        const p = toCanvas(e.clientX, e.clientY);
        setResizing({ id, ox: p.x, oy: p.y, ow: d.w, oh: d.h });
        setSel({ kind: 'node', id });
      }, [nodes, toCanvas]);

      const startMid = useCallback((e, edgeId) => {
        e.stopPropagation();
        setDragMid(edgeId);
        setSel({ kind: 'edge', id: edgeId });
      }, []);

      const onCanvasMove = useCallback((e) => {
        if (panning) {
          const el = canvasRef.current;
          el.scrollLeft = panning.sl - (e.clientX - panning.sx);
          el.scrollTop = panning.st - (e.clientY - panning.sy);
          return;
        }
        if (resizing) {
          const p = toCanvas(e.clientX, e.clientY);
          const w = snapTo(Math.max(MIN_W, resizing.ow + (p.x - resizing.ox)));
          const h = snapTo(Math.max(MIN_H, resizing.oh + (p.y - resizing.oy)));
          setNodes((ns) => ns.map((n) => n.id === resizing.id ? { ...n, width: w, height: h } : n));
        } else if (dragMid) {
          const p = toCanvas(e.clientX, e.clientY);
          setEdges((es) => es.map((ed) => ed.id === dragMid ? { ...ed, controlPoint: { x: p.x, y: p.y } } : ed));
        } else if (drag) {
          const p = toCanvas(e.clientX, e.clientY);
          const ddx = p.x - drag.startX, ddy = p.y - drag.startY;
          setNodes((ns) => ns.map((n) => drag.orig[n.id]
            ? { ...n, x: snapTo(Math.max(0, drag.orig[n.id].x + ddx)), y: snapTo(Math.max(0, drag.orig[n.id].y + ddy)) }
            : n));
        } else if (marquee) {
          const p = toCanvas(e.clientX, e.clientY);
          setMarquee((m) => ({ ...m, x1: p.x, y1: p.y }));
        } else if (draw) {
          const p = toCanvas(e.clientX, e.clientY);
          setDraw((d) => ({ ...d, x: p.x, y: p.y }));
        }
      }, [panning, drag, draw, resizing, dragMid, marquee, toCanvas, snapTo]);

      const finishDrawOn = useCallback((toId, toHandle) => {
        setDraw((d) => {
          if (d && d.from && toId && d.from !== toId) {
            const id = `edge-${idSeq.current++}`;
            setEdges((es) => [...es, { id, from: d.from, to: toId, fromHandle: d.fromHandle, toHandle, condition: '' }]);
            setSel({ kind: 'edge', id });
          }
          return null;
        });
      }, [idSeq]);

      const endInteraction = useCallback(() => {
        if (marquee) {
          const rx0 = Math.min(marquee.x0, marquee.x1), ry0 = Math.min(marquee.y0, marquee.y1);
          const rx1 = Math.max(marquee.x0, marquee.x1), ry1 = Math.max(marquee.y0, marquee.y1);
          const moved = (rx1 - rx0) > 3 || (ry1 - ry0) > 3;
          if (moved) {
            const hit = nodes.filter((n) => { const d = dimsOf(n); return n.x < rx1 && n.x + d.w > rx0 && n.y < ry1 && n.y + d.h > ry0; }).map((n) => n.id);
            setSelectedIds(hit);
            setSel(hit.length === 1 ? { kind: 'node', id: hit[0] } : null);
          } else {
            setSelectedIds([]); setSel(null);
          }
          setMarquee(null);
        }
        setDrag(null); setDraw(null); setResizing(null); setDragMid(null); setPanning(null);
      }, [marquee, nodes]);
      const onCanvasUp = endInteraction;

      useEffect(() => {
        window.addEventListener('mouseup', endInteraction);
        return () => window.removeEventListener('mouseup', endInteraction);
      }, [endInteraction]);

      // Ctrl/Cmd + wheel = zoom (zoom-to-cursor); plain wheel = scroll (unchanged).
      useEffect(() => {
        const el = canvasRef.current; if (!el) return undefined;
        const onWheel = (e) => {
          if (!(e.ctrlKey || e.metaKey)) return;
          e.preventDefault();
          const r = el.getBoundingClientRect();
          zoomAt(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX - r.left, e.clientY - r.top);
        };
        el.addEventListener('wheel', onWheel, { passive: false });
        return () => el.removeEventListener('wheel', onWheel);
      }, [zoomAt]);

      // Hold Space to arm panning; ignored while typing in a field.
      useEffect(() => {
        const isTyping = () => {
          const a = document.activeElement;
          return !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable);
        };
        const down = (e) => {
          if (e.code === 'Space' && !isTyping()) { if (!spaceRef.current) { spaceRef.current = true; setSpacePan(true); } e.preventDefault(); }
        };
        const up = (e) => { if (e.code === 'Space') { spaceRef.current = false; setSpacePan(false); } };
        window.addEventListener('keydown', down);
        window.addEventListener('keyup', up);
        return () => { window.removeEventListener('keydown', down); window.removeEventListener('keyup', up); };
      }, []);

      // Track canvas size so we can flag handles that fall at the canvas edge (6a).
      useEffect(() => {
        const measure = () => { if (canvasRef.current) { setCanvasW(canvasRef.current.clientWidth); setCanvasH(canvasRef.current.clientHeight); } };
        measure();
        window.addEventListener('resize', measure);
        return () => window.removeEventListener('resize', measure);
      }, []);

      const setNoteText = (id, text) => patchNodeData(setNodes, id, { text });
      const setNoteTitle = (id, title) => patchNodeData(setNodes, id, { title });

      // ----- execution-order numbering (ACTIVE only — Sandbox result is null) -----
      const nodeOrders = {}; // nodeId -> [step numbers]
      const edgeOrders = {}; // edgeId -> [move numbers]
      if (result && result.trace) {
        result.trace.forEach((s, i) => {
          (nodeOrders[s.nodeId] = nodeOrders[s.nodeId] || []).push(i + 1);
        });
        for (let i = 0; i < result.trace.length - 1; i++) {
          const fromId = result.trace[i].nodeId, toId = result.trace[i + 1].nodeId;
          const e = edges.find((ed) => ed.from === fromId && ed.to === toId);
          if (e) (edgeOrders[e.id] = edgeOrders[e.id] || []).push(i + 1);
        }
      }

      const nodeById = (id) => nodes.find((n) => n.id === id);
      function anchorsFor(e) {
        const a = nodeById(e.from), b = nodeById(e.to);
        if (!a || !b) return null;
        const fromSide = e.fromHandle || (e.loop ? 'bottom' : 'right');
        const toSide = e.toHandle || (e.loop ? 'bottom' : 'left');
        const p1 = portFor(a, fromSide), p2 = portFor(b, toSide);
        if (e.controlPoint && typeof e.controlPoint.x === 'number') {
          const cp = e.controlPoint;
          const path = `M ${p1.x} ${p1.y} Q ${cp.x} ${cp.y}, ${p2.x} ${p2.y}`;
          const mid = { x: 0.25 * p1.x + 0.5 * cp.x + 0.25 * p2.x, y: 0.25 * p1.y + 0.5 * cp.y + 0.25 * p2.y };
          return { path, mid };
        }
        const d1 = dirFor(fromSide), d2 = dirFor(toSide);
        const off = e.loop ? 90 : Math.max(50, Math.hypot(p2.x - p1.x, p2.y - p1.y) / 2);
        const c1 = { x: p1.x + d1.x * off, y: p1.y + d1.y * off };
        const c2 = { x: p2.x + d2.x * off, y: p2.y + d2.y * off };
        const path = `M ${p1.x} ${p1.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${p2.x} ${p2.y}`;
        const mid = {
          x: 0.125 * p1.x + 0.375 * c1.x + 0.375 * c2.x + 0.125 * p2.x,
          y: 0.125 * p1.y + 0.375 * c1.y + 0.375 * c2.y + 0.125 * p2.y,
        };
        return { path, mid };
      }

      const maxRight = Math.max(0, ...nodes.map((n) => n.x + dimsOf(n).w));
      const maxBottom = Math.max(0, ...nodes.map((n) => n.y + dimsOf(n).h));
      const contentW = Math.max(canvasW, maxRight + 200);
      const contentH = Math.max(canvasH, maxBottom + 200);
      const overflowsView = maxRight > canvasW - 6 || maxBottom > canvasH - 6;

      return (
            <div className={'canvas-wrap col' + (isSandbox ? ' is-sandbox' : '')} data-testid={isSandbox ? 'canvas-sandbox' : 'canvas-active'}
              style={{ borderRight: '1px solid #1e293b' }} onMouseDownCapture={onActivate}>
              {label && <div className="zone-tag" data-testid={isSandbox ? 'zone-tag-sandbox' : 'zone-tag-active'}>{label}</div>}
              {readOnly && <div className="layers-ro-banner" data-testid="layers-readonly">🔒 {roBanner || 'Calques superposés — lecture seule'}</div>}
              <div className={'canvas' + (panning ? ' panning' : (spacePan ? ' space-pan' : ''))} ref={canvasRef}
                onMouseMove={onCanvasMove} onMouseUp={onCanvasUp}
                onMouseDown={(e) => {
                  // Space held (or middle button) → pan the view instead of starting a marquee.
                  if (spaceRef.current || e.button === 1) {
                    e.preventDefault();
                    const el = canvasRef.current;
                    setPanning({ sx: e.clientX, sy: e.clientY, sl: el.scrollLeft, st: el.scrollTop });
                    return;
                  }
                  const p = toCanvas(e.clientX, e.clientY); setSel(null); setMarquee({ x0: p.x, y0: p.y, x1: p.x, y1: p.y });
                }}>
                {/* .world = scroll extent (contentW*zoom); .world-scale = svg+nodes at 1:1, CSS-scaled. */}
                <div className="world" style={{ width: contentW * zoom, height: contentH * zoom }}>
                <div className="world-scale" data-testid="world-scale" data-zoom={zoom}
                  style={{ width: contentW, height: contentH, transform: 'scale(' + zoom + ')' }}>
                <svg className="edges" style={{ width: contentW, height: contentH }}>
                  <defs>
                    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
                      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1" />
                    </marker>
                    <marker id="arrow-loop" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
                      <path d="M0,0 L8,3 L0,6 Z" fill="#fbbf24" />
                    </marker>
                    <marker id="arrow-flow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
                      <path d="M0,0 L8,3 L0,6 Z" fill="#34d399" />
                    </marker>
                  </defs>
                  {edges.map((e) => {
                    const an = anchorsFor(e);
                    if (!an) return null;
                    const selected = selEdge && selEdge.id === e.id;
                    const orders = edgeOrders[e.id];       // moves that traversed this edge
                    const flowed = orders && orders.length > 0;
                    const stroke = flowed ? '#34d399' : (e.loop ? '#fbbf24' : (selected ? '#c4b5fd' : '#6366f1'));
                    const lineW = selected ? 3.5 : (flowed ? 3 : 2);
                    const vstyle = e.visualStyle || 'arrow';
                    const styleClass = vstyle === 'stream' ? 'edge-stream' : '';
                    const styleDash = vstyle === 'chain' ? '7 6'
                      : vstyle === 'stream' ? '10 6'
                      : (e.loop && !flowed ? '6 4' : (e.loop ? '7 3' : undefined)); // arrow = prior behaviour
                    const label = e.loop
                      ? `↻ ${e.condition || '?'}${e.maxIterations ? ' ×' + e.maxIterations : ''}`
                      : e.condition;
                    return (
                      <g key={e.id} style={{ pointerEvents: 'stroke', cursor: 'pointer' }}
                         data-testid="edge" data-edge-id={e.id} data-edge-orders={orders ? orders.join(',') : ''}
                         onMouseDown={(ev) => { ev.stopPropagation(); setSel({ kind: 'edge', id: e.id }); }}>
                        <path className="edge-casing" d={an.path} fill="none" stroke="#0b0f19"
                          strokeWidth={lineW + 6} strokeLinecap="round" />
                        <path className={styleClass} data-edge-style={vstyle} d={an.path} fill="none" stroke={stroke}
                          strokeWidth={lineW} strokeLinecap="round"
                          opacity={selected || flowed ? 1 : 0.82}
                          strokeDasharray={styleDash}
                          markerEnd={flowed ? 'url(#arrow-flow)' : (e.loop ? 'url(#arrow-loop)' : 'url(#arrow)')} />
                        {label && (
                          <text x={an.mid.x} y={an.mid.y - 11} fill={e.loop ? '#fbbf24' : '#94a3b8'} fontSize="10" textAnchor="middle">{label}</text>
                        )}
                        <circle className="mid-handle" data-testid="edge-mid" data-edge-id={e.id}
                          cx={an.mid.x} cy={an.mid.y} r="5"
                          fill={e.controlPoint ? '#c4b5fd' : '#0b0f19'} stroke="#a78bfa" strokeWidth="1.5"
                          style={{ pointerEvents: 'all', cursor: 'grab' }}
                          onMouseDown={(ev) => startMid(ev, e.id)} />
                        {flowed && (
                          <g>
                            <circle cx={an.mid.x + 18} cy={an.mid.y} r="9" fill="#065f46" stroke="#34d399" strokeWidth="1.5" />
                            <text x={an.mid.x + 18} y={an.mid.y + 3} fill="#d1fae5" fontSize="9" textAnchor="middle"
                              fontWeight="bold" data-testid="edge-order">{orders.join('·')}</text>
                          </g>
                        )}
                        {e.attachedBrickRef && (() => {
                          // Badge 📎 sous le point médian = présence d'une brique référencée sur l'edge.
                          const nm = String(e.attachedBrickRef.name || '').slice(0, 18);
                          const w = 22 + nm.length * 6;
                          return (
                            <g data-testid="edge-brick-badge" data-edge-id={e.id} data-brick-id={e.attachedBrickRef.id}
                               style={{ pointerEvents: 'none' }}>
                              <rect x={an.mid.x - w / 2} y={an.mid.y + 9} width={w} height="15" rx="7"
                                fill="#1e1b4b" stroke="#a78bfa" strokeWidth="1" />
                              <text x={an.mid.x} y={an.mid.y + 19.5} fill="#c4b5fd" fontSize="9" textAnchor="middle">📎 {nm}</text>
                            </g>
                          );
                        })()}
                      </g>
                    );
                  })}
                  {draw && (() => {
                    const a = nodeById(draw.from); if (!a) return null;
                    const p1 = portFor(a, draw.fromHandle || 'right');
                    return <path d={`M ${p1.x} ${p1.y} L ${draw.x} ${draw.y}`} stroke="#a78bfa" strokeWidth="2" strokeDasharray="5 4" fill="none" />;
                  })()}
                  {marquee && (() => {
                    const x = Math.min(marquee.x0, marquee.x1), y = Math.min(marquee.y0, marquee.y1);
                    const w = Math.abs(marquee.x1 - marquee.x0), h = Math.abs(marquee.y1 - marquee.y0);
                    return <rect data-testid="marquee" x={x} y={y} width={w} height={h}
                      fill="rgba(129,140,248,0.12)" stroke="#818cf8" strokeWidth="1" strokeDasharray="4 3" />;
                  })()}
                </svg>

                {nodes.map((n) => {
                  const meta = NODE_TYPES[n.type];
                  const selected = (sel && sel.kind === 'node' && sel.id === n.id) || selectedIds.includes(n.id);
                  const d = dimsOf(n);
                  const sizeStyle = { left: n.x, top: n.y, width: d.w,
                    height: typeof n.height === 'number' ? n.height : undefined };
                  const renderHandles = (isNote) => SIDES.map((side) => (
                    <div key={side} className={'handle draggable ' + side}
                      data-handle-node={n.id} data-handle-side={side}
                      {...(isNote ? { 'data-testid': 'note-handle-' + side } : {})}
                      title="glisser pour relier"
                      onMouseDown={(e) => startDraw(e, n.id, side)}
                      onMouseUp={(e) => { if (draw) { e.stopPropagation(); finishDrawOn(n.id, side); } }} />
                  ));
                  const resizeHandle = (
                    <div className="resize-handle" data-testid={'resize-' + n.id}
                      title="redimensionner (min 160×80)" onMouseDown={(e) => startResize(e, n.id)} />
                  );

                  if (n.type === 'note') {
                    const editing = titleEdit && titleEdit.id === n.id;
                    const title = n.data.title || 'Note';
                    return (
                      <div key={n.id} className={'node note' + (selected ? ' selected' : '')}
                        data-testid={'node-' + n.id} data-node-id={n.id} data-node-type="note"
                        style={sizeStyle}
                        onMouseDown={(e) => startDrag(e, n.id)}
                        onMouseUp={() => { if (draw) finishDrawOn(n.id); }}>
                        <div className="nhead">
                          {editing ? (
                            <input className="title-input" data-testid="note-title-input" autoFocus
                              value={titleEdit.value}
                              onMouseDown={(e) => e.stopPropagation()}
                              onFocus={(e) => e.target.select()}
                              onChange={(e) => setTitleEdit({ id: n.id, value: e.target.value })}
                              onBlur={() => { setNoteTitle(n.id, titleEdit.value); setTitleEdit(null); }}
                              onKeyDown={(e) => {
                                if (e.key === 'Enter') { setNoteTitle(n.id, titleEdit.value); setTitleEdit(null); }
                                else if (e.key === 'Escape') { setTitleEdit(null); }
                              }} />
                          ) : (
                            <span data-testid="note-title" style={{ cursor: 'text' }}
                              title="double-clic (ou clic si sélectionné) pour éditer"
                              onMouseDown={(e) => { if (selected) e.stopPropagation(); }}
                              onClick={(e) => { if (selected) { e.stopPropagation(); setTitleEdit({ id: n.id, value: title }); } }}
                              onDoubleClick={(e) => { e.stopPropagation(); setTitleEdit({ id: n.id, value: title }); }}>
                              📝 {title}
                            </span>
                          )}
                          <span className="ntype">NOTE</span>
                        </div>
                        <div style={{ padding: '6px', flex: '1 1 auto', minHeight: 0 }}>
                          <textarea style={{ height: '100%' }} value={n.data.text || ''} onMouseDown={(e) => e.stopPropagation()}
                            onChange={(e) => setNoteText(n.id, e.target.value)} />
                        </div>
                        {renderHandles(true)}
                        {resizeHandle}
                      </div>
                    );
                  }

                  if (n.type === 'agent-component') {
                    const cm = AGENT_COMPONENT_META[n.data.componentType] || { label: n.data.componentType, icon: '🧩' };
                    const filled = componentFilled(n);
                    return (
                      <div key={n.id}
                        className={'node agent-component ' + (filled ? 'comp-filled' : 'comp-empty') + (selected ? ' selected' : '')}
                        data-testid={'node-' + n.id} data-node-id={n.id} data-node-type="agent-component"
                        data-comp-type={n.data.componentType} data-comp-filled={filled ? '1' : '0'}
                        style={sizeStyle}
                        title={cm.label + (filled ? ' — rempli' : ' — vide')}
                        onMouseDown={(e) => startDrag(e, n.id)}
                        onMouseUp={() => { if (draw) finishDrawOn(n.id); }}>
                        <div className="comp-head">
                          <span className="comp-dot" data-testid={'comp-dot-' + n.id}>{filled ? '●' : '○'}</span>
                          <span className="comp-label">{cm.icon} {cm.label}</span>
                        </div>
                        {renderHandles(false)}
                      </div>
                    );
                  }

                  const orders = nodeOrders[n.id];
                  const card = n.type === 'agent' ? agentCardStatus(n.id, nodes) : null;
                  // Brouillard d'audit : 'fog' (source non vérifiée) OU 'danger' (broken).
                  // Exclusifs par construction (voir nodeAudit) — jamais les deux à la fois.
                  const audit = nodeAudit(n);
                  return (
                    <div key={n.id} className={'node ' + n.type + (selected ? ' selected' : '') + (orders ? ' flowed' : '')
                        + (audit === 'fog' ? ' node-fog' : '') + (audit === 'danger' ? ' node-danger' : '')
                        + (n.data && n.data._layerDiff && n.data._layerDiff !== 'base' ? ' layer-' + n.data._layerDiff : '')}
                      data-testid={'node-' + n.id} data-node-id={n.id} data-node-type={n.type}
                      data-node-orders={orders ? orders.join(',') : ''}
                      data-wired={n.data && n.data.wiredStatus ? n.data.wiredStatus : ''}
                      data-layer-diff={n.data && n.data._layerDiff ? n.data._layerDiff : ''}
                      data-fog={audit === 'fog' ? '1' : '0'} data-danger={audit === 'danger' ? '1' : '0'}
                      style={sizeStyle}
                      onMouseDown={(e) => startDrag(e, n.id)}
                      onMouseUp={() => { if (draw) finishDrawOn(n.id); }}>
                      {n.data && n.data._layerDiff && n.data._layerDiff !== 'base' && (
                        <div className={'layer-diff-tag layer-diff-' + n.data._layerDiff} data-testid={'layer-diff-' + n.id}>
                          {n.data._layerDiff === 'added' ? '＋ ajouté' : n.data._layerDiff === 'removed' ? '− supprimé' : '~ modifié'}
                        </div>
                      )}
                      {audit === 'danger' && (
                        <div className="node-danger-tag" data-testid={'node-danger-' + n.id}
                          title="Source auditée et CASSÉE (wiredStatus: broken) — ne pas rejouer">⚠ cassé</div>
                      )}
                      {card && card.isComposite && (
                        <div className={'card-badge ' + (card.complete ? 'card-ok' : 'card-warn')}
                          data-testid={'agent-card-' + n.id}
                          data-card-filled={card.filled} data-card-complete={card.complete ? '1' : '0'}
                          title={card.complete ? 'Carte d\'identité complète — exécutable'
                            : `Carte d'identité incomplète (${card.filled}/${card.total}) — exécution bloquée`}>
                          {card.filled}/{card.total} {card.complete ? '✅' : '⚠️'}
                        </div>
                      )}
                      {orders && (
                        <div className="order-badge" data-testid="node-order" title={`exécuté à l'étape ${orders.join(', ')}`}>
                          {orders.join('·')}
                        </div>
                      )}
                      <div className="nhead" style={{ background: roleColor(n) }}>
                        <span>{n.id}</span>
                        <span className="ntype">{n.type === 'agent' && n.data.role ? n.data.role : meta.label}</span>
                      </div>
                      {n.attachedBrick && (
                        <div className="node-brick" data-testid={'node-brick-' + n.id} title={'fiche liée : ' + n.attachedBrick.name}>
                          <span className={'badge-' + n.attachedBrick.badge}>{EXAMPLE_BADGE[n.attachedBrick.badge]}</span>
                          🔗 {n.attachedBrick.name}
                        </div>
                      )}
                      {n.attachedPrompt && (
                        <div className="node-brick" data-testid={'node-prompt-' + n.id} title={'prompt lié : ' + n.attachedPrompt.name}>
                          <span className={'badge-' + n.attachedPrompt.badge}>{EXAMPLE_BADGE[n.attachedPrompt.badge]}</span>
                          🔗 {n.attachedPrompt.name}
                        </div>
                      )}
                      {n.attachedOracle && (
                        <div className="node-brick" data-testid={'node-oracle-' + n.id} title={'gardien : ' + n.attachedOracle.name}>
                          <span className={'badge-' + n.attachedOracle.badge}>{EXAMPLE_BADGE[n.attachedOracle.badge]}</span>
                          🛡️ {n.attachedOracle.name}
                        </div>
                      )}
                      {n.attachedGoal && (
                        <div className="node-brick" data-testid={'node-goal-' + n.id} title={'objectif : ' + n.attachedGoal.name}>
                          <span className={'badge-' + n.attachedGoal.badge}>{EXAMPLE_BADGE[n.attachedGoal.badge]}</span>
                          🎯 {n.attachedGoal.name}
                        </div>
                      )}
                      {n.type === 'humangate' && (() => {
                        const dec = result && result.state && result.state.nodes[n.id] ? result.state.nodes[n.id].decision : undefined;
                        const stateLabel = (paused && paused.pausedAt === n.id) ? '⏸️ en attente'
                          : dec === 'approve' ? '✅ approuvé' : dec === 'reject' ? '❌ rejeté' : '⏸️ point d\'arrêt';
                        return (
                          <div className="node-brick" data-testid={'node-gate-' + n.id}>
                            {n.data.actsAsOracle && <span className="badge-target" title="porte une règle">🛡️</span>}
                            <span data-testid={'node-gate-state-' + n.id}>{stateLabel}</span>
                          </div>
                        );
                      })()}
                      <div className="nbody">
                        {n.type === 'artefact'
                          ? <div data-testid={'artefact-body-' + n.id}>
                              <div><b>🎁 {n.data.title || 'Livrable'}</b></div>
                              <div style={{ opacity: .8 }}>{String(n.data.description || '').slice(0, 60)}</div>
                              <div style={{ fontSize: 8, opacity: .7 }}>type : {n.data.artefactType || '—'} · non-exécutable</div>
                            </div>
                        : n.type === 'agent' && n.data.role
                          ? <div>
                              <div><b>model</b> {String(n.data.model ?? '—')}</div>
                              <div><b>temp</b> {n.data.temperature ?? 'N/A'} · <b>top_p</b> {n.data.top_p ?? 'N/A'} · <b>tok</b> {n.data.max_tokens ?? 'N/A'}</div>
                              {n.data.okAfter !== undefined ? <div><b>okAfter</b> {n.data.okAfter}</div> : null}
                            </div>
                          : Object.keys(stripUi(n.data)).slice(0, 3).map((k) => (
                              <div key={k}><b>{k}</b>: {String(n.data[k]).slice(0, 26)}</div>
                            ))}
                      </div>
                      {renderHandles(false)}
                      {resizeHandle}
                    </div>
                  );
                })}
                </div>{/* /world-scale */}
                </div>{/* /world */}

                {/* Overlays live OUTSIDE .world so they never scale/pan with the graph. */}
                {nodes.length === 0 && (
                  <div className="empty" style={{ marginTop: 80 }}>
                    {isSandbox ? 'Sandbox vide — pose des nœuds pour expérimenter (jamais exécuté).' : <span>Canvas vide.<br />Charge « Council ↻ looped » pour voir une boucle tourner.</span>}
                  </div>
                )}

                {nodes.length > 0 && edges.length === 0 && (
                  <div data-testid="connect-hint" style={{ position: 'absolute', top: 6, left: '50%', transform: 'translateX(-50%)',
                    zIndex: 40, background: 'rgba(99,102,241,.14)', border: '1px solid #6366f1', color: '#c7d2fe',
                    borderRadius: 6, padding: '4px 10px', fontSize: 11, pointerEvents: 'none' }}>
                    💡 Glisse depuis le petit point sur le bord d'un nœud vers un autre nœud pour les relier.
                  </div>
                )}

                {overflowsView && (
                  <div data-testid="canvas-scroll-hint" style={{ position: 'sticky', top: 6, left: '50%', transform: 'translateX(-50%)',
                    zIndex: 40, background: 'rgba(129,140,248,.16)', border: '1px solid #818cf8', color: '#c7d2fe',
                    borderRadius: 6, padding: '4px 10px', fontSize: 10, pointerEvents: 'none', width: 'fit-content', margin: '0 auto' }}>
                    ↔ des nœuds s'étendent au-delà de la vue — défile le canvas pour les atteindre (handles toujours actifs)
                  </div>
                )}
              </div>

              {/* Chantier 2 — zoom controls, pinned over the viewport. */}
              <div className="zoom-ctl" data-testid="zoom-controls">
                <button data-testid="zoom-out" title="Dézoomer (Ctrl+molette)" onClick={() => zoomBy(1 / 1.2)}>−</button>
                <span className="zlvl" data-testid="zoom-level">{Math.round(zoom * 100)}%</span>
                <button data-testid="zoom-in" title="Zoomer (Ctrl+molette)" onClick={() => zoomBy(1.2)}>＋</button>
                <button data-testid="zoom-reset" title="Réinitialiser le zoom (100%)" onClick={resetZoom}>⟳</button>
              </div>
            </div>
      );
    }

    function App() {
      // Canvas zones = two independent instances of the SAME model/component.
      //  • ACTIVE  = the executable graph. The engine (run + toEngineGraph) reads ONLY this,
      //    by construction — `active` is a distinct binding never swapped for `sandbox`.
      //  • SANDBOX = a scratch zone. Never executed, never in the engine graph.
      const active = useCanvasModel();
      const sandbox = useCanvasModel();
      const [focused, setFocused] = useState('active'); // zone the user last interacted with
      // `F` = the FOCUSED model. Node-writing UI (palette pose, import-at-pose, Library attach,
      // inspector edits) targets F, so it lands in whichever zone the user is working in.
      const F = focused === 'active' ? active : sandbox;
      // Bare names = ACTIVE. Used by run/save/engine-graph/window test-hooks — the execution
      // path. Keeping them bound to `active` is what makes the "Sandbox never runs" guarantee
      // structural rather than a checked condition.
      const { nodes, setNodes, edges, setEdges, sel, setSel, selNode, selEdge, selectedIds,
        setSelectedIds, marquee, setMarquee, titleEdit, setTitleEdit, importChooser, setImportChooser } = active;
      const [menu, setMenu] = useState(null);           // open dropdown: 'llm' | 'council' | 'examples' | null
      const [loadedExample, setLoadedExample] = useState(null); // key of the example last loaded via the selector
      const [splitPct, setSplitPct] = useState(70);     // Active-zone height %, dragged via the split bar
      const splitRef = useRef(null);                    // .canvas-split container (for drag math)
      // ----- Library (brick store, Passe 1) -----
      const [libBricks, setLibBricks] = useState([]);    // [{id,kind,name,maturity,badge}]
      const [libEditing, setLibEditing] = useState(null); // full brick being edited, or null
      const [libFilter, setLibFilter] = useState('all'); // list filter: 'all' | 'agent' | 'prompt' | 'chain'
      // F1 — Library search + sort. libSearch matches the VISIBLE fields (name, kind,
      // badge, maturity); the list payload carries no brick body, so search stays on
      // what the row shows. libSort: 'name' (A→Z) | 'updated' (most-recent first).
      const [libSearch, setLibSearch] = useState('');
      const [libSort, setLibSort] = useState('name');
      const [chainSaveOpen, setChainSaveOpen] = useState(false); // "save canvas as chain" modal
      const [libPermText, setLibPermText] = useState('{}'); // permissions JSON textarea buffer
      // ----- Wire Map (traceability) -----
      const [view, setView] = useState('canvas');       // 'canvas' | 'wiremap'
      const [wmProjects, setWmProjects] = useState([]);  // [{id,name}]
      const [wmId, setWmId] = useState(null);            // current project id
      const [wm, setWm] = useState(null);                // {project, entries}
      const [wmAudit, setWmAudit] = useState(null);      // audit markdown string | null
      const [wmViewer, setWmViewer] = useState(null);    // {path, content, from, to} mini code viewer
      const [wmNewOpen, setWmNewOpen] = useState(false); // new-project modal
      const [wmFiles, setWmFiles] = useState([]);        // repo file list for autocomplete
      const [wmExpanded, setWmExpanded] = useState({});  // explicit expand toggles by entry id
      const [inputText, setInputText] = useState('{\n  "task": "Implémenter la feature X"\n}');
      const [result, setResult] = useState(null);
      const [error, setError] = useState(null);          // human-facing message (main)
      const [errorDetail, setErrorDetail] = useState(null); // raw technical error (dev detail)
      const [status, setStatus] = useState({ msg: 'Canvas vide — charge un exemple ou ajoute des nœuds.', kind: '' });
      const [busy, setBusy] = useState(false);
      const [paused, setPaused] = useState(null);     // HumanGate pause: {ctx, graph, pausedAt}
      const [resumeNote, setResumeNote] = useState(''); // optional human note on approve/reject
      const [snap, setSnap] = useState(false);
      // A1 — opt-in real execution. false = mockAdapters (default, offline, deterministic).
      // true = the run POSTs {live:true}, routing the engine to the REAL LM Studio adapter
      // (local :1234). Never auto-enabled; the user must tick it. Persisted per-session only.
      const [live, setLive] = useState(false);
      const idSeq = useRef(1);
      // Copy/paste clipboard — INTERNAL React state (a ref), not the system clipboard:
      // simpler and reliable (no async permission prompt, no cross-tab leakage). Holds a
      // deep clone of {nodes, edges} with ORIGINAL ids; ids are remapped fresh at paste.
      const clipboardRef = useRef(null);

      // ----- Calques (layers) — état + actions -----
      const [layers, setLayers] = useState(() => loadLayers()); // [{id,name,nodes,edges,createdAt}]
      const [activeLayerIds, setActiveLayerIds] = useState([]); // ordered selection (1st = base, last = target)
      const [layersMenuOpen, setLayersMenuOpen] = useState(false);
      const [layerName, setLayerName] = useState('');
      const preLayerRef = useRef(null); // {nodes,edges} of the Actif canvas BEFORE any calque took over the view
      const layersReadOnly = activeLayerIds.length >= 2;

      // Recompute the Actif canvas for a given selection of calque ids.
      const applyLayers = useCallback((nextIds) => {
        if (nextIds.length === 0) {
          if (preLayerRef.current) { setNodes(preLayerRef.current.nodes); setEdges(preLayerRef.current.edges); preLayerRef.current = null; }
          setSel(null); setSelectedIds([]);
          setStatus({ msg: 'Calques désactivés — édition rétablie.', kind: '' });
          return;
        }
        if (!preLayerRef.current) preLayerRef.current = { nodes, edges }; // snapshot the real working canvas once
        const chosen = nextIds.map((id) => layers.find((l) => l.id === id)).filter(Boolean);
        const merged = mergeLayers(chosen);
        setNodes(merged.nodes); setEdges(merged.edges); setSel(null); setSelectedIds([]);
        setStatus({ msg: nextIds.length >= 2
          ? `📚 ${nextIds.length} calques superposés — delta affiché (lecture seule).`
          : `📚 Calque affiché (édition possible).`, kind: 'ok' });
      }, [layers, nodes, edges]);

      const toggleLayer = useCallback((id) => {
        const next = activeLayerIds.includes(id) ? activeLayerIds.filter((x) => x !== id) : [...activeLayerIds, id];
        setActiveLayerIds(next);
        applyLayers(next);
      }, [activeLayerIds, applyLayers]);

      const saveActiveAsLayer = useCallback(() => {
        const name = (layerName || '').trim();
        if (!name) { setStatus({ msg: '⚠️ Nomme le calque avant de l\'enregistrer.', kind: 'error' }); return; }
        if (layersReadOnly) { setStatus({ msg: '⚠️ Lecture seule (2+ calques superposés) — enregistrement impossible.', kind: 'error' }); return; }
        const snap = JSON.parse(JSON.stringify({ nodes, edges }));
        snap.nodes.forEach((n) => { if (n.data) { delete n.data._layerDiff; delete n.data._dataText; delete n.data._dataErr; } });
        const layer = { id: 'layer-' + Date.now().toString(36) + '-' + Math.floor(Math.random() * 1e5).toString(36),
          name, nodes: snap.nodes, edges: snap.edges, createdAt: new Date().toISOString() };
        const nextLayers = [...layers, layer];
        setLayers(nextLayers); persistLayers(nextLayers); setLayerName('');
        setStatus({ msg: `📚 Calque « ${name} » enregistré (${snap.nodes.length} nœuds).`, kind: 'ok' });
      }, [layerName, layers, nodes, edges, activeLayerIds]);

      // Ré-enregistrer (écraser) un calque existant avec le canvas Actif courant.
      // Le cas d'usage : activer 1 calque → le modifier → 💾 pour persister la modif
      // DANS ce même calque (au lieu d'en créer un nouveau). Bloqué en lecture seule.
      const updateLayer = useCallback((id) => {
        if (layersReadOnly) { setStatus({ msg: '⚠️ Lecture seule (2+ calques) — impossible de ré-enregistrer.', kind: 'error' }); return; }
        const snap = JSON.parse(JSON.stringify({ nodes, edges }));
        snap.nodes.forEach((n) => { if (n.data) { delete n.data._layerDiff; delete n.data._dataText; delete n.data._dataErr; } });
        const nextLayers = layers.map((l) => l.id === id
          ? { ...l, nodes: snap.nodes, edges: snap.edges, updatedAt: new Date().toISOString() } : l);
        setLayers(nextLayers); persistLayers(nextLayers);
        const nm = (layers.find((l) => l.id === id) || {}).name || id;
        setStatus({ msg: `📚 Calque « ${nm} » ré-enregistré (${snap.nodes.length} nœuds).`, kind: 'ok' });
      }, [layers, nodes, edges, layersReadOnly]);

      const deleteLayer = useCallback((id) => {
        const nextLayers = layers.filter((l) => l.id !== id);
        setLayers(nextLayers); persistLayers(nextLayers);
        if (activeLayerIds.includes(id)) { const next = activeLayerIds.filter((x) => x !== id); setActiveLayerIds(next); applyLayers(next); }
      }, [layers, activeLayerIds, applyLayers]);

      // Close the Calques menu on outside click (mirror of the palette dropdown pattern).
      useEffect(() => {
        if (!layersMenuOpen) return undefined;
        const close = () => setLayersMenuOpen(false);
        window.addEventListener('click', close);
        return () => window.removeEventListener('click', close);
      }, [layersMenuOpen]);

      const loadInto = useCallback((g, label) => {
        setNodes(g.nodes); setEdges(g.edges); setSel(null); setSelectedIds([]); setMarquee(null); setResult(null); setError(null);
        if (g.input) setInputText(JSON.stringify(g.input, null, 2));
        idSeq.current = 1000;
        setStatus({ msg: '✅ ' + label, kind: 'ok' });
      }, []);

      const clearAll = useCallback(() => {
        setNodes([]); setEdges([]); setSel(null); setSelectedIds([]); setMarquee(null); setResult(null); setError(null);
        setStatus({ msg: 'Canvas vidé.', kind: '' });
      }, []);

      const addNode = useCallback((type) => {
        const { setNodes, setSel } = F; // pose into the FOCUSED zone (Active or Sandbox)
        const id = `${type}-${idSeq.current++}`;
        setNodes((ns) => {
          // Anti-superposition: cascade each new node 30px down-right of the previous
          // (wrap every 8 so it stays on-screen). First node lands near top-left.
          const k = ns.length;
          const n = { id, type, x: 60 + (k % 8) * 30, y: 50 + (k % 8) * 30, data: NODE_TYPES[type].data() };
          return [...ns, n];
        });
        setSel({ kind: 'node', id });
      }, [F]);

      // Pose a node from the palette AND immediately offer to import a Library brick
      // of `chooserKind` onto it (or leave it empty). Reuses the SAME attach functions
      // as the Library editor — no duplicated attach logic. baseType = the node type
      // posed; dataOverride lets "+ Prompt" start with an empty prompt (no overwrite
      // confirm when a prompt is then imported).
      const addNodeWithImport = useCallback((baseType, chooserKind, dataOverride) => {
        const { setNodes, setSel, setImportChooser } = F; // pose into the FOCUSED zone
        const id = `${baseType}-${idSeq.current++}`;
        setNodes((ns) => {
          const k = ns.length;
          const n = { id, type: baseType, x: 60 + (k % 8) * 30, y: 50 + (k % 8) * 30, data: dataOverride || NODE_TYPES[baseType].data() };
          return [...ns, n];
        });
        setSel({ kind: 'node', id });
        setImportChooser({ nodeId: id, kind: chooserKind });
      }, [F]);

      // "+ Agent" = pose a COMPOSITE: one central executable agent node + its 7 satellite
      // component nodes (mémoire/skill/plugin/rôle/objectif/garde-fou/modèle), linked by
      // decorative edges. Layout = a horizontal ROW above the central node (documented
      // choice: a row reads left-to-right in the canonical order and never overlaps the
      // node body). The central agent is then offered a Library import (fills the 7).
      const addAgentComposite = useCallback(() => {
        const { setNodes, setEdges, setSel, setImportChooser } = F; // pose into the FOCUSED zone
        const aid = `agent-${idSeq.current++}`;
        // Pre-mint satellite ids so we can build central+satellites AND their edges together.
        const sats = AGENT_COMPONENT_TYPES.map((ct) => ({ ct, id: `agentcomp-${idSeq.current++}` }));
        setNodes((ns) => {
          const k = ns.length;
          // Push the central node down so the row of satellites above it stays on-canvas.
          const ax = 90 + (k % 6) * 34, ay = 210 + (k % 6) * 24;
          const spacing = 104;
          const totalW = (sats.length - 1) * spacing;
          // Center the row over the agent, but floor the START once (not per-node) so the
          // whole row shifts right as a block — clamping each node would stack the leftmost
          // satellites at x=0 and overlap them.
          const startX = Math.max(12, ax + NODE_W / 2 - totalW / 2);
          const sy = Math.max(0, ay - 155);
          const central = { id: aid, type: 'agent', x: ax, y: ay, data: NODE_TYPES.agent.data() };
          const satNodes = sats.map((s, i) => ({
            id: s.id, type: 'agent-component',
            x: startX + i * spacing, y: sy,
            data: { componentType: s.ct, text: '', parentId: aid },
          }));
          return [...ns, central, ...satNodes];
        });
        // Decorative edges central → each satellite (UI-only; dropped by toEngineGraph
        // since the satellite endpoint is non-exec).
        setEdges((es) => [...es, ...sats.map((s) => ({
          id: `edge-${idSeq.current++}`, from: aid, to: s.id, fromHandle: 'top', toHandle: 'bottom', condition: '', _cardEdge: true,
        }))]);
        setSel({ kind: 'node', id: aid });
        setImportChooser({ nodeId: aid, kind: 'agent' });
      }, [F]);

      // Close any open palette dropdown when clicking elsewhere (Item 4).
      useEffect(() => {
        if (!menu) return undefined;
        const close = () => setMenu(null);
        window.addEventListener('click', close);
        return () => window.removeEventListener('click', close);
      }, [menu]);

      // Expose the live UI graph for tests (notes + decorative edges included here,
      // but excluded by toEngineGraph). Updated every render. __setGraph lets a
      // test inject a dense graph to check canvas legibility.
      useEffect(() => {
        window.__ui = { nodes, edges, selectedIds, marquee };
        window.__setGraph = (ns, es) => { setNodes(ns); setEdges(es); setSel(null); setSelectedIds([]); setMarquee(null); setResult(null); };
        // Test seam: deterministic node selection (avoids drag/click flakiness on .nhead).
        window.__selectNode = (id) => setSel(id ? { kind: 'node', id } : null);
      });

      // (Derived-prompt engine for composite agents now lives in useCanvasModel — runs
      // per-canvas.) Expose composeAgentPrompt for tests.
      window.composeAgentPrompt = composeAgentPrompt;

      function parseErr(text) {
        try { const v = JSON.parse(text); if (v === null || typeof v !== 'object' || Array.isArray(v)) return 'data doit être un objet JSON'; return null; }
        catch (e) { return e.message; }
      }
      // Inspector edit helpers — target the FOCUSED zone (the inspector shows F's selection).
      const updateNodeData = useCallback((id, text) => {
        F.setNodes((ns) => ns.map((n) => n.id === id ? { ...n, data: { ...n.data, _dataText: text, _dataErr: parseErr(text) } } : n));
      }, [F]);
      const commitNodeData = useCallback((id) => {
        F.setNodes((ns) => ns.map((n) => {
          if (n.id !== id || n.data._dataText === undefined) return n;
          const err = parseErr(n.data._dataText);
          if (err) return n;
          return { ...n, data: JSON.parse(n.data._dataText) };
        }));
      }, [F]);

      // Patch one field of a node's data (used by the agent role/param inspector).
      const patchData = useCallback((id, patch) => { patchNodeData(F.setNodes, id, patch); }, [F]);
      const applyRole = useCallback((id, role) => {
        F.setNodes((ns) => ns.map((n) => n.id === id ? { ...n, data: withRole(stripUi(n.data), role) } : n));
      }, [F]);
      const setNoteText = useCallback((id, text) => { patchNodeData(F.setNodes, id, { text }); }, [F]);
      // Item 2 — note title (data.title), edited inline in the block AND in the inspector.
      const setNoteTitle = useCallback((id, title) => { patchNodeData(F.setNodes, id, { title }); }, [F]);

      // Item 4 — LLM sub-menu: pose an LLM node whose data is pre-filled with the
      // chosen agent field (outputKey = field + a suggested prompt).
      const addLlmField = useCallback((field) => {
        const { setNodes, setSel } = F; // pose into the FOCUSED zone
        const id = `llm-${idSeq.current++}`;
        setNodes((ns) => {
          const k = ns.length; // cascade (anti-superposition), same as addNode
          const n = { id, type: 'llm', x: 60 + (k % 8) * 30, y: 50 + (k % 8) * 30,
            data: { prompt: `Configure the "${field}" of the agent.`, outputKey: field } };
          return [...ns, n];
        });
        setSel({ kind: 'node', id });
        setMenu(null);
        setStatus({ msg: `✅ Nœud LLM « ${field} » posé`, kind: 'ok' });
      }, [F]);

      // Item 4 — Council: ADD a pre-wired subgraph (ids remapped unique, offset so it
      // doesn't overlap what's already there). Unlike loadInto, this keeps the canvas.
      const addSubgraph = useCallback((sub, label) => {
        const { setNodes, setEdges } = F; // pose into the FOCUSED zone
        const suffix = `-${idSeq.current++}`;
        const idMap = {};
        const off = 40 + (idSeq.current % 4) * 24;
        const newNodes = sub.nodes.map((n) => { const nid = n.id + suffix; idMap[n.id] = nid; return { ...n, id: nid, x: n.x + off, y: n.y + off }; });
        const newEdges = sub.edges.map((e) => ({ ...e, id: e.id + suffix, from: idMap[e.from], to: idMap[e.to] }));
        setNodes((ns) => [...ns, ...newNodes]);
        setEdges((es) => [...es, ...newEdges]);
        setMenu(null);
        setStatus({ msg: `✅ ${label} posé (${newNodes.length} nœuds)`, kind: 'ok' });
      }, [F]);

      // ----- Chantier 1 — split bar drag + Sandbox→Actif transfer -----
      const startSplitDrag = useCallback((e) => {
        e.preventDefault();
        const move = (ev) => {
          const box = splitRef.current && splitRef.current.getBoundingClientRect();
          if (!box) return;
          const pct = ((ev.clientY - box.top) / box.height) * 100;
          setSplitPct(Math.min(85, Math.max(15, pct)));
        };
        const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', up);
      }, []);

      // Move the Sandbox's selected nodes into the ACTIVE zone. Edges whose BOTH endpoints
      // are in the moved set travel with them (internal wiring preserved); an edge with only
      // one endpoint selected is dropped (documented choice: no orphan/cross-zone edges — the
      // engine graph must never reference a node that isn't there). Ids are already unique
      // across zones (shared idSeq), so no remap is needed.
      const transferToActive = useCallback(() => {
        const ids = sandbox.selectedIds.length ? sandbox.selectedIds
          : (sandbox.sel && sandbox.sel.kind === 'node' ? [sandbox.sel.id] : []);
        if (!ids.length) return;
        const idSet = new Set(ids);
        const moving = sandbox.nodes.filter((n) => idSet.has(n.id));
        const movingEdges = sandbox.edges.filter((e) => idSet.has(e.from) && idSet.has(e.to));
        const droppedEdges = sandbox.edges.filter((e) => (idSet.has(e.from) !== idSet.has(e.to)));
        active.setNodes((ns) => [...ns, ...moving]);
        active.setEdges((es) => [...es, ...movingEdges]);
        // Remove moved nodes + any edge touching them from the Sandbox.
        sandbox.setNodes((ns) => ns.filter((n) => !idSet.has(n.id)));
        sandbox.setEdges((es) => es.filter((e) => !idSet.has(e.from) && !idSet.has(e.to)));
        sandbox.setSel(null); sandbox.setSelectedIds([]);
        setFocused('active');
        setStatus({ msg: `✅ ${moving.length} nœud(s) transféré(s) vers l'Actif` + (droppedEdges.length ? ` (${droppedEdges.length} edge(s) orpheline(s) écartée(s))` : ''), kind: 'ok' });
      }, [sandbox, active]);

      // ----- Copier / coller de blocs (Ctrl+C / Ctrl+V) -----
      // Reuses the EXISTING multi-selection (selectedIds) and the SHARED idSeq. Copy reads
      // the FOCUSED zone; paste writes to the FOCUSED zone — so a copy in Actif can be
      // pasted in Sandbox and vice-versa (ids are unique across zones via the shared idSeq).
      // Only edges whose BOTH endpoints are in the selection travel (internal wiring),
      // exactly like transferToActive. A selected composite agent drags its satellites
      // (agent-component children) + card edges along, and parentId is remapped on paste.
      const copySelection = useCallback(() => {
        const zone = F;
        const base = zone.selectedIds.length ? zone.selectedIds
          : (zone.sel && zone.sel.kind === 'node' ? [zone.sel.id] : []);
        if (!base.length) { setStatus({ msg: 'Rien à copier — sélectionne un ou plusieurs nœuds', kind: '' }); return 0; }
        const idSet = new Set(base);
        // Expand: pull in the satellites of any selected composite agent so the card copies whole.
        for (const n of zone.nodes) if (n.type === 'agent-component' && n.data && idSet.has(n.data.parentId)) idSet.add(n.id);
        const nodes = zone.nodes.filter((n) => idSet.has(n.id));
        const edges = zone.edges.filter((e) => idSet.has(e.from) && idSet.has(e.to));
        clipboardRef.current = { nodes: JSON.parse(JSON.stringify(nodes)), edges: JSON.parse(JSON.stringify(edges)) };
        const nCentral = nodes.filter((n) => n.type !== 'agent-component').length;
        setStatus({ msg: `📋 ${nCentral} nœud(s) copié(s)` + (edges.length ? ` + ${edges.length} edge(s) interne(s)` : ''), kind: 'ok' });
        return nodes.length;
      }, [F]);

      const pasteClipboard = useCallback(() => {
        const clip = clipboardRef.current;
        if (!clip || !clip.nodes.length) { setStatus({ msg: 'Presse-papier vide', kind: '' }); return 0; }
        const zone = F;
        const OFF = 30; // visual offset so the paste doesn't sit exactly on the original
        const idMap = {};
        const newNodes = clip.nodes.map((n) => {
          const nid = `${n.type}-${idSeq.current++}`;
          idMap[n.id] = nid;
          const copy = JSON.parse(JSON.stringify(n));
          return { ...copy, id: nid, x: n.x + OFF, y: n.y + OFF };
        });
        // Remap the only intra-selection node cross-reference: a satellite's parentId.
        for (const n of newNodes) if (n.data && n.data.parentId && idMap[n.data.parentId]) n.data.parentId = idMap[n.data.parentId];
        const newEdges = clip.edges.map((e) => ({ ...JSON.parse(JSON.stringify(e)), id: `edge-${idSeq.current++}`, from: idMap[e.from], to: idMap[e.to] }));
        zone.setNodes((ns) => [...ns, ...newNodes]);
        zone.setEdges((es) => [...es, ...newEdges]);
        zone.setSel(null);
        zone.setSelectedIds(newNodes.map((n) => n.id));
        const nCentral = newNodes.filter((n) => n.type !== 'agent-component').length;
        setStatus({ msg: `📌 ${nCentral} nœud(s) collé(s) (nouveaux ids, +${OFF}px)`, kind: 'ok' });
        return newNodes.length;
      }, [F]);

      // Ctrl/Cmd + C / V — global (App-level) so it targets the focused zone regardless of
      // which CanvasSurface has DOM focus. Ignored while typing in a field (no clobbering
      // native copy/paste inside inputs/textareas).
      useEffect(() => {
        const isTyping = () => { const a = document.activeElement; return !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable); };
        const onKey = (e) => {
          if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
          if (isTyping()) return;
          const k = (e.key || '').toLowerCase();
          if (k === 'c') { if (copySelection()) e.preventDefault(); }
          else if (k === 'v') { if (pasteClipboard()) e.preventDefault(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [copySelection, pasteClipboard]);

      // Test seams (deterministic, focus-independent) — mirror the keyboard path exactly.
      useEffect(() => {
        window.__copySelection = copySelection;
        window.__pasteClipboard = pasteClipboard;
        window.__clipboard = () => clipboardRef.current;
        window.__zones = () => ({ focused, active: { nodes: active.nodes, edges: active.edges }, sandbox: { nodes: sandbox.nodes, edges: sandbox.edges } });
      });

      // ================= Wire Map (traceability) =================
      const loadWmProjects = useCallback(async () => {
        try {
          const r = await fetch('/api/wireframes');
          const j = await r.json();
          setWmProjects(j.projects || []);
          return j.projects || [];
        } catch { return []; }
      }, []);

      const loadWmProject = useCallback(async (id) => {
        if (!id) return;
        try {
          const r = await fetch('/api/wireframes/' + encodeURIComponent(id));

          const doc = await r.json();
          setWm(doc); setWmId(id); setWmAudit(null);
        } catch { setStatus({ msg: '❌ chargement Wire Map échoué', kind: 'error' }); }
      }, []);

      // Persist the given doc (or the current wm) to the server.
      const saveWm = useCallback(async (doc) => {
        const d = doc || wm;
        if (!d || !d.project) return;
        try {
          await fetch('/api/wireframes/' + encodeURIComponent(d.project.id), {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d),
          });
        } catch { /* offline: keep in-memory */ }
      }, [wm]);

      // Mutate the current wm and persist.
      const commitWm = useCallback((mutator) => {
        setWm((prev) => {
          if (!prev) return prev;
          const next = mutator({ ...prev, entries: prev.entries.map((e) => ({ ...e })) });
          saveWm(next);
          return next;
        });
      }, [saveWm]);

      const createProject = useCallback(async (name, repoRoot, roadmapRef) => {
        const id = (name || 'project').toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '') || 'project';
        const doc = { project: { id, name: name || id, repoRoot: repoRoot || '.', created: '2026-07-01T00:00:00Z', roadmapRef: roadmapRef || '' }, entries: [] };
        await saveWm(doc);
        await loadWmProjects();
        setWm(doc); setWmId(id); setWmNewOpen(false);
        setStatus({ msg: `✅ Projet Wire Map « ${id} » créé`, kind: 'ok' });
      }, [saveWm, loadWmProjects]);

      // Add a Wire Map entry for a canvas node (or a blank one).
      // Add a BLANK roadmap entry. The Wire Map is a software patch-note journal,
      // NOT a mirror of the canvas — so an entry is never derived from a canvas
      // node. The user names it via the "Nœud / nom" field in the entry detail.
      const addWmEntry = useCallback(() => {
        commitWm((d) => {
          const order = d.entries.length + 1;
          const entry = {
            id: 'entry-' + Date.now().toString(36) + '-' + order,
            nodeId: '', label: 'entrée ' + order,
            function: '',
            files: [], command: '',
            test: { description: '', file: '', line: 0, status: 'PENDING', color: 'orange', type: 'unit' },
            impRef: null, humanRequired: false, notes: '', order,

          return d;
        });
      }, [commitWm]);

      const updateEntry = useCallback((entryId, patch) => {
        commitWm((d) => { d.entries = d.entries.map((e) => e.id === entryId ? { ...e, ...patch } : e); return d; });
      }, [commitWm]);
      const updateEntryTest = useCallback((entryId, patch) => {
        commitWm((d) => { d.entries = d.entries.map((e) => e.id === entryId ? { ...e, test: { ...e.test, ...patch } } : e); return d; });
      }, [commitWm]);
      const deleteEntry = useCallback((entryId) => {
        commitWm((d) => { d.entries = d.entries.filter((e) => e.id !== entryId); return d; });
      }, [commitWm]);

      // Set a test status → also aligns the traffic-light colour (PASS→green,
      // FAIL→red, everything else→orange).
      const setEntryStatus = useCallback((entryId, statusKey) => {
        updateEntryTest(entryId, { status: statusKey, color: statusToColor(statusKey) });
      }, [updateEntryTest]);

      // Open the mini code viewer for a file:from-to.
      const openViewer = useCallback(async (p, from, to) => {
        try {
          const r = await fetch('/api/repo/file?path=' + encodeURIComponent(p));
          const j = await r.json();
          if (!r.ok) { setWmViewer({ path: p, content: j.error || 'erreur', from: 1, to: 1 }); return; }
          setWmViewer({ path: p, content: j.content, from: from || 1, to: to || j.lines });
        } catch (e) { setWmViewer({ path: p, content: String(e), from: 1, to: 1 }); }
      }, []);

      // NOTE (dette technique soldée) : applyTraceToWm() a été RETIRÉ ici.
      // Il mettait le statut d'une entrée Wire Map à PASS/FAIL après un run, en
      // matchant entry.nodeId à un id de nœud du trace. Depuis le recentrage du
      // Wire Map en roadmap logicielle pure (entrées « types », « scheduler »…),
      // ce couplage run→entrée n'a plus de sens : zéro entrée n'a de nodeId égal à
      // un id de nœud canvas exécutable. Retiré (principe : pas de code mort).

      // Deterministic audit report (NO external LLM — forbidden). Local heuristic.
      // Correction 1 — counts the ENTRIES of the selected Wire Map project, NEVER the
      // canvas nodes. The report is coherent with the table above it, independent of
      // whatever graph happens to be drawn on the canvas at the same moment.
      const runAudit = useCallback(() => {
        if (!wm) return;
        const entries = wm.entries;
        const total = entries.length;
        const mapped = entries.filter((e) => e.nodeId).length; // entries bound to a node id
        const byStatus = (s) => entries.filter((e) => e.test.status === s).length;
        const noTest = entries.filter((e) => !e.test.file && !e.test.description);
        const fails = entries.filter((e) => e.test.status === 'FAIL');
        const humans = entries.filter((e) => e.humanRequired);
        const imps = entries.filter((e) => e.impRef);
        const pct = total ? Math.round((mapped / total) * 100) : 0;
        const L = [];
        L.push(`# Wire Map Audit — ${wm.project.name} — 2026-07-01`, '');
        L.push('## Couverture');
        L.push(`- Nœuds mappés : ${mapped}/${total} (${pct}%)`);
        L.push(`- Tests PASS : ${byStatus('PASS')}/${total}`);
        L.push(`- Tests FAIL : ${byStatus('FAIL')}/${total}`);
        L.push(`- PENDING : ${byStatus('PENDING')}/${total}`);
        L.push(`- Human Required : ${humans.length} entrées`, '');
        L.push('## Entrées sans test');
        L.push(noTest.length ? noTest.map((e) => `- ${e.nodeId || e.label} : aucun test associé`).join('\n') : '- (aucune)');
        L.push('', '## Entrées FAIL');
        L.push(fails.length ? fails.map((e) => `- ${e.nodeId} : ${e.test.file}:${e.test.line}`).join('\n') : '- (aucune) ✅');
        L.push('', '## Connexions roadmap');
        L.push(imps.length ? imps.map((e) => `- ${e.impRef} : ${e.label} — ${e.test.status}`).join('\n') : '- (aucune référence IMP)');
        L.push('', '## Recommandation (heuristique locale — pas d\'appel LLM)');
        const rec = [];
        if (mapped < total) rec.push(`Lier les ${total - mapped} entrée(s) sans nodeId.`);
        if (byStatus('FAIL')) rec.push('Corriger les entrées FAIL en priorité.');
        if (byStatus('PENDING')) rec.push('Lancer/écrire les tests PENDING.');
        if (!rec.length) rec.push('Couverture complète — poser la prochaine feature sur ce Wire Map.');
        L.push(rec.map((r) => `- ${r}`).join('\n'));
        setWmAudit(L.join('\n'));
      }, [wm]);

      // Load projects + repo files once; auto-open first project.
      useEffect(() => {
        loadWmProjects().then((ps) => { if (ps[0]) loadWmProject(ps[0].id); });
        fetch('/api/repo/files?ext=.ts').then((r) => r.json()).then((j) => setWmFiles(j.files || [])).catch(() => {});
      }, [loadWmProjects, loadWmProject]);

      // ================= Library (brick store, Passe 1) =================
      // GET the summary list (server auto-seeds from agent_registry when empty).
      const loadLibrary = useCallback(async () => {
        try {
          const r = await fetch('/api/library');
          const j = await r.json();
          setLibBricks(j.bricks || []);
          return j.bricks || [];
        } catch { return []; }
      }, []);
      // Open a brick in the editor (fetches the full payload).
      const loadBrick = useCallback(async (id) => {
        try {
          const r = await fetch('/api/library/' + encodeURIComponent(id));
          if (!r.ok) { setStatus({ msg: '❌ brique introuvable', kind: 'error' }); return; }
          const b = await r.json();
          setLibEditing(b);
          setLibPermText(JSON.stringify(b.payload && b.payload.permissions ? b.payload.permissions : {}, null, 2));
        } catch { setStatus({ msg: '❌ chargement brique échoué', kind: 'error' }); }
      }, []);
      // Start a fresh draft brick (agent or prompt) in the editor (not yet persisted).
      const newBrick = useCallback((kind = 'agent') => {
        const id = kind + '-' + Date.now().toString(36);
        const maker = kind === 'prompt' ? newPromptBrick : kind === 'oracle' ? newOracleBrick : kind === 'chain' ? newChainBrick : kind === 'goal' ? newGoalBrick : kind === 'roadmap' ? newRoadmapBrick : kind === 'outputformat' ? newOutputFormatBrick : kind === 'router' ? newRouterBrick : kind === 'tool' ? newToolBrick : kind === 'note' ? newNoteBrick : kind === 'artefact' ? newArtefactBrick : newAgentBrick;
        setLibEditing(maker(id));
        setLibPermText('{}');
      }, []);
      const patchBrick = useCallback((patch) => {
        setLibEditing((b) => b ? { ...b, ...patch } : b);
      }, []);
      const patchBrickPayload = useCallback((patch) => {
        setLibEditing((b) => b ? { ...b, payload: { ...b.payload, ...patch } } : b);
      }, []);
      // ---- Roadmap milestone edit helpers (Passe 5) ----
      const addMilestone = useCallback(() => {
        setLibEditing((b) => {
          if (!b) return b;
          const ms = b.payload.milestones || [];
          const m = { id: 'ms-' + (ms.length + 1) + '-' + Date.now().toString(36), title: 'Nouveau jalon', description: '', status: 'todo', goalRef: null };
          return { ...b, payload: { ...b.payload, milestones: [...ms, m] } };
        });
      }, []);
      const updateMilestone = useCallback((idx, patch) => {
        setLibEditing((b) => {
          if (!b) return b;
          const ms = (b.payload.milestones || []).map((m, i) => i === idx ? { ...m, ...patch } : m);
          return { ...b, payload: { ...b.payload, milestones: ms } };
        });
      }, []);
      const removeMilestone = useCallback((idx) => {
        setLibEditing((b) => {
          if (!b) return b;
          const ms = (b.payload.milestones || []).filter((_, i) => i !== idx);
          return { ...b, payload: { ...b.payload, milestones: ms } };
        });
      }, []);
      // Persist the brick being edited. Permissions come from the JSON buffer;
      // invalid JSON aborts the save with a readable status (no silent corruption).
      // Dette technique soldée — race condition de saveBrick.
      // Auparavant `setLibEditing(doc)` tournait APRÈS un `await`, si bien que deux
      // sauvegardes rapprochées (~100ms) pouvaient se marcher dessus : la reprise de
      // la 1re écrasait l'état posé par la 2de (stale). Correction = FILE D'ATTENTE :
      // chaque sauvegarde (enqueueSave) est chaînée après la précédente (saveChainRef)
      // et ne démarre qu'une fois celle-ci pleinement résolue. Garantit l'ordre
      // d'écriture serveur ET que l'état final (setLibEditing) reflète la DERNIÈRE
      // sauvegarde, jamais un intermédiaire corrompu, sans perte silencieuse.
      const saveChainRef = useRef(Promise.resolve());
      const enqueueSave = useCallback((doc) => {
        const doSave = async () => {
          try {
            const r = await fetch('/api/library/' + encodeURIComponent(doc.id), {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(doc),
            });
            if (!r.ok) { setStatus({ msg: '❌ sauvegarde brique échouée', kind: 'error' }); return; }
            setLibEditing(doc);
            await loadLibrary();
            setStatus({ msg: '✅ Brique « ' + doc.name + ' » sauvegardée', kind: 'ok' });
          } catch { setStatus({ msg: '❌ réseau — sauvegarde impossible', kind: 'error' }); }
        };
        const p = saveChainRef.current.then(doSave, doSave); // enfile après la précédente
        saveChainRef.current = p;
        return p;
      }, [loadLibrary]);
      const saveBrick = useCallback(() => {
        const b = libEditing;
        if (!b) return Promise.resolve();
        let payload = b.payload;
        // Permissions live in a separate JSON textarea buffer — AGENT bricks only.
        // Prompt bricks edit their payload directly (via patchBrickPayload).
        if (b.kind === 'agent') {
          let permissions;
          try { permissions = JSON.parse(libPermText || '{}'); }
          catch { setStatus({ msg: '❌ permissions : JSON invalide', kind: 'error' }); return Promise.resolve(); }
          if (permissions === null || typeof permissions !== 'object' || Array.isArray(permissions)) {
            setStatus({ msg: '❌ permissions doit être un objet JSON', kind: 'error' }); return Promise.resolve();
          }
          payload = { ...b.payload, permissions };
        }
        const doc = { ...b, payload, updated: new Date().toISOString() };
        return enqueueSave(doc);
      }, [libEditing, libPermText, enqueueSave]);
      // Test seam (comme window.__ui / __setGraph) : permet de tirer deux sauvegardes
      // dans le MÊME tick pour valider la file d'attente (dette 1). Non utilisé par l'UI.
      useEffect(() => { window.__enqueueSave = enqueueSave; }, [enqueueSave]);
      // Duplicate: new id, maturity "draft", content otherwise identical.
      const duplicateBrick = useCallback(async (id) => {
        try {
          const r = await fetch('/api/library/' + encodeURIComponent(id));
          if (!r.ok) { setStatus({ msg: '❌ brique introuvable', kind: 'error' }); return; }
          const src = await r.json();
          const now = new Date().toISOString();
          const newId = 'agent-' + Date.now().toString(36);
          const copy = { ...src, id: newId, maturity: 'draft', created: now, updated: now };
          await fetch('/api/library/' + encodeURIComponent(newId), {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(copy),
          });
          await loadLibrary();
          setLibEditing(copy);
          setLibPermText(JSON.stringify(copy.payload && copy.payload.permissions ? copy.payload.permissions : {}, null, 2));
          setStatus({ msg: '✅ Dupliqué → ' + newId + ' (draft)', kind: 'ok' });
        } catch { setStatus({ msg: '❌ duplication échouée', kind: 'error' }); }
      }, [loadLibrary]);
      const deleteBrick = useCallback(async (id) => {
        try {
          await fetch('/api/library/' + encodeURIComponent(id), { method: 'DELETE' });
          setLibEditing((e) => (e && e.id === id ? null : e));
          await loadLibrary();
          setStatus({ msg: '🗑️ Brique supprimée', kind: '' });
        } catch { setStatus({ msg: '❌ suppression échouée', kind: 'error' }); }
      }, [loadLibrary]);
      // Attach a brick's payload onto an agent node's data (payload wins on overlap;
      // node id/position are top-level and untouched). The link label is stored
      // top-level (attachedBrick) so toEngineGraph drops it from the engine graph.
      const attachBrickToNode = useCallback(async (nodeId, brickId) => {
        const { setNodes, nodes } = F; // attach onto the FOCUSED zone's node
        if (!brickId) {
          setNodes((ns) => ns.map((n) => n.id === nodeId
            ? (() => { const { attachedBrick, ...rest } = n; const { producerRef, ...restData } = (n.data || {}); return { ...rest, data: restData }; })()
            : n));
          return;
        }
        try {
          const r = await fetch('/api/library/' + encodeURIComponent(brickId));
          if (!r.ok) { setStatus({ msg: '❌ brique introuvable', kind: 'error' }); return; }
          const brick = await r.json();
          const payload = brick.payload || {};
          // producerRef = the brick that PRODUCES this node's output (provenance).
          // Transmitted in data (survives toEngineGraph) so the API can enforce the
          // no-self-validation rule (Oracle can't judge output from its own brick).
          setNodes((ns) => {
            // Composite agent → ALSO fill the 7 SATELLITES from the fiche (the carte
            // d'identité). The central node keeps the historical full merge (role +
            // governance + engine params) so saved chains / inspector / API provenance are
            // unchanged; completeness is computed from the SATELLITES, so the central copy
            // is inert to the card. Legacy agents (no satellites) get only the merge.
            const hasComps = agentComponentsOf(nodeId, ns).length > 0;
            return ns.map((n) => {
              if (n.id === nodeId) {
                // Reset divergence on import so the composed prompt reflects the fiche
                // immediately (the derived-prompt effect recomposes on this nodes change).
                // Stamp la vérité de câblage de la fiche sur le nœud : sourceRef + wiredStatus
                // effectif (documented-only par défaut si la fiche est importée sans champ).
