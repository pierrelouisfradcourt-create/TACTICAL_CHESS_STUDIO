<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM-Lego — Builder Council</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Monaco', 'Courier New', monospace; background: #0b0f19; color: #e0e7ff; height: 100vh; overflow: hidden; }
    #root { height: 100vh; }
    .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
    header { padding: 10px 16px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; gap: 14px; }
    header h1 { font-size: 15px; background: linear-gradient(to right, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    header .sub { font-size: 10px; color: #94a3b8; }
    .toolbar { display: flex; gap: 6px; margin-left: auto; align-items: center; flex-wrap: wrap; }
    button { background: #6366f1; border: none; color: white; padding: 7px 12px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 11px; transition: all .15s; }
    button:hover { background: #4f46e5; }
    button:active { transform: scale(.98); }
    button:disabled { background: #64748b; cursor: not-allowed; opacity: .5; }
    button.ghost { background: #334155; }
    button.ghost:hover { background: #475569; }
    button.palette { background: #1e293b; border: 1px solid #334155; text-align: left; }
    button.danger { background: #7f1d1d; }
    button.danger:hover { background: #991b1b; }
    select, .field input, .field textarea, textarea, input { width: 100%; background: #0f172a; border: 1px solid #475569; border-radius: 4px; color: #e0e7ff; font-family: inherit; font-size: 11px; padding: 6px; }
    select:focus, input:focus, textarea:focus { outline: none; border-color: #6366f1; }
    .body { display: grid; grid-template-columns: 160px 1fr 350px; height: 100%; overflow: hidden; }
    .col { overflow: auto; border-right: 1px solid #1e293b; }
    .col.right { border-right: none; border-left: 1px solid #1e293b; }
    .col h2 { font-size: 10px; color: #6366f1; text-transform: uppercase; letter-spacing: 1px; padding: 12px 12px 6px; }
    .palette-list { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px; }
    .pal-item { position: relative; }
    .pal-menu { position: absolute; left: 6px; top: calc(100% + 2px); z-index: 30; background: #0f172a;
      border: 1px solid #475569; border-radius: 6px; padding: 4px; min-width: 152px; box-shadow: 0 8px 22px rgba(0,0,0,.6); }
    .pal-menu-h { font-size: 9px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; padding: 4px 6px 2px; }
    .pal-menu-i { display: block; width: 100%; text-align: left; background: transparent; border: none;
      color: #e0e7ff; padding: 6px; font-size: 11px; border-radius: 4px; }
    .pal-menu-i:hover { background: #1e293b; }
    .badge-real { background: #065f46; color: #6ee7b7; font-size: 8px; padding: 1px 5px; border-radius: 3px; margin-right: 6px; font-weight: bold; }
    .badge-target { background: #7c2d12; color: #fdba74; font-size: 8px; padding: 1px 5px; border-radius: 3px; margin-right: 6px; font-weight: bold; }
    .badge-demo { background: #1e3a8a; color: #93c5fd; font-size: 8px; padding: 1px 5px; border-radius: 3px; margin-right: 6px; font-weight: bold; }
    /* Library maturity pill (draft → saved → live). Purely informative. */
    .lib-maturity { font-size: 8px; padding: 1px 6px; border-radius: 8px; font-weight: bold; text-transform: uppercase; }
    .lib-maturity[data-maturity="draft"] { background: #334155; color: #cbd5e1; }
    .lib-maturity[data-maturity="saved"] { background: #065f46; color: #6ee7b7; }
    .lib-maturity[data-maturity="live"]  { background: #7c2d12; color: #fdba74; }
    /* wiredStatus — vérité de câblage runtime (épistémique). Pastille informative,
       même patron que maturity/badge. unset/documented-only = « on ne sait pas si ça
       tourne » ; wired = vérifié ; broken = audité ET cassé. */
    .lib-wired { font-size: 8px; padding: 1px 6px; border-radius: 8px; font-weight: bold; text-transform: uppercase; }
    .lib-wired[data-wired="unset"]           { background: #334155; color: #cbd5e1; }
    .lib-wired[data-wired="documented-only"] { background: #3b2f14; color: #fcd34d; }
    .lib-wired[data-wired="wired"]           { background: #064e3b; color: #6ee7b7; }
    .lib-wired[data-wired="broken"]          { background: #7f1d1d; color: #fca5a5; }
    /* Brouillard d'audit (épistémique — « on ne sait pas ») : le CORPS du nœud est flouté
       quand la source est déclarée (sourceRef) mais NON vérifiée (wiredStatus unset ou
       documented-only). Le TITRE (.nhead) reste TOUJOURS net et lisible (cf. cadrage). */
    .node.node-fog .nbody      { filter: blur(1.4px); opacity: 0.8; }
    .node.node-fog .node-brick { filter: blur(1px); opacity: 0.85; }
    /* Danger (qualité — « on sait, et c'est cassé ») : wiredStatus broken. Bordure/teinte
       vive, JAMAIS de flou. Mutuellement exclusif de node-fog PAR CONSTRUCTION : nodeAudit
       court-circuite sur 'broken' avant toute condition de brume — les deux ne se
       chevauchent jamais. */
    .node.node-danger { outline: 2px solid #f97316; outline-offset: 1px; box-shadow: 0 0 9px rgba(249,115,22,0.55); }
    .node-danger-tag { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); z-index: 6;
      background: #7f1d1d; color: #fecaca; border: 1.5px solid #f97316; border-radius: 8px;
      font-size: 9px; font-weight: bold; padding: 1px 6px; white-space: nowrap; }
    /* Attached-brick label under a node title. */
    .node-brick { padding: 2px 9px 4px; font-size: 8px; color: #93c5fd; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #334155; }
    .resize-handle { position: absolute; right: -3px; bottom: -3px; width: 14px; height: 14px; cursor: nwse-resize; z-index: 6;
      background: linear-gradient(135deg, transparent 45%, #94a3b8 45%, #94a3b8 60%, transparent 60%, transparent 72%, #94a3b8 72%, #94a3b8 88%, transparent 88%); }
    .title-input { font-size: 11px; font-weight: bold; padding: 1px 4px; width: 120px; }
    .clip-warn { color: #fbbf24; }
    .canvas-wrap { position: relative; overflow: hidden; background:
      radial-gradient(circle, #1e293b 1px, transparent 1px) 0 0 / 24px 24px, #0b0f19; }
    .canvas { position: absolute; inset: 0; overflow: auto; }
    svg.edges { position: absolute; top: 0; left: 0; pointer-events: none; }
    /* Chantier 2 — zoom/pan. .world carries the SCROLL extent (contentW*zoom); .world-scale
       holds the svg+nodes at 1:1 and is CSS-scaled, so all pointer math (toCanvas) only has
       to divide by zoom. Overlays/hints stay OUTSIDE .world so they never scale. */
    .world { position: relative; }
    .world-scale { position: relative; transform-origin: 0 0; }
    .canvas.space-pan { cursor: grab; }
    .canvas.panning { cursor: grabbing; }
    .zoom-ctl { position: absolute; right: 10px; bottom: 10px; z-index: 45; display: flex; align-items: center;
      gap: 2px; background: rgba(15,23,42,.92); border: 1px solid #334155; border-radius: 8px; padding: 3px;
      box-shadow: 0 2px 10px rgba(0,0,0,.5); user-select: none; }
    .zoom-ctl button { width: 26px; height: 24px; padding: 0; font-size: 13px; line-height: 1; }
    .zoom-ctl .zlvl { min-width: 42px; text-align: center; font-size: 10px; color: #cbd5e1; }
    /* Chantier 3 — alternative edge visual styles (purely cosmetic; edge behaviour unchanged).
       The casing path stays SOLID under every style, so crossings keep their line-jump legibility. */
    @keyframes tcs-stream { to { stroke-dashoffset: -32; } }
    .edge-stream { animation: tcs-stream 0.9s linear infinite; }
    .edge-style-pick { display: flex; gap: 4px; }
    .edge-style-pick button { flex: 1; font-size: 10px; padding: 4px 2px; background: #1e293b;
      border: 1px solid #334155; color: #cbd5e1; border-radius: 5px; }
    .edge-style-pick button.active { background: #312e81; border-color: #6366f1; color: #e0e7ff; }
    /* Chantier 1 — split Active / Sandbox. The middle grid cell is a vertical flex of two
       CanvasSurface panes separated by a draggable bar. Each pane is a full CanvasSurface. */
    .canvas-split { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .split-pane { min-height: 0; display: flex; flex-direction: column; position: relative; }
    .canvas-split .canvas-wrap { flex: 1 1 auto; min-height: 0; }
    .split-bar { flex: 0 0 7px; cursor: row-resize; background: #1e293b; border-top: 1px solid #334155;
      border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: center; }
    .split-bar::before { content: ''; width: 40px; height: 3px; border-radius: 2px; background: #475569; }
    .split-bar:hover { background: #263449; }
    .split-bar:hover::before { background: #6366f1; }
    /* Sandbox pane: warm-tinted grid so it reads as a distinct, non-executable scratch space. */
    .canvas-wrap.is-sandbox { background:
      radial-gradient(circle, #2a2418 1px, transparent 1px) 0 0 / 24px 24px, #14100a; }
    .zone-tag { position: absolute; top: 6px; left: 8px; z-index: 46; font-size: 9px; font-weight: bold;
      letter-spacing: 1px; text-transform: uppercase; padding: 2px 8px; border-radius: 5px; pointer-events: none;
      background: rgba(99,102,241,.16); border: 1px solid #6366f1; color: #c7d2fe; }
    .canvas-wrap.is-sandbox .zone-tag { background: rgba(217,119,6,.16); border-color: #d97706; color: #fcd34d; }
    .sandbox-bar { display: flex; align-items: center; gap: 8px; padding: 4px 8px; background: #14100a;
      border-top: 1px solid #3f2d0f; font-size: 10px; color: #fcd34d; }
    .sandbox-bar button { font-size: 10px; padding: 3px 8px; }
    .node { position: absolute; width: 172px; background: #1e293b; border: 2px solid #334155; border-radius: 8px; user-select: none; box-shadow: 0 4px 14px rgba(0,0,0,.4); cursor: grab; display: flex; flex-direction: column; }
    .node:active { cursor: grabbing; }
    .node.selected { border-color: #c4b5fd; box-shadow: 0 0 0 2px rgba(196,181,253,.5); }
    .node .nhead { padding: 6px 9px; font-size: 11px; font-weight: bold; border-radius: 6px 6px 0 0; cursor: grab; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .node .nhead:active { cursor: grabbing; }
    .node .nbody { padding: 6px 9px; font-size: 9px; color: #94a3b8; word-break: break-word; flex: 1 1 auto; min-height: 0; overflow: auto; }
    .handle.clipped { opacity: 0.2 !important; pointer-events: none; }
    .node .ntype { font-size: 8px; opacity: .85; text-transform: uppercase; background: rgba(0,0,0,.25); padding: 1px 5px; border-radius: 3px; }
    .node.note { background: #3f3a12; border-color: #a16207; width: 180px; }
    /* Artefact = non-executable deliverable. Distinct sky/deliverable look, clearly
       different from a Note (yellow) and from executable nodes. */
    .node.artefact { background: #0c2a3a; border-color: #0ea5e9; border-style: dashed; width: 180px; }
    .node.artefact .nhead { background: #0ea5e9; }
    .node.artefact .agcomp { color: #7dd3fc; }
    .node.note .nhead { background: #a16207; cursor: grab; }
    .node.note textarea { background: #4a4314; border-color: #a16207; color: #fef9c3; font-size: 10px; height: 70px; }
    /* ---- Calques (layers) : superposition + delta visuel ---- */
    .node.layer-added    { box-shadow: 0 0 0 2px #22c55e, 0 0 14px rgba(34,197,94,.55); }
    .node.layer-removed  { opacity: .5; filter: grayscale(.4); box-shadow: 0 0 0 2px #ef4444; }
    .node.layer-modified { box-shadow: 0 0 0 2px #f59e0b, 0 0 14px rgba(245,158,11,.5); }
    .layer-diff-tag { position: absolute; top: -9px; right: 6px; font-size: 9px; font-weight: bold;
      padding: 1px 6px; border-radius: 8px; color: #0b0f19; z-index: 3; pointer-events: none; }
    .layer-diff-added    { background: #22c55e; }
    .layer-diff-removed  { background: #ef4444; color: #fff; }
    .layer-diff-modified { background: #f59e0b; }
    .layers-ro-banner { position: absolute; top: 8px; right: 12px; z-index: 20;
      background: #1e293b; border: 1px solid #f59e0b; color: #fbbf24; font-size: 11px; font-weight: bold;
      padding: 4px 12px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
    .layers-menu { min-width: 260px; max-height: 70vh; overflow: auto; }
    .layer-row { display: flex; align-items: center; gap: 6px; padding: 4px 8px; font-size: 12px; }
    .layer-row:hover { background: rgba(99,102,241,.12); }
    .layer-row input[type=checkbox] { cursor: pointer; }
    .layer-row .layer-upd { margin-left: auto; background: none; border: none; color: #38bdf8; cursor: pointer; font-size: 13px; padding: 0 4px; }
    .layer-row .layer-upd:disabled { opacity: .35; cursor: not-allowed; }
    .layer-row .layer-del { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 13px; padding: 0 4px; }
    .layer-save-row { display: flex; gap: 4px; padding: 6px 8px; border-bottom: 1px solid #334155; }
    .layer-save-row input { flex: 1; min-width: 0; background: #0b0f19; border: 1px solid #334155; color: #e2e8f0; border-radius: 4px; padding: 3px 6px; font-size: 12px; }
    .handle { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #6366f1; border: 2px solid #0b0f19; top: 50%; transform: translateY(-50%); }
    .handle.out { right: -8px; cursor: crosshair; }
    .handle.in { left: -8px; }
    .handle.out:hover { background: #a78bfa; transform: translateY(-50%) scale(1.25); }
    /* 4-sided handles (used by note nodes) — same visual style as node handles. */
    .handle.left { left: -8px; }
    .handle.right { right: -8px; }
    .handle.top { top: -8px; bottom: auto; left: 50%; transform: translateX(-50%); }
    .handle.bottom { top: auto; bottom: -8px; left: 50%; transform: translateX(-50%); }
    .handle.draggable { cursor: crosshair; }
    /* Friction #1 — bigger HIT zone than the visible dot: a transparent ring the
       parent handle still receives the mousedown for. ~30px target vs 14px dot. */
    .handle.draggable::before { content: ''; position: absolute; inset: -8px; border-radius: 50%; }
    /* Hover feedback: brighter + a halo (box-shadow doesn't affect the transform that
       centres the dot on its side, so positioning stays correct). */
    .handle.draggable:hover { background: #a78bfa; box-shadow: 0 0 0 5px rgba(167,139,250,.4); }
    /* note handles use the warm note accent so they read as decorative. */
    .node.note .handle { background: #d97706; }
    .node.note .handle:hover { background: #f59e0b; }
    .node.flowed { border-color: #34d399; }
    .order-badge { position: absolute; top: -10px; left: -10px; z-index: 5; background: #065f46; color: #d1fae5;
      border: 1.5px solid #34d399; border-radius: 10px; min-width: 20px; height: 20px; padding: 0 5px;
      font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
    /* Carte d'identité — agent health badge (top-right of a composite agent node). */
    .card-badge { position: absolute; top: -10px; right: -10px; z-index: 6; border-radius: 10px;
      padding: 0 6px; height: 20px; font-size: 10px; font-weight: bold; display: flex; align-items: center;
      justify-content: center; white-space: nowrap; }
    .card-badge.card-ok { background: #064e3b; color: #a7f3d0; border: 1.5px solid #10b981; }
    .card-badge.card-warn { background: #4a2b05; color: #fde68a; border: 1.5px solid #f59e0b; }
    /* Agent component satellites — compact; filled=green solid, empty=grey dashed. */
    .node.agent-component { width: 94px; min-height: 44px; background: #292524; border-radius: 7px;
      box-shadow: 0 2px 8px rgba(0,0,0,.35); cursor: grab; }
    .node.agent-component.comp-filled { border: 2px solid #10b981; }
    .node.agent-component.comp-empty { border: 2px dashed #6b7280; opacity: .92; }
    .node.agent-component .comp-head { padding: 5px 6px; font-size: 9px; font-weight: bold; color: #e7e5e4;
      display: flex; align-items: center; gap: 4px; line-height: 1.25; }
    .node.agent-component .comp-dot { font-size: 9px; }
    .node.agent-component.comp-filled .comp-dot { color: #34d399; }
    .node.agent-component.comp-empty .comp-dot { color: #9ca3af; }
    .node.agent-component .comp-label { word-break: break-word; }
    .flux { font-size: 10px; color: #cbd5e1; padding: 0 12px 10px; line-height: 1.7; word-break: break-word; }
    .flux .fluxn { background: #065f46; color: #d1fae5; border-radius: 8px; padding: 0 5px; font-weight: bold; }
    .inspector { padding: 8px 12px; }
    .field { margin-bottom: 9px; }
    .field.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .field label { display: block; font-size: 9px; color: #94a3b8; margin-bottom: 3px; text-transform: uppercase; letter-spacing: .5px; }
    .field textarea { resize: vertical; }
    .hint { font-size: 9px; color: #64748b; margin-top: 2px; }
    .err { color: #f87171; font-size: 10px; margin-top: 4px; }
    .banner { padding: 8px 12px; border-radius: 4px; font-size: 11px; margin: 0 12px 10px; }
    .banner.error { background: rgba(248,113,113,.12); border: 1px solid #f87171; color: #fca5a5; white-space: pre-wrap; }
    .trace-step { background: #0f172a; border-left: 3px solid #6366f1; padding: 7px 8px; margin: 0 12px 7px; border-radius: 2px; font-size: 10px; }
    .trace-step.is-error { border-left-color: #f87171; }
    .trace-step.is-loop { border-left-color: #fbbf24; }
    .trace-step .sid { font-weight: bold; color: #818cf8; font-size: 11px; display: flex; justify-content: space-between; }
    .trace-step .iter { color: #fbbf24; font-size: 9px; background: rgba(251,191,36,.12); padding: 1px 6px; border-radius: 8px; }
    .trace-step .det { color: #94a3b8; margin-top: 3px; }
    .trace-step .route { color: #fbbf24; margin-top: 3px; }
    .trace-step .dec { color: #34d399; margin-top: 3px; }
    .trace-step .terr { color: #f87171; margin-top: 3px; }
    pre.state { font-size: 10px; color: #cbd5e1; white-space: pre-wrap; word-break: break-all; padding: 8px 12px; margin: 0; }
    .empty { color: #64748b; font-size: 11px; padding: 16px 12px; text-align: center; }
    details { margin: 0 12px 10px; }
    details summary { font-size: 10px; color: #6366f1; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
    details pre { font-size: 9px; color: #94a3b8; white-space: pre-wrap; word-break: break-all; margin-top: 6px; background: #0f172a; padding: 6px; border-radius: 4px; max-height: 200px; overflow: auto; }
    .status { font-size: 10px; }
    .status.error { color: #f87171; } .status.ok { color: #10b981; } .status.busy { color: #fbbf24; }
    .legend { font-size: 9px; color: #64748b; padding: 0 12px 10px; line-height: 1.5; }
    .setting-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #cbd5e1; cursor: pointer; }
    .setting-row input { width: auto; }
    /* ---- Wire Map ---- */
    .wm { padding: 8px 10px; font-size: 10px; }
    .wm-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    .wm-scroll { overflow: auto; max-height: calc(100vh - 190px); border: 1px solid #1e293b; border-radius: 6px; }
    table.wm-t { border-collapse: collapse; font-size: 10px; width: 100%; }
    table.wm-t th, table.wm-t td { border: 1px solid #1e293b; padding: 4px 6px; text-align: left; vertical-align: top; white-space: nowrap; }
    table.wm-t th { position: sticky; top: 0; background: #0f172a; color: #6366f1; z-index: 1; text-transform: uppercase; font-size: 8px; letter-spacing: .5px; }
    table.wm-t input, table.wm-t select { font-size: 10px; padding: 2px 4px; min-width: 60px; }
    /* Correction 4 — traffic-light colour dropdown (pastille + closed choice). */
    .wm-color-cell { display: flex; align-items: center; gap: 5px; }
    .wm-pastille { width: 14px; height: 14px; border-radius: 50%; flex: 0 0 auto; border: 1px solid rgba(255,255,255,.25); }
    select.wm-color-select { min-width: 84px; }
    table.wm-t input.wide { min-width: 120px; width: 100%; }
    /* compact view: Nœud column always readable */
    table.wm-t th.wm-col-node, table.wm-t td.wm-col-node { min-width: 140px; max-width: 220px; }
    .wm-node-name { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
    .wm-expand-btn { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; padding: 2px 6px; border-radius: 4px; font-size: 9px; white-space: nowrap; }
    .wm-expand-btn:hover { background: #334155; }
    tr.wm-detail td { background: #0b0f19; }
    .wm-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; white-space: normal; }
    .wm-detail-grid .wm-f { display: flex; flex-direction: column; gap: 2px; }
    .wm-detail-grid .wm-f > label { font-size: 8px; color: #64748b; text-transform: uppercase; letter-spacing: .5px; }
    .wm-detail-grid .wm-f.full { grid-column: 1 / -1; }
    .wm-badge { padding: 1px 6px; border-radius: 8px; font-size: 9px; font-weight: bold; color: #0b0f19; }
    .wm-chip { display: inline-block; background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 1px 5px; margin: 1px; cursor: pointer; color: #93c5fd; }
    .wm-chip:hover { background: #334155; }
    .wm-link { background: none; border: none; color: #93c5fd; cursor: pointer; text-decoration: underline; padding: 0; font-size: 10px; }
    .wm-unmapped { color: #94a3b8; }
    .wm-modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100; display: flex; align-items: center; justify-content: center; }
    .wm-modal .box { background: #0f172a; border: 1px solid #475569; border-radius: 8px; padding: 16px; width: 420px; max-height: 80vh; overflow: auto; }

  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Vendored locally (offline). Served by demo-server.ts from node_modules. -->
  <script src="/vendor/react.js"></script>
  <script src="/vendor/react-dom.js"></script>
  <script src="/vendor/babel.js"></script>

  <script type="text/jsx-source" id="builder-src">
    const { useState, useRef, useCallback, useEffect, useLayoutEffect } = React;

    // ---- Node type metadata ---------------------------------------------------
    const NODE_TYPES = {
      llm:    { label: 'LLM',    color: '#6366f1', data: () => ({ prompt: 'Your prompt here', outputKey: 'out' }) },
      tool:   { label: 'Tool',   color: '#10b981', data: () => ({ name: 'search', description: 'Web search' }) },
      // Agent = COMPOSITE. Posing an Agent (via "+ Agent") lays a central executable
      // agent node PLUS 7 SATELLITE component nodes (type "agent-component"), linked by
      // decorative edges and disposed in a row above (see addAgentComposite). The central
      // node keeps only engine params (role/model/temp…). The 7 identity components live
      // in the satellites — its "carte d'identité". NodeType stays "agent" → existing
      // graphs (Council, Chaîne idée→IMP) that carry NO satellites are untouched.
      agent:  { label: 'Agent',  color: '#f59e0b', data: () => ({ ...withRole({}, 'qwen-coder') }) },
      router: { label: 'Router', color: '#8b5cf6', data: () => ({ path: 'nodes.<id>.<key>', defaultRoute: 'chat' }) },
      // Artefact = final deliverable. NON-executable, treated EXACTLY like a Note by
      // the engine (excluded from toEngineGraph, edges touching it dropped). Accepts
      // incoming AND outgoing connections. Client-only type (like note, NOT in src).
      artefact: { label: 'Artefact', color: '#0ea5e9', data: () => ({ title: 'Livrable', description: '', artefactType: 'logiciel' }) },
      // HumanGate — a blocking checkpoint: the engine pauses here and waits for a
      // human approve/reject. `rule` reuses the Oracle vocabulary; actsAsOracle flags
      // a gate that carries a validation rule (vs a plain confirmation stop).
      humangate: { label: 'HumanGate', color: '#e11d48', data: () => ({ message: 'Valide-t-on la sortie du nœud précédent ?', rule: '', context: [], actsAsOracle: false }) },
      note:   { label: 'Note',   color: '#a16207', data: () => ({ text: 'Annotation libre (ignorée par le moteur)' }) },
      // Agent component = one satellite of an Agent's "carte d'identité". NON-executable,
      // client-only (like note/artefact — NOT in src). Excluded from toEngineGraph. Its
      // `parentId` binds it to the central agent (source of truth for grouping / cascade
      // delete / completeness — robust even if the decorative edge is removed).
      'agent-component': { label: 'Composant', color: '#78716c', data: () => ({ componentType: 'memoire', text: '', parentId: null }) },
    };

    // ---- Agent "carte d'identité" — the 7 components ---------------------------
    // Canonical order = the order they're read to the user in the block-message
    // (mémoire, skill, plugin, rôle, objectif, garde-fou, modèle). Each satellite is a
    // node typed "agent-component" whose data.componentType is one of these keys.
    const AGENT_COMPONENT_TYPES = ['memoire', 'skill', 'plugin', 'role', 'objectif', 'gardeFou', 'modele', 'sortieAttendue'];
    const AGENT_COMPONENT_META = {
      memoire:        { label: 'mémoire',        icon: '🧠' },
      skill:          { label: 'skill',          icon: '🛠️' },
      plugin:         { label: 'plugin',         icon: '🔌' },
      role:           { label: 'rôle',           icon: '🎭' },
      objectif:       { label: 'objectif',       icon: '🎯' },
      gardeFou:       { label: 'garde-fou',      icon: '🚧' },
      modele:         { label: 'modèle',         icon: '🤖' },
      // 8ᵉ satellite (cette passe) : le contrat de SORTIE de l'agent (ce qu'il doit
      // produire). Alimenté par une brique kind:"outputformat" de la Bibliothèque, ou à
      // la main. Distinct des 7 autres (qui décrivent l'ENTRÉE/l'identité) : il compose la
      // section « Format de sortie attendu » du prompt (composeAgentPrompt).
      sortieAttendue: { label: 'sortie attendue', icon: '📤' },
    };
    const AGENT_CARD_LABELS = AGENT_COMPONENT_TYPES.map((t) => AGENT_COMPONENT_META[t].label).join(', ');

    // A component's text is "filled" iff non-empty after trimming whitespace.
    function componentFilled(node) {
      return !!node && node.type === 'agent-component' && String((node.data && node.data.text) || '').trim() !== '';
    }
    // The satellite component nodes bound to a given central agent id.
    function agentComponentsOf(agentId, nodes) {
      return (nodes || []).filter((n) => n.type === 'agent-component' && n.data && n.data.parentId === agentId);
    }
    // Completeness status of an agent's carte d'identité.
    //   isComposite = the agent was posed via "+ Agent" (has ≥1 satellite). Legacy agents
    //     (Council, Chaîne idée→IMP) have NONE → isComposite=false → NOT subject to the rule.
    //   required = the canonical types this agent ACTUALLY HAS a satellite for (présence).
    //     This GRANDFATHERS agents posed before a canonical type existed: a legacy agent
    //     built with 7 satellites is never retroactively blocked for the 8th ("sortie
    //     attendue") it was never given — it stays X/7, a fresh "+ Agent" is X/8. A
    //     satellite that is present but empty still counts as required (must be filled).
    //   filled = how many required components are non-empty.
    //   complete = all required present-and-filled (tout ou rien — pas de seuil partiel).
    function agentCardStatus(agentId, nodes) {
      const comps = agentComponentsOf(agentId, nodes);
      const isComposite = comps.length > 0;
      const required = AGENT_COMPONENT_TYPES.filter((t) => comps.some((x) => x.data.componentType === t));
      let filled = 0;
      for (const t of required) {
        const c = comps.find((x) => x.data.componentType === t);
        if (componentFilled(c)) filled++;
      }
      const total = required.length;
      return { isComposite, filled, total, complete: isComposite && total > 0 && filled === total };
    }
    // Composite agents that are NOT yet complete — the ones blocking execution.
    function incompleteCompositeAgents(nodes) {
      return (nodes || [])
        .filter((n) => n.type === 'agent')
        .map((n) => ({ id: n.id, ...agentCardStatus(n.id, nodes) }))
        .filter((s) => s.isComposite && !s.complete);
    }

    // ---- Compose the LLM system prompt from the 7 satellites -------------------
    // Turns the carte d'identité into a natural-language system prompt (phrases, not a
    // labelled dump). Empty components are OMITTED entirely (no "[vide]" placeholder), so
    // a partially-filled card still reads cleanly during editing. `modele` does BOTH: it
    // appears as a "Modèle : X" section AND feeds the technical `data.model` field (the
    // same field ROLE_PRESETS/Council set and the mock llm adapter reads). Returns the
    // composed prompt text + the model value (or '' when the modele component is empty).
    function composeAgentPrompt(agentId, nodes) {
      const comps = agentComponentsOf(agentId, nodes);
      const v = (ct) => { const c = comps.find((x) => x.data.componentType === ct); return c ? String(c.data.text || '').trim() : ''; };
      const role = v('role'), objectif = v('objectif'), memoire = v('memoire'),
        skill = v('skill'), plugin = v('plugin'), gardeFou = v('gardeFou'), modele = v('modele'),
        sortie = v('sortieAttendue');
      const parts = [];
      if (role && objectif) parts.push(`Tu es ${role}. Ton objectif est ${objectif}.`);
      else if (role) parts.push(`Tu es ${role}.`);
      else if (objectif) parts.push(`Ton objectif est ${objectif}.`);
      if (memoire) parts.push(`Mémoire et contexte : ${memoire}`);
      if (skill) parts.push(`Compétences disponibles : ${skill}`);
      if (plugin) parts.push(`Outils/plugins : ${plugin}`);
      if (gardeFou) parts.push(`Contraintes et garde-fous : ${gardeFou}`);
      if (modele) parts.push(`Modèle : ${modele}`);
      // 8ᵉ satellite : le contrat de sortie, en dernière section (omise si vide, comme les
      // 7 autres). N'affecte QUE le prompt, pas le champ technique `model`.
      if (sortie) parts.push(`Format de sortie attendu : ${sortie}`);
      return { prompt: parts.join('\n\n'), model: modele };
    }

    // ---- Council agent roles --------------------------------------------------
    // Two labelled groups: the REAL v1 (scripts/council.py, IMP-198 — a 3-voice
    // parallel gate) and the UNIMPLEMENTED VISION (a 6-role pipeline from a user
    // reference diagram that exists NOWHERE in TCS — NOT kaizen_autoloop, which is
    // council 3 voices + a Claude Code CLI subprocess). Both are selectable so the
    // builder honestly shows vision vs reality. See COUNCIL_NAMING_FIX_PLAN.md.
    const ROLE_PRESETS = {
      // -- v1 réel (council.py) : gate parallèle, temp réelles, top_p/max_tokens non paramétrés --
      'PLAN_REVIEW':    { group: 'v1 réel (council.py)', model: 'claude (proxy :8765)', temperature: 0.2,  top_p: null, max_tokens: null,  color: '#6366f1' },
      'RED_TEAM':       { group: 'v1 réel (council.py)', model: 'qwen2.5-14b (:1234)',  temperature: 0.2,  top_p: null, max_tokens: null,  color: '#ef4444' },
      'DIVERGENCE':     { group: 'v1 réel (council.py)', model: 'gemini-flash',          temperature: 0.4,  top_p: null, max_tokens: null,  color: '#14b8a6' },
      // -- vision non implémentée (table de référence utilisateur) : pipeline 6 rôles, absent de TCS --
      'claude-planner':  { group: 'cible / vision (non implémentée)', model: 'Claude Opus',     temperature: 0.4,  top_p: 0.9,  max_tokens: 6000,  color: '#6366f1' },
      'qwen-redteam':    { group: 'cible / vision (non implémentée)', model: 'Qwen',            temperature: 0.7,  top_p: 0.9,  max_tokens: 3000,  color: '#ef4444' },
      'gemini-explorer': { group: 'cible / vision (non implémentée)', model: 'Gemini Flash/Pro', temperature: 0.8,  top_p: 0.95, max_tokens: 3000,  color: '#f59e0b' },
      'qwen-coder':      { group: 'cible / vision (non implémentée)', model: 'Qwen-Coder',      temperature: 0.3,  top_p: 0.9,  max_tokens: 12000, color: '#10b981' },
      'tester':          { group: 'cible / vision (non implémentée)', model: '(outils)',        temperature: null, top_p: null, max_tokens: null,  color: '#64748b' },
      'claude-reviewer': { group: 'cible / vision (non implémentée)', model: 'Claude Opus',     temperature: 0.3,  top_p: 0.9,  max_tokens: 4500,  color: '#8b5cf6' },
    };

    // Apply a role preset onto a data object: sets role+model, and sets numeric
    // params when the preset defines them (omits the key when the preset is null,
    // e.g. tester has no temperature). Preserves any other existing data keys.
    function withRole(data, role) {
      const p = ROLE_PRESETS[role];
      const out = { ...data, role };
      if (!p) return out;
      out.model = p.model;
      for (const k of ['temperature', 'top_p', 'max_tokens']) {
        if (p[k] === null || p[k] === undefined) delete out[k];
        else out[k] = p[k];
      }
      return out;
    }

    function roleColor(node) {
      if (node.type === 'agent' && node.data && ROLE_PRESETS[node.data.role]) {
        return ROLE_PRESETS[node.data.role].color;
      }
      return NODE_TYPES[node.type].color;
    }

    // ---- UI graph -> canonical engine Graph -----------------------------------
    // Drops positions/styles. EXCLUDES note AND artefact nodes entirely (pure
    // annotation / deliverable markers — the engine must never see them) and drops
    // any edge touching one. Keeps id/type/data on nodes; id/from/to(+condition,
    // +loop,+maxIterations) on edges. Robust to missing fields. EXPORTED for tests.
    // agent-component satellites (and their edges) are excluded EXACTLY like note/artefact.
    const NON_EXEC_TYPES = new Set(['note', 'artefact', 'agent-component']);
    function toEngineGraph(uiNodes, uiEdges) {
      const all = uiNodes || [];
      const exec = all.filter((n) => !NON_EXEC_TYPES.has(n.type));
      const keep = new Set(exec.map((n) => n.id));
      const nodes = exec.map((n) => {
        let data = n.data && typeof n.data === 'object' ? stripUi(n.data) : {};
        // Carte d'identité: the satellites are excluded, but their aggregate completeness
        // is stamped onto the central agent's engine data as INERT provenance metadata
        // (like oracleRef/producerRef — the engine ignores unknown keys). This is what lets
        // the API refuse an incomplete composite agent even though it never sees the
        // satellites. Only stamped for COMPOSITE agents (Option A: legacy agents unaffected).
        if (n.type === 'agent') {
          const card = agentCardStatus(n.id, all);
          if (card.isComposite) {
            data = { ...data, cardComposite: true, cardFilled: card.filled, cardTotal: card.total, cardComplete: card.complete };
          }
        }
        return { id: n.id, type: n.type, data };
      });
      const edges = (uiEdges || [])
        .filter((e) => keep.has(e.from) && keep.has(e.to))
        .map((e) => {
          const edge = { id: e.id, from: e.from, to: e.to };
          const cond = e.condition;
          if (cond !== undefined && cond !== null && String(cond).trim() !== '') {
            edge.condition = String(cond);
          }
          if (e.loop === true) {
            edge.loop = true;
            if (typeof e.maxIterations === 'number' && e.maxIterations > 0) {
              edge.maxIterations = e.maxIterations;
            }
          }
          return edge;
        });
      return { nodes, edges };
    }
    // Drop transient UI-only fields (the inspector's in-progress JSON text/error).
    function stripUi(data) {
      const { _dataText, _dataErr, ...rest } = data;
      return { ...rest };
    }
    window.toEngineGraph = toEngineGraph;

    // ---- Friction #2: humanize engine graph-validation errors -----------------
    // Maps the moteur's raw (English, technical) rejection messages to an actionable
    // French sentence. The raw message is still shown separately (dev detail). This is
    // pure PRESENTATION — the engine's validation logic (src/) is unchanged.
    function humanizeGraphError(raw) {
      const s = String(raw || '');
      let m;
      if ((m = s.match(/exactly one start node.*?found (\d+)/i))) {
        return `Ton graphe a ${m[1]} nœuds de départ possibles (aucune flèche n'arrive dessus). ` +
          `Relie-les avec des flèches pour n'en garder qu'un seul point de départ.`;
      }
      if (/unknown target node|unknown source node/i.test(s)) {
        return `Une connexion pointe vers un nœud qui n'existe pas/plus. Vérifie tes flèches.`;
      }
      if ((m = s.match(/Node "([^"]+)".*?(?:outgoing edges|Only "router")/i))) {
        return `Le nœud « ${m[1]} » a plusieurs flèches sortantes, mais seul un nœud Routeur peut ` +
          `se brancher en plusieurs directions. Insère un Routeur, ou ne garde qu'une flèche.`;
      }
      if ((m = s.match(/cycle through "([^"]+)"/i))) {
        return `Il y a une boucle non bornée passant par « ${m[1]} ». Une boucle voulue doit être ` +
          `marquée comme edge de retour (loop) avec une condition ; sinon elle est refusée.`;
      }
      if (/Loop edge.*must declare.*condition/i.test(s)) {
        return `Une flèche de boucle doit porter une condition (le verdict qui déclenche le retour, ex « NOK »).`;
      }
      return `Le moteur a rejeté le graphe. Voir le détail technique ci-dessous pour la cause exacte.`;
    }

    // ---- Examples -------------------------------------------------------------
    function exampleRouting() {
      return {
        nodes: [
          { id: 'node-analyzer', type: 'llm',    x: 40,  y: 70,  data: { prompt: 'Analyze intent. JSON {"intent":"search"|"chat"}', outputKey: 'intent' } },
          { id: 'node-router',   type: 'router', x: 300, y: 70,  data: { path: 'nodes.node-analyzer.intent', defaultRoute: 'chat' } },
          { id: 'node-search',   type: 'tool',   x: 560, y: 10,  data: { name: 'search', description: 'Web search for information' } },
          { id: 'node-chat',     type: 'llm',    x: 560, y: 170, data: { prompt: 'Provide a helpful conversational response.', outputKey: 'reply' } },
        ],
        edges: [
          { id: 'e1', from: 'node-analyzer', to: 'node-router' },
          { id: 'e2', from: 'node-router',   to: 'node-search', condition: 'search' },
          { id: 'e3', from: 'node-router',   to: 'node-chat',   condition: 'chat' },
        ],
        input: { query: 'Search for climate news' },
      };
    }

    // Council "looped" (VISION, non implémentée) — this 6-role / feedback-loop shape
    // exists NOWHERE in real TCS (verified: these role names appear only inside
    // llm-lego/). It comes from a user reference diagram (architecture-cible), NOT
    // from kaizen_autoloop. The REAL kaizen_autoloop = council 3 voices (PLAN_REVIEW/
    // RED_TEAM/DIVERGENCE) + a Claude Code CLI subprocess executor. This example only
    // demonstrates the ENGINE's loop capability (fast refinement coder/tester/reviewer),
    // dressed in the vision's role names. See COUNCIL_NAMING_FIX_PLAN.md.
    function exampleCouncilLooped() {
      return {
        nodes: [
          { id: 'planner',  type: 'agent', x: 40,  y: 40,  data: withRole({}, 'claude-planner') },
          { id: 'redteam',  type: 'agent', x: 40,  y: 150, data: withRole({}, 'qwen-redteam') },
          { id: 'explorer', type: 'agent', x: 40,  y: 260, data: withRole({}, 'gemini-explorer') },
          { id: 'coder',    type: 'agent', x: 300, y: 150, data: withRole({}, 'qwen-coder') },
          { id: 'tester',   type: 'agent', x: 520, y: 150, data: withRole({}, 'tester') },
          { id: 'reviewer', type: 'agent', x: 740, y: 150, data: withRole({ okAfter: 2 }, 'claude-reviewer') },
          { id: 'note-loop', type: 'note', x: 470, y: 300, data: { text: 'VISION NON IMPLÉMENTÉE — ces 6 rôles + boucle n_existent nulle part dans TCS. Le vrai kaizen_autoloop = council 3 voix (PLAN_REVIEW/RED_TEAM/DIVERGENCE) + subprocess Claude Code CLI. Ici on démontre seulement la boucle du moteur: reviewer NOK → coder, stop sur OK (okAfter=2) ou maxIterations. Note = ignorée par le moteur.' } },
        ],
        edges: [
          { id: 'e-p-rt', from: 'planner',  to: 'redteam' },
          { id: 'e-rt-e', from: 'redteam',  to: 'explorer' },
          { id: 'e-e-c',  from: 'explorer', to: 'coder' },
          { id: 'e-c-t',  from: 'coder',    to: 'tester' },
          { id: 'e-t-r',  from: 'tester',   to: 'reviewer' },
          { id: 'e-loop', from: 'reviewer', to: 'coder', condition: 'NOK', loop: true, maxIterations: 5 },
        ],
        input: { task: 'Implémenter la feature X' },
      };
    }

    // Council "gate v1" (réel council.py) — 3-voice gate, no loop. The engine is
    // sequential so the 3 parallel reviews are drawn as a chain; the note flags it.
    function exampleCouncilGate() {
      return {
        nodes: [
          { id: 'brief',       type: 'agent', x: 40,  y: 150, data: { name: 'brief-IMP', note: 'lit titre/objectif/fichiers/acceptance' } },
          { id: 'PLAN_REVIEW', type: 'agent', x: 280, y: 40,  data: withRole({}, 'PLAN_REVIEW') },
          { id: 'RED_TEAM',    type: 'agent', x: 280, y: 150, data: withRole({}, 'RED_TEAM') },
          { id: 'DIVERGENCE',  type: 'agent', x: 280, y: 260, data: withRole({}, 'DIVERGENCE') },
          { id: 'synthesis',   type: 'agent', x: 540, y: 150, data: { name: 'synthèse → HumanGate', note: 'pas d_auto-résolution v1' } },
          { id: 'note-gate', type: 'note', x: 280, y: 360, data: { text: 'RÉEL: les 3 voix tournent EN PARALLÈLE (timeout 120s, fallback Qwen). Moteur séquentiel → chaîne ici. BLOQUE → HumanGate (Pierre). Pas d_auto-résolution v1.' } },
        ],
        edges: [
          { id: 'g1', from: 'brief',       to: 'PLAN_REVIEW' },
          { id: 'g2', from: 'PLAN_REVIEW', to: 'RED_TEAM' },
          { id: 'g3', from: 'RED_TEAM',    to: 'DIVERGENCE' },
          { id: 'g4', from: 'DIVERGENCE',  to: 'synthesis' },
        ],
        input: { imp: 'IMP-236', lane: 'AUDIT_REQUIRED' },
      };
    }

    // ---- Loadable examples (toolbar selector) ---------------------------------
    // One entry per pre-written graph, each tagged with a maturity status that
    // REUSES the project's existing démo/réel/cible vocabulary (same badge classes
    // as the Council palette: badge-real / badge-target, plus badge-demo).
    // Selecting an item loads that graph via loadInto — same behaviour as the old
    // fixed buttons, just sourced from the dropdown. loadedMsg strings are kept
    // identical to the old buttons so the "✅ … chargé" indicator is unchanged.
    const EXAMPLE_BADGE = { demo: 'démo', real: 'réel', target: 'cible' };

    // ---- wiredStatus : vérité de câblage runtime (épistémique) -----------------
    // Troisième axe de l'enveloppe commune, à côté de maturity (cycle de vie) et badge
    // (intention). Ne dit PAS si c'est bon, dit si on SAIT que la source tourne :
    //   unset            = brique neuve, jamais rattachée à une source vérifiée
    //   documented-only  = source déclarée (sourceRef) mais jamais re-vérifiée au runtime
    //   wired            = vérifié comme réellement câblé/appelé
    //   broken           = audité ET cassé/contradictoire/interdit (≠ inconnu — c'est un DANGER)
    const WIRED_STATUS_VALUES = ['unset', 'documented-only', 'wired', 'broken'];
    const WIRED_STATUS_LABELS = {
      'unset': 'unset (non renseigné)', 'documented-only': 'documented-only (déclaré, non vérifié)',
      'wired': 'wired (vérifié câblé)', 'broken': 'broken (audité, cassé)',
    };
    // wiredStatus EFFECTIF d'une brique. Le champ explicite gagne ; sinon les briques
    // IMPORTÉES (sourceRef présent) tombent par prudence sur 'documented-only' (jamais
    // re-vérifiées après import), les briques créées à la main sur 'unset'. Dérivé à la
    // lecture — AUCUNE migration/réécriture des fichiers library/ existants.
    function brickWiredStatus(b) {
      if (b && WIRED_STATUS_VALUES.includes(b.wiredStatus)) return b.wiredStatus;
      return (b && b.sourceRef) ? 'documented-only' : 'unset';
    }
    // État d'audit VISUEL d'un nœud du canvas : brouillard (épistémique) vs danger (qualité).
    // MUTUELLEMENT EXCLUSIFS par construction — 'broken' court-circuite AVANT toute condition
    // de brume, donc un nœud ne peut jamais être à la fois flou ET danger.
    //   'danger' = wiredStatus broken (on SAIT que la source est cassée) → teinte, jamais de flou
    //   'fog'    = source déclarée (sourceRef) mais NON vérifiée (unset/documented-only) → flou léger
    //   null     = wired, ou aucune source → net, aucun traitement
    function nodeAudit(n) {
      const d = (n && n.data) || {};
      const ws = WIRED_STATUS_VALUES.includes(d.wiredStatus)
        ? d.wiredStatus : (d.sourceRef ? 'documented-only' : 'unset');
      if (ws === 'broken') return 'danger';
      if (d.sourceRef && (ws === 'unset' || ws === 'documented-only')) return 'fog';
      return null;
    }
    window.nodeAudit = nodeAudit;
    const EXAMPLES = [
      { key: 'routing', label: 'routing (search|chat)', status: 'demo',   make: exampleRouting,       loadedMsg: 'Exemple routing chargé' },

    const COMP_W = 94, COMP_H = 44; // agent-component satellites are compact

    // ---- Calques (layers) — persistence + delta ------------------------------
    // A calque = a named, detached snapshot {id,name,nodes,edges} of the ACTIVE
    // canvas. Persisted to localStorage so it survives reload. Activating ≥1 shows
    // it on the canvas (read-only from ≥2, with an added/modified/removed delta).
    const LAYERS_LS_KEY = 'llmlego.layers.v1';
    function loadLayers() {
      try { const v = JSON.parse(localStorage.getItem(LAYERS_LS_KEY) || '[]'); return Array.isArray(v) ? v : []; }
      catch { return []; }
    }
    function persistLayers(ls) {
      try { localStorage.setItem(LAYERS_LS_KEY, JSON.stringify(ls)); } catch { /* quota/private mode — in-memory still works */ }
    }
    // Stable signature of a node for equality (ignores UI-only fields).
    function layerNodeKey(n) {
      const d = { ...(n.data || {}) };
      delete d._layerDiff; delete d._dataText; delete d._dataErr;
      return JSON.stringify({ type: n.type, x: n.x, y: n.y, w: n.width, h: n.height, data: d });
    }
    // Merge the chosen calques into a single {nodes,edges} view. 1 calque = shown as-is
    // (tag 'base'). ≥2 = diff of the FIRST (base) vs the LAST (target) selected:
    // added (in target only) / removed (in base only) / modified (same id, changed) / base (unchanged).
    function mergeLayers(chosen) {
      if (chosen.length === 0) return { nodes: [], edges: [] };
      if (chosen.length === 1) {
        return {
          nodes: chosen[0].nodes.map((n) => ({ ...n, data: { ...n.data, _layerDiff: 'base' } })),
          edges: chosen[0].edges.map((e) => ({ ...e })),
        };
      }
      const base = chosen[0];
      const target = chosen[chosen.length - 1];
      const baseById = new Map(base.nodes.map((n) => [n.id, n]));
      const targById = new Map(target.nodes.map((n) => [n.id, n]));
      const out = [];
      base.nodes.forEach((bn) => {
        const tn = targById.get(bn.id);
        if (!tn) { out.push({ ...bn, data: { ...bn.data, _layerDiff: 'removed' } }); }
        else {
          const same = layerNodeKey(bn) === layerNodeKey(tn);
          out.push({ ...tn, data: { ...tn.data, _layerDiff: same ? 'base' : 'modified' } });
        }
      });
      target.nodes.forEach((tn) => {
        if (!baseById.has(tn.id)) out.push({ ...tn, data: { ...tn.data, _layerDiff: 'added' } });
      });
      const edgeMap = new Map();
      base.edges.forEach((e) => edgeMap.set(e.id, e));
      target.edges.forEach((e) => edgeMap.set(e.id, e));
      return { nodes: out, edges: [...edgeMap.values()] };
    }

      const [spacePan, setSpacePan] = useState(false); // Space held → cursor + pan-arm (mirror of spaceRef)
