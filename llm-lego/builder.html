                    <button data-testid="wm-new-submit" onClick={() => {
                      const name = document.getElementById('wm-new-name').value;
                      const root = document.getElementById('wm-new-root').value;
                      const rm = document.getElementById('wm-new-roadmap').value;
                      createProject(name, root, rm);
                    }}>Créer</button>
                    <button className="ghost" onClick={() => setWmNewOpen(false)}>Annuler</button>
                  </div>
                </div>
              </div>
            )}

            {wmViewer && (
              <div className="wm-modal wm-viewer" onMouseDown={() => setWmViewer(null)}>
                <div className="box" style={{ width: 700 }} onMouseDown={(e) => e.stopPropagation()}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
                    <b style={{ color: '#93c5fd' }} data-testid="wm-viewer-title">{wmViewer.path} : {wmViewer.from}-{wmViewer.to}</b>
                    <button className="ghost" data-testid="wm-viewer-close" onClick={() => setWmViewer(null)}>fermer</button>
                  </div>
                  <pre>{wmViewer.content.split(/\r?\n/).map((ln, i) => {
                    const num = i + 1;
                    const inRange = num >= wmViewer.from && num <= wmViewer.to;
                    return <span key={i} className={inRange ? 'hlline' : ''}>{String(num).padStart(4, ' ')}  {ln}{'\n'}</span>;
                  })}</pre>
                </div>
              </div>
            )}
          </div>
        );
      }

      return (
        <div className="app">
          <header>
            <div>
              <h1>⚙️ LLM-Lego — Builder Council</h1>
              <div className="sub">Rôles + paramètres + boucles → VRAI moteur — mockAdapters (défaut) ou LM Studio réel (toggle « réel »)</div>
            </div>
            <div className="toolbar">
              <button className={view === 'canvas' ? '' : 'ghost'} data-testid="tab-canvas"
                onClick={() => setView('canvas')}>Canvas</button>
              <button className={view === 'wiremap' ? '' : 'ghost'} data-testid="tab-wiremap"
                onClick={() => setView('wiremap')}>Wire Map</button>
              <button className={view === 'library' ? '' : 'ghost'} data-testid="tab-library"
                onClick={() => setView('library')}>Bibliothèque</button>
              {/* Calques : enregistrer le canvas Actif comme calque nommé, puis en superposer
                  plusieurs (delta added/modified/removed, lecture seule dès 2). */}
              <div className="pal-item">
                <button className={activeLayerIds.length ? '' : 'ghost'} data-testid="btn-layers"
                  onClick={(ev) => { ev.stopPropagation(); setLayersMenuOpen((o) => !o); }}
                  title="Enregistrer / superposer des calques du canvas Actif">
                  📚 Calques{activeLayerIds.length ? ` (${activeLayerIds.length})` : ''}
                </button>
                {layersMenuOpen && (
                  <div className="pal-menu layers-menu" data-testid="layers-menu" onClick={(ev) => ev.stopPropagation()}>
                    <div className="pal-menu-h">Calques — canvas Actif</div>
                    <div className="layer-save-row">
                      <input data-testid="layer-name-input" placeholder="Nom du calque…" value={layerName}
                        onChange={(e) => setLayerName(e.target.value)}
                        onKeyDown={(e) => { if (e.key === 'Enter') saveActiveAsLayer(); }} />
                      <button data-testid="layer-save" onClick={saveActiveAsLayer}
                        title="Enregistrer le canvas Actif courant comme nouveau calque">＋ Enregistrer</button>
                    </div>
                    {layers.length === 0 && (
                      <div className="pal-menu-h" data-testid="layers-empty" style={{ opacity: .7, fontStyle: 'italic' }}>
                        Aucun calque. Pose des nœuds puis « ＋ Enregistrer ».
                      </div>
                    )}
                    {layers.map((l) => {
                      const idx = activeLayerIds.indexOf(l.id);
                      return (
                        <label key={l.id} className="layer-row" data-testid={'layer-row-' + l.id}>
                          <input type="checkbox" data-testid={'layer-toggle-' + l.id}
                            checked={idx >= 0} onChange={() => toggleLayer(l.id)} />
                          <span>{l.name}</span>
                          <span style={{ opacity: .6, fontSize: 10 }}>({l.nodes.length}n)</span>
                          {idx >= 0 && (
                            <span style={{ fontSize: 9, color: idx === 0 ? '#38bdf8' : '#f59e0b' }}>
                              {idx === 0 ? 'base' : (idx === activeLayerIds.length - 1 ? 'cible' : '·')}
                            </span>
                          )}
                          <button className="layer-upd" data-testid={'layer-update-' + l.id} disabled={layersReadOnly}
                            onClick={(e) => { e.preventDefault(); e.stopPropagation(); updateLayer(l.id); }}
                            title={layersReadOnly ? 'Lecture seule (2+ calques) — ré-enregistrement impossible'
                              : 'Ré-enregistrer ce calque avec le canvas Actif courant (écrase)'}>💾</button>
                          <button className="layer-del" data-testid={'layer-del-' + l.id}
                            onClick={(e) => { e.preventDefault(); e.stopPropagation(); deleteLayer(l.id); }}
                            title="Supprimer ce calque">🗑</button>
                        </label>
                      );
                    })}
                    {activeLayerIds.length >= 2 && (
                      <div className="pal-menu-h" data-testid="layers-menu-ro" style={{ color: '#fbbf24', borderTop: '1px solid #334155', marginTop: 4, paddingTop: 6 }}>
                        🔒 {activeLayerIds.length} superposés — lecture seule (delta 🟩 ajouté · 🟧 modifié · 🟥 supprimé)
                      </div>
                    )}
                  </div>
                )}
              </div>
              <span style={{ width: 1, height: 20, background: '#334155', margin: '0 4px' }} />
              {/* Central view selector — replaces the fixed routing/gate/looped buttons.
                  Each option carries a démo/réel/cible maturity badge (same vocab as
                  the Council palette) so a target is never mistaken for something real. */}
              <div className="pal-item" data-testid="example-selector">
                <button className="ghost" data-testid="example-dropdown"
                  onClick={(ev) => { ev.stopPropagation(); setMenu(menu === 'examples' ? null : 'examples'); }}>
                  Charger : ▾{loadedExample ? ' ' + EXAMPLES.find((x) => x.key === loadedExample).label : ''}
                </button>
                {menu === 'examples' && (
                  <div className="pal-menu" data-testid="example-menu" onClick={(ev) => ev.stopPropagation()} style={{ maxHeight: '70vh', overflow: 'auto' }}>
                    {/* The 3 FIXED code examples — always first, always present, NEVER
                        migrated to the store (they anchor the double-run regression). */}
                    <div className="pal-menu-h">exemples (fixes)</div>
                    {EXAMPLES.map((ex) => (
                      <button key={ex.key} className="pal-menu-i" data-testid={'example-' + ex.key}
                        onClick={() => { loadInto(ex.make(), ex.loadedMsg); setLoadedExample(ex.key); setMenu(null); }}>
                        <span className={'badge-' + ex.status}>{EXAMPLE_BADGE[ex.status]}</span>{ex.label}
                      </button>
                    ))}
                    {/* Saved chains from the library store — IN ADDITION to, below, the fixed ones. */}
                    {libBricks.filter((b) => b.kind === 'chain').length > 0 && (
                      <div className="pal-menu-h" data-testid="example-chains-sep" style={{ borderTop: '1px solid #334155', marginTop: 4, paddingTop: 6 }}>chaînes sauvegardées</div>
                    )}
                    {libBricks.filter((b) => b.kind === 'chain').map((b) => (
                      <button key={b.id} className="pal-menu-i" data-testid={'example-chain-' + b.id}
                        onClick={() => { loadChainById(b.id); setMenu(null); }}>
                        <span className={'badge-' + b.badge}>{EXAMPLE_BADGE[b.badge]}</span>{b.name}
                        <span className="lib-maturity" data-maturity={b.maturity} style={{ marginLeft: 6 }}>{b.maturity}</span>
                      </button>
                    ))}
                  </div>
                )}
              </div>
              <button className="ghost" data-testid="btn-clear" onClick={clearAll}>🗑️</button>
              <button className="ghost" data-testid="btn-save-chain"
                onClick={() => setChainSaveOpen(true)}
                disabled={nodes.filter((n) => !NON_EXEC_TYPES.has(n.type)).length === 0}
                title="Sauver le canvas courant comme chaîne réutilisable">💾 chaîne</button>
              {/* A1 — opt-in real execution. Unchecked (default) = mockAdapters. Checked =
                  route the run to the REAL local LM Studio adapter (:1234). Never auto-set. */}
              <label data-testid="live-toggle-label" title="Coché : exécution réelle sur LM Studio local (:1234, Qwen2.5-14B). Décoché : mockAdapters (par défaut, hors-ligne)."
                style={{ display: 'inline-flex', alignItems: 'center', gap: 4, fontSize: 12, color: live ? '#fdba74' : '#94a3b8', cursor: 'pointer' }}>
                <input type="checkbox" data-testid="live-toggle" checked={live} onChange={(e) => setLive(e.target.checked)} />
                {live ? '🔴 réel (LM Studio)' : '⚪ mock'}
              </label>
              <button data-testid="btn-execute" onClick={execute} disabled={busy || nodes.filter((n) => !NON_EXEC_TYPES.has(n.type)).length === 0}>
                {busy ? '⏳ …' : (live ? '▶️ Exécuter (réel)' : '▶️ Exécuter')}
              </button>
              <span className={'status ' + status.kind} data-testid="status">{status.msg}</span>
            </div>
          </header>

          <div className="body" style={{ gridTemplateColumns: (view === 'wiremap' || view === 'library') ? '160px 1fr 660px' : '160px 1fr 350px' }}>
            {/* palette */}
            <div className="col" style={{ overflow: 'visible' }}>
              <h2>Palette</h2>
              <div className="palette-list">
                {/* + LLM = simple monobloc: one plain llm node (the 7-component composite
                    now lives under + Agent). No sub-menu. */}
                <button className="palette" data-testid="add-llm" style={{ borderColor: NODE_TYPES.llm.color }} onClick={() => addNode('llm')}>＋ LLM</button>
                <button className="palette" data-testid="add-tool" style={{ borderColor: NODE_TYPES.tool.color }} onClick={() => addNode('tool')}>＋ Tool</button>
                <button className="palette" data-testid="add-router" style={{ borderColor: NODE_TYPES.router.color }} onClick={() => addNode('router')}>＋ Router</button>
                <button className="palette" data-testid="add-agent" style={{ borderColor: NODE_TYPES.agent.color }} onClick={() => addAgentComposite()}>＋ Agent</button>
                {/* Prompt/Oracle/Goal now have palette buttons too — each poses a node
                    and offers to import a matching Library brick (reuses attach fns). */}
                <button className="palette" data-testid="add-prompt" style={{ borderColor: '#3b82f6' }} onClick={() => addNodeWithImport('llm', 'prompt', { prompt: '', outputKey: 'out' })}>＋ Prompt</button>
                <button className="palette" data-testid="add-oracle" style={{ borderColor: '#f59e0b' }} onClick={() => addNodeWithImport('agent', 'oracle')}>＋ Oracle</button>
                <button className="palette" data-testid="add-goal" style={{ borderColor: '#14b8a6' }} onClick={() => addNodeWithImport('agent', 'goal')}>＋ Goal</button>
                {/* Council ▸ with format selector: Gate v1 = RÉEL (council.py, 3 voix);
                    Looped = VISION non implémentée (6 rôles hypothétiques, ≠ kaizen réel). */}
                <div className="pal-item">
                  <button className="palette" data-testid="add-council" style={{ borderColor: '#8b5cf6' }}
                    onClick={(ev) => { ev.stopPropagation(); setMenu(menu === 'council' ? null : 'council'); }}>＋ Council ▸</button>
                  {menu === 'council' && (
                    <div className="pal-menu" data-testid="council-menu" onClick={(ev) => ev.stopPropagation()}>
                      <button className="pal-menu-i" data-testid="council-gate"
                        onClick={() => addSubgraph(subgraphGateV1(), 'Council Gate v1')}>
                        <span className="badge-real">RÉEL</span>Gate v1 — 3 voix
                      </button>
                      <button className="pal-menu-i" data-testid="council-looped"
                        title="Vision non implémentée : ces 6 rôles + boucle n'existent nulle part dans TCS. Le vrai kaizen_autoloop = council 3 voix + subprocess Claude Code CLI."
                        onClick={() => addSubgraph(subgraphLooped(), 'Council Looped')}>
                        <span className="badge-target">VISION</span>Looped — 6 rôles (non implémenté)
                      </button>
                    </div>
                  )}
                </div>
                <button className="palette" data-testid="add-humangate" style={{ borderColor: NODE_TYPES.humangate.color }} onClick={() => addNode('humangate')}>＋ HumanGate</button>
                <button className="palette" data-testid="add-artefact" style={{ borderColor: NODE_TYPES.artefact.color }} onClick={() => addNode('artefact')}>🎁 ＋ Artefact</button>
                <button className="palette" data-testid="add-note" style={{ borderColor: NODE_TYPES.note.color }} onClick={() => addNode('note')}>＋ Note</button>
              </div>
              <h2>Input initial</h2>
              <div style={{ padding: '0 12px 12px' }}>
                <textarea data-testid="input-json" rows={5} value={inputText}
                  onChange={(e) => setInputText(e.target.value)} />
              </div>
              {/* Correction 3 — snap-to-grid is a CANVAS SETTING, not a view/nav tab.
                  Kept out of the toolbar's view cluster, here in a distinct panel. */}
              <h2>Réglages canvas</h2>
              <div style={{ padding: '0 12px 12px' }}>
                <label className="setting-row" title="Aligner les nœuds sur la grille lors du drag">
                  <input type="checkbox" data-testid="btn-snap" aria-pressed={snap}
                    checked={snap} onChange={() => setSnap((s) => !s)} />
                  <span>▦ snap-to-grid {snap ? '(ON)' : '(off)'}</span>
                </label>
              </div>
              <div className="legend">
                <div>━━ edge normal · 4 handles/nœud</div>
                <div style={{ color: '#fbbf24' }}>┈┈ edge de boucle (retour)</div>
                <div style={{ color: '#34d399' }}>━① flux exécuté + ordre</div>
                <div style={{ color: '#a16207' }}>▢ note = ignorée moteur</div>
              </div>
            </div>

            {/* canvas — split into ACTIVE (top) + SANDBOX (bottom). Both are the SAME
                CanvasSurface component (two instances). Only ACTIVE is ever executed —
                run/toEngineGraph read the `active` model, never `sandbox`. */}
            <div className="canvas-split" ref={splitRef} data-testid="canvas-split" data-focused={focused}>
              <div className="split-pane" style={{ flexBasis: splitPct + '%' }}>
                <CanvasSurface cv={active} snap={snap} idSeq={idSeq} result={result} paused={paused}
                  readOnly={layersReadOnly} roBanner={`${activeLayerIds.length} calques superposés — lecture seule`}
                  label={'● Actif' + (focused === 'active' ? ' (focus)' : '')} onActivate={() => setFocused('active')} />
              </div>
              <div className="split-bar" data-testid="split-bar" title="Glisser pour redimensionner Actif / Sandbox"
                onMouseDown={startSplitDrag} />
              <div className="split-pane" style={{ flexBasis: (100 - splitPct) + '%' }}>
                <CanvasSurface cv={sandbox} snap={snap} idSeq={idSeq} result={null} paused={null}
                  isSandbox label={'▲ Sandbox — non exécuté' + (focused === 'sandbox' ? ' (focus)' : '')}
                  onActivate={() => setFocused('sandbox')} />
                <div className="sandbox-bar" data-testid="sandbox-bar">
                  <span>Isolé du moteur.</span>
                  <button data-testid="sandbox-transfer" onClick={transferToActive}
                    title="Déplace les nœuds sélectionnés du Sandbox vers l'Actif (edges internes conservés)">→ Activer la sélection</button>
                </div>
              </div>
            </div>

            {/* right: Wire Map panel OR inspector + results */}
            <div className="col right">
              {view === 'wiremap' && renderWireMap()}
              {view === 'library' && renderLibrary()}
              <div style={{ display: view === 'canvas' ? undefined : 'none' }}>
              <h2>Inspecteur</h2>
              {(() => {
              // Inspector reads/edits the FOCUSED zone's selection (Active or Sandbox). The
              // edit helpers (patchData/applyRole/attach*/setEdgeField/deleteSelected) already
              // target F, so these shadowed reads keep display and edits on the same zone.
              const { sel, selNode, selEdge, nodes, edges, importChooser, setImportChooser, setSel } = F;
              return (
              <div className="inspector">
                {!sel && <div className="empty">Sélectionne un nœud ou un edge.</div>}

                {/* Import-at-pose chooser: appears right after a palette button posed a
                    node. Reuses the Library attach functions — no duplicated logic. */}
                {importChooser && selNode && selNode.id === importChooser.nodeId && (() => {
                  const KIND_LABEL = { prompt: 'prompt', oracle: 'oracle', goal: 'objectif (goal)', agent: 'fiche agent' };
                  const IMPORT_FN = { prompt: attachPromptToNode, oracle: attachOracleToNode, goal: attachGoalToNode, agent: attachBrickToNode };
                  const options = libBricks.filter((b) => b.kind === importChooser.kind);
                  return (
                    <div className="banner" data-testid="import-chooser"
                      style={{ background: 'rgba(99,102,241,.12)', border: '1px solid #6366f1', color: '#c7d2fe', marginBottom: 10 }}>
                      <div style={{ fontWeight: 'bold', marginBottom: 4 }}>Nœud posé — importer un {KIND_LABEL[importChooser.kind]} ?</div>
                      <select data-testid="import-select" defaultValue=""
                        onChange={(e) => { const id = e.target.value; if (id) { IMPORT_FN[importChooser.kind](importChooser.nodeId, id); setImportChooser(null); } }}>
                        <option value="">— importer un modèle depuis la Bibliothèque ({options.length}) —</option>
                        {options.map((b) => <option key={b.id} value={b.id}>{EXAMPLE_BADGE[b.badge]} · {b.name}</option>)}
                      </select>
                      <button data-testid="import-empty" className="ghost" style={{ marginLeft: 6 }}
                        onClick={() => setImportChooser(null)}>Créer vide</button>
                    </div>
                  );
                })()}

                {selNode && selNode.type === 'agent' && (
                  <div data-testid="inspector-agent">
                    <div className="field"><label>id</label><input value={selNode.id} readOnly /></div>
                    {(() => {
                      const card = agentCardStatus(selNode.id, nodes);
                      if (!card.isComposite) return null;
                      // Only satellites the agent ACTUALLY has can be "missing" (présence —
                      // a legacy 7-satellite agent never lists "sortie attendue" as missing).
                      const comps = agentComponentsOf(selNode.id, nodes);
                      const missing = AGENT_COMPONENT_TYPES
                        .filter((t) => comps.some((x) => x.data.componentType === t))
                        .filter((t) => !componentFilled(comps.find((x) => x.data.componentType === t)))
                        .map((t) => AGENT_COMPONENT_META[t].label);
                      return (
                        <div className="field" data-testid="inspector-agent-card">
                          <label>carte d'identité {card.complete
                            ? <span className="badge-real" style={{ marginLeft: 6 }}>{card.filled}/{card.total} ✅ complète</span>
                            : <span className="badge-target" style={{ marginLeft: 6 }}>{card.filled}/{card.total} ⚠️ incomplète</span>}</label>
                          {!card.complete && <div className="hint" style={{ color: '#fbbf24' }}>Composants manquants : {missing.join(', ')}. L'exécution est bloquée tant que la carte n'est pas {card.total}/{card.total}.</div>}
                        </div>
                      );
                    })()}
                    <div className="field">
                      <label>role (Council)
                        {selNode.data.role && ROLE_PRESETS[selNode.data.role] && (
                          <span data-testid="agent-group" className={ROLE_PRESETS[selNode.data.role].group.startsWith('v1') ? 'badge-real' : 'badge-target'}
                            title={ROLE_PRESETS[selNode.data.role].group.startsWith('v1') ? 'Rôle réel de council.py (gate v1)' : 'Rôle de vision non implémentée — n_existe pas dans TCS (≠ kaizen_autoloop réel: council 3 voix + Claude Code CLI)'}
                            style={{ marginLeft: 6 }}>{ROLE_PRESETS[selNode.data.role].group.startsWith('v1') ? 'RÉEL' : 'VISION'}</span>
                        )}
                      </label>
                      <select data-testid="agent-role" value={selNode.data.role || ''}
                        onChange={(e) => applyRole(selNode.id, e.target.value)}>
                        <option value="">(aucun)</option>
                        {['v1 réel (council.py)', 'cible / vision (non implémentée)'].map((grp) => (
                          <optgroup key={grp} label={grp}>
                            {Object.keys(ROLE_PRESETS).filter((r) => ROLE_PRESETS[r].group === grp).map((r) => (
                              <option key={r} value={r}>{r}</option>
                            ))}
                          </optgroup>
                        ))}
                      </select>
                    </div>
                    <div className="field"><label>model</label>
                      <input data-testid="agent-model" value={selNode.data.model ?? ''}
                        onChange={(e) => patchData(selNode.id, { model: e.target.value })} /></div>
                    <div className="field row">
                      <div><label>temperature</label>
                        <input data-testid="agent-temperature" type="number" step="0.1" value={selNode.data.temperature ?? ''}
                          onChange={(e) => patchData(selNode.id, { temperature: e.target.value === '' ? undefined : Number(e.target.value) })} /></div>
                      <div><label>top_p</label>
                        <input data-testid="agent-top_p" type="number" step="0.05" value={selNode.data.top_p ?? ''}
                          onChange={(e) => patchData(selNode.id, { top_p: e.target.value === '' ? undefined : Number(e.target.value) })} /></div>
                    </div>
                    <div className="field"><label>max_tokens</label>
                      <input data-testid="agent-max_tokens" type="number" value={selNode.data.max_tokens ?? ''}
                        onChange={(e) => patchData(selNode.id, { max_tokens: e.target.value === '' ? undefined : Number(e.target.value) })} /></div>
                    <div className="hint">Choisir un rôle pré-remplit model/temp/top_p/max_tokens (table ou council.py). Éditable. okAfter (si présent) = mock reviewer déterministe.</div>
                    {/* Prompt système composé — visible uniquement pour un agent COMPOSITE
                        (avec satellites). Dérivé & lecture seule tant que piloté par les 7
                        satellites ; « éditer manuellement » fait diverger (Option A), avec
                        badge + bouton « recomposer ». */}
                    {agentComponentsOf(selNode.id, nodes).length > 0 && (() => {
                      const manual = !!selNode.data.promptManual;
                      return (
                        <div className="field" data-testid="agent-prompt-section" style={{ marginTop: 8, borderTop: '1px solid #334155', paddingTop: 8 }}>
                          <label>prompt système {manual
                            ? <span className="badge-target" data-testid="agent-prompt-diverged" style={{ marginLeft: 6 }}>✏️ édité manuellement — ne reflète plus les 7 composants</span>
                            : <span className="badge-real" data-testid="agent-prompt-derived" style={{ marginLeft: 6 }}>🔗 composé automatiquement depuis les 7 satellites</span>}</label>
                          <textarea data-testid="agent-prompt" rows={8} readOnly={!manual}
                            value={selNode.data.prompt || ''}
                            placeholder="(se compose automatiquement dès que tu remplis les satellites)"
                            style={manual ? undefined : { opacity: .85, cursor: 'default', background: '#0b1220' }}
                            onChange={(e) => patchData(selNode.id, { prompt: e.target.value, promptManual: true })} />
                          {manual
                            ? <button data-testid="agent-prompt-recompose" className="ghost" style={{ marginTop: 4 }}
                                onClick={() => patchData(selNode.id, { promptManual: false })}>🔄 Recomposer depuis les satellites</button>
                            : <button data-testid="agent-prompt-edit" className="ghost" style={{ marginTop: 4 }}
                                onClick={() => patchData(selNode.id, { promptManual: true })}>✏️ Éditer manuellement</button>}
                          <div className="hint">Envoyé au moteur comme <code>data.prompt</code> du nœud. Le composant « modèle » alimente aussi le champ technique <code>model</code>.</div>
                        </div>
                      );
                    })()}
                    <div className="field" style={{ marginTop: 8, borderTop: '1px solid #334155', paddingTop: 8 }}>
                      <label>Attacher une fiche (bibliothèque)</label>
                      <select data-testid="agent-attach" value={selNode.attachedBrick ? selNode.attachedBrick.id : ''}
                        onChange={(e) => attachBrickToNode(selNode.id, e.target.value)}>
                        <option value="">(aucune)</option>
                        {libBricks.filter((b) => b.kind === 'agent').map((b) => (
                          <option key={b.id} value={b.id}>{EXAMPLE_BADGE[b.badge]} · {b.name}</option>
                        ))}
                      </select>
                      {selNode.attachedBrick && <div className="hint" data-testid="agent-attached">🔗 fiche liée : {selNode.attachedBrick.name}</div>}
                    </div>
                    <button className="danger" onClick={deleteSelected} style={{ marginTop: 6 }}>Supprimer le nœud</button>
                  </div>
                )}

                {selNode && selNode.type === 'note' && (
                  <div data-testid="inspector-note">
                    <div className="field"><label>titre (éditable ici ou dans le bloc)</label>
                      <input data-testid="note-title-field" value={selNode.data.title || ''}
                        placeholder="Note"
                        onChange={(e) => setNoteTitle(selNode.id, e.target.value)} /></div>
                    <div className="field"><label>note (annotation — hors moteur)</label>
                      <textarea data-testid="note-text" rows={5} value={selNode.data.text || ''}
                        onChange={(e) => setNoteText(selNode.id, e.target.value)} /></div>
                    <div className="hint">Exclue de toEngineGraph : le moteur ne la voit jamais.</div>
                    <button className="danger" onClick={deleteSelected}>Supprimer la note</button>
                  </div>
                )}

                {/* Item 3 — dedicated router panel (was falling into the generic JSON blob). */}
                {selNode && selNode.type === 'router' && (
                  <div data-testid="inspector-router">
                    <div className="field"><label>id</label><input value={selNode.id} readOnly /></div>
                    <div className="field"><label>type</label><input value="router" readOnly /></div>
                    <div className="field"><label>path (routeKey source)</label>
                      <input data-testid="router-path" value={selNode.data.path ?? ''}
                        placeholder="ex: nodes.node-analyzer.intent"
                        onChange={(e) => patchData(selNode.id, { path: e.target.value })} /></div>
                    <div className="field"><label>defaultRoute</label>
                      <input data-testid="router-defaultRoute" value={selNode.data.defaultRoute ?? ''}
                        placeholder="ex: chat"
                        onChange={(e) => patchData(selNode.id, { defaultRoute: e.target.value })} /></div>
                    <div className="field">
                      <label>conditions des edges sortants</label>
                      {edges.filter((e) => e.from === selNode.id).length === 0
                        ? <div className="hint">Aucun edge sortant. Relie ce router à ≥2 nœuds.</div>
                        : edges.filter((e) => e.from === selNode.id).map((e) => (
                            <div key={e.id} className="field row" style={{ marginBottom: 5, alignItems: 'center' }}>
                              <div style={{ fontSize: 10, color: '#94a3b8' }}>→ {e.to}</div>
                              <input data-testid={'router-edge-' + e.id} value={e.condition || ''}
                                placeholder="condition (routeKey)"
                                onChange={(ev) => setEdgeField(e.id, { condition: ev.target.value })} />
                            </div>
                          ))}
                    </div>
                    <button className="danger" onClick={deleteSelected}>Supprimer le nœud</button>
                  </div>
                )}

                {selNode && selNode.type === 'humangate' && (
                  <div data-testid="inspector-humangate">
                    <div className="field"><label>id</label><input value={selNode.id} readOnly /></div>
                    <div className="field"><label>type</label><input value="humangate ⏸️" readOnly /></div>
                    <div className="field"><label>message (affiché à l'humain)</label>
                      <textarea data-testid="hg-message" rows={2} value={selNode.data.message ?? ''}
                        onChange={(e) => patchData(selNode.id, { message: e.target.value })} /></div>
                    <div className="field">
                      <label className="setting-row" style={{ gap: 6 }}>
                        <input type="checkbox" data-testid="hg-actsAsOracle" checked={!!selNode.data.actsAsOracle}
                          onChange={(e) => patchData(selNode.id, { actsAsOracle: e.target.checked })} />
                        <span>🛡️ actsAsOracle (porte une règle de validation)</span>
                      </label>
                    </div>
                    <div className="field"><label>rule (critère à vérifier — vocab Oracle, optionnel)</label>
                      <textarea data-testid="hg-rule" rows={2} value={selNode.data.rule ?? ''}
                        placeholder="ex: la sortie doit être un JSON valide avec un champ intent"
                        onChange={(e) => patchData(selNode.id, { rule: e.target.value })} /></div>
                    <div className="field"><label>context (nœuds à montrer — cocher)</label>
                      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', fontSize: 11 }}>
                        {nodes.filter((n) => n.id !== selNode.id && n.type !== 'note' && n.type !== 'agent-component').map((n) => {
                          const ctxList = Array.isArray(selNode.data.context) ? selNode.data.context : [];
                          return (
                            <label key={n.id} className="setting-row" style={{ gap: 4 }}>
                              <input type="checkbox" data-testid={'hg-context-' + n.id} checked={ctxList.includes(n.id)}
                                onChange={(e) => {
                                  const next = e.target.checked ? [...ctxList, n.id] : ctxList.filter((x) => x !== n.id);
                                  patchData(selNode.id, { context: Array.from(new Set(next)) });
                                }} />
                              <span>{n.id}</span>
                            </label>
                          );
                        })}
                        {nodes.filter((n) => n.id !== selNode.id && n.type !== 'note' && n.type !== 'agent-component').length === 0 && <span className="hint">Aucun autre nœud.</span>}
                      </div></div>
                    <div className="hint">Le moteur met le graphe EN PAUSE ici et attend une décision humaine (approuver/rejeter).</div>
                    <button className="danger" onClick={deleteSelected}>Supprimer le nœud</button>
                  </div>
                )}

                {selNode && selNode.type === 'artefact' && (
                  <div data-testid="inspector-artefact">
                    <div className="field"><label>id</label><input value={selNode.id} readOnly /></div>
                    <div className="field"><label>type</label><input value="artefact 🎁 (non-exécutable)" readOnly /></div>
                    <div className="field"><label>titre du livrable</label>
                      <input data-testid="artefact-title" value={selNode.data.title ?? ''}
                        onChange={(e) => patchData(selNode.id, { title: e.target.value })} /></div>
                    <div className="field"><label>description</label>
                      <textarea data-testid="artefact-description" rows={3} value={selNode.data.description ?? ''}
                        onChange={(e) => patchData(selNode.id, { description: e.target.value })} /></div>
                    <div className="field"><label>type d'artefact</label>
                      <select data-testid="artefact-type" value={selNode.data.artefactType ?? 'logiciel'}
                        onChange={(e) => patchData(selNode.id, { artefactType: e.target.value })}>
                        {ARTEFACT_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
                      </select></div>
                    <div className="hint">Livrable final : accepte des flèches entrantes (contributeurs) ET sortantes (renvoi/feedback). Ignoré par le moteur — comme une Note.</div>
                    <button className="danger" onClick={deleteSelected}>Supprimer le nœud</button>
                  </div>
                )}

                {selNode && selNode.type === 'agent-component' && (() => {
                  const cm = AGENT_COMPONENT_META[selNode.data.componentType] || { label: selNode.data.componentType, icon: '🧩' };
                  const filled = componentFilled(selNode);
                  const parent = nodes.find((n) => n.id === selNode.data.parentId);
                  return (
                    <div data-testid="inspector-agent-component">
                      <div className="field"><label>id</label><input value={selNode.id} readOnly /></div>
                      <div className="field"><label>composant</label>
                        <input value={cm.icon + ' ' + cm.label} readOnly /></div>
                      <div className="field"><label>agent parent</label>
                        <input value={selNode.data.parentId || '—'} readOnly /></div>
                      <div className="field">
                        <label>contenu {filled
                          ? <span className="badge-real" style={{ marginLeft: 6 }}>rempli</span>
                          : <span className="badge-target" style={{ marginLeft: 6 }}>vide</span>}</label>
                        <textarea data-testid="comp-text" rows={5} value={selNode.data.text || ''}
                          placeholder={'Décris ' + cm.label + ' de cet agent…'}
                          onChange={(e) => patchData(selNode.id, { text: e.target.value })} />
                      </div>
                      {/* 8ᵉ satellite : piocher une brique kind:"outputformat" de la
                          Bibliothèque, qui remplit ce satellite avec son contrat de sortie. */}
                      {selNode.data.componentType === 'sortieAttendue' && (
                        <div className="field">
                          <label>importer un format de sortie (Bibliothèque)</label>
                          <select data-testid="comp-outputformat-select" value=""
                            onChange={(e) => { if (e.target.value) applyOutputFormatToComponent(selNode.id, e.target.value); }}>
                            <option value="">(choisir une brique « sortie attendue »…)</option>
                            {libBricks.filter((b) => b.kind === 'outputformat').map((b) => (
                              <option key={b.id} value={b.id}>{EXAMPLE_BADGE[b.badge]} · {b.name}</option>
                            ))}
                          </select>
                        </div>
                      )}
                      <div className="hint">Composant de la carte d'identité de l'agent — non-exécutable (exclu de toEngineGraph, comme une Note). Le remplir fait progresser le badge {parent ? agentCardStatus(parent.id, nodes).filled : 0}/{parent ? agentCardStatus(parent.id, nodes).total : AGENT_COMPONENT_TYPES.length} de l'agent.</div>
                      <button className="danger" onClick={deleteSelected}>Supprimer le composant</button>
                    </div>
                  );
                })()}

                {selNode && selNode.type !== 'agent' && selNode.type !== 'agent-component' && selNode.type !== 'note' && selNode.type !== 'router' && selNode.type !== 'humangate' && selNode.type !== 'artefact' && (
                  <div data-testid="inspector-generic">
                    <div className="field"><label>id</label><input value={selNode.id} readOnly /></div>
                    <div className="field"><label>type</label><input value={selNode.type} readOnly /></div>
                    <div className="field">
                      <label>data (JSON)</label>
                      <textarea rows={7} data-testid="node-data"
                        value={selNode.data._dataText !== undefined ? selNode.data._dataText : JSON.stringify(stripUi(selNode.data), null, 2)}
                        onChange={(e) => updateNodeData(selNode.id, e.target.value)}
                        onBlur={() => commitNodeData(selNode.id)} />
                      {selNode.data._dataErr && <div className="err">⚠ {selNode.data._dataErr}</div>}
                      <div className="hint">Quitte le champ (blur) pour appliquer.</div>
                    </div>
                    {selNode.type === 'llm' && (
                      <div className="field" style={{ marginTop: 8, borderTop: '1px solid #334155', paddingTop: 8 }}>
                        <label>Attacher un prompt (bibliothèque)</label>
                        <select data-testid="llm-attach-prompt" value={selNode.attachedPrompt ? selNode.attachedPrompt.id : ''}
                          onChange={(e) => attachPromptToNode(selNode.id, e.target.value)}>
                          <option value="">(aucun)</option>
                          {libBricks.filter((b) => b.kind === 'prompt').map((b) => (
                            <option key={b.id} value={b.id}>{EXAMPLE_BADGE[b.badge]} · {b.name}</option>
                          ))}
                        </select>
                        {selNode.attachedPrompt && <div className="hint" data-testid="llm-attached-prompt">🔗 prompt lié : {selNode.attachedPrompt.name} → data.prompt</div>}
                      </div>
                    )}
                    {/* C1 exécutable : un nœud TOOL peut lancer un des 5 scripts d'audit PowerShell
                        (read-only) — uniquement en mode « réel » (toggle). data.script = basename
                        whitelisté ; l'adapter PowerShell l'exécute sur le repo TCS et renvoie un
                        verdict Oracle. Vide = tool mock normal. */}
                    {selNode.type === 'tool' && (
                      <div className="field" style={{ marginTop: 8, borderTop: '1px solid #334155', paddingTop: 8 }}>
                        <label>oracle PowerShell (audit read-only — exécuté seulement en mode « réel »)</label>
                        <select data-testid="tool-ps-script" value={selNode.data.script || ''}
                          onChange={(e) => patchData(selNode.id, e.target.value ? { script: e.target.value } : { script: undefined })}>
                          <option value="">(aucun — tool mock)</option>
                          {['chain_hygiene.ps1', 'chain_lab.ps1', 'chain_models.ps1', 'chain_python.ps1', 'chain_rust.ps1'].map((s) => (
                            <option key={s} value={s}>{s}</option>
                          ))}
                        </select>
                        {selNode.data.script && <div className="hint" data-testid="tool-ps-selected">⚙️ exécute <code>00_STUDIO_CONTROL/05_AUDIT/chains/{selNode.data.script}</code> → verdict PASS/PARTIAL/FAIL. chain_rust ≈ 2-5 min (cargo). Whitelist stricte.</div>}
                      </div>
                    )}
                    <button className="danger" onClick={deleteSelected}>Supprimer le nœud</button>
                  </div>
                )}

                {selEdge && (
                  <div>
                    <div className="field"><label>edge</label><input value={`${selEdge.from} → ${selEdge.to}`} readOnly /></div>
                    <div className="field">
                      <label>condition</label>
                      <input data-testid="edge-condition" value={selEdge.condition || ''}
                        placeholder="ex: NOK / search (vide = inconditionnel)"
                        onChange={(e) => setEdgeField(selEdge.id, { condition: e.target.value })} />
                    </div>
                    {/* Chantier 3 — visual style picker (cosmetic only; excluded from the engine
                        graph via toEngineGraph's field whitelist). Applied immediately. */}
                    <div className="field">
                      <label>style visuel</label>
                      <div className="edge-style-pick" data-testid="edge-style">
                        {[['arrow', '➡️', 'Flèche'], ['chain', '⛓️', 'Chaîne'], ['stream', '🌊', 'Courant']].map(([v, ic, lbl]) => (
                          <button key={v} data-testid={'edge-style-' + v} data-active={(selEdge.visualStyle || 'arrow') === v ? '1' : '0'}
                            className={(selEdge.visualStyle || 'arrow') === v ? 'active' : ''}
                            onClick={() => setEdgeField(selEdge.id, { visualStyle: v })}>{ic} {lbl}</button>
                        ))}
                      </div>
                    </div>
                    {/* Ancrage d'une brique de la Bibliothèque au MILIEU de l'edge — une
                        RÉFÉRENCE non-exécutable (tous kinds), pas une duplication de contenu.
                        attachedBrickRef est une métadonnée décorative comme condition/visualStyle :
                        persistée avec la Chaîne, EXCLUE du graphe moteur par toEngineGraph
                        (whitelist id/from/to/condition/loop/maxIterations). */}
                    <div className="field">
                      <label>🔗 Brique liée (référence ancrée au milieu — non-exécutable, tous kinds)</label>
                      <select data-testid="edge-brick" value={selEdge.attachedBrickRef ? selEdge.attachedBrickRef.id : ''}
                        onChange={(ev) => {
                          const b = libBricks.find((x) => x.id === ev.target.value);
                          setEdgeField(selEdge.id, { attachedBrickRef: b ? { id: b.id, name: b.name, kind: b.kind, badge: b.badge } : null });
                        }}>
                        <option value="">(aucune)</option>
                        {libBricks.map((b) => (
                          <option key={b.id} value={b.id}>{EXAMPLE_BADGE[b.badge]} · [{b.kind}] {b.name}</option>
                        ))}
                      </select>
                      {selEdge.attachedBrickRef && (
                        <div className="hint" data-testid="edge-brick-attached">📎 référence : [{selEdge.attachedBrickRef.kind}] {selEdge.attachedBrickRef.name} — non-exécutable, exclue du moteur</div>
                      )}
                    </div>
                    <div className="field">
                      <label><input type="checkbox" data-testid="edge-loop" style={{ width: 'auto', marginRight: 6 }}
                        checked={!!selEdge.loop}
                        onChange={(e) => setEdgeField(selEdge.id, { loop: e.target.checked, maxIterations: selEdge.maxIterations ?? 5 })} />
                        boucle (edge de retour)</label>
                    </div>
                    {selEdge.loop && (
                      <div className="field">
                        <label>maxIterations</label>
                        <input data-testid="edge-maxiter" type="number" min="1" value={selEdge.maxIterations ?? 5}
                          onChange={(e) => setEdgeField(selEdge.id, { maxIterations: Number(e.target.value) })} />
                        <div className="hint">Une boucle DOIT porter une condition (le verdict de retour, ex « NOK »). Borne dure de passes.</div>
                      </div>
                    )}
                    <button className="danger" onClick={deleteSelected}>Supprimer l'edge</button>
                  </div>
                )}
              </div>
              ); })()}

              <h2>Graphe envoyé au moteur</h2>
              <details>
                <summary>toEngineGraph (notes exclues)</summary>
                <pre data-testid="engine-graph">{JSON.stringify(engineGraph, null, 2)}</pre>
              </details>

              {error && (
                <div className="banner error" data-testid="error-banner">
                  <div data-testid="error-human">{error}</div>
                  {errorDetail && (
                    <details data-testid="error-technical" style={{ marginTop: 6 }}>
                      <summary style={{ cursor: 'pointer', fontSize: 10, color: '#fca5a5' }}>détail technique</summary>
                      <pre style={{ fontSize: 10, whiteSpace: 'pre-wrap', margin: '4px 0 0' }}>{errorDetail}</pre>
                    </details>
                  )}
                </div>
              )}

              {/* HumanGate pause panel — approve/reject a blocked run. */}
              {paused && (() => {
                const gate = nodes.find((n) => n.id === paused.pausedAt);
                const gd = (gate && gate.data) || {};
                return (
                  <div className="banner" data-testid="humangate-pause"
                    style={{ background: 'rgba(225,29,72,.12)', border: '1px solid #e11d48', color: '#fda4af' }}>
                    <div style={{ fontWeight: 'bold', marginBottom: 4 }}>⏸️ En attente de validation humaine : {gd.message || paused.pausedAt}</div>
                    {gd.actsAsOracle && <div data-testid="hg-oracle-badge" style={{ fontSize: 10, marginBottom: 4 }}>🛡️ Ce gate porte une règle de validation (Oracle humain)</div>}
                    {gd.rule && gd.rule.trim() && <div data-testid="hg-rule-shown" style={{ fontSize: 11, marginBottom: 4 }}>Règle à vérifier : <b>{gd.rule}</b></div>}
                    {Array.isArray(gd.context) && gd.context.length > 0 && (
                      <details style={{ margin: '4px 0' }}><summary style={{ fontSize: 10, cursor: 'pointer' }}>Contexte ({gd.context.length} nœud·s)</summary>
                        <pre style={{ fontSize: 9, maxHeight: 120, overflow: 'auto' }}>{gd.context.map((cid) => cid + ': ' + JSON.stringify(result && result.state ? result.state.nodes[cid] : undefined)).join('\n')}</pre>
                      </details>
                    )}
                    <input data-testid="hg-note" value={resumeNote} placeholder="note (optionnelle)"
                      onChange={(e) => setResumeNote(e.target.value)} style={{ marginBottom: 6 }} />
                    <div style={{ display: 'flex', gap: 6 }}>
                      <button data-testid="hg-approve" onClick={() => resume('approve')} disabled={busy}
                        style={{ background: '#10b981' }}>✅ Approuver</button>
                      <button data-testid="hg-reject" onClick={() => resume('reject')} disabled={busy}
                        style={{ background: '#7f1d1d' }}>❌ Rejeter</button>
                    </div>
                  </div>
                );
              })()}

              {result && result.status === 'rejected' && (
                <div className="banner error" data-testid="humangate-rejected">❌ Rejeté par l'humain — exécution arrêtée au gate.</div>
              )}

              {result && result.trace.length > 0 && (
                <div>
                  <h2>Flux d'exécution (ordre)</h2>
                  <div className="flux" data-testid="flux">
                    {result.trace.map((s, i) => (
                      <span key={i}>
                        <span className="fluxn">{i + 1}</span>.{s.nodeId}{i < result.trace.length - 1 ? ' → ' : ''}
                      </span>
                    ))}
                  </div>
                </div>
              )}

              <h2>État final (moteur)</h2>
              {result
                ? <pre className="state" data-testid="state-output">{JSON.stringify(result.state, null, 2)}</pre>
                : <div className="empty">Aucun run encore.</div>}

              <h2>Trace d'exécution (moteur)</h2>
              <div data-testid="trace-output">
                {result && result.trace.length
                  ? result.trace.map((s, i) => {
                      const r = s.routingDecision;
                      const isLoop = r && (r.reason === 'loop-iteration' || r.reason === 'loop-max-iterations');
                      const decision = s.output && typeof s.output === 'object' ? s.output.decision : undefined;
                      return (
                        <div key={i} className={'trace-step' + (s.error ? ' is-error' : (isLoop ? ' is-loop' : ''))}
                          data-testid="trace-step" data-node-id={s.nodeId} data-iteration={s.iteration}>
                          <div className="sid">
                            <span>#{i + 1} · {s.nodeId}</span>
                            <span className="iter" data-testid="iter-badge">iter {s.iteration}</span>
                          </div>
                          <div className="det">type <b>{s.nodeType}</b> · {s.durationMs}ms</div>
                          {decision !== undefined && <div className="dec" data-testid="decision">décision: <b>{String(decision)}</b></div>}
                          {r && <div className="route" data-testid="route-reason">🔀 routeKey={JSON.stringify(r.routeKey)} · reason={r.reason}</div>}
                          {s.error && <div className="terr">❌ {s.error}</div>}
                        </div>
                      );
                    })
                  : <div className="empty">Aucune trace.</div>}
              </div>
              </div>
            </div>
          </div>

          {chainSaveOpen && (
            <div className="wm-modal" data-testid="chain-save-modal" onMouseDown={() => setChainSaveOpen(false)}>
              <div className="box" onMouseDown={(e) => e.stopPropagation()}>
                <h3 style={{ color: '#6366f1', marginBottom: 10 }}>💾 Sauver le canvas comme chaîne</h3>
                <div className="hint" style={{ marginBottom: 8 }}>{nodes.length} nœud(s) · {edges.length} edge(s) capturés (positions incluses).</div>
                {councilInfoOf(nodes).isCouncil && (
                  <div className="hint" data-testid="chain-council-detected" style={{ marginBottom: 8, color: '#fdba74' }}>
                    🏛️ Sous-graphe Council détecté — catégorie pré-remplie « council », badge « {EXAMPLE_BADGE[councilInfoOf(nodes).badge]} » (dérivé des rôles).
                  </div>
                )}
                <div className="field"><label>nom</label><input data-testid="chain-name" id="chain-name" placeholder="Ma chaîne" /></div>
                <div className="field"><label>catégorie</label>
                  <input data-testid="chain-category" id="chain-category" list="chain-cat-dl" defaultValue={councilInfoOf(nodes).category} placeholder="council / routing / …" />
                  <datalist id="chain-cat-dl">{CHAIN_CATEGORIES.map((c) => <option key={c} value={c} />)}</datalist></div>
                <div className="field"><label>tags (séparés par virgule)</label><input data-testid="chain-tags" id="chain-tags" placeholder="looped, raffinement" /></div>
                <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
                  <button data-testid="chain-save-submit" onClick={() => {
                    saveCanvasAsChain(
                      document.getElementById('chain-name').value,
                      document.getElementById('chain-category').value,
                      document.getElementById('chain-tags').value,
                    );
                  }}>Sauver</button>
                  <button className="ghost" onClick={() => setChainSaveOpen(false)}>Annuler</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <script>
    // Compile the JSX with the CLASSIC runtime (React.createElement), then run it.
    // Automatic runtime would emit `import ... from "react/jsx-runtime"`, a
    // SyntaxError in a non-module script.
    (function () {
      try {
        var src = document.getElementById('builder-src').textContent;
        var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
        (0, eval)(out);
      } catch (e) {
        document.getElementById('root').innerHTML =
          '<pre style="color:#f87171;padding:20px;white-space:pre-wrap">Builder failed to compile:\n' +
          String(e && e.stack ? e.stack : e) + '</pre>';
        console.error(e);
      }
    })();
  </script>
</body>
</html>
