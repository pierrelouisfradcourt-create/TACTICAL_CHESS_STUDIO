<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM-Lego Engine Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Monaco', 'Courier New', monospace;
      background: #0b0f19;
      color: #e0e7ff;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 30px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 5px;
      background: linear-gradient(to right, #6366f1, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      font-size: 12px;
      color: #94a3b8;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 15px;
    }

    .panel h2 {
      font-size: 13px;
      color: #6366f1;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    textarea {
      width: 100%;
      height: 300px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 4px;
      color: #e0e7ff;
      font-family: inherit;
      font-size: 11px;
      padding: 10px;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 8px rgba(99, 102, 241, 0.3);
    }

    button {
      background: #6366f1;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      margin-top: 10px;
      transition: all 0.2s;
    }

    button:hover {
      background: #4f46e5;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: #64748b;
      cursor: not-allowed;
      opacity: 0.5;
    }

    .results {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    .result-panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 15px;
      max-height: 600px;
      overflow-y: auto;
    }

    .result-panel h3 {
      font-size: 13px;
      color: #10b981;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .result-content {
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .trace-step {
      background: #0f172a;
      border-left: 3px solid #6366f1;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 2px;
    }

    .trace-step-id {
      font-weight: bold;
      color: #6366f1;
      font-size: 11px;
    }

    .trace-step-detail {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .error {
      color: #f87171;
      background: rgba(248, 113, 113, 0.1);
      border-color: #f87171 !important;
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 12px;
    }

    .loading {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .example-btn {
      background: #475569;
      margin-top: 5px;
      font-size: 11px;
      padding: 6px 12px;
    }

    .example-btn:hover {
      background: #64748b;
    }

    .status {
      font-size: 11px;
      color: #10b981;
      margin-top: 5px;
    }

    .status.error {
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚙️ LLM-Lego Engine Demo</h1>
      <p>Test de l'engine d'orchestration de graphes — exécution solo, pas de UI complexe</p>
    </header>

    <div class="controls">
      <div class="panel">
        <h2>📋 Graphe (JSON)</h2>
        <textarea id="graphInput" placeholder='{"nodes": [...], "edges": [...]}'></textarea>
        <button class="example-btn" onclick="loadExample()">📦 Charger exemple</button>
      </div>

      <div class="panel">
        <h2>🔑 Input Initial (JSON)</h2>
        <textarea id="initialInput" placeholder='{"query": "..."}' style="height: 100px;"></textarea>
        <button onclick="execute()" style="width: 100%;">▶️ Exécuter</button>
        <div class="status" id="status"></div>
      </div>
    </div>

    <div class="results" id="results" style="display: none;">
      <div class="result-panel">
        <h3>🧠 État final (Contexte)</h3>
        <div class="result-content" id="stateOutput"></div>
      </div>

      <div class="result-panel">
        <h3>🕵️ Trace d'exécution</h3>
        <div id="traceOutput"></div>
      </div>
    </div>
  </div>

  <script>
    const exampleGraph = {
      nodes: [
        {
          id: 'node-analyzer',
          type: 'llm',
          data: {
            prompt: 'Analyze the user intent. Respond ONLY with JSON: {"intent": "search"} or {"intent": "chat"}',
            outputKey: 'intent'
          }
        },
        {
          id: 'node-router',
          type: 'router',
          data: {
            path: 'nodes.node-analyzer.intent',
            defaultRoute: 'chat'
          }
        },
        {
          id: 'node-search',
          type: 'tool',
          data: {
            name: 'search',
            description: 'Web search for information'
          }
        },
        {
          id: 'node-chat',
          type: 'llm',
          data: {
            prompt: 'Provide a helpful conversational response.',
            outputKey: 'reply'
          }
        }
      ],
      edges: [
        { id: 'e1', from: 'node-analyzer', to: 'node-router' },
        { id: 'e2', from: 'node-router', to: 'node-search', condition: 'search' },
        { id: 'e3', from: 'node-router', to: 'node-chat', condition: 'chat' }
      ]
    };

    const exampleInput = {
      query: 'Find information about AI safety'
    };

    function loadExample() {
      document.getElementById('graphInput').value = JSON.stringify(exampleGraph, null, 2);
      document.getElementById('initialInput').value = JSON.stringify(exampleInput, null, 2);
      updateStatus('✅ Exemple chargé');
    }

    function updateStatus(msg, isError = false) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.classList.toggle('error', isError);
    }

    async function execute() {
      try {
        updateStatus('⏳ Exécution en cours...');

        const graphStr = document.getElementById('graphInput').value.trim();
        const inputStr = document.getElementById('initialInput').value.trim();

        if (!graphStr || !inputStr) {
          updateStatus('❌ Remplis les deux champs', true);
          return;
        }

        const graph = JSON.parse(graphStr);
        const initialInput = JSON.parse(inputStr);

        const response = await fetch('/api/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ graph, initialInput })
        });

        const result = await response.json();

        if (!result.success) {
          updateStatus(`❌ ${result.error}`, true);
          return;
        }

        // Display state
        document.getElementById('stateOutput').textContent = JSON.stringify(
          result.state,
          null,
          2
        );

        // Display trace
        const traceHtml = result.trace
          .map(
            (step, idx) => `
          <div class="trace-step">
            <div class="trace-step-id">Step ${idx + 1}: ${step.nodeId}</div>
            <div class="trace-step-detail">Type: <strong>${step.nodeType}</strong> | Duration: <strong>${step.durationMs}ms</strong></div>
            ${step.routingDecision ? `<div class="trace-step-detail">🔀 Router: routeKey=${JSON.stringify(step.routingDecision.routeKey)}, reason=${step.routingDecision.reason}</div>` : ''}
            ${step.error ? `<div class="trace-step-detail" style="color: #f87171;">❌ Error: ${step.error}</div>` : ''}
          </div>
        `
          )
          .join('');

        document.getElementById('traceOutput').innerHTML = traceHtml;
        document.getElementById('results').style.display = 'grid';

        updateStatus('✅ Exécution réussie');
      } catch (err) {
        updateStatus(`❌ ${err.message}`, true);
        console.error(err);
      }
    }

    // Load example on startup
    window.addEventListener('load', () => {
      loadExample();
    });
  </script>
</body>
</html>
