; supervisord.conf — Studio OS (WSL/Linux uniquement)
; Windows : utiliser start_studio.ps1
;
; Install : pip install supervisor
; Start   : supervisord -c infrastructure/supervisord.conf
; Status  : supervisorctl -c infrastructure/supervisord.conf status
; Stop    : supervisorctl -c infrastructure/supervisord.conf shutdown

[unix_http_server]
file=/tmp/studio_supervisord.sock

[supervisord]
logfile=lab/logs/supervisord.log
logfile_maxbytes=5MB
logfile_backups=3
loglevel=info
pidfile=/tmp/studio_supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/studio_supervisord.sock

; ── SERVICE 1 : claude_proxy (port 8765) ──────────────────────────────────────
[program:claude_proxy]
command=python scripts/claude_proxy.py
directory=/mnt/c/TACTICAL_CHESS_STUDIO
environment=CLAUDE_PROXY_SYSTEM_FILE="studio/openclaw-workspace/BOOTSTRAP.md"
autostart=true
autorestart=true
startretries=3
stdout_logfile=lab/logs/claude_proxy.log
stdout_logfile_maxbytes=2MB
stderr_logfile=lab/logs/claude_proxy_err.log
priority=100

; ── SERVICE 2 : canvas_gateway (port 8766) ────────────────────────────────────
[program:canvas_gateway]
command=python scripts/canvas_gateway.py
directory=/mnt/c/TACTICAL_CHESS_STUDIO
; STUDIO_HMAC_KEY chargée automatiquement depuis ~/.openclaw/.env par canvas_gateway.py
autostart=true
autorestart=true
startretries=3
stdout_logfile=lab/logs/canvas_gateway.log
stdout_logfile_maxbytes=2MB
stderr_logfile=lab/logs/canvas_gateway_err.log
priority=200
; canvas_gateway démarre après claude_proxy
depends_on=claude_proxy

