  evidence:
    concept: "Preuve mécanique d'exécution, signée et datée"
    status: LIVE_VERIFIED
    note: "avec 'contract' et 'verdict', la dimension la mieux couverte du studio"
    source_of_truth: ["lab/forge_evidence/dispatch_audit.jsonl", "knowledge_base/proofs/*.log (exception .gitignore explicite : preuves permanentes)", "lab/forge_runs/<run>/{artifacts,evidence}/"]
    consumer: "hook_guard.py, forge.verify_run"
    evidence: "logs de validation datés confirmés cette session pour knowledge_base/roles/*.yaml (role_sim_guardian_static_validation.log, role_sim_pursuer_mobile_validation.log)"
    gap: "aucun"
    provenance: verifie_cette_session

  knowledge:
    concept: "Décisions, rationale, patterns réutilisables"
    status: DISPERSED
    note: "dispersion ASSUMÉE par design — CLAUDE.md dit explicitement 'ne pas les confondre ni les fusionner', à ne pas traiter comme les autres DISPERSED (capability/policy) qui sont des trous accidentels"
    source_of_truth:
      - "knowledge_base/catalog.json (briques de jeu réutilisables : provenance, sha256, licence, tier candidate→validated)"
      - "lab/chains/IMPROVEMENT_LEDGER.yaml (décisions/rationale par IMP)"
      - "memory/*.md (faits durables machine) + studio_brain/ (doctrine humaine, tier-2)"
    consumer: "knowledge_base/search.mjs (catalog.json) ; kaizen_loop.py + skills (ledger) ; mécanisme auto-mémoire Claude Code (memory/)"
    evidence: "3 systèmes vérifiés vivants indépendamment cette session (roles.yaml → catalog.json → search.mjs testé)"
    gap: "aucun pont formel entre les 3 — une décision prise côté ledger n'alimente pas automatiquement memory/ ni catalog.json"
    provenance: verifie_cette_session

  memory:
    concept: "Mémoire persistante typée, inter-session"
    status: LIVE_VERIFIED
    source_of_truth: ["memory/MEMORY.md + memory/*.md (mécanisme auto-mémoire Claude Code)"]
    consumer: "chargé automatiquement au boot de chaque session"
    evidence: "auto-chargement confirmé structurellement (ce fichier fait partie du contexte système de cette conversation)"
    gap: >
      vocabulaire différent du modèle proposé — Pierre/ChatGPT proposent
      fact/decision/failure/success ; la taxonomie réelle Claude Code est
      user/feedback/project/reference. À réconcilier si ce modèle doit devenir une vraie
      carte de correspondance plutôt qu'un inventaire.
    provenance: verifie_cette_session

  artifact:
    concept: "Sortie produite et tracée (généré par → validé par)"
    status: LIVE_VERIFIED
    source_of_truth: ["games/<jeu>/ (jeu généré)", "lab/forge_runs/<run>/artifacts/", "knowledge_base/proofs/*.log"]
    consumer: "verdict.py (validated_by), driver.py (generated_by)"
    evidence: "games/breakout/, games/collect_runner/ confirmés produits sur disque cette session"
    gap: "breakout et collect_runner ont un artefact réel MAIS aucun historique git de leur run lab/forge_runs/ — trou d'hygiène (non commité), pas un trou fonctionnel"
    provenance: verifie_cette_session

  routing:
    concept: "Où vit quoi ; fichiers dérivés/générés ; édition manuelle interdite"
    status: LIVE_VERIFIED
    source_of_truth: ["FILE_ROUTING_MANIFEST.yaml"]
    consumer: "lab/chains/doc_hygiene_chain.py, lab/chains/studio_context_builder.py, lab/chains/test_doc_hygiene.py"
    evidence: "seul fichier YAML de tout l'audit complet du 2026-07-19 avec statut TESTED intégral (consommateur réel + tests réels + skip-guard sur le fichier live)"
    gap: "aucun"
    provenance: verifie_cette_session

  observability:
    concept: "Logs, métriques, traces, alertes"
    status: LIVE_PARTIAL
    source_of_truth: ["lab/events.jsonl (gitignoré, runtime)", "knowledge_base/search_log.jsonl (gitignoré)", "lab/reports/studio_meta_latest.json (gitignoré, ELO/verdict)", "lab/forge_evidence/dispatch_audit.jsonl"]
    consumer: "scripts studio_meta.py, director.py (connus par mémoire studio, non revérifiés mécaniquement cette session)"
    evidence: "existence des fichiers confirmée (référencés explicitement et nommément dans .gitignore)"
    gap: >
      AUCUNE alerte trouvée nulle part dans cet audit ni en mémoire studio — le champ
      'alerts' du modèle proposé est totalement absent aujourd'hui. code-hygiene.yml
      (cron GitHub sans runner self-hosted enregistré, trouvé cette session) est
      exactement un cas où une alerte aurait détecté le problème et n'existe pas.
    provenance: mixte (voir champs)

  lifecycle:
    concept: "États created → tested → approved → deprecated → archived"
    status: LIVE_PARTIAL
    source_of_truth:
      - "lab/chains/IMPROVEMENT_LEDGER.yaml (status: OPEN/CLOSED/FROZEN/REJECTED)"
      - "00_STUDIO_CONTROL/99_ARCHIVE/ (convention de dossier archive, confirmée mais le contenu est mort — cf. audit YAML)"
    consumer: "kaizen_loop.py (ledger status)"
    evidence: "540 IMPs avec statuts réels (mémoire studio) ; FROZEN/REJECTED confirmé invisible dans les outils de recall (dérive connue, mémoire 'ledger_frozen_rejected_convention')"
    gap: >
      pas de lifecycle formel pour les fichiers de config eux-mêmes (contrats, YAML divers)
      avant l'audit du 2026-07-19 — les recommandations KEEP/FREEZE/ARCHIVE_CANDIDATE/REVIEW
      produites par cet audit SONT, de facto, le premier lifecycle appliqué à cette couche.
    provenance: mixte (voir champs)

  verdict:
    concept: "software_verdict / evidence_verdict / claim_verdict séparés, signés"
    status: LIVE_VERIFIED
    note: "la règle la plus stricte et la mieux appliquée de tout le studio — seule dimension du modèle proposé qui était déjà doctrine non négociable AVANT cet audit"
    source_of_truth: ["scripts/forge/verdict.py"]
    consumer: "tout run Forge ; tout rapport de fin de charter (CLAUDE.md l'exige explicitement)"
    evidence: "dataclass confirmée cette session (software_verdict/evidence_verdict/claim_verdict, HMAC signé, verify_run)"
    gap: "aucun"
    provenance: verifie_cette_session

# ---------------------------------------------------------------------------------------------
# TABLE DE CORRESPONDANCE (raffinée avec preuve, vs. la table de suggestion Pierre×ChatGPT)
# ---------------------------------------------------------------------------------------------

correspondance_table:
  - parametre: capability
    source_reelle: "openclaw/capabilities.yaml + scripts/forge/contracts/roles.yaml (Forge) — lab/agent_policy/*.json (STUDIO, legacy/gelé)"
  - parametre: agent
    source_reelle: ".claude/agents/*.md (Markdown, pas YAML)"
  - parametre: skill
    source_reelle: ".claude/skills/<nom>/skill.md (Markdown, pas YAML)"
  - parametre: contract
    source_reelle: "scripts/forge/contracts/*.yaml (17 fichiers, SCHEMA.md)"
  - parametre: evidence
    source_reelle: "lab/forge_evidence/dispatch_audit.jsonl + lab/forge_runs/*/artifacts/ + knowledge_base/proofs/*.log"
  - parametre: gate
    source_reelle: "lab/chains/HUMANGATE_DECISION_LOG.yaml + scripts/forge/verdict.py + .claude/hooks/pretool_forge_guard.py"
  - parametre: knowledge
    source_reelle: "knowledge_base/catalog.json + lab/chains/IMPROVEMENT_LEDGER.yaml + memory/ + studio_brain/ (3 systèmes distincts, assumés séparés)"
  - parametre: routing
    source_reelle: "FILE_ROUTING_MANIFEST.yaml (seul TESTED complet de l'audit)"
  - parametre: execution
    source_reelle: "lab/forge_evidence/dispatch_audit.jsonl + marqueurs FORGE_DISPATCH dans les artefacts de run"
  - parametre: policy
    source_reelle: "toujours dispersé — CLAUDE.md (prose) + lab/agent_policy/*.json (gelé, bugué) + .claude/settings.json (hooks) — AUCUN SSOT unique"

# ---------------------------------------------------------------------------------------------
# SYNTHÈSE — décrit vs exécuté vs prouvé
# ---------------------------------------------------------------------------------------------

coverage_summary:
  total_dimensions: 22
  LIVE_VERIFIED: 11   # agent, skill, contract, execution, oracle, test, evidence, memory, artifact, routing, verdict
  LIVE_PARTIAL: 7      # intent, task, planner, gate, simulation, observability, lifecycle
  DISPERSED: 3         # capability, policy, knowledge
  DOCUMENTED_ONLY: 1   # identity
  ABSENT: 0
  lecture: >
    Le studio prouve mécaniquement la moitié de ce qu'il décrit (11/22 LIVE_VERIFIED).
    Les 3 dimensions DISPERSED ne sont pas de gravité égale : 'knowledge' est une séparation
    voulue et documentée (CLAUDE.md), tandis que 'capability' et 'policy' sont des trous
    réels — aucune matrice de permission unifiée et vivante n'existe à l'échelle du studio,
    seulement des fragments (dont un legacy gelé connu bugué). C'est le vrai chantier
    structurel que révèle ce modèle, pas un nouveau format YAML à produire.

verdict:
  software_verdict: OK
  evidence_verdict: MECHANICAL_VALIDATION_ONLY
  claim_verdict: NO_CLAIM_ALLOWED
  no_global_ready_verdict: true
  note: "ceci est un inventaire de référence, pas un verdict de production — rien ne le consomme, rien n'est mergé"
