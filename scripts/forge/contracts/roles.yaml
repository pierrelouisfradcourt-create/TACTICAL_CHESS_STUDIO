# scripts/forge/contracts/roles.yaml
# Résolution rôle-de-capacité -> runtime pour les agents Forge.
# Portée : Forge UNIQUEMENT. Ne touche pas openclaw/capabilities.yaml — qui n'est PLUS le « SSOT
# studio » : openclaw est LEGACY depuis le 2026-07-23 (Pierre : « on travaille que claude et forge »).
# Ce fichier-ci est la seule source de résolution de rôle de la Forge : `contract.resolve_runtime`
# passe toujours `caps_path=FORGE_ROLES`. Le chemin openclaw n'est que le DÉFAUT du module partagé
# `control_plane/registry.py:15`, consommé par la lane STUDIO, elle-même gelée. (Étiquette
# « SSOT studio, IMP-124 » corrigée le 2026-07-23 : elle était devenue fausse.)
# Décisions : ADR-002 gate 1 (full Claude pour cette phase) + gate 4 (Qwen = red team indépendant).
# Lu par : scripts/forge/contract.py via control_plane.registry.get_model_for_role(role, caps_path=ce fichier).
# claim_posture: NO_CLAIM_ALLOWED

version: "1.0"
generated: "2026-07-09"
source_adr: ADR-002

# DEUX RÔLES DISTINCTS, longtemps confondus sous un seul nom (défaut trouvé et corrigé
# le 2026-07-23) :
#
#  * `orchestrator`     — la SESSION qui pilote /forge, celle avec qui Pierre parle.
#    Ce rôle n'est résolu par AUCUN code : la porte ne le dispatche jamais, la session
#    elle-même l'incarne, et c'est PIERRE qui choisit son modèle en ouvrant la session.
#    L'entrée ci-dessous est donc purement DESCRIPTIVE. Fable en mode superpowers
#    (décision Pierre 2026-07-10).
#
#  * `run_orchestrator` — l'AGENT SPAWNÉ sous contrat (scripts/forge/contracts/
#    orchestrator.yaml) qui conduit UN run : il lance run_real.py, laisse la chaîne
#    boucler, vérifie le verdict, restitue. Celui-là EST résolu par le registry, donc
#    son modèle a un effet mécanique et un coût réel. Sous **Opus** — décision Pierre
#    2026-07-22 : « Fable consomme trop, je ne peux pas l'utiliser sur des trucs comme
#    Pong ». Aucun des deux n'est un tier de build.
#
# Pourquoi les séparer : le registry résout un rôle par ORDRE DE DÉCLARATION (premier
# modèle qui déclare le rôle gagne, control_plane/registry.py:39). Tant que les deux
# usages partageaient le nom `orchestrator`, écrire « Fable OU Opus » en commentaire ne
# changeait rien — le code rendait Fable, toujours. Une décision de Pierre vivait à côté
# d'une donnée qui la contredisait : exactement le défaut que le contrat de système
# interdit.
#
# Escalade de modèle (scripts/forge/escalate.py) : échelle des BUILDERS Claude
# haiku -> sonnet -> opus. Un tier faible peut demander (ESCALATE_REQUEST) ou déclencher
# par oracle rouge une ré-exécution du même contrat au tier supérieur (borné, tracé,
# signé dans le verdict). Qwen (reviewer) et non-llm (oracles) ne s'escaladent pas.

models:
  - id: anthropic/claude-fable-5
    name: Fable 5 — orchestrateur /forge (mode superpowers)
    provider: claude-local
    reasoning: high
    roles:
      - orchestrator        # démarre et pilote la chaîne (hors étapes contractualisées)

  - id: anthropic/claude-opus-4-8
    name: Claude Opus 4.8
    provider: claude-local
    reasoning: high
    roles:
      - run_orchestrator    # agent SPAWNÉ qui conduit un run (contrats/orchestrator.yaml).
                            # Distinct de `orchestrator` (la session, descriptive, Fable) :
                            # celui-ci est résolu par le registry et dispatché par la porte,
                            # donc son modèle a un coût réel. Opus — RATIFIÉ Pierre
                            # 2026-07-23 (« intention ≠ exécution »).
                            # Réserve exprimée dans la même ratification, PAS ENCORE
                            # IMPLÉMENTÉE : l'orchestrateur ne doit pas consommer le tier
                            # maximal en permanence si la tâche peut être traitée plus bas.
                            # Aucun mécanisme ne porte encore cette règle — `escalate.py` ne
                            # couvre que les BUILDERS. Tant qu'aucun champ structuré ne
                            # l'exprime, cette ligne reste une INTENTION, pas une politique
                            # active : ne pas la lire comme un comportement en vigueur.
      - contract_author     # étape 0 — rédacteur du contrat
      - prisme              # étape 1 — Prisme Produit (photo du produit fini)
      - art_director        # étape 2.5 — Art Bible + asset_requests (Tier 3 #7)
      - decompose           # étape 3 — décomposition fonctionnelle
      - architect           # étape 4 — architecte
      - wiremap             # étape 5 — WireMap isomorphe
      - redteam_code        # étape 11 — red-team code (contexte vierge)
      - game_forger         # étape 9 variante STANDARD — forge un JEU ENTIER depuis un
                            # squelette gelé. Distinct de `builder` : ce rôle tient
                            # simultanément toutes les lignes du squelette, plusieurs
                            # runtimes, une parité entre implémentations et six oracles,
                            # sans droit d'ajouter quoi que ce soit hors plan. Raisonnement
                            # soutenu sous contrainte, pas exécution mécanique — `builder`
                            # (haiku) reste juste pour ce à quoi il était calibré : une
                            # brique isolée. Ajouté 2026-07-22, gate Pierre.

  - id: anthropic/claude-haiku-4-5-20251001
    name: Claude Haiku 4.5
    provider: claude-local
    reasoning: low
    roles:
      - builder             # étape 9 — build (délégation économique)
      - worldscan           # étape 2 — world scan

  # Missions d'outillage Forge (hors chaîne s0-s12) : Sonnet = bras d'exécution
  # (répartition ratifiée Pierre 2026-07-19). Ce tier existait déjà dans l'échelle
  # d'escalade des builders (escalate.py LADDER) mais aucun rôle ne le résolvait.
  # Ajouté 2026-07-26 pour la mission M1 (télémétrie d'échec) — gate Pierre au commit.
  - id: anthropic/claude-sonnet-5
    name: Claude Sonnet 5 — outillage Forge (missions sous contrat hors profil)
    provider: claude-local
    reasoning: high
    roles:
      - forge_toolsmith     # missions d'outillage sur scripts/forge/** (ex. M1) —
                            # contrat dédié obligatoire, dispatch allow_unprofiled
                            # assumé et inscrit dans l'audit signé

  # Gate 4 : validation indépendante. Qwen critique les DÉCISIONS, ne remplace pas les oracles.
  - id: lmstudio/qwen2.5-14b-instruct
    name: Qwen2.5 14B — red team / reviewer indépendant
    provider: lmstudio
    reasoning: false
    roles:
      - redteam_reviewer    # étape 6 — red-team du plan (archi + wiremap)
      - repair_runtime      # réparation ciblée d'un défaut DÉJÀ identifié par un oracle
                            # amont. Accepté SOUS CONDITION par Pierre le 2026-08-04 :
                            # ni production_ready, ni garantie de qualité. Ce rôle
                            # DÉCLARE du code qui tournait déjà (run_real.py:1164) hors
                            # de tout registre — voir `runtime_contracts` en fin de
                            # fichier pour son contrat d'entrée/sortie.

  # Étapes déterministes (oracles + verdict) : PAS de LLM. Runtime sentinelle non-llm.
  - id: deterministic/non-llm
    name: Oracle déterministe (non-LLM)
    provider: forge
    reasoning: false
    roles:
      - deterministic       # étapes 10a/10b/10c (oracles) + 12 (verdict signé)

# ===================================================================================
# CONTRATS DE RUNTIME
# ===================================================================================
# `models` ci-dessus répond à « QUI exécute ce rôle ». Cette section répond à « QUOI,
# avec quelles entrées, quelles sorties et quelles limites ». Les deux sont séparées
# parce qu'un rôle peut changer de modèle sans changer de contrat, et l'inverse.
#
# Lecture : informative pour `control_plane/registry.py` (il ne lit que `models`), mais
# NORMATIVE pour la Forge — `repair_runtime_adapter.mjs` refuse toute requête qui ne
# porte pas exactement les entrées listées ici.
#
# Un seul rôle y figure aujourd'hui, à dessein : on déclare ce qu'on a mesuré, pas ce
# qu'on aimerait avoir.

runtime_contracts:

  repair_runtime:
    mission: >-
      Réparer un défaut DÉJÀ IDENTIFIÉ par un oracle amont, et rien d'autre. Ne découvre
      pas les défauts, ne modifie pas les métriques, ne modifie pas les règles
      d'acceptation, ne supprime pas un finding, n'écrit pas hors des champs autorisés.
    # Chaîne d'exécution RÉELLE — aucune abstraction. Chacun de ces fichiers existe et
    # tournait déjà avant cette déclaration.
    implementation:
      called_by:  scripts/forge/run_real.py:1164 (run_repair_step, 5 étapes amont)
      adapter:    scripts/forge/repair_runtime_adapter.mjs
      entrypoint: scripts/forge/repair_step.mjs
      logic:      scripts/forge/repair_loop.mjs
      model:      lmstudio/qwen2.5-14b-instruct
      temperature: 0
      max_tokens: 400        # valeur RÉELLE du code (repair_step.mjs:93)
      kill_switch: FORGE_REPAIR=0
    # `request_file` : le callable lit un JSON portant les entrées NOMMÉES ci-dessous.
    invocation: request_file
    inputs:  [finding_id, root_problem_id, artifact_ref, evidence_ref, allowed_fields, forbidden_fields]
    outputs: [before, after, patch, oracle_before, oracle_after, evidence_created, mutation_used]
    constraints:
      oracle_unchanged:  l'oracle est rejoué par l'appelant, jamais fourni par le runtime
      metrics_unchanged: aucune écriture dans capabilities.json, mutation_registry.json,
                         root_problems.json, le ledger ou memory/
      scope_limited:     toute écriture hors `allowed_fields` annule la réparation entière
                         et restaure l'artefact
      no_verdict:        capteur, pas juge — le runtime ne fixe jamais ok/fail
    # LIMITES DÉCLARÉES — elles font partie du contrat, pas d'une note de bas de page.
    limits:
      quality_not_proven: true
      production_ready: false
      why: >-
        L'oracle valide la FERMETURE DU DÉFAUT MESURÉ. Il ne valide ni la qualité
        rédactionnelle, ni la valeur gameplay, ni l'expérience joueur. Mesuré : une
        réparation acceptée par l'oracle a écrit « J'ai apprécié de jouer à Cookie
        Clicker » dans un champ censé expliquer la rétention. « oracle OK » ne se lit
        jamais « qualité OK ».
      cost: 70 à 151 tokens de complétion mesurés sur 3 exécutions versionnées
      evidence: lab/forge_evidence/REPAIR_RUNTIME_V1/ · lab/forge_evidence/REPAIR-LOOP-V1/
      accepted_by: Pierre (HumanGate) le 2026-08-04 — SOUS CONDITION

  # DÉCLARATION DE L'EXISTANT, 2026-08-04. Ce runtime tourne depuis toujours (oracles
  # 10a/10b/10c, verdict signé, et depuis peu les deux détecteurs de qualité). Il
  # n'avait simplement pas de contrat — comme 15 des 16 rôles. Rien de nouveau ici :
  # aucune ligne de code n'a changé, on écrit ce que le code fait déjà.
  deterministic:
    mission: >-
      Mesurer un artefact et rendre des compteurs. Aucun modèle n'intervient : même
      entrée, même sortie, toujours. Ne génère rien, ne répare rien, ne décide d'aucun
      verdict d'étape — il produit la mesure sur laquelle un verdict s'appuie.
    implementation:
      entrypoints:
        - scripts/forge/oracle_quality.mjs        # signaux DISCRIMINANCE · LANGUE · RECOPIE
        - scripts/forge/cross_field_quality.mjs   # déplacements inter-champs
        - scripts/forge/check_worldscan.mjs       # + les 5 autres check_*.mjs
      invoked_from:
        - scripts/forge/repair_step.mjs (phaseQualite)   # embarqué
        - CLI directe (node <entrypoint> <artefact.json>)  # autonome
      model: aucun
      provider: forge
    # `positional_artifact` : le callable reçoit le CHEMIN de l'artefact en argument
    # positionnel — pas d'enveloppe JSON. Convention réelle des CLI d'oracle
    # (`node oracle_quality.mjs <artefact.json> [--json]`), déclarée le 2026-08-04.
    invocation: positional_artifact
    inputs:  [artifact_ref]
    # Noms RÉELS des clés rendues par `mesurerSignalSemantique` (oracle_quality.mjs:247).
    # Corrigé le 2026-08-04 : le contrat déclarait « compteurs », le code rend « compte ».
    # Un contrat qui invente le nom de sa propre sortie ne peut vérifier personne.
    outputs: [verdict, signaux, compte]
    constraints:
      no_model:      aucun appel de complétion, aucun réseau
      no_write:      ne modifie jamais l'artefact mesuré
      no_verdict:    advisory — la mesure ne fait basculer aucun verdict d'étape
      deterministic: deux exécutions sur la même entrée rendent la même sortie
    limits:
      quality_not_proven: false   # ces capacités MESURENT la qualité, elles ne l'écrivent pas
      production_ready: false
      why: >-
        La détection est mesurée sur des défauts INJECTÉS, donc connus d'avance
        (detection_rate 1,0 · false_positive_rate 0 · n=12 et n=10). Un défaut d'un type
        non injecté reste invisible : la mesure borne ce qu'on a testé, pas ce qui existe.
      evidence: lab/forge_evidence/CAPABILITY_MEASUREMENT_V1/
      declared_by: déclaration de l'existant — aucun runtime ajouté
